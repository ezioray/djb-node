              - amount
              properties:
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                amount:
                  type: string
                  description: 十进制 USDT，最多 6 位小数（如 "12.5"）
                confirmations:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                status:
                  type: string
                  enum:
                  - success
                  - reverted
                  default: success
      responses:
