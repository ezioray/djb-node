openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: DJB Protocol API
  version: 1.11.0
  summary: W1 冻结 + M16 审计链 + W2/W3 契约面 + S4 TokenRouter 加性字段（覆盖 M01–M14、M16–M18）
  description: "DJB 联脑的对外可观测契约。spec 是唯一真相源：客户端 SDK、云端路由与校验、\n契约测试、文档站都从本文件生成或对照，任何一方不得绕过 spec 自行定义。\n\n- 命名空间：`/v1/*` 为 OpenAI\
    \ 兼容网关面；`/api/v1/*` 为控制面（节点/用方/协议/后台）。\n- 可用性：`x-djb-availability` 标记「不是所有部署都提供」的面；`m03` = 仅 M03 网关装配\n  （`DJB_GATEWAY_M03=1`）时挂载，默认部署返回\
    \ 404，客户端应按「端点不存在」降级。\n- 版本：URL 中的 `v1` 是**协议 MAJOR**，冻结；新 MAJOR 走新前缀（`/v2`、`/api/v2`）\n  并与旧前缀并存一个弃用周期，不得在旧前缀内做破坏性变更。\n\
    - 兼容：同 MAJOR 内只加不改。客户端必须容忍未知字段/未知 enum 值（tolerant reader）。\n- 错误：统一 `error` 信封（`type` / `code` / `message` / `request_id`）。数字错误码\n\
    \  见 `components/schemas/Error`；1.2.0 起按 00-conventions §5 码段登记（401xx / 402xx /\n  403xx / 409xx / 422xx / 424xx / 426xx\
    \ / 45xxx–49xxx），本文件不重复阈值与名单。\n- 风控：429/403 只给粗粒度原因码与 `Retry-After`；本文件**不含**任何阈值、名单、\n  评分权重或判定条件——那是私有配置（`djb/risk-config`），不进公开仓。\n\
    - 幂等：写操作接受 `X-DJB-Idempotency-Key`（24h）；非流式请求体指纹 300s 去重；\n  流式仅请求级 60s 去重。不做请求签名（保 OpenAI 兼容）。\n- 大小上限、超时与重试：超时/重试在客户端侧，服务端以\
    \ 429 +\n  `Retry-After` 与 503 表达可重试性。\n\n说明：少数进阶字段（batch 输入形态、用量汇总分组维度）在首个实现落地前仍需最终确认；\n此类字段的调整一律先改本 spec 再改实现，不允许实现先行。\n"
  termsOfService: https://example.invalid/djb/terms
  contact:
    name: DJB Protocol WG
    url: https://example.invalid/djb/spec
  license:
    name: Apache-2.0
    identifier: Apache-2.0
externalDocs:
  description: spec 使用与变更流程
  url: https://example.invalid/djb/README.md
servers:
- url: https://api.example.invalid
  description: 占位：公网网关（真实域名与证书在发布时注入）
- url: http://127.0.0.1:1717
  description: '本机镜像端点：由客户端本地注入凭据，客户端决定实时/慢任务。

    仅回环绑定；对端仍按同一 spec 校验。

    '
security:
- userBearer: []
tags:
- name: gateway
  description: OpenAI 兼容网关（用方）
- name: user
  description: 用方用量与账单
- name: node
  description: 共享节点（客户端）
- name: protocol
  description: 协议能力协商与弃用
- name: schedule
  description: 公开容量公告与快照（可离线复算）
- name: admin
  description: 后台只读查询（内网/VPN + 强 MFA，公网不可达）
- name: ops
  description: 平台运维内部面（mTLS + 服务令牌；公网不可达；审计链只追加）
- name: pay
  description: 用方支付面（M08：支付订单 / PSP 回调 / 退款；资金写不自动重试；管理面见 admin）
- name: provider
  description: 共享方控制台面（M08 分润 / 出款地址；M04 报价设置；不与 pay 合并）
paths:
  /api/v1/admin/accounts:
    get:
      tags:
      - admin
      summary: 账户列表（只回哈希前缀）
      description: 账户列表（只回哈希前缀，不含邮箱 / 手机明文）。
      operationId: listAdminAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      operationId: rc8_post_api_v1_admin_accounts
      summary: RC8 additive endpoint (POST /api/v1/admin/accounts)
      tags:
      - rc8
      responses:
        '200':
          description: OK
  /api/v1/admin/ledger/summary:
    get:
      tags:
      - admin
      summary: 账务只读汇总（今日应收 / 已入账 / 差额）
      description: 账务只读汇总（今日应收 / 已入账 / 差额；不动账本）。
      operationId: getAdminLedgerSummary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/admin/nodes:
    get:
      tags:
      - admin
      summary: 节点列表（在线判定 / access 分布）
      description: 节点列表（``state`` / ``online`` 过滤 + 在线判定 + access 分布）。
      operationId: listAdminNodes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/admin/supply/summary:
    get:
      tags:
      - admin
      summary: 供给汇总（节点 / 报价 / 按模型容量与价格）
      description: 供给汇总（节点数 / 在线数 / 有效报价 / 按模型 max_qps 与价格区间）。
      operationId: getAdminSupplySummary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/admin/traffic/summary:
    get:
      tags:
      - admin
      summary: 流量汇总（窗口调用量 / 成功率 / p95 延迟）
      description: 流量汇总（最近 ``window_h`` 小时：调用量 / 成功失败 / 错误率 / p95）。
      operationId: getAdminTrafficSummary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/node/earnings:
    get:
      tags:
      - metering
      summary: Get Node Earnings
      description: 节点控制台：收益汇总 + 近期明细（查不到 → ``null`` + ``unavailable_reason``）。
      operationId: get_node_earnings_api_v1_node_earnings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - currency
                - unit
                - settled_micro
                - pending_micro
                - corrected_micro
                - today_micro
                - usage_rows
                - rows
                - page
                properties:
                  currency:
                    type: string
                    const: USDT
                  unit:
                    type: string
                    const: micro-USD
                  settled_micro:
                    type: integer
                    description: 已结算（micro-USD）
                  pending_micro:
                    type: integer
                    description: 待结算（micro-USD）
                  corrected_micro:
                    type: integer
                    description: 已更正（micro-USD）
                  today_micro:
                    type: integer
                    description: 今日计费额（micro-USD），**UTC 日界**（服务端 00:00Z 起算）；今天无记录 = 0
                  settled_minor:
                    type: integer
                    deprecated: true
                    description: 历史命名，单位实为 micro-USD，与 settled_micro 同值
                  pending_minor:
                    type: integer
                    deprecated: true
                    description: 同上，与 pending_micro 同值
                  corrected_minor:
                    type: integer
                    deprecated: true
                    description: 同上，与 corrected_micro 同值
                  usage_rows:
                    type: integer
                  next_settlement_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: 无排期表 → null（不猜时间）
                  unavailable_reason:
                    type:
                    - string
                    - 'null'
                    description: 有数据也可能是 settlement_schedule_not_configured；**不可用才为空金额**，有金额时原因降级为备注
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        request_id:
                          type: string
                        task_id:
                          type: string
                        receipt_id:
                          type:
                          - string
                          - 'null'
                          description: 无收据 → null（不填空串）
                        tokens:
                          type:
                          - integer
                          - 'null'
                          description: tokens_in + tokens_out
                        model:
                          type: string
                        state:
                          type: string
                          enum:
                          - recorded
                          - settled
                          - corrected
                        amount_micro:
                          type: integer
                        recorded_at:
                          type: string
                          format: date-time
                        settled_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                  page:
                    type: object
                    properties:
                      cursor:
                        type: string
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
  /api/v1/node/profile:
    get:
      tags:
      - metering
      summary: Get Node Profile
      description: 节点控制台：本节点身份（只读）。跨节点/不存在 → 404（不泄露存在性）。
      operationId: get_node_profile_api_v1_node_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - node_id
                - state
                - bound
                properties:
                  node_id:
                    type: string
                  display_name:
                    type:
                    - string
                    - 'null'
                  state:
                    type: string
                    description: 节点状态词（active/pending/frozen/retired…）
                  region:
                    type:
                    - string
                    - 'null'
                  platform:
                    type:
                    - string
                    - 'null'
                  upstream_kind:
                    type:
                    - string
                    - 'null'
                    description: A1/A2/B；托管形态为 hosted_agent
                  capabilities:
                    type: array
                    items:
                      type: string
                  bound:
                    type: boolean
                    description: 是否已绑定账户
                  bound_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  last_seen_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
  /api/v1/node/tasks:
    get:
      tags:
      - metering
      summary: List Node Tasks
      description: 节点控制台：本节点任务列表（只读，游标分页）。无数据返回空数组，**不返回 404**。
      operationId: list_node_tasks_api_v1_node_tasks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - array
                    description: 任务行（task_id/receipt_id/state/inflight/tokens_in/tokens_out/amount_micro/started_at/finished_at
                      等）
                  page:
                    type: object
                    description: cursor/has_more/next_cursor
  /api/v1/user/balance:
    get:
      tags:
      - metering
      summary: Get User Balance
      description: '账单页「可用余额」（micro-USD）。


        读 M06 只读视图 ``account_balances_latest``（2101 服务预付款，AVAILABLE 子账户）；

        **无记录 → 0**（零是事实：没充过值就是 0），不新表、不直读别人基表。'
      operationId: get_user_balance_api_v1_user_balance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - available_minor
                - unit
                - account
                - as_of
                properties:
                  available_minor:
                    type: integer
                    description: micro-USD（账本真实零 = 0，不是缺字段）
                  unit:
                    type: string
                    const: micro-USD
                  account:
                    type: string
                    const: '2101'
                  as_of:
                    type: string
                    format: date-time
                  note:
                    type: string
                    description: 已绑定但账本无记录时的说明（此时 available_minor=0）
  /api/v1/node/balance:
    get:
      tags:
      - metering
      summary: Get Node Balance
      description: '节点侧「绑定账户可用余额」（micro-USD）。


        鉴权 ``nodeClientKey``；账户取 M02 ``nodes.bound_account_id``（经只读视图 ``v_supply_node_snapshot``），**节点自报的账户 id 一律不采信**，因此拿别人的节点钥
        也只能看到自己那份。


        三态严格区分：绑定且有余额 → 真值；绑定但账本无记录 → ``0``（零是事实）； 未绑定 → ``available_minor: null`` + ``unavailable_reason: node_not_bound``（不
        404、不写 0）。'
      operationId: getNodeBalance
      security:
      - nodeClientKey: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - available_minor
                - unit
                - account
                - as_of
                properties:
                  available_minor:
                    type:
                    - integer
                    - 'null'
                    description: micro-USD；未绑定账户时为 null
                  unit:
                    type: string
                    const: micro-USD
                  account:
                    type: string
                    const: '2101'
                  as_of:
                    type: string
                    format: date-time
                  unavailable_reason:
                    type: string
                    const: node_not_bound
                  note:
                    type: string
                    description: 已绑定但无记录时的说明（此时 available_minor=0）
        '401':
          description: 40101 缺少或无效的 X-Client-Key
  /api/v1/hosted/echo:
    post:
      tags:
      - hosted
      operationId: hostedAgentEcho
      summary: 最小回显（证明令牌可用；不转发上游）
      security:
      - hostedAgentBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 200
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - agent_id
                - echo
                properties:
                  ok:
                    type: boolean
                  agent_id:
                    type: string
                    format: uuid
                  echo:
                    type: object
        '400':
          description: 40001 请求体非 JSON 对象 / 超过 4096 字节
        '401':
          description: 40101
        '404':
          description: 40401 开关关闭
  /api/v1/hosted/health:
    get:
      tags:
      - hosted
      operationId: hostedAgentHealth
      summary: 托管令牌可用性证明
      security:
      - hostedAgentBearer: []
      responses:
        '200':
          description: 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedPing'
        '401':
          description: 40101 缺失/未知/已撤销（统一，不区分存在性）
        '404':
          description: 40401 开关关闭
  /api/v1/node/hosted-agent:
    post:
      tags:
      - hosted
      operationId: registerHostedAgent
      summary: 注册 / 轮换托管 Agent（明文令牌只返回一次）
      security:
      - nodeClientKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - display_name
              - endpoint_url
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                endpoint_url:
                  type: string
                  description: 必须 https；仅回环（localhost/127.0.0.1/::1）允许 http
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                    - inference.read
                  default:
                  - inference.read
              additionalProperties: false
      responses:
        '200':
          description: 已存在 active Agent，覆盖并轮换令牌（旧令牌立即失效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedAgentToken'
        '201':
          description: 首次注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedAgentToken'
        '400':
          description: 40001 参数不合法（endpoint 非 https/回环、scope 不在白名单、display_name）
        '401':
          description: 40101 缺少/未知 X-Client-Key
        '404':
          description: 40401 开关关闭
    get:
      tags:
      - hosted
      operationId: getHostedAgent
      summary: 读取本节点托管 Agent（不含令牌）
      security:
      - nodeClientKey: []
      responses:
        '200':
          description: 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedAgentEnvelope'
        '401':
          description: 40101
        '404':
          description: 40401 未注册 / 开关关闭
  /api/v1/node/hosted-agent/{id}:
    delete:
      tags:
      - hosted
      operationId: revokeHostedAgent
      summary: 撤销（写 revoked_at，令牌立即失效；行不删）
      security:
      - nodeClientKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedAgentEnvelope'
        '401':
          description: 40101
        '404':
          description: 40401 不存在 / 已撤销 / 跨节点 / 开关关闭
  /api/v1/user/hosted-agents:
    get:
      tags:
      - hosted
      operationId: listHostedAgents
      summary: 客户侧可用托管 Agent 列表（不含 endpoint / token）
      security:
      - userBearer: []
      responses:
        '200':
          description: 200
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - count
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - display_name
                      - scopes
                      properties:
                        id:
                          type: string
                          format: uuid
                        display_name:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                  count:
                    type: integer
        '401':
          description: 40101
        '404':
          description: 40401 开关关闭
  /api/v1/admin/tickets:
    get:
      operationId: listTickets
      summary: 后台工单列表（state / priority / tenant 过滤 + 只读聚合）
      description: '每条附只读聚合 `message_count`（含内部备注）与 `last_message_at`，用于值班队列排序。

        本端点**不下发**会话正文。

        '
      tags:
      - Admin
      - Tickets
      security:
      - adminBearer: []
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TicketState'
      - name: priority
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TicketPriority'
      - name: tenant
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 工单列表（含聚合）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAdminList'
        '400':
          description: 40001 过滤值 / limit / cursor 非法
        '401':
          description: 40101 未认证 / 主体缺 admin_id
        '403':
          description: 40301 缺 scope：ticket.read
        '404':
          description: 40401 开关关闭
  /api/v1/admin/tickets/{ticket_id}/messages:
    post:
      operationId: replyTicket
      summary: 客服回复 / 内部备注
      description: '`internal_note=true` 的会话只对后台可见（客户侧读路径在 SQL 层过滤），

        但会计入后台列表的 `message_count`。

        '
      tags:
      - Admin
      - Tickets
      security:
      - adminBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReplyRequest'
      responses:
        '201':
          description: 回复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessageCreated'
        '400':
          description: 40001 body 不合法 / internal_note 非布尔
        '401':
          description: 40101 未认证 / 主体缺 admin_id
        '403':
          description: 40301 缺 scope：ticket.reply
        '404':
          description: 40401 工单不存在 / 开关关闭
  /api/v1/admin/tickets/{ticket_id}/state:
    post:
      operationId: setTicketState
      summary: 工单状态迁移
      description: '合法迁移见 info.description；非法迁移 409 `reason=illegal_transition`（附

        `current` / `target`）；同态重复提交按幂等返回 `changed=false`。

        `closed` 时写 `closed_at`，重开（→ open）时清空。

        '
      tags:
      - Admin
      - Tickets
      security:
      - adminBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketStateChangeRequest'
      responses:
        '200':
          description: 迁移结果（`changed=false` 表示同态幂等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketStateChanged'
        '400':
          description: 40001 state 缺失 / 非枚举值
        '401':
          description: 40101 未认证 / 主体缺 admin_id
        '403':
