      description: '结果回传。`status=failed` 时必须给 `error_code` 或 `error_class`（否则 `400` + `40001`）。

        服务端只保留 usage / 元数据与请求摘要，**不落正文**。

        '
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - completed
          - failed
        content:
          type: string
          description: 模型输出正文（`completed` 时有意义；不落库、不进日志）。
        finish_reason:
          type: string
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        usage_source:
          type: string
          enum:
          - actual
          - estimated
          - dual
          description: 'usage 来源：`actual` 上游返回 / `estimated` 本地估算 / `dual` 两者都有

            （取用优先级 actual > estimated）。可空（`null` = 未上报）。

