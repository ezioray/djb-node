        '400':
          description: 40001 金额精度超 6 位 / 地址非法
        '401':
          description: 40101 服务令牌无效
        '403':
          description: 40301 非 test 环境
        '503':
          description: 50001 真链 provider 下不可用
  /api/v1/internal/chain/scan:
    post:
      operationId: runChainScan
      summary: 触发一轮增量扫描（**仅测试网 / 内部**）
      description: '三重门：``DJB_ENV=test`` + 服务令牌 ``X-DJB-Service-Token``（常量时间比较）+ 请求来源必须

        回环（``DJB_CHAIN_ALLOW_REMOTE_INTERNAL=1`` 才放开）。窗口 = ``max(游标+1, head-200)``，

        保证 reorg 后 200 块内可重扫；游标单调不回退。

        '
      tags:
      - Chain
      - Internal
      security:
      - internalMTLS: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                addresses:
                  type: array
                  items:
                    type: string
                  description: 缺省=全部活跃地址
                refresh_blocks:
                  type: integer
                  minimum: 1
                  maximum: 5000
                  default: 200
      responses:
        '200':
          description: 本轮扫描摘要（transfers / actions / below_min_deposit / cursor）
        '401':
          description: 40101 服务令牌缺失或不匹配
        '403':
          description: 40301 非 test 环境或非回环来源
        '503':
          description: 50001 provider 不可用（已留痕 last_error，游标不前进）
  /api/v1/treasury/deposit-address:
    get:
