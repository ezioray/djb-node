          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

# ==========================================================================
# components
# ==========================================================================
  # ----------------------------------------------------------------------
  # 身份与租户（M01；spec 1.2.0 补登记：M01 CR-1 / _CR-LOG S1）
  # /api/v1/auth/* · /user/profile · /user/api-keys · /admin/accounts|tenants
  # 写进 spec ≠ 公网可达：管理面内网/VPN + 强 MFA + step-up（≤5 分钟）
  # ----------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [user]
      summary: 登录（密码 / OAuth / 验证码）
      operationId: createAuthSession
      description: |
        `method` 区分登录方式，成功后返回会话令牌。MFA 未完成时返回 `mfa_required=true`
        的短期令牌（只可用于 step-up 换正式令牌）。凭据错误统一 `40110`，
        **不区分**「账号不存在」与「口令错误」（防枚举）；失败锁定与风控只给
        429 / 403 + 粗粒度原因码，不含阈值与名单。扫码登录的**轮询中间态**复用本条端点：
        票据未确认时返回 `202` + `ScanStatus`，确认后返回 `200` 令牌。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功（或 `mfa_required=true` 的短期令牌）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '202':
          description: |
            扫码登录中间态（轮询）。响应体**顶层即 `ScanStatus`**（`status` / `expires_at` /
            `retry_after_s`），客户端按 `retry_after_s` 继续轮询同一条端点；`confirmed` 后
            下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回 `409` + `40905`（一次性令牌家族）。
            **过渡期**：M01-T2 额外携带一份 `scan` 同值包裹（`{status, expires_at, retry_after_s}`），
            属纯增量；`ScanStatus` 声明 `additionalProperties: true` 允许该包裹，客户端只读顶层字段。
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [user]
      summary: 刷新令牌（轮换）
      operationId: refreshAuthSession
      description: |
        刷新即轮换：旧 `refresh_token` 立即失效，返回新的令牌对。重放已轮换的令牌
        按 `40103`（令牌已撤销）处理，并要求重新登录。刷新不延长绝对过期时间。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 新令牌对
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [user]
      summary: 退出（撤销会话）
      operationId: revokeAuthSession
      description: |
        撤销当前会话；`all_devices=true` 时撤销该账号全部会话（`session_epoch++`，
        旧令牌立即失效）。幂等：重复退出返回首次结果，不报错。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 已撤销
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/profile:
    get:
      tags: [user]
      summary: 账户与租户视图（脱敏）
      operationId: getUserProfile
      description: |
        返回脱敏后的账户与租户视图：只给 `email_hash` 派生的展示掩码，不回传
        原始邮箱 / 手机号 / 硬件信息。`balance` 是 M06 `account_balances` 的
        **只读镜像**，结算与对账一律以账本分录为准。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 账户视图
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [user]
      summary: 修改昵称与语言（局部更新）
      operationId: updateUserProfile
      description: |
        只允许修改展示类字段（`display_name` / `locale`）。未出现的字段保持原值；
        身份字段（`account_id` / `tenant_id` / `state`）不可经此端点修改。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdateRequest' }
      responses:
        '200':
          description: 更新后的账户视图
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys:
    get:
      tags: [user]
      summary: 列举 API Key（只回前缀）
      operationId: listApiKeys
      description: |
        只返回 8 位前缀与元数据，**永不回传明文或哈希**。撤销后的 Key 默认不返回，
        `include_revoked=true` 时可查（保留 24 个月）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Key 分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [user]
      summary: 创建 API Key（明文只回一次）
      operationId: createApiKey
      description: |
        明文只在本次响应出现一次，平台只存 `sha256(key)` 与前缀。`frozen` / `closed`
        账户禁止建 Key（403 + `40304`）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
      responses:
        '201':
          description: Key 已创建（`key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys/{id}:
    delete:
      tags: [user]
      summary: 撤销 API Key（幂等）
      operationId: revokeApiKey
      description: |
        撤销后立即失效；重复撤销返回首次结果（不报 5xx）。跨租户访问一律 404（防枚举）。
      security:
        - userBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 撤销结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys/{id}/rotate:
    post:
      tags: [user]
      summary: 轮换 API Key（旧钥立即失效）
      operationId: rotateApiKey
      description: |
        生成新 Key 并撤销旧 Key；新明文只在本次响应出现一次。若声明重叠期，
        重叠 ≤24 h 且旧钥在重叠期内**只验签**、不接受新注册（INV-10）。
      security:
        - userBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyRotateRequest' }
      responses:
        '201':
          description: 新 Key（`key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/freeze:
    post:
      tags: [admin]
      summary: 冻结账户（理由 + 期限必填）
      operationId: freezeAccount
      description: |
        冻结后账户只读 + 可申诉，禁止建 Key / 充值 / 接新单。`frozen_until` 必填且
        ≤180 天（超期属参数错误，400 + `40001`）。解冻须**非原冻结人**（409 + `40902`）。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStateChangeRequest' }
      responses:
        '200':
          description: 已冻结
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStateAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/unfreeze:
    post:
      tags: [admin]
      summary: 解冻账户（非原冻结人）
      operationId: unfreezeAccount
      description: |
        解冻人与原冻结人必须不同（409 + `40902`）；到期自动解冻由定时 job 执行并留痕，
        重放不产生重复状态事件。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStateChangeRequest' }
      responses:
        '200':
          description: 已解冻
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStateAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/roles:
    post:
      tags: [admin]
      summary: 授予 / 回收后台角色（第二人确认）
      operationId: updateAccountRoles
      description: |
        `admin_role` ∈ 八角色（SUPER / SVC / OPS / AUDIT / RISK / FIN / CS / VIEWER，
        见 03-facts §5）。授予与回收都必须带复核人（`second_approver` ≠ 操作人），
        变更后 `session_epoch++`（旧会话 401 + `40102`）。SVC 不得绑自然人邮箱。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRoleChangeRequest' }
      responses:
        '200':
          description: 角色已更新
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRoles' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/tenants/{id}/quotas:
    post:
      tags: [admin]
      summary: 修改租户配额（升配额超阈值需 FIN 复核）
      operationId: updateTenantQuotas
      description: |
        配额主体为 `tenant_quotas`（`kind` / `value` / `policy_version`）。生效值 =
        min(租户, Key, 节点能力)，并随请求写 `policy_version`。升配额超阈值必须 FIN
        复核（`second_approver` 必填），降配额立即生效。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantQuotasRequest' }
      responses:
        '200':
          description: 配额已更新
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantQuotasAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 节点供给（M02；spec 1.2.0 补登记：M02 CR-2 / CR-3 / CR-5 / CR-7）
  # /api/v1/node/pair · /node/binding · /node/upstream/probe · /admin/supply/nodes/{id}/review
  # 节点侧认证 X-Client-Key；审核属管理面（内网 + 强 MFA + step-up）
  # ----------------------------------------------------------------------
  /api/v1/node/pair:
    post:
      tags: [node]
      summary: 生成 / 轮换客户端密钥（明文只回一次）
      operationId: pairNodeClientKey
      description: |
        生成节点客户端密钥（`X-Client-Key`），明文只在本次响应出现一次；平台只存
        `sha256(key)` 与 8 位前缀。轮换重叠 ≤24 h，重叠期内旧钥**只验签**、
        不接受新注册。状态非 `active` 的节点拒绝换钥（403 + `40305`）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePairRequest' }
      responses:
        '201':
          description: 已签发（`client_key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePairResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/binding:
    get:
      tags: [node]
      summary: 查询节点绑定（当前账户）
      operationId: getNodeBinding
      description: |
        一个节点同时只有**一条**有效绑定（INV-08）。解绑 / 换绑不删除历史收据与锁定收益。
        绑定关系存 `nodes` 列 + `node_events` 历史，不建独立表（M02 CR-4）。
      security:
        - nodeClientKey: []
      parameters:
        - name: node_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 绑定状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [node]
      summary: 网页端绑定节点
      operationId: bindNode
      description: |
        用一次性绑定码把节点绑定到当前账户；绑定码一次性、短时效。节点须为 `active`，
        否则 403 + `40305`（`pending` 未准入 / `frozen` / `retired`）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeBindingRequest' }
      responses:
        '200':
          description: 绑定成功
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [node]
      summary: 解绑节点（幂等）
      operationId: unbindNode
      description: |
        解绑后节点停新单，在途任务按清退两段处理（先降权再摘除），不强制中断（INV-09）。
        重复解绑返回首次结果。
      security:
        - nodeClientKey: []
      parameters:
        - name: node_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已解绑
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/upstream/probe:
    post:
      tags: [node]
      summary: 上报本地体检结论（回执式，服务端不探测）
      operationId: reportNodeUpstreamProbe
      description: |
        **服务端不发起探测**：由客户端在本地探测上游连通性后上报结论，服务端只按回执
        改 `NodeUpstream.state`（`probing → verified / rejected`）。只收结论与耗时，
        不收凭据、不收上游响应正文（H1）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeProbeReport' }
      responses:
        '200':
          description: 回执已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeProbeAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/channel/poll:
    post:
      tags: [node]
      summary: 长轮询取一个任务（wait_s 内无任务 → 204）
      operationId: pollNodeChannel
      description: |
        **节点出站长轮询**（C10 决策单 A：HTTP 长轮询 + 内存队列，正文不落库、默认关）。
        客户端用 `X-Client-Key` 鉴权，携带 `wait_s` 阻塞至多 N 秒取一个任务；到点无任务返回
        `204`（无响应体）。单节点同时只允许 **1 个在途任务**（由通道层保证）。
        任务正文（`messages`）**只在内存与响应体过一手**：平台不落库、不进日志、不进事件。
        未接线 / 通道关闭 / 节点离线 → `503` + `50903`（不静默回落 Echo；是否回落由部署层显式选择）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeChannelPollRequest' }
      responses:
        '200':
          description: 派发一个任务
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeChannelPollResponse' }
        '204':
          description: 在 `wait_s` 内没有任务（长轮询到点）；无响应体。
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/node/channel/result:
    post:
      tags: [node]
      summary: 回传任务结果（按 job_id 幂等）
      operationId: submitNodeChannelResult
      description: |
        节点执行完（或失败）后回传结果。**按 `job_id` 幂等**：同一 `job_id` 同一载荷重复提交
        返回 `200` + `duplicate: true`（通道只受理一次）；同一 `job_id` 不同载荷 → `409` + `40919`。
        `job_id` 不存在 / 不属于该节点 → `404` + `40401`（不泄露存在性）。
        正文只保留在内存：服务端落库的只有 usage / 元数据与请求摘要（sha256），**不落正文**。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeChannelResultRequest' }
      responses:
        '200':
          description: 结果已受理（`duplicate=true` = 重复提交被幂等去重，未再次受理）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeChannelResultAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/supply/nodes/{id}/review:
    post:
      tags: [admin]
      summary: 节点准入审核（通过 / 驳回）
      operationId: reviewSupplyNode
      description: |
        准入审核：`approve` 使 `pending → active`；`reject` 保留 `pending` 并通知
        （不落 `retired`）。数据与状态归 M02，页面归 M14。审核必须留理由；
        状态迁移不合法（如已 `active` 再审）返回 403 + `40305`。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeReviewRequest' }
      responses:
        '200':
          description: 审核结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeReviewAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }







  # ----------------------------------------------------------------------
  # M17 canary / L4 行为指纹（C13，spec 1.2.15）
  # 合成题面；响应正文不落库，只存 hash/score
  # ----------------------------------------------------------------------
  /api/v1/admin/supply/integrity/canary/runs:
    post:
      tags: [admin]
      summary: 发一条 canary（同一节点/模型同时只 1 条 issued）
      operationId: issueCanaryRun
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanaryIssueRequest' }
      responses:
        '201':
          description: 已发题（合成 prompt；可复算 selection）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanaryIssueResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [admin]
      summary: canary 运行列表
      operationId: listCanaryRuns
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: node_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [issued, passed, failed, missed] }
      responses:
        '200':
          description: 运行列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanaryRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/supply/integrity/canary/runs/{id}/result:
    post:
      tags: [admin]
      summary: 回填 canary 响应（只比对；正文不落库）
      operationId: submitCanaryResult
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
