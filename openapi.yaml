  /api/v1/support/tickets:
    post:
      operationId: createSupportTicket
      summary: 提交工单（匿名可提；登录用户邮箱已可信可免验证）
      description: '**匿名可调用**：不带 bearer 时 `security` 走匿名分支，仍需填 `email`（只用于发验证信，

        服务端只存 HMAC 哈希，不存明文）。返回里**不回显**邮箱、哈希、内部主键。


        登录用户（带 `userBearer`）由服务端显式决定 `require_verify`：

        邮箱已可信 → 直接 `open` 并进入运营队列；否则仍需验证。

        调用方**不能**通过请求体自行跳过验证（请求体里没有这个字段）。


        `public_id` 是对客短号（12 位 Crockford base32，随机不可枚举），也是匿名用户后续

        读单的凭据；内部 uuid 不下发。


        发信闸门（`DJB_FF_SUPPORT_EMAIL`）与工单开关解耦：闸门关/超限时 `verification.status`

        为粗粒度值（`sent` / `pending` / `skipped`），**不下发**配额、阈值、剩余次数。

        工单**不会**因为发信失败而回滚。

        '
      tags:
      - Support
      security:
      - userBearer: []
      - {}
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 可选幂等键（表单 nonce / UUID 均可，1..64 位 `[A-Za-z0-9_.:~-]`）。 同一 `Idempotency-Key` + 同一邮箱**只认一次**：重复提交返回**原工单号**
          （`verification.replayed=true`），且**不会**再发第二封验证信 （否则双击会吃掉"每邮箱 2 封/日"的额度）。
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_.:~-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateRequest'
      responses:
        '201':
          description: 已受理（`ticket.status` 为 `pending_verify` 或 `open`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketCreated'
        '400':
          description: 40001 字段不合法（超长只回 max_length / actual_length，不回正文）
        '404':
          description: 40401 开关 support_tickets 关闭；error.reason=feature_disabled（与记录不存在可判别）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
        '429':
          description: 42901 rate_limited（每 IP / 每邮箱各自口径，不公开阈值），带 Retry-After
    get:
      operationId: listMySupportTickets
      summary: 我的工单列表（仅登录用户；游标分页）
      description: 只返回鉴权主体本人的工单（`account_id` 匹配），按 `created_at DESC, id DESC`。
      tags:
      - Support
      security:
      - userBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SupportTicketStatus'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 工单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
        '400':
          description: 40001 limit / status / cursor 非法
        '401':
          description: 40101 未认证
        '404':
          description: 40401 开关 support_tickets 关闭；error.reason=feature_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
  /api/v1/support/tickets/{public_id}:
    get:
      operationId: getSupportTicket
      summary: 读单（客户侧；匿名凭 public_id，登录凭本人身份）
      description: '匿名用户凭 `public_id` 读自己的单（能力式凭据，不可枚举）；登录用户必须是本人单。

        **未验证单（`pending_verify`）一律 404**：不承认存在，避免"猜号探测"。

        客户侧会话只含 `visibility=public` 的消息，内部备注在 SQL 层就被过滤。

        '
      tags:
      - Support
      security:
      - userBearer: []
      - {}
      parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10,16}$
      responses:
        '200':
          description: 工单 + 会话（内部备注不下发）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketThread'
        '404':
          description: 40401 不存在 / 未验证 / 越权 —— 开关关闭时 error.reason=feature_disabled（其余情况无该字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
        '429':
          description: 42901 rate_limited（防猜号），带 Retry-After
  /api/v1/support/tickets/{public_id}/messages:
    post:
      operationId: replySupportTicket
      summary: 客户追加消息
      description: '客户侧只能写 `visibility=public`（请求体没有这个字段，服务端固定）。

        `closed` 状态拒绝追加：409 `reason=ticket_closed`（沿用既有 reason，不新增码）。

        未验证单 404（同读单口径）。

        '
      tags:
      - Support
      security:
      - userBearer: []
      - {}
      parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10,16}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketMessageCreateRequest'
      responses:
        '201':
          description: 已追加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketMessageCreated'
        '400':
          description: 40001 body 不合法
        '404':
          description: 40401 不存在 / 未验证 / 越权 —— 开关关闭时 error.reason=feature_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
        '409':
          description: 40919 reason=ticket_closed
  /api/v1/support/verify:
    post:
      operationId: verifySupportTicketEmail
      summary: 验证邮箱（点邮件里的链接后调用）
      description: '令牌只出现在邮件正文里，服务端只存它的 HMAC；**令牌放进请求体而不是 URL**，

        避免出现在代理日志与 Referer。验证成功后工单从 `pending_verify` 转 `open` 并进队列。

        重复提交同一令牌幂等（返回当前状态，不报错）。

        失效/过期/未投递一律 404，**不区分**是哪种（不给探测者反馈）。

        '
      tags:
      - Support
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportVerifyRequest'
      responses:
        '200':
          description: 验证结果（幂等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportVerifyResult'
        '400':
          description: 40001 token 缺失 / 形状不合法
        '404':
          description: 40401 令牌无效 / 过期 / 未投递 —— 开关关闭时 error.reason=feature_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
        '429':
          description: 42901 rate_limited（防令牌爆破），带 Retry-After
  /api/v1/admin/support/tickets:
    get:
      operationId: listSupportQueue
      summary: 运营队列（**唯一**队列，含匿名与登录）
      description: '默认**不含** `pending_verify`（未验证单一律不进队列，D4）；即便显式传

        `status=pending_verify` 也返回空集，不退化成全表。

        按 `status` + `created_at DESC` 取，队列不含会话正文（只有聚合计数）。

