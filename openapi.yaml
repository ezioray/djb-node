# ==========================================================================
# components
# ==========================================================================
components:

  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: DJB-Key
      description: |
        用方 API Key（一枚 Key 通吃所有可路由模型）。Key 只显示一次；
        平台只存哈希；客户端应存于 OS 安全存储，不进日志、不进仓库。
    nodeClientKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: |
        节点客户端密钥，由 `/api/v1/node/pair` 生成、可轮换（重叠 ≤24h）
        与撤销（立即停单，在途不受影响）。只存哈希（字段 client_key），
        平台不回显明文。
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: Admin-Session
      description: |
        后台会话（强制 MFA；敏感动作 step-up ≤5 分钟；break-glass 只读模式见）。管理面仅内网/VPN，公网不可达。

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方生成的请求标识（UUID）；服务端原样回显，贯穿日志与链路追踪。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-DJB-Idempotency-Key
      in: header
      required: false
      description: |
        写操作幂等键，24h 有效且与账本写入同事务。缺省时服务端按
        请求体指纹做 300s 去重（流式仅 60s）。
      schema:
        type: string
        minLength: 16
        maxLength: 128
    AdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      description: 敏感操作二次认证凭据（≤5 分钟有效）；P0 配置发布必备。
      schema:
        type: string

    ReportPeriod:
      name: period
      in: query
      required: true
      description: 自然月 `YYYY-MM`（与 `/verify/{period}` 同粒度；审计锚定日是日粒度）。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}$'

    ProtocolVersion:
      name: DJB-Protocol-Version
      in: header
      required: false
      description: 调用方协议版本（`MAJOR.MINOR.PATCH`）。缺省按服务端当前版本；不兼容返回 426。
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Capabilities:
      name: DJB-Capabilities
      in: header
      required: false
      description: |
        调用方启用的能力标识（逗号分隔，如 `chat_completions,batch`）。双方只启用交集；
        未知 capability **忽略不报错**。
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页的不透明游标；首次不传。不得猜测或自行构造。
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数上限。服务端可返回更少；`has_more` 判断是否继续。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      description: 起始时间（UTC，含端点）。日期或 RFC 3339 日期时间。
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: 结束时间（UTC，含端点）。
      schema:
        type: string
        format: date-time
    Period:
      name: period
      in: path
      required: true
      description: 周期标识（UTC 日期）。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    RequestId:
      description: 服务端/调用方请求标识，原样回显。
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: 建议重试等待秒数（429/503）。客户端必须遵守并加抖动。
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: 请求不合法（结构、枚举、大小上限）。不得回显内部堆栈或 SQL。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或凭据无效/过期。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        已认证但无权限，或命中风控。对外只给粗粒度原因码（如 `account_restricted`），
        不返回具体规则/阈值/名单。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（含无权查看时的统一 404，避免枚举）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突（重复幂等键的不同载荷、状态机不允许的迁移）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: 协议版本不兼容（`42601`，HTTP 426）。响应体给出可升级的版本范围。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        请求体超过上限（chat 请求建议 ≤1 MiB；receipts 批 ≤500 条/次；上限属实现参数，
        放宽不算破坏性变更，收紧算）。只给上限提示，不回显请求内容。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        限流或配额耗尽。只给粗粒度原因码与 `Retry-After`；具体阈值属私有配置，
        不在响应中暴露。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 暂时不可用/过载/维护；可安全重试（遵守 `Retry-After`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ------------------------------------------------------------ 通用
    Error:
      type: object
      additionalProperties: true
      required: [error]
      description: |
        统一错误信封。客户端必须容忍未知字段（只加不改）；`message` 只供人类阅读，
        程序判断一律用 `type` / `code`，不得解析 `message` 文案。
      properties:
        error:
          type: object
          additionalProperties: true
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - rate_limit_error
                - not_found_error
                - conflict_error
                - protocol_error
                - server_error
                - upstream_error
            code:
              type: integer
              description: |
                数字错误码。已核实：`40301` 管理接口签名失败（recon/01:265）、
                `42601` 协议版本不兼容（recon/01:393）；已登记资金段
                `40910–40918`、`42210`、`42211`、`40201`。其余以产品设计 §6.3 与附录 C.4 为准。
            message:
              type: string
              description: 人类可读，不含内部堆栈/规则细节/凭据。
            request_id:
              type: string
              format: uuid
            retry_after:
              type: integer
              minimum: 0
              description: 仅 429/503 有意义；与 `Retry-After` 头一致。
            reason:
              type: string
              enum: [rate_limited, quota_exceeded, account_restricted, policy_blocked]
              description: |
                粗粒度原因码，供客户端做退避与提示。**不含**判定细节；
                具体规则/阈值/名单在私有配置，不对外。

    Page:
      type: object
      required: [has_more]
      additionalProperties: true
      properties:
        cursor:
          type: string
          description: 本页起始游标（回显；首页为空）。
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；`has_more=false` 时为 `null`。

    # ------------------------------------------------------------ 网关
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 1048576
        name:
          type: string

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model:
          type: string
          description: 模型 slug（不可变）。取自 `/v1/models`。
        messages:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stop:
          type: array
          items:
            type: string
        user:
          type: string
          description: 可选的调用方自定义稳定标识（用于防滥用去重，不留 PII）。

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      additionalProperties: true
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix 秒（UTC）。
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                enum: [stop, length, tool_calls, content_filter, upstream_error]
        usage:
          $ref: '#/components/schemas/Usage'

    Model:
      type: object
      additionalProperties: true
      required: [id, object, owned_by]
      properties:
        id:
          type: string
          description: 模型 slug。
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
        context_window:
          type: integer
        unit:
          type: string
          description: 计量单位（如 token）。
        price:
          type: object
          additionalProperties: true
          description: 公开参考价；结算是以账本分录为准，不以本字段为准。
          properties:
            amount:
              type: string
              description: 十进制字符串（不用浮点）。
            unit:
              type: string

    ModelList:
      type: object
      additionalProperties: true
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    BatchCreateRequest:
      type: object
      additionalProperties: true
      required: [kind, model, items]
      properties:
        kind:
          type: string
          enum: [chat, completion]
          description: 慢任务类型。
        model:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [custom_id]
            properties:
              custom_id:
                type: string
                maxLength: 128
              input:
                $ref: '#/components/schemas/ChatCompletionRequest'
        deadline_seconds:
          type: integer
          minimum: 60
          description: 期望完成时限（尽力而为，不构成 SLA）。
        webhook_url:
          type: string
          format: uri
          description: 完成回调（可选；回调带签名，禁止携带凭据）。
        metadata:
          type: object
          additionalProperties: true

    BatchAccepted:
      type: object
      additionalProperties: true
      required: [batch_id, status, eta_seconds]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        eta_seconds:
          type: integer
          minimum: 0
        cost_estimate:
          $ref: '#/components/schemas/Amount'

    BatchStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
      description: 未知状态值必须被客户端容忍（只加不改）。

    Amount:
      type: object
      additionalProperties: true
      required: [amount, unit]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: 十进制字符串；不在客户端做浮点运算。
        unit:
          type: string
          description: 计量/计价单位（如 token、gpu_second、gb_hour）。

    Batch:
      type: object
      additionalProperties: true
      required: [batch_id, status, created_at]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        progress:
          type: object
          additionalProperties: true
          properties:
            completed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        eta_seconds:
          type: integer
          minimum: 0
        checkpoint_resumes:
          type: integer
          minimum: 0
          description: 检查点恢复次数（抢占/故障后恢复的计数）。
        results_ref:
          type: string
          description: 结果对象签名 URL（≤15 分钟有效）；过期需重新获取。
        cost:
          type: object
          additionalProperties: true
          properties:
            estimated:
              $ref: '#/components/schemas/Amount'
            actual:
              $ref: '#/components/schemas/Amount'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    BatchCancelAck:
      type: object
      additionalProperties: true
      required: [batch_id, status]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        canceled_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ 用方
    UsageSummary:
      type: object
      additionalProperties: true
      required: [period, totals, groups]
      properties:
        period:
          type: object
          additionalProperties: true
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        totals:
          type: object
          additionalProperties: true
          properties:
            requests:
              type: integer
              minimum: 0
            prompt_tokens:
              type: integer
              minimum: 0
            completion_tokens:
              type: integer
              minimum: 0
            billable:
              $ref: '#/components/schemas/Amount'
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [key]
            properties:
              key:
                type: string
                description: 分组键（模型 slug 或 UTC 日期）。
              requests:
                type: integer
                minimum: 0
              tokens:
                type: integer
                minimum: 0
              billable:
                $ref: '#/components/schemas/Amount'

    # ------------------------------------------------------------ 节点
    NodeRegisterRequest:
      type: object
      additionalProperties: true
      required: [platform, hardware_fingerprint, client_version, protocol_version]
      properties:
        platform:
          type: string
          enum: [macos, windows, linux]
        hardware_fingerprint:
          type: string
          description: |
            硬件指纹**哈希**（客户端本地计算）。平台不回传原值、不落明文；
            原始指纹不出客户设备。
        client_version:
          type: string
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        capabilities:
          type: array
          items:
            type: string
        access_modes:
          type: array
          description: 申报的接入方式（A1 直填 Key / A2 本机代理 / B 企业网关）。
          items:
            type: string
            enum: [A1, A2, B]

    NodeRegisterResponse:
      type: object
      additionalProperties: true
      required: [node_id, state, policy_version, protocol_version, server_time]
      properties:
        node_id:
          type: string
        state:
          type: string
          enum: [pending, active, frozen, retired]
        policy_version:
          type: string
        protocol_version:
          type: string
        server_time:
          type: string
          format: date-time

    CapacityAnnouncement:
      type: object
      additionalProperties: true
      required: [kind, access, model, max_qps, unit]
      description: |
        容量公告（字段 capacity_announcement）；时序数据。
        `ask_price` 是节点要价，**不是**风控/评分权重。
      properties:
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
          description: 十进制字符串。
        unit:
          type: string
        resource_level:
          type: string

    NodeHeartbeatRequest:
      type: object
      additionalProperties: true
      required: [node_id, protocol_version, policy_version]
      properties:
        node_id:
          type: string
        protocol_version:
          type: string
        policy_version:
          type: string
        capacity:
          type: array
          items:
            $ref: '#/components/schemas/CapacityAnnouncement'
        load:
          type: object
          additionalProperties: true
          description: 可选的本机负载自述（仅用于调度输入，不参与信誉分计算）。
          properties:
            inflight:
              type: integer
              minimum: 0
            queue_seconds:
              type: number
              minimum: 0

    NodeHeartbeatResponse:
      type: object
      additionalProperties: true
      required: [server_time, protocol_version, policy_version]
      properties:
        server_time:
          type: string
          format: date-time
        protocol_version:
          type: string
        policy_version:
          type: string
        next_heartbeat_seconds:
          type: integer
          minimum: 1
        policy_updated:
          type: boolean
          description: 为 true 时客户端应立即拉取 `/api/v1/node/policy`。

    NodeUpstreamRequest:
      type: object
      additionalProperties: true
      required: [access_type, base_url, models]
      properties:
        access_type:
          type: string
          enum: [A1, A2, B]
          description: |
            A1 直填 Key（属直连）、A2 本机代理、B 企业网关。分类口径见正式文档
            「接入方式分类」；H1 约束的是**平台**（不下发/不上传/不托管凭据），
            不是客户端持有凭据。
        base_url:
          type: string
          format: uri
          description: 上游端点（可含路径）。不得带用户名/口令等 userinfo。
        models:
          type: array
          minItems: 1
          items:
            type: string
        credential_handle:
          type: string
          description: |
            **本地**凭据句柄（客户端内部标识，如 keychain 条目名）。服务端不解析、
            不存储、不回显；凭据本体永不上行（H1）。
        protocol:
          type: string
          description: 上游协议（如 openai-chat）。未知值按适配器容错处理。

    NodeUpstreamResponse:
      type: object
      additionalProperties: true
      required: [upstream_id, state, models_declared]
      properties:
        upstream_id:
          type: string
        state:
          type: string
          enum: [declared, probing, verified, rejected]
        models_declared:
          type: array
          items:
            type: string
        probe_hint:
          type: string
          description: 提示本地发起体检（`/api/v1/node/upstream/probe`），不在服务端探。

    ReceiptInput:
      type: object
      additionalProperties: true
      required:
        - receipt_id
        - task_id
        - access
        - usage
        - price
        - sig_provider
        - sig_consumer
      properties:
        receipt_id:
          type: string
        task_id:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        usage:
          type: object
          additionalProperties: true
          required: [amount, unit]
          properties:
            amount:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
            unit:
              type: string
        price:
          $ref: '#/components/schemas/Amount'
        sig_provider:
          type: string
          description: 供方签名（对收据规范字段的签名；算法随协议版本，见协议仓）。
        sig_consumer:
          type: string
          description: 需方签名。双签缺一即拒收。
        usage_source:
          type: string
          enum: [client_reported, server_measured, dual]
        task_kind:
          type: string

    ReceiptBatchRequest:
      type: object
      additionalProperties: false
      required: [receipts]
      properties:
        receipts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReceiptInput'

    RejectedReceipt:
      type: object
      additionalProperties: true
      required: [receipt_id, code, message]
      properties:
        receipt_id:
          type: string
        code:
          type: integer
        message:
          type: string
          description: 拒绝原因（只描述契约问题，如签名不匹配/字段缺失）。

    ReceiptBatchResponse:
      type: object
      additionalProperties: true
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items:
            type: string
            description: 已受理的 receipt_id。
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedReceipt'

    NodePolicy:
      type: object
      additionalProperties: true
      required: [policy_version, protocol_version, issued_at]
      properties:
        policy_version:
          type: string
          description: 策略版本号（与 protocol_version 不是一回事）。
        protocol_version:
          type: string
        issued_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        digest:
          type: string
          description: 策略包摘要（用于校验下发内容未被篡改）。
        quotas:
          type: array
          description: |
            配额**结构**由 spec 定义，具体数值由服务端按节点下发（私有配置）。
            客户端不得内置默认值。
          items:
            type: object
            additionalProperties: true
            required: [name, window_seconds]
            properties:
              name:
                type: string
              window_seconds:
                type: integer
                minimum: 1
              value:
                type: integer
                description: 窗口内额度；值由服务端给出，spec 不规定。
        directives:
          type: array
          description: 可选指令（如暂停接单、要求升级）；未知指令必须忽略。
          items:
            type: string

    # ------------------------------------------------------------ 协议
    ProtocolCapabilities:
      type: object
      additionalProperties: true
      required: [protocol_version, min_supported_version, capabilities, server_time]
      properties:
        protocol_version:
          type: string
        min_supported_version:
          type: string
          description: 服务端仍接受的最低版本；低于此值返回 426。
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, version]
            properties:
              id:
                type: string
                description: 能力标识（如 `chat_completions`、`batch`、`receipts`）。
              version:
                type: string
              status:
                type: string
                enum: [stable, beta, deprecated]
        server_time:
          type: string
          format: date-time

    DeprecationList:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [path, method, deprecated_at, sunset_at]
            properties:
              path:
                type: string
              method:
                type: string
              deprecated_at:
                type: string
                format: date-time
              sunset_at:
                type: string
                format: date-time
                description: 退役日期；提前 ≥90 天公示，且至少跨 2 个 MAJOR。
              replacement:
                type: string
                description: 替代端点/字段（无替代时为空）。
              supported_majors:
                type: array
                items:
                  type: string

    # ------------------------------------------------------------ 调度快照
    SnapshotNode:
      type: object
      additionalProperties: true
      required: [node_id, kind, access, model, max_qps, unit]
      description: 快照里的单条容量公告（**输入**，不含评分/权重/淘汰原因）。
      properties:
        node_id:
          type: string
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
        unit:
          type: string
        resource_level:
          type: string

    ScheduleSnapshot:
      type: object
      additionalProperties: true
      required: [period, quote_version, published_at, nodes]
      properties:
        period:
          type: string
          format: date
        quote_version:
          type: string
          description: 报价版本（复算输入的一部分）。
        published_at:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNode'
        verify_url:
          type: string
          format: uri
          description: 对应周期的 Merkle 根与复算工具（`/verify/{period}`）。

    # ------------------------------------------------------------ 账本
    LedgerEntry:
      type: object
      additionalProperties: true
      required:
        - entry_id
        - entry_type
        - unit_type
        - channel_id
        - asset_ref
        - amount
        - status
        - policy_version
      description: |
        账本分录（只追加）。语义字段（`entry_type` / `unit_type` /
        `status`）语义不因版本改变；旧分录永远可复算。
      properties:
        entry_id:
          type: string
        entry_type:
          type: string
        unit_type:
          type: string
        channel_id:
          type: string
        asset_ref:
          type: string
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        ref_id:
          type: string
        quality_coef:
          type: string
        stability_coef:
          type: string
        status:
          type: string
          enum: [pending, confirmed, locked, settled, void]
          description: |
            分录状态。与产品设计 §20.4 对齐：pending → confirmed → locked → settled；
            异常终止为 void；冲正不改原分录，新增 reverse_of 指向原 entry_id。
            reversed 退役（v1 未发布，无兼容负担）；客户端仍须容忍未知值。
        lock_until:
          type: string
          format: date-time
        reverse_of:
          type: [string, 'null']
          description: 冲正指向的原始 `entry_id`；非冲正为 null。
        policy_version:
          type: string
        created_at:
          type: string
          format: date-time

    LedgerEntriesPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        page:
          $ref: '#/components/schemas/Page'

    ConfigItem:
      type: object
      additionalProperties: true
      required: [key, scope, version, value_type, state, updated_at]
      properties:
        key:
          type: string
        scope:
          type: string
          description: 作用域（global / chain / tier / bucket 等）
        version:
          type: integer
          minimum: 1
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        value:
          description: 非敏感配置值；敏感项必须为空，只给 `secret_ref` 或脱敏摘要。
        secret_ref:
          type: [string, 'null']
          description: 敏感值的引用（KMS/密钥库路径），不是明文。
        state:
          type: string
          enum: [draft, active, rolled_back, retired]
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    ConfigItemPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
        page:
          $ref: '#/components/schemas/Page'

    ConfigDraftRequest:
      type: object
      additionalProperties: false
      required: [value_type, reason]
      properties:
        value:
          description: 非敏感值；敏感项改用 `secret_ref`。
        secret_ref:
          type: string
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        effective_at:
          type: string
          format: date-time

    ConfigPublishRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        gray_plan:
          type: object
          additionalProperties: false
          properties:
            buckets:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 100
            observation_seconds:
              type: integer
              minimum: 60

    ConfigApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 4

    ConfigRollbackRequest:
      type: object
      additionalProperties: false
      required: [target_version, reason]
      properties:
        target_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 4
        ticket:
          type: string

    ConfigKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [reason, ttl_seconds]
      properties:
        reason:
          type: string
          minLength: 4
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: 到期自动回到上一生效版本；上限 24h。
        tighten_only:
          type: boolean
          enum: [true]
          description: 只允许收紧；借开关放开权限/阈值必须拒绝。

    ConfigPublishAck:
      type: object
      additionalProperties: true
      required: [request_id, state]
      properties:
        request_id:
          type: string
        state:
          type: string
          enum:
            - pending_approval
            - approved
            - scheduled
            - rolling_out
            - active
            - rejected
            - expired
            - cancelled
            - rolled_back
            - failed
          description: |
            发布单状态机：pending_approval → approved → scheduled → rolling_out → active；
            终止态 rejected / expired / cancelled / rolled_back / failed。
            `expired` **不自动放行**。
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        approvals_required:
          type: integer
          minimum: 1
        approvals_received:
          type: integer
          minimum: 0

    ConfigDrift:
      type: object
      additionalProperties: true
      required: [key, detected_at]
      properties:
        key:
          type: string
        scope:
          type: string
        desired_version:
          type: integer
        effective_version:
          type: integer
        running_version:
          type: integer
        detected_at:
          type: string
          format: date-time

    ConfigDriftList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDrift'
        page:
          $ref: '#/components/schemas/Page'

    SourceType:
      type: string
      description: |
        记账网关维护的 `source_type` 白名单（16 值，TEC-02）。用于 journal 幂等键
        `(source_type, source_id, event_seq)`。属**版本化枚举**：新增值按 MINOR 先改 spec，
        客户端必须容忍未知值（读路径遇未知值由服务端拒绝，不静默记账）。
      enum:
        - chain_tx
        - payment_attempt
        - conversion_trade
        - usage_settle
        - lock_expiry
        - payout_accrual
        - payout_item
        - payout_batch
        - wallet_transfer
        - refund
        - chargeback
        - rebate
        - fx_reval
        - loss_pool
        - void
        - unidentified

    NotificationPreferences:
      type: object
      additionalProperties: true
      required: [email, in_app, webhook]
      properties:
        email: { type: boolean }
        in_app: { type: boolean }
        webhook: { type: boolean }
        quiet_hours:
          type: object
          additionalProperties: false
          properties:
            start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            timezone: { type: string }
        digest:
          type: string
          enum: [realtime, daily, weekly]
        p0_opt_out:
          type: boolean
          enum: [false]
          description: P0 通知不可退订；写入 true 返回 `40902`。

    WebhookSubscription:
      type: object
      additionalProperties: true
      required: [id, url, events, status]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        status:
          type: string
          enum: [active, paused, disabled]
        created_at: { type: string, format: date-time }

    WebhookSubscriptionList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        page: { $ref: '#/components/schemas/Page' }

    WebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        description: { type: string, maxLength: 200 }

    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 签名密钥，**仅创建时返回一次**；服务端只存哈希。

    QuoteSettings:
      type: object
      additionalProperties: true
      required: [min_price, max_price, currency]
      properties:
        min_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        max_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, enum: [USD] }
        updated_at: { type: string, format: date-time }
      description: 区间整体替换（PUT 覆盖式）；用方为出价范围，供方为价格范围。

    ReportEnvelope:
      type: object
      additionalProperties: true
      required: [report_id, period, generated_at]
      properties:
        report_id:
          type: string
          enum: [REP-01, REP-02, REP-03, REP-04, REP-06]
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: 自然月 `YYYY-MM`（与 `/verify/{period}` 同粒度；审计锚定日是日粒度）。
        generated_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: 报表主体（字段随 report_id 不同，见 v4 §23.2）。

    TreasuryIntent:
      type: object
      additionalProperties: true
      required: [intent_id, kind, chain_id, expires_at, nonce]
      properties:
        intent_id: { type: string }
        kind:
          type: string
          enum: [PAYOUT, REFUND, SWEEP, REBALANCE, GAS_TOPUP, POLICY_CHANGE, RECOVERY, WALLET_PROVISION]
          description: 第八个取值 `WALLET_PROVISION` 属追加枚举；不复用 `POLICY_CHANGE`。
        chain_id: { type: integer }
        wallet_id: { type: string }
        amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        expires_at: { type: string, format: date-time }
        nonce: { type: integer, minimum: 0 }
        policy_version: { type: string }

    Wallet:
      type: object
      additionalProperties: true
      required: [wallet_id, status]
      properties:
        wallet_id: { type: string }
        status:
          type: string
          enum: [active, paused, draining, retired, provisioning, zero, frozen]
          description: 四值基线 + 退休四步中间态 `provisioning / zero / frozen`；共七值。
        switch_state:
          type: string
          enum: [standby, in_service, switching_out, draining]
          description: 仅对 `active` 有意义。
        fund_class: { type: string, enum: [hot, warm, cold] }
        balance: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }

    SigningEvent:
      type: object
      additionalProperties: true
      required: [signing_event_id, signing_request_id, event, occurred_at]
      properties:
        signing_event_id: { type: string }
        signing_request_id: { type: string }
        event:
          type: string
          enum: [requested, presented, signed, verified, co_signed, broadcast]
        signer_type: { type: string, enum: [owner, reviewer, company] }
        signer_ref: { type: string }
        signature_hash: { type: string }
        device_id: { type: string }
        auth_hash: { type: string }
        txid: { type: string }
        error_code: { type: integer }
        occurred_at: { type: string, format: date-time }
