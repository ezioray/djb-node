          description: 40401 工单不存在 —— 开关关闭时 error.reason=feature_disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
  /api/v1/admin/support/tickets/{public_id}/state:
    post:
      operationId: setSupportTicketState
      summary: 工单状态迁移（幂等）
      description: '合法迁移见本域状态机；非法迁移 409 `reason=illegal_transition`（附 current / target）；

        同态重复提交幂等 `changed=false`（不写库、不改 updated_at）。

