      summary: 为我签发一次性绑定码（账户级；首次绑定不要求 step-up）
      description: '网页端在登录态下为自己签发一枚一次性绑定码，作为 `POST /api/v1/node/binding` 的前置

        （M02 §6.5 / INV-08）。**账户级 Bearer 即可，不要求 step-up** —— 首次绑定节点的用户

        可能还没有绑定 MFA/因子，要求 step-up 会让新用户永远走不完绑定流程（BUG-05）。


        口径：节点不存在 → 404 + `40401`（不泄露存在性）；节点非 `active`

        （`pending` 未准入 / `frozen` / `retired`）→ 403 + `40305`；节点**已绑定**（他人或本人）

        → 409（`40903`，`reason=node_already_bound` / `node_already_bound_by_self`），

        响应体**不包含**绑定方账户标识。


        绑定码明文只在本响应出现一次，平台只存 `sha256(code)`；有效期等于响应里的 `ttl_seconds`。

        '
      security:
      - userBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
