        generated_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: 报表主体（字段随 report_id 不同，见 v4 §23.2）。
    TreasuryIntent:
      type: object
      additionalProperties: true
      required:
      - intent_id
      - kind
