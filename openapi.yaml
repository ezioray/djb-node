  # ---------------------------------------------------------------- 支付与资金（M08，spec 1.2.5）
  # 写进 spec ≠ 公网可达：管理面内网/VPN + 强 MFA + step-up（≤5 分钟）；资金写不自动重试。
  # 敏感边界：schema 不含卡号、私钥 / 助记词、完整签名；只存结论与哈希引用。
  /api/v1/pay/orders:
    post:
      tags: [pay]
      operationId: createPaymentOrder
      summary: 创建支付订单（PSP 通道 / 链上收款；一单一币种）
      description: |
        金额用整数最小单位（分，`amount_minor`；INV-07），不做浮点与四舍五入；超精度直接拒绝。
        同一 `X-DJB-Idempotency-Key` 重放返回首次结果，不重复下单。
        通道未开启 → `403` + `40310`；地区不支持 → `403` + `40311`；入金风控等级不足 → `403` + `40312`。
        PSP 会话与密钥由服务端持有，本接口不回传密钥 / 卡数据；收银台跳转 URL 由通道适配器返回
        （字段待 M13 接入时按需补 optional，本版不含）。
      security: [{ userBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentOrderCreateRequest' }
      responses:
        '201':
          description: 订单已创建（`status=created`）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pay/orders/{id}:
    get:
      tags: [pay]
      operationId: getPaymentOrder
      summary: 订单状态与尝试明细（只读）
      description: |
        `id` 接受订单号 `order_no`。状态机 created → pending → paid → credited，
        终止 failed / closed / expired（终态不可回退）。链上收款确认不足只返回确认中态、不入账；
        链 / 资产不支持 → `409` + `40913`，确认数不足 / 充值未到账 → `409` + `40912`。
        响应带 `attempts`（每次向 PSP / 链上发起）与 `signature_verified` 结论，**不含**签名字节；
        `original_route_masked` 为原路展示掩码（只读、仅展示，无成功 attempt 时为 null）。
      security: [{ userBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 订单号 `order_no`（对外单号，≤32 字符，创建后不变）。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 订单详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pay/webhooks/{provider}:
    post:
      tags: [pay]
      operationId: receivePaymentWebhook
      summary: PSP 回调（独立验签端点，不进用户鉴权）
      description: |
        服务端验签端点：**不做用户鉴权**（`security: []`），只按通道独立密钥验签。
        原始 body 参与验签（先验签再反序列化）、时间戳 ±5 分钟、事件 ID 幂等；
        PSP 重试时幂等返回首次结果（`duplicate=true`），我方返回 2xx 才停止重试。
        验签失败 → `400` + `40001`（spec 通用码）；重复回调 → `409` + `40910`（幂等返回首次结果，
        不重复入账）；金额不符 → `409` + `40911`（挂账，入账前不计）；`responseUrl` 不作为入账依据，
        webhook 也不是结算依据（以 PSP 结算报告 + 银行流水为准）。
        请求体为通道原始事件（结构随通道而异），本 spec 只约束响应与状态码。
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: 通道标识（与 `PaymentProvider.id()` 一致）；密钥按通道分域、独立轮换。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: PSP 原始事件体（只验签并解析必要字段，不落正文）。
      responses:
        '200':
          description: 已接收（首次或重复回调；重复返回首次处理结果）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentWebhookAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pay/refund-requests:
    post:
      tags: [pay]
      operationId: createRefundRequest
      summary: 退款申请（原路、14 天窗口、唯一 refund_request）
      description: |
        只回原路、金额 ≤ 已付未消耗、窗口 14 天（03-facts §5），唯一一条 `refund_request`；
        不向第三方地址退款。`original_route` 可省略：省略时服务端按 `order_no` 对应的唯一成功
        `payment_attempt` 推导真实原路；无法唯一确定（无成功 attempt / 多次成功）→ `409` + `40919`
        （`reason=original_route_unavailable`）。原路退款排队 → `409` + `40917`；原路不可用 →
        `409` + `40918`（转人工，不换路）；金额不符 / 超额 → `409` + `40911`。
        高危动作：二次认证（step-up ≤5 分钟）+ 双人复核；缺 step-up 返回 `424` + `42401`。
      security: [{ userBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequestCreateRequest' }
      responses:
        '201':
          description: 已受理（`status=requested`；进入审批与执行队列）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/provider/payouts:
    get:
      tags: [provider]
      operationId: listProviderPayouts
      summary: 共享方分润批次与明细（只读）
      description: |
        当前账户作为共享方的分润批次（`payout_batches` + `payout_items`，≤50 笔 / 批）。
        只返回本账户相关批次；三项金额（gross / fee / net）均为整数最小单位。
        `fee > gross` 的明细 `status=carried`（滚存下批），不在本批出款。
        批次状态机 draft → prepared → checked → signed → broadcast → settled / partial / failed。
      security: [{ userBearer: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, prepared, checked, signed, broadcast, settled, partial, failed] }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 分润批次分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/provider/payout-address:
    post:
      tags: [provider]
      operationId: updateProviderPayoutAddress
      summary: 出款地址新增 / 变更（72h 冷却 + 首笔试转）
      description: |
        出款主体准入（白名单 / 所有权签名挑战未完成 → `422` + `42210`；风控 / 地址风险拒绝 → `422` + `42211`）。
        72h 冷却后才生效；首笔 ≤100 USDT 试转；出款前 7 天禁改；旧地址继续监听 ≥90 天。
        只接受一期链（Polygon PoS）地址。高敏：二次认证（缺 step-up → `424` + `42401`）+ 双人复核 + 冷却。
        响应只回地址、白名单状态与冷却 / 生效时间，**不回**签名挑战原文或完整签名。
      security: [{ userBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryAddressRequest' }
      responses:
        '200':
          description: 已登记（冷却期 / 生效时间见响应；未生效地址不得出款）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryAddress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/pools:
    get:
      tags: [admin]
      operationId: listTreasuryPools
      summary: 钱包池深度（只读）
      description: |
        池键 `chain:role:fund_class` 创建后不可变（INV-01）。`depth_ready` = `active ∧ gas_ok`
        的可用只数（INV-03），`depth_available` 供切换判定；池空 **不停止收款**（INV-06），
        只暂停新地址分发并摊量到现有钱包。`role` / `fund_class` 取值收敛以 CR-P5 裁决为准。
      security: [{ adminBearer: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, paused, retired] }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [hot, warm] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 池分页（含深度；可带池内钱包摘要）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryPoolPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: createTreasuryPool
      summary: 新建钱包池（池键不可变）
      description: |
        一期只建 Polygon × {客户热、客户温、平台温}（平台热不建）。cap 与 max_active 受
        facts §2 约束：单钱包 cap ≤10,000 USD 且 ≥1,000 USD；池合计上限 50,000 USD 或
        treasury 10% 取小；`max_active` 自动上调只升不降（INV-04 / INV-05）。池键冲突 → `409`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryPoolCreateRequest' }
      responses:
        '201':
          description: 池已创建
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryPool' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/provision:
    post:
      tags: [admin]
      operationId: provisionTreasuryWallets
      summary: 预生成钱包（描述符 + 批次；不碰钱）
      description: |
        生成 N 只钱包描述符 → `batch_id` + 描述符 Merkle 根（INV-02：批次内不得夹带转账指令）。
        每批默认 4 只、硬顶 8；批次 TTL 24h，过期作废重签。只返回批次与描述符哈希，
        **不返回**私钥 / 助记词 / keystore（平台零可签名材料）。池已暂停 / 不可扩容 → `409`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryProvisionRequest' }
      responses:
        '201':
          description: 批次已生成（`status=draft` 或 `pending_sign`；激活另走 activate）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryProvisionBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/activate/{batch}:
    post:
      tags: [admin]
      operationId: activateTreasuryBatch
      summary: 批量激活（HSM 验 2/3 签；24h TTL）
      description: |
        批次 draft → pending_sign → signed → activated（activated 不可回退）；HSM 验 2/3 签后批量激活。
        批次过期 → `409` + `40914`（整批不激活，重签）；地址冲突 → `409` + `40915`。
        缺 2/3 签名不得激活（INV-10 / INV-02）。激活 ≠ 可用：`ready = active ∧ gas_ok`（INV-03）。
        请求体只引用签名请求（`signing_request_id`），**不接受**签名字节。
      security: [{ adminBearer: [] }]
      parameters:
        - name: batch
          in: path
          required: true
          description: 预生成批次 id（`batch_id` / `WALLET_PROVISION` 批次）。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryActivateRequest' }
      responses:
        '200':
          description: 已激活（返回批次最新状态与激活时间）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryProvisionBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/switch:
    post:
      tags: [admin]
      operationId: switchTreasuryWallet
      summary: 手动 / 重试地址切换（自动切换走内部事件）
      description: |
        切换只影响**新地址分配**，不搬旧钱（跨池调钱是一笔真实转账 + 分录）。
        候选钱包由服务端按 least_utilized（余额 / cap 最低）→ newest_activated 选择；
        被换下的钱包进入 switching_out → draining 后不再接新地址；切回需新 switch_id。
        切换失败重试 1 次后转人工。单人可「停」，改分配需 step-up + 双人复核（§19.11.2）。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasurySwitchRequest' }
      responses:
        '200':
          description: 切换已触发（`status=triggered` / `executing` / `done`）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasurySwitchAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/retire:
    post:
      tags: [admin]
      operationId: retireTreasuryWallet
      summary: 钱包退休四步（drain → zero → frozen → retire）
      description: |
        `step ∈ {drain, zero, frozen, retire}`；余额非 0 不得退休，缺对账 attestation
        不得进入 retired（`409` + `40916`）。退休后地址不复用、`wallet_id` 永久可解析、
        旧地址监听 ≥90 天。退休是终态，不可回退。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryRetireRequest' }
      responses:
        '200':
          description: 已推进退休步骤（返回钱包最新状态）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryWallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/payouts:
    post:
      tags: [admin]
      operationId: createTreasuryPayoutBatch
      summary: 分润批次制单（≤50 笔；审批后明细冻结）
      description: |
        制单 ≤50 笔（PAYOUT_BATCH_MAX_ITEMS）；制单人 ≠ 复核人。批次状态机
        draft → prepared → checked → signed → broadcast → settled / partial / failed；
        审批后明细冻结，改单 = 新批次。`fee > gross` 的 item 置 carried 滚存下批。
        请求体含应付明细（gross 与可选 fee）；net 与 gas 结算由服务端按 `policy_version` 计算，
        gas 模式按批次快照、下一批生效（INV-14）。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutBatchCreateRequest' }
      responses:
        '201':
          description: 批次已制单（`status=draft` / `prepared`；明细冻结前可改）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/payouts/{id}/approve:
    post:
      tags: [admin]
      operationId: approveTreasuryPayoutBatch
      summary: 分润批次复核（须有效 attestation；复核人 ≠ 制单人）
      description: |
        复核 = maker–checker 的 checker；须 M09 有效 attestation、未结 P0 / P1 为 0、
        审批链完整，否则 `409` + `40916`（缺 attestation / 未对账平）。审批 30 分钟内可执行，
        超时作废（PAYOUT_APPROVAL_EXPIRE_S）；复核人 = 制单人 → `409`。
        状态推进：prepared → checked。请求体为可选备注，不含签名字节。
      security: [{ adminBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 分润批次号 `batch_no`。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutApproveRequest' }
      responses:
        '200':
          description: 已复核（`status=checked`；明细冻结）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/payouts/{id}/sign-request:
    post:
      tags: [admin]
      operationId: requestTreasuryPayoutSignature
      summary: 发起决策人签名请求（不是签名）
      description: |
        只 propose：生成 `treasury_intent`（`kind=PAYOUT`）+ `signing_request` 并推送到签名设备；
        签名本身是链下 / 链上独立动作，不在 RBAC 内（§19.11.3）。签名请求 TTL 1800s
        （SIGNING_TTL_S），超时过期；缺 attestation / 未对账平 → `409` + `40916`。
        响应只回签名请求 id、状态与 `auth_hash` 前缀，**不回**签名字节。
      security: [{ adminBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 分润批次号 `batch_no`。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: 签名请求已创建（`status=pending`；推送至签名设备）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/addresses:
    get:
      tags: [admin]
      operationId: listTreasuryAddresses
      summary: 收款地址白名单与冷却状态（只读）
      description: |
        地址是可公开的链上标识；响应只含地址、标签、归属与冷却 / 变更时间，不含密钥或签名材料。
        72h 冷却内的地址不得用于出款；出款前 7 天禁改（INV-13）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: chain
          in: query
          required: false
          description: 链标识（一期 `polygon`）。
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, whitelisted, rejected, revoked] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 地址分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryAddressPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: upsertTreasuryAddress
      summary: 新增 / 变更收款地址白名单（72h 冷却 + 首笔试转）
      description: |
        所有权签名挑战 + 人工复核 + 72h 冷却；首笔 ≤100 USDT 试转；出款前 7 天禁改。
        链 / 地址不支持 → `409` + `40913`；出款主体未准入 / 风控拒绝 → `422` + `42210` / `42211`。
        step-up 必需（`424` + `42401`）；地址不可复用（退休地址只监听）。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryAddressRequest' }
      responses:
        '201':
          description: 已登记（冷却中或直接生效取决于白名单 / 冷却状态）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryAddress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/deposit-address:
    get:
      tags: [admin]
      operationId: getTreasuryDepositAddress
      summary: 平台收款地址（只读；发布走 POST）
      description: |
        返回当前生效的平台收款地址与旧地址监听到期日。链不支持 → `409` + `40913`。
      security: [{ adminBearer: [] }]
      parameters:
        - name: chain
          in: query
          required: false
          description: 链标识（一期 `polygon`）。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 当前平台收款地址
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositAddress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: publishTreasuryDepositAddress
      summary: 发布 / 轮换平台收款地址（GA 强制；S3 开放）
      description: |
        二次认证（GA OTP）+ `reason` + `ticket` 必填；24h 冷却；发布后旧地址继续监听 ≥90 天，
        切换不退不补。链不支持 → `409` + `40913`。发布本身进审计链。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositAddressRequest' }
      responses:
        '200':
          description: 已发布（返回生效地址与新版本时间）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositAddress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/gas-policy:
    get:
      tags: [admin]
      operationId: getTreasuryGasPolicy
      summary: gas 策略快照（只读）
      description: |
        返回 gas 模式 / 承担方 / 作用域与 `policy_version`。按批次快照、下一批生效、不追溯（INV-14）；
        低于 gas 预留（≥10 POL）暂停归集并告警（03-facts §1）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: chain
          in: query
          required: false
          description: 链标识（一期 `polygon`）。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 当前 gas 策略
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GasPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: updateTreasuryGasPolicy
      summary: 切换 gas 模式（下一批生效、不追溯）
      description: |
        `gas_mode ∈ {INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER}`；EXTERNAL_* 必须指定 `gas_bearer`。
        24h 冷却，下一批生效、不追溯，切换不退不补（INV-14）。step-up + 双人复核；
        策略发布人 ≠ 出款人（策略发布 ≠ 出款，§19.11.2）。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GasPolicyRequest' }
      responses:
        '200':
          description: 已登记（下一批次生效）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GasPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- 数据治理与 Ops（M14，spec 1.2.5）
  # 只读聚合：M14 不写业务表；写动作一律调 Owner API。导出链接与水印是敏感面：
  # 链接一次性、TTL ≤15 分钟、文件 7 天失效、导出本身进审计；响应不返回 prompt / 凭据 / 完整签名。
  /api/v1/admin/data/export-requests:
    get:
      tags: [admin]
      operationId: listAdminDataExportRequests
      summary: 导出申请列表（游标分页）
      description: |
        只返回请求人有权范围的申请；`state ∈ {pending, approved, running, done, failed, expired}`，
        过期不自动续期（INV-04）。列表**不返回**下载链接（链接只在详情、一次性、TTL ≤15 分钟）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, running, done, failed, expired] }
        - name: object
          in: query
          required: false
          schema: { type: string, enum: [usage, receipts, tickets, logs, backups, analytics] }
        - name: requester
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 导出申请分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      operationId: createAdminDataExportRequest
      summary: 建导出申请（step-up + 理由 + 范围）
      description: |
        step-up 必带；`reason` 与 `scope.object` 必填。>1,000 行或含个人信息需双人复核；
        同一人 24h ≤1 次大导出（INV-04）。越权 → `403` + `40301`；超出导出上限
        （行数 > `data.export_max_rows` / 大导出配额）→ `400` 或 `413` + `49001`（提示拆范围）；
        请求结构 / 值非法 → `400` + `40001`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequestCreateRequest' }
      responses:
        '201':
          description: 申请已建（`state=pending`；进入审批）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/data/export-requests/{export_id}:
    get:
      tags: [admin]
      operationId: getAdminDataExportRequest
      summary: 申请状态 + 一次性下载链接（≤15 分钟）
      description: |
        `state=done` 且未消费时返回带水印的一次性签名下载链接（TTL ≤15 分钟；文件 7 天后失效）；
        其余情况 `download.available=false` 并给 `download.reason`。申请人 / 复核人之外不可见
        （越权统一 `404` + `40401`）。链接只能用一次。
      security: [{ adminBearer: [] }]
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出申请 id（UUID）。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申请详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/data/export-requests/{export_id}/cancel:
    post:
      tags: [admin]
      operationId: cancelAdminDataExportRequest
      summary: 取消未执行的导出申请（step-up）
      description: |
        取消只作用于未执行（pending / approved）申请，效果为 `state → failed` +
        `failure_reason=cancelled_by_requester`（**不新增** cancelled 状态值，state 枚举不变）；
        重复取消幂等返回同一结果（`cancelled_at` 不变）；running / done / failed / expired 返回
        `409` + `40901`（状态不允许 / 对象被待复核动作锁定）。取消也留痕进审计。
      security: [{ adminBearer: [] }]
      parameters:
        - name: export_id
          in: path
          required: true
          description: 导出申请 id（UUID）。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已取消（`state=failed`、`failure_reason=cancelled_by_requester`；`cancelled_at` / `cancelled_by` 留痕）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/data/retention-jobs:
    post:
      tags: [admin]
      operationId: createRetentionJob
      summary: 触发保留任务（dry-run 可选；step-up）
      description: |
        按 §22.5 保留矩阵执行；同一 (`object`, `cutoff`) 只执行一次（幂等），
        重复提交返回 `409` + `40901`。`dry_run=true` 只算将删条数、不执行。
        job 状态 queued → running → done / failed；失败 P1 + 幂等重放，连续 2 次升级 P0。
        `cutoff` 与 `policy_days` 二选一或同时给出（同时给出时必须一致）。
        请求结构 / 值非法 → `400` + `40001`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionJobCreateRequest' }
      responses:
        '201':
          description: 任务已创建（`state=queued` 或已执行完成）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [admin]
      operationId: listRetentionJobs
      summary: 保留任务与删除报告（只读）
      description: |
        任务与删除报告（已删 / 部分保留及原因 / 最迟清除日 / 方式）只读查询；
        `report_ref` 为报告引用，`report` 为结构化摘要（不含被删数据正文）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: object
          in: query
          required: false
          schema: { type: string, enum: [usage, receipts, tickets, logs, backups, analytics] }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [queued, running, done, failed] }
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 任务分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionJobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ops/health:
    get:
      tags: [admin]
      operationId: getOpsHealth
      summary: 七块健康总览（红 / 黄 / 绿 + 最近变更）
      description: |
        七块：gateway / scheduling / ledger / recon / wallet / config / notification；
        每块给红黄绿、原因摘要与最近一次变更。只给结论与组件名，**不含**阈值、名单、依赖地址或凭据。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 健康总览
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ops/changes:
    get:
      tags: [admin]
      operationId: listOpsChanges
      summary: 变更日历（窗口 / 回滚方案 / 影响面）
      description: |
        所有生产变更挂变更单（窗口、回滚方案、影响面）；冻结窗口默认月末 2 天与重大活动期，
        窗口外变更 100% 被拒。只读聚合，变更执行在 M16。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 变更分页（按发生时间倒序）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsChangePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ops/batch-ops:
    post:
      tags: [admin]
      operationId: executeOpsBatch
      summary: 批量操作五步（预览 / 执行 / 撤销）
      description: |
        五步：① `step=preview` 返回影响清单 + 数量 + 随机 ≤10 条逐条确认（无预览禁止执行；201）；
        ② 二次认证（step-up）；③ >50 条或涉资金 / 冻结需双人复核（响应 `dual_review_required`）；
        ④ `step=execute` 单次 ≤200 条，执行后 10 分钟撤销窗口（`undo_deadline`）；
        ⑤ 受影响用户 P1 通知。`step=undo` 一键反向（撤销也留痕）。
        结构 / 值非法 → `400` + `40001`；越权 / 超上限 → `403`（`49001` 提示拆分）；
        重复执行、窗口已关或对象被锁定 → `409` + `40901`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpsBatchOpRequest' }
      responses:
        '200':
          description: 执行 / 撤销结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsBatchOp' }
        '201':
          description: 预览结果（含影响清单与抽样；无预览不得执行）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsBatchOp' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ops/audit-replay:
    get:
      tags: [admin]
      operationId: replayOpsAudit
      summary: 操作回放（按 trace_id / owner_id / action 合并时间线；只读）
      description: |
        审计链 + 事件 outbox 按 `trace_id` / `owner_id` / `action` 合并时间线；
        只读、不可修改任何日志。至少给一个过滤条件，否则 `400` + `40001`。
        返回脱敏摘要（不含 prompt / 凭据 / 完整签名 / before-after 原文）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: trace_id
          in: query
          required: false
          schema: { type: string }
        - name: owner_id
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 合并时间线（按 occurred_at 倒序，同刻按来源排序）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditReplay' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  # ---------------------------------------------------------------- 用户态补丁（M02 / M05，spec 1.2.6）
  # M13 CR-1 / CR-2：用户控制台所需的节点绑定视图与账单导出；归属 M02 / M05，鉴权 userBearer。
  /api/v1/user/nodes:
    get:
      tags: [user]
      operationId: listUserNodes
      summary: 我的节点（绑定状态 / 最近心跳 / 已生效版本）
      description: |
        当前账户名下节点（含已解绑历史，`state=revoked`）。`state` 为绑定视图状态
        （unbound / pending_receipt / bound / revoked），`lifecycle_state` 为 M02 权威生命周期
        （pending / active / frozen / retired）；两者不一致时以 M02 心跳与 node_events 为准。
        `applied_version` 为节点回传的已生效版本（M10 running applied_version），未回传为 null；
        `pending_reason` 给 pending / pending_receipt 的粗粒度原因（不含规则、名单或内部判定）。
        只返回本账户节点；对象级越权一律 404 + `40401`（不泄露存在性）。
      security: [{ userBearer: [] }]
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [unbound, pending_receipt, bound, revoked] }
        - name: lifecycle_state
          in: query
          required: false
          schema: { type: string, enum: [pending, active, frozen, retired] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 节点分页（按最近心跳倒序，无心跳排后）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserNodePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/nodes/{node_id}/unbind:
    post:
      tags: [user]
      operationId: unbindUserNode
      summary: 解绑我的节点（幂等；需 step-up）
      description: |
        解绑当前账户下的节点：解除绑定并撤销该节点客户端密钥（立即停单；在途任务允许完成，
        历史收据与锁定收益不删除，M02 INV-08）。
        幂等：重复调用返回同一结果（`state=revoked`，`bound_at` 保留，`unbound_at` 不变）。
        需二次认证（缺 step-up → 424 + `42401`）；节点不属于本账户统一 404 + `40401`；
        状态不允许（已清退 / 冻结）→ 409（M02 `40902` / `40903` 段）。
        密钥撤销后旧 `X-Client-Key` 立即失效；换绑需重新配对（`POST /api/v1/node/pair`）。
      security: [{ userBearer: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserNodeUnbindRequest' }
      responses:
        '200':
          description: 解绑后的节点视图（重复调用返回同一结果）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/billing/export:
    get:
      tags: [user]
      operationId: exportUserBilling
      summary: 导出我的账单（流式 CSV / JSON；Content-Disposition + TTL）
      description: |
        流式账单导出，只含当前账户有权数据；不含 prompt / response 正文、凭据与 PII 正文。
        `format=csv` 返回 `text/csv`（UTF-8 含表头），`format=json` 返回 `application/json`
        （JSON 数组或 NDJSON 流，按实现；客户端按行 / 数组解析均应容忍）。
        文件名走 `Content-Disposition: attachment`；流 / 下载凭据有效期由
        `X-DJB-Export-Expires-At` 给出（TTL，≤15 分钟，过期需重新申请）。
        服务端不落导出正文；导出本身进审计。时间窗过大请拆分（超限 → 400 + `40001`）。
      security: [{ userBearer: [] }]
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: csv }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 流式账单（CSV / JSON；错误仍为 JSON 错误信封）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Disposition:
              description: '`attachment; filename="billing-<period>.<csv|json>"`；不暴露内部路径。'
              schema: { type: string }
            X-DJB-Export-Expires-At:
              description: 流 / 下载凭据过期时间（RFC 3339 UTC，TTL ≤15 分钟）；过期需重新申请。
              schema: { type: string, format: date-time }
          content:
            text/csv:
              schema:
                type: string
                description: CSV 文本流（UTF-8，含表头）。
            application/json:
              schema:
                type: string
                description: JSON 数组或 NDJSON 流（UTF-8）；元素结构按账单口径。
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: DJB-Key
      description: |
        用方 API Key（一枚 Key 通吃所有可路由模型）。Key 只显示一次；
        平台只存哈希；客户端应存于 OS 安全存储，不进日志、不进仓库。
    nodeClientKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: |
        节点客户端密钥，由 `/api/v1/node/pair` 生成、可轮换（重叠 ≤24h）
        与撤销（立即停单，在途不受影响）。只存哈希（字段 client_key），
        平台不回显明文。
    internalMTLS:
      type: mutualTLS
      description: |
        服务间 mTLS + service token（仅集群内可达，公网不可达；不进客户端 SDK，
        不发动态口令）。仅用于 `/api/v1/schedule/route` 这类**内部**端点。
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: Admin-Session
      description: |
        后台会话（强制 MFA；敏感动作 step-up ≤5 分钟；break-glass 只读模式见）。管理面仅内网/VPN，公网不可达。

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方生成的请求标识（UUID）；服务端原样回显，贯穿日志与链路追踪。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-DJB-Idempotency-Key
      in: header
      required: false
      description: |
        写操作幂等键，24h 有效且与账本写入同事务。缺省时服务端按
        请求体指纹做 300s 去重（流式仅 60s）。
      schema:
        type: string
        minLength: 16
        maxLength: 128
    AdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      description: 敏感操作二次认证凭据（≤5 分钟有效）；P0 配置发布必备。
      schema:
        type: string

    ReportPeriod:
      name: period
      in: query
      required: true
      description: |
        报表周期：自然月 `YYYY-MM`，或日粒度 `YYYY-MM-DD`（REP-01/02/04 需要日粒度时用；
        `/admin/ledger/merkle/{period}` 仍只接受月）。日粒度只加不改，月粒度行为不变。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$'

    ProtocolVersion:
      name: DJB-Protocol-Version
      in: header
      required: false
      description: 调用方协议版本（`MAJOR.MINOR.PATCH`）。缺省按服务端当前版本；不兼容返回 426。
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Capabilities:
      name: DJB-Capabilities
      in: header
      required: false
      description: |
        调用方启用的能力标识（逗号分隔，如 `chat_completions,batch`）。双方只启用交集；
        未知 capability **忽略不报错**。
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页的不透明游标；首次不传。不得猜测或自行构造。
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数上限。服务端可返回更少；`has_more` 判断是否继续。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      description: 起始时间（UTC，含端点）。日期或 RFC 3339 日期时间。
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: 结束时间（UTC，含端点）。
      schema:
        type: string
        format: date-time
    Period:
      name: period
      in: path
      required: true
      description: 周期标识（UTC 日期）。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    RequestId:
      description: 服务端/调用方请求标识，原样回显。
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: 建议重试等待秒数（429/503）。客户端必须遵守并加抖动。
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: 请求不合法（结构、枚举、大小上限）。不得回显内部堆栈或 SQL。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或凭据无效/过期。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        已认证但无权限，或命中风控。对外只给粗粒度原因码（如 `account_restricted`），
        不返回具体规则/阈值/名单。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（含无权查看时的统一 404，避免枚举）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突（重复幂等键的不同载荷、状态机不允许的迁移）。无更细码时用通用
        `40919`；细分码见 `Error.code`。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: 协议版本不兼容（`42601`，HTTP 426）。响应体给出可升级的版本范围。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        请求体超过上限（HTTP 413，专用码 `40013`；chat 请求建议 ≤1 MiB；receipts 批 ≤500 条/次；
        上限属实现参数，放宽不算破坏性变更，收紧算）。只给上限提示，不回显请求内容。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        限流或配额耗尽。只给粗粒度原因码与 `Retry-After`；具体阈值属私有配置，
        不在响应中暴露。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 暂时不可用/过载/维护；可安全重试（遵守 `Retry-After`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentRequired:
      description: |
        余额不足 / 欠费（`40201`，HTTP 402）。只给粗粒度原因与充值提示，
        不返回额度细节、风控阈值或判定条件；客户端应停止重试并引导充值。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpRequired:
      description: |
        二次认证（step-up）缺失或已过期（`42401`，HTTP 424）。敏感动作须重新完成
        step-up（≤5 分钟有效）后重放；过渡期实现也可返回 403 + `47009`（M10 CR-3），
        客户端必须同时处理两种。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        语义 / 业务校验失败（HTTP 422，`422xx` 段）。具体码值按模块段位登记
        （如账本 `42220–42223`）；结构与类型错误一律 `400`，两者不混用。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ------------------------------------------------------------ 通用
    Error:
      type: object
      additionalProperties: true
      required: [error]
      description: |
        统一错误信封。客户端必须容忍未知字段（只加不改）；`message` 只供人类阅读，
        程序判断一律用 `type` / `code`，不得解析 `message` 文案。
      properties:
        error:
          type: object
          additionalProperties: true
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - rate_limit_error
                - not_found_error
                - conflict_error
                - protocol_error
                - server_error
                - upstream_error
            code:
              type: integer
              description: |
                数字错误码。已核实：`40301` 管理接口签名失败（recon/01:265）、
                `42601` 协议版本不兼容（recon/01:393）；已登记资金段
                `40910–40918`、`42210`、`42211`、`40201`。

                spec 1.2.0 新登记（按 00-conventions §5 码段，只加不改）：
                `40110` 登录凭据错误（M01）；`40013` 请求体超上限（HTTP 413 专用码）与
                `40919` 状态冲突通用码（HTTP 409 无更细码时）；`40305` 节点状态不允许该动作（M02）；
                账本 `40920–40924`、`42220–42223`（M06，见 §10.3 CR-L1）；
                `42401` step-up 缺失或过期（HTTP 424，M10 CR-3）；
                配置中心 `47001–47009`（47001 校验失败 / 47002 复核人 = 发起人 / 47003 键被未完结发布单锁定 /
                47004 危险键禁改 / 47005 冷却期未到 / 47006 目标版本不存在 / 47007 灰度或观测窗非法 /
                47008 发布窗口外 / 47009 需 step-up）。

                spec 1.2.1 新登记（M01 T2 已在用，仅文档补登；不改结构/响应/枚举）：
                `40103` 刷新令牌无效 / 已轮换或撤销（重放）/ 过期 → 重新登录（HTTP 401）；
                `40905` 一次性令牌失效（扫码票据 / 邀请令牌：已用、过期、票据与账户不匹配）→ 重新发起（HTTP 409）。

                spec 1.2.4 新登记（W2 信誉 / 风控错误码，仅文档补登）：
                `42240` COP 兑换 / 转让校验失败（锁定期、限额、自转等，HTTP 422）；
                风控 `48001` 限额命中（对外只给粗粒度原因）/ `48002` 案件已存在 / `48003` 申诉超期或重复 /
                `48004` 证据缺失 / `48005` 规则或限额版本冲突 / `48006` 处置越权（HTTP 400–409）。

                spec 1.2.6 新登记（仅文档补登；不改结构 / 响应 / 枚举）：
                `40101` 通用未认证码（HTTP 401）：未认证 / 凭据无效或过期 / 鉴权未接线（fail-closed）；
                M01 会话、M02 节点密钥、M08 / M14 的未认证路径统一复用，不再另造 401 子码。

                spec 1.2.5 新登记（W2 资金 / 数据与 Ops 错误码，仅文档补登；不改结构 / 响应 / 枚举）：
                `40310` 支付通道未开启 / `40311` 地区不支持 / `40312` 入金未达所需风控等级（M08，HTTP 403）；
                `40001` 输入校验失败（HTTP 400）、`40901` 对象被待复核动作锁定（HTTP 409）与
                `40919` 状态冲突通用码——M14 / M08 复用；
                `40910–40918` 资金段语义按产品 §19.10.4 逐码钉死：40910 重复回调 / 40911 金额不符 /
                40912 确认数不足 / 40913 链·资产不支持 / 40914 扩容批次过期 / 40915 地址冲突 /
                40916 缺 attestation / 40917 退款处理中 / 40918 退款失败；
                `42210` 出款主体未准入 / `42211` 风控或地址风险拒绝（M08，HTTP 422）；
                `49001` 导出 / 查询结果过大（M14，HTTP 400 或 413；M06 复用；提示拆分范围）。

                spec 1.2.3 新登记（W2 通知 / 对账错误码，仅文档补登）：
                `40902` 不可退订 / 偏好冲突（M12：P0 通知不得退订，HTTP 409）；
                `49201` 对账批次不存在（404）/ `49202` 存在未结 P0·P1 不得签核（409）/
                `49203` 批次已签核或已关闭（409）/ `49204` 差异状态不允许该处置（409）/
                `49205` 同一期间 + batch_hash 已有 valid 凭证（409）/ `49206` 出款前凭证校验失败（403）/
                `49210` 报表周期非法或无数据（404）/ `49211` 渲染件不存在（404）/ `49212` 凭证不存在（404）。

                spec 1.2.2 新登记（M03 网关错误码，仅文档补登；不改结构 / 响应 / 枚举）：
                `42901` QPS 超限 / `42902` 每日花费上限（HTTP 429）；
                `44101` 流式中断、用量按估算（HTTP 441）；
                `45001` 无可用节点（HTTP 503，换节点 / 换区域后可重试；语义以 M04 §4.4 为准）——
                **本条原先记为「统一错误模型自检失败兜底（HTTP 500）」，属文档错误，按 spec 1.2.16 订正**；
                `45201` 慢任务超 ETA / `45202` 需确认预估成本 / `45203` 组网准入不足（HTTP 408 / 202 / 403）；
                `50901` 无可用节点 / `50902` 上游超时 / `50903` 上游异常（HTTP 503 / 504 / 502）；
                `50904` 鉴权不可用（S1 过渡期用 503 + `50001` + reason=unavailable，登记后切换）；
                `40401` 资源不存在（HTTP 404 专用码，无更细码时）；`42601` 协议版本不兼容（HTTP 426）；
                `47010` 角色不足 / 越权（M10，HTTP 403；在 47002 之外区分「角色不足」与「复核人=发起人」）；
                `47011` 审计不可用（M10 → M16 接线后，HTTP 503；未接线前沿用 409 + 40919）。

                spec 1.2.9 新登记（C10 节点通道，仅文档补登；不改结构 / 响应 / 枚举 / 码值）：
                `50903` **复用**为「节点通道不可用」——C10b 队列未接线 / 通道关闭 / 节点离线导致
                长轮询不可用（HTTP 503，可安全重试并遵守 `Retry-After`）；不新造 503 子码。
                `40401` 复用为「通道任务不存在或不属于该节点」（HTTP 404，不泄露存在性）；
                `40919` 复用为「同一 `job_id` 提交了不同结果载荷」（HTTP 409）；
                `42901` 复用为通道侧限流（HTTP 429，只给粗粒度原因码与 `Retry-After`）。

                spec 1.2.16 新登记（错误码语义订正与补登；仅文档，不改结构 / 响应 / 枚举 / 既有码值）：
                `50000` **新增**——服务端内部错误兜底（HTTP 500，**不可重试**），用于替换原先被误用为
                通用 500 兜底的 `45001`（M03「统一错误模型自检失败」及各模块未预期异常）；
                `50001` **补登**——依赖 / 能力不可用（HTTP 503，fail-closed，**可重试**），涵盖库未接线、
                签名密钥未接线、开关关闭等（audit / integrity / metering / model_sync / notify / recon /
                reputation / scheduling / treasury 共用该语义）；
                `40303` **补登**——策略拒绝的粗粒度码（HTTP 403）：角色不足 / 认证方式不可用 / 通用禁止，
                细节只写 `reason`，不向调用方泄露（identity / metering / scheduling 在用）；
                `40907` **补登**——策略版本回退（HTTP 409，supply：`policy_version_regression`）；
                `42221` **补登**——账本语义/枚举非法（HTTP 422）：科目码、资金类别、单位、事件类型、
                来源类型、分录类型未知或不允许（ledger 在用；属 CR-L1 区间 42220–42223）；
                `42301` **补登**——审计链未激活或已锁定（HTTP 423，`audit_chain_locked`）：
                HMAC 密钥缺失、链校验失败后写入口冻结（audit 在用）；
                语义边界（三者互斥，不得混用）：`45001` 仅「无可用节点」、`50001` 仅「依赖不可用」、
                `50000` 为「内部错误」。客户端应按 `code` 区分是否可重试；按 HTTP 状态分流的实现不受影响。

                未登记的码一律不返回；新增码先改本 spec 与 04 码段表。其余以产品设计 §6.3 与附录 C.4 为准。
            message:
              type: string
              description: 人类可读，不含内部堆栈/规则细节/凭据。
            request_id:
              type: string
              format: uuid
            retry_after:
              type: integer
              minimum: 0
              description: 仅 429/503 有意义；与 `Retry-After` 头一致。
            reason:
              type: string
              enum: [rate_limited, quota_exceeded, account_restricted, policy_blocked, original_route_unavailable]
              description: |
                粗粒度原因码，供客户端做退避与提示。**不含**判定细节；
                具体规则/阈值/名单在私有配置，不对外。
                `original_route_unavailable`：退款原路无法由服务端唯一推导（无成功 attempt / 多次成功），
                与 `409` + `40919` 一起返回；客户端应提示补填原路或转人工，不得重试猜测。

    Page:
      type: object
      required: [has_more]
      additionalProperties: true
      properties:
        cursor:
          type: string
          description: 本页起始游标（回显；首页为空）。
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；`has_more=false` 时为 `null`。

    # ------------------------------------------------------------ 网关
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 1048576
        name:
          type: string

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model:
          type: string
          description: 模型 slug（不可变）。取自 `/v1/models`。
        messages:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stop:
          type: array
          items:
            type: string
        user:
          type: string
          description: 可选的调用方自定义稳定标识（用于防滥用去重，不留 PII）。

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      additionalProperties: true
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix 秒（UTC）。
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                enum: [stop, length, tool_calls, content_filter, upstream_error]
        usage:
          $ref: '#/components/schemas/Usage'

    Model:
      type: object
      additionalProperties: true
      required: [id, object, owned_by]
      properties:
        id:
          type: string
          description: 模型 slug。
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
        context_window:
          type: integer
        unit:
          type: string
          description: 计量单位（如 token）。
        price:
          type: object
          additionalProperties: true
          description: 公开参考价；结算是以账本分录为准，不以本字段为准。
          properties:
            amount:
              type: string
              description: 十进制字符串（不用浮点）。
            unit:
              type: string

        price_version:
          type: [string, 'null']
          description: |
            价格快照版本（M04 model_catalog.price_version / M10 同族），用于三处同源校验。
            公开侧（未登录文档站 / 降级镜像）可缺省为 null；客户端不得据此推断结算价。
        tokenizer_version:
          type: [string, 'null']
          description: 服务端已知的 tokenizer 版本（C17/M18）；缺省表示未同步/未知。
        model_sync_version:
          type: [integer, 'null']
          description: 该行来源的模型同步 bundle 版本（C17/M18）；缺省表示未同步。
        available:
          type: boolean
          description: |
            当前是否可服务（C9，1.2.8）。服务端按「容量公告 + 已验证上游（state=verified）
            且 verified_at 在新鲜窗口内」判定；字段缺省表示未计算/降级镜像，客户端不得推断为可用。
        probe:
          type: object
          additionalProperties: false
          description: |
            可用性依据（C9，1.2.8）；只在服务端能给出时返回。reason 为 no_capacity / unverified /
            stale，available=true 时为 null。
          properties:
            level:
              type: [string, 'null']
              description: 服务端已知的证明等级；S2 仅回传可用性，暂不宣称 L3+。
            verified_at:
              type: [string, 'null']
              format: date-time
            fresh:
              type: boolean
              description: verified_at 是否在服务端新鲜窗口内（默认 900s）。
            reason:
              type: [string, 'null']
              enum: [no_capacity, unverified, stale, null]

    ModelList:
      type: object
      additionalProperties: true
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    BatchCreateRequest:
      type: object
      additionalProperties: true
      required: [kind, model, items]
      properties:
        kind:
          type: string
          enum: [chat, completion]
          description: 慢任务类型。
        model:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [custom_id]
            properties:
              custom_id:
                type: string
                maxLength: 128
              input:
                $ref: '#/components/schemas/ChatCompletionRequest'
        deadline_seconds:
          type: integer
          minimum: 60
          description: 期望完成时限（尽力而为，不构成 SLA）。
        webhook_url:
          type: string
          format: uri
          description: 完成回调（可选；回调带签名，禁止携带凭据）。
        metadata:
          type: object
          additionalProperties: true

    BatchAccepted:
      type: object
      additionalProperties: true
      required: [batch_id, status, eta_seconds]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        eta_seconds:
          type: integer
          minimum: 0
        cost_estimate:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本分录为准）。

    BatchStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
      description: 未知状态值必须被客户端容忍（只加不改）。

    Amount:
      type: object
      additionalProperties: true
      required: [amount, unit]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: 十进制字符串；不在客户端做浮点运算。
        unit:
          type: string
          description: 计量/计价单位（如 token、gpu_second、gb_hour）。

    Batch:
      type: object
      additionalProperties: true
      required: [batch_id, status, created_at]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        progress:
          type: object
          additionalProperties: true
          properties:
            completed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        eta_seconds:
          type: integer
          minimum: 0
        checkpoint_resumes:
          type: integer
          minimum: 0
          description: 检查点恢复次数（抢占/故障后恢复的计数）。
        results_ref:
          type: string
          description: 结果对象签名 URL（≤15 分钟有效）；过期需重新获取。
        cost_estimate:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本分录为准）。
        cost:
          type: object
          additionalProperties: true
          properties:
            estimated:
              $ref: '#/components/schemas/Amount'
            actual:
              $ref: '#/components/schemas/Amount'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    BatchCancelAck:
      type: object
      additionalProperties: true
      required: [batch_id, status]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        canceled_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ 用方
    UsageSummary:
      type: object
      additionalProperties: true
      required: [period, totals, groups]
      properties:
        period:
          type: object
          additionalProperties: true
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        totals:
          type: object
          additionalProperties: true
          properties:
            requests:
              type: integer
              minimum: 0
            prompt_tokens:
              type: integer
              minimum: 0
            completion_tokens:
              type: integer
              minimum: 0
            billable:
              $ref: '#/components/schemas/Amount'
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [key]
            properties:
              key:
                type: string
                description: 分组键（模型 slug 或 UTC 日期）。
              requests:
                type: integer
                minimum: 0
              tokens:
                type: integer
                minimum: 0
              billable:
                $ref: '#/components/schemas/Amount'

    # ------------------------------------------------------------ 节点
    NodeRegisterRequest:
      type: object
      additionalProperties: true
      required: [platform, hardware_fingerprint, client_version, protocol_version]
      properties:
        platform:
          type: string
          enum: [macos, windows, linux]
        hardware_fingerprint:
          type: string
          description: |
            硬件指纹**哈希**（客户端本地计算）。平台不回传原值、不落明文；
            原始指纹不出客户设备。
        client_version:
          type: string
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        capabilities:
          type: array
          items:
            type: string
        access_modes:
          type: array
          description: 申报的接入方式（A1 直填 Key / A2 本机代理 / B 企业网关）。
          items:
            type: string
            enum: [A1, A2, B]

    NodeRegisterResponse:
      type: object
      additionalProperties: true
      required: [node_id, state, policy_version, protocol_version, server_time]
      properties:
        node_id:
          type: string
        state:
          type: string
          enum: [pending, active, frozen, retired]
        policy_version:
          type: string
        protocol_version:
          type: string
        server_time:
          type: string
          format: date-time

    CapacityAnnouncement:
      type: object
      additionalProperties: true
      required: [kind, access, model, max_qps, unit]
      description: |
        容量公告（字段 capacity_announcement）；时序数据。
        `ask_price` 是节点要价，**不是**风控/评分权重。
      properties:
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
          description: 十进制字符串。
        unit:
          type: string
        resource_level:
          type: string

    NodeHeartbeatRequest:
      type: object
      additionalProperties: true
      required: [node_id, protocol_version, policy_version]
      properties:
        node_id:
          type: string
        protocol_version:
          type: string
        policy_version:
          type: string
        runtime_state:
          type: string
          description: |
            可选：客户端运行态自述（§5.9 未绑定 / 已上线 / 配额用尽 / 让路暂停 / 用户暂停 / 异常）。
            约定值 unbound / online / quota_exhausted / yield_paused / user_paused / error；
            **未知值忽略不报错**（服务端不落成枚举）。仅作调度输入，不参与信誉分计算。
        capacity:
          type: array
          items:
            $ref: '#/components/schemas/CapacityAnnouncement'
        load:
          type: object
          additionalProperties: true
          description: 可选的本机负载自述（仅用于调度输入，不参与信誉分计算）。
          properties:
            inflight:
              type: integer
              minimum: 0
            queue_seconds:
              type: number
              minimum: 0

    NodeHeartbeatResponse:
      type: object
      additionalProperties: true
      required: [server_time, protocol_version, policy_version]
      properties:
        server_time:
          type: string
          format: date-time
        protocol_version:
          type: string
        policy_version:
          type: string
        next_heartbeat_seconds:
          type: integer
          minimum: 1
        policy_updated:
          type: boolean
          description: 为 true 时客户端应立即拉取 `/api/v1/node/policy`。

    NodeUpstreamRequest:
      type: object
      additionalProperties: true
      required: [access_type, base_url, models]
      properties:
        access_type:
          type: string
          enum: [A1, A2, B]
          description: |
            A1 直填 Key（属直连）、A2 本机代理、B 企业网关。分类口径见正式文档
            「接入方式分类」；H1 约束的是**平台**（不下发/不上传/不托管凭据），
            不是客户端持有凭据。
        base_url:
          type: string
          format: uri
          description: 上游端点（可含路径）。不得带用户名/口令等 userinfo。
        models:
          type: array
          minItems: 1
          items:
            type: string
        credential_handle:
          type: string
          description: |
            **本地**凭据句柄（客户端内部标识，如 keychain 条目名）。服务端不解析、
            不存储、不回显；凭据本体永不上行（H1）。
        protocol:
          type: string
          description: 上游协议（如 openai-chat）。未知值按适配器容错处理。

    NodeUpstreamResponse:
      type: object
      additionalProperties: true
      required: [upstream_id, state, models_declared]
      properties:
        upstream_id:
          type: string
        state:
          type: string
          enum: [declared, probing, verified, rejected]
        models_declared:
          type: array
          items:
            type: string
        probe_hint:
          type: string
          description: 提示本地发起体检（`/api/v1/node/upstream/probe`），不在服务端探。

    NodeChannelPollRequest:
      type: object
      additionalProperties: true
      properties:
        wait_s:
          type: number
          minimum: 1
          maximum: 30
          default: 25
          description: 长轮询最长等待秒数（1–30，默认 25）；到点无任务返回 `204`。
        capabilities:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
          description: 本节点可承接的能力标识（可选）；未知值**忽略不报错**，只按双方交集派单。

    NodeChannelJob:
      type: object
      additionalProperties: true
      required: [job_id, kind, request_id, request, lease_expires_at]
      description: |
        通道派发的单个任务。**不含任何凭据 / 上游端点**（H1 口径不变）；
        `request` 是待转发的请求正文，只在内存与响应体过一手，不进库 / 不进日志 / 不进事件。
        **`model` / `messages` 不在 job 顶层**，统一放在 `request` 内（与客户端 `parse_job` 对齐）。
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [chat.completions]
        request_id:
          type: string
          description: 平台请求标识（贯穿网关 / 调度 / 收据）。
        request:
          type: object
          additionalProperties: true
          required: [model, messages]
          properties:
            model:
              type: string
            messages:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true
                required: [role, content]
                properties:
                  role:
                    type: string
                    enum: [system, user, assistant]
                  content:
                    type: string
            max_tokens:
              type: integer
              minimum: 1
            temperature:
              type: number
              minimum: 0
              maximum: 2
            stop:
              type: array
              items:
                type: string
        timeout_s:
          type: number
          minimum: 1
          description: 平台侧请求总超时（秒，可选）；缺省由客户端按自身策略。
        lease_expires_at:
          type: string
          format: date-time
          description: 租约到期时刻；到期未回传由通道层重派（≤2 次）。

    NodeChannelPollResponse:
      type: object
      additionalProperties: true
      required: [job, server_time]
      properties:
        job:
          $ref: '#/components/schemas/NodeChannelJob'
        server_time:
          type: string
          format: date-time

    NodeChannelResultRequest:
      type: object
      additionalProperties: true
      required: [job_id, status]
      description: |
        结果回传。`status=failed` 时必须给 `error_code` 或 `error_class`（否则 `400` + `40001`）。
        服务端只保留 usage / 元数据与请求摘要，**不落正文**。
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        content:
          type: string
          description: 模型输出正文（`completed` 时有意义；不落库、不进日志）。
        finish_reason:
          type: string
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        usage_source:
          type: string
          enum: [actual, estimated, dual]
          description: |
            usage 来源：`actual` 上游返回 / `estimated` 本地估算 / `dual` 两者都有
            （取用优先级 actual > estimated）。可空（`null` = 未上报）。
        latency_ms:
          type: integer
          minimum: 0
        first_byte_ms:
          type: integer
          minimum: 0
        error_code:
          type: string
        error_class:
          type: string
        upstream_request_id:
          type: string

    NodeChannelResultAck:
      type: object
      additionalProperties: true
      required: [accepted, duplicate]
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
          description: 取值为 `true` 时表示同一 `job_id` 的重复提交被幂等去重（通道未再次受理）。

    ReceiptInput:
      type: object
      additionalProperties: true
      required:
        - receipt_id
        - task_id
        - access
        - usage
        - price
        - sig_provider
        - sig_consumer
      properties:
        receipt_id:
          type: string
        task_id:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        usage:
          type: object
          additionalProperties: true
          required: [amount, unit]
          properties:
            amount:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
            unit:
              type: string
        price:
          $ref: '#/components/schemas/Amount'
        sig_provider:
          type: string
          description: 供方签名（对收据规范字段的签名；算法随协议版本，见协议仓）。
        sig_consumer:
          type: string
          description: 需方签名。双签缺一即拒收。
        usage_source:
          type: string
          enum: [client_reported, server_measured, dual]
        task_kind:
          type: string

    ReceiptBatchRequest:
      type: object
      additionalProperties: false
      required: [receipts]
      properties:
        receipts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReceiptInput'

    RejectedReceipt:
      type: object
      additionalProperties: true
      required: [receipt_id, code, message]
      properties:
        receipt_id:
          type: string
        code:
          type: integer
        message:
          type: string
          description: 拒绝原因（只描述契约问题，如签名不匹配/字段缺失）。

    ReceiptBatchResponse:
      type: object
      additionalProperties: true
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items:
            type: string
            description: 已受理的 receipt_id。
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedReceipt'

    NodePolicy:
      type: object
      additionalProperties: true
      required: [policy_version, protocol_version, issued_at]
      properties:
        policy_version:
          type: string
          description: 策略版本号（与 protocol_version 不是一回事）。
        protocol_version:
          type: string
        issued_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        digest:
          type: string
          description: 策略包摘要（用于校验下发内容未被篡改）。
        quotas:
          type: array
          description: |
            配额**结构**由 spec 定义，具体数值由服务端按节点下发（私有配置）。
            客户端不得内置默认值。
          items:
            type: object
            additionalProperties: true
            required: [name, window_seconds]
            properties:
              name:
                type: string
              window_seconds:
                type: integer
                minimum: 1
              value:
                type: integer
                description: 窗口内额度；值由服务端给出，spec 不规定。
        directives:
          type: array
          description: 可选指令（如暂停接单、要求升级）；未知指令必须忽略。
          items:
            type: string

    # ------------------------------------------------------------ 协议
    ProtocolCapabilities:
      type: object
      additionalProperties: true
      required: [protocol_version, min_supported_version, capabilities, server_time]
      properties:
        protocol_version:
          type: string
        min_supported_version:
          type: string
          description: 服务端仍接受的最低版本；低于此值返回 426。
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, version]
            properties:
              id:
                type: string
                description: 能力标识（如 `chat_completions`、`batch`、`receipts`）。
              version:
                type: string
              status:
                type: string
                enum: [stable, beta, deprecated]
        server_time:
          type: string
          format: date-time

    DeprecationList:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [path, method, deprecated_at, sunset_at]
            properties:
              path:
                type: string
              method:
                type: string
              deprecated_at:
                type: string
                format: date-time
              sunset_at:
                type: string
                format: date-time
                description: 退役日期；提前 ≥90 天公示，且至少跨 2 个 MAJOR。
              replacement:
                type: string
                description: 替代端点/字段（无替代时为空）。
              supported_majors:
                type: array
                items:
                  type: string

    # ------------------------------------------------------------ 调度快照
    SnapshotNode:
      type: object
      additionalProperties: true
      required: [node_id, kind, access, model, max_qps, unit]
      description: 快照里的单条容量公告（**输入**，不含评分/权重/淘汰原因）。
      properties:
        node_id:
          type: string
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
        unit:
          type: string
        resource_level:
          type: string

    ScheduleSnapshot:
      type: object
      additionalProperties: true
      required: [period, quote_version, published_at, nodes]
      properties:
        period:
          type: string
          format: date
        quote_version:
          type: string
          description: 报价版本（复算输入的一部分）。
        published_at:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNode'
        verify_url:
          type: string
          format: uri
          description: 对应周期的 Merkle 根与复算工具（`/verify/{period}`）。

    # ------------------------------------------------------------ 账本
    LedgerEntry:
      type: object
      additionalProperties: true
      required:
        - entry_id
        - entry_type
        - unit_type
        - channel_id
        - asset_ref
        - amount
        - status
        - policy_version
      description: |
        账本分录（只追加）。语义字段（`entry_type` / `unit_type` /
        `status`）语义不因版本改变；旧分录永远可复算。
      properties:
        entry_id:
          type: string
        entry_type:
          type: string
        unit_type:
          type: string
        channel_id:
          type: string
        asset_ref:
          type: string
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        ref_id:
          type: string
        quality_coef:
          type: string
        stability_coef:
          type: string
        status:
          type: string
          enum: [pending, confirmed, locked, settled, void]
          description: |
            分录状态。与产品设计 §20.4 对齐：pending → confirmed → locked → settled；
            异常终止为 void；冲正不改原分录，新增 reverse_of 指向原 entry_id。
            reversed 退役（v1 未发布，无兼容负担）；客户端仍须容忍未知值。
        lock_until:
          type: string
          format: date-time
        reverse_of:
          type: [string, 'null']
          description: 冲正指向的原始 `entry_id`；非冲正为 null。
        policy_version:
          type: string
        created_at:
          type: string
          format: date-time

    LedgerEntriesPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        page:
          $ref: '#/components/schemas/Page'

    ConfigItem:
      type: object
      additionalProperties: true
      required: [key, scope, version, value_type, state, updated_at]
      properties:
        key:
          type: string
        scope:
          type: string
          description: 作用域（global / chain / tier / bucket 等）
        version:
          type: integer
          minimum: 1
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        value:
          description: 非敏感配置值；敏感项必须为空，只给 `secret_ref` 或脱敏摘要。
        secret_ref:
          type: [string, 'null']
          description: 敏感值的引用（KMS/密钥库路径），不是明文。
        state:
          type: string
          enum: [draft, active, rolled_back, retired]
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    ConfigItemPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
        page:
          $ref: '#/components/schemas/Page'

    ConfigDraftRequest:
      type: object
      additionalProperties: false
      required: [value_type, reason]
      properties:
        value:
          description: 非敏感值；敏感项改用 `secret_ref`。
        secret_ref:
          type: string
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        effective_at:
          type: string
          format: date-time

    ConfigPublishRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        gray_plan:
          type: object
          additionalProperties: false
          properties:
            buckets:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 100
            observation_seconds:
              type: integer
              minimum: 60

    ConfigApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 4

    ConfigRollbackRequest:
      type: object
      additionalProperties: false
      required: [target_version, reason]
      properties:
        target_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 4
        ticket:
          type: string

    ConfigKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [reason, ttl_seconds]
      properties:
        reason:
          type: string
          minLength: 4
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: 到期自动回到上一生效版本；上限 24h。
        tighten_only:
          type: boolean
          enum: [true]
          description: 只允许收紧；借开关放开权限/阈值必须拒绝。

    ConfigPublishAck:
      type: object
      additionalProperties: true
      required: [request_id, state]
      properties:
        request_id:
          type: string
        state:
          type: string
          enum:
            - pending_approval
            - approved
            - scheduled
            - rolling_out
            - active
            - rejected
            - expired
            - cancelled
            - rolled_back
            - failed
          description: |
            发布单状态机：pending_approval → approved → scheduled → rolling_out → active；
            终止态 rejected / expired / cancelled / rolled_back / failed。
            `expired` **不自动放行**。
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        approvals_required:
          type: integer
          minimum: 1
        approvals_received:
          type: integer
          minimum: 0

    ConfigDrift:
      type: object
      additionalProperties: true
      required: [key, detected_at]
      properties:
        key:
          type: string
        scope:
          type: string
        desired_version:
          type: integer
        effective_version:
          type: integer
        running_version:
          type: integer
        detected_at:
          type: string
          format: date-time

    ConfigDriftList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDrift'
        page:
          $ref: '#/components/schemas/Page'

    SourceType:
      type: string
      description: |
        记账网关维护的 `source_type` 白名单（16 值，TEC-02）。用于 journal 幂等键
        `(source_type, source_id, event_seq)`。属**版本化枚举**：新增值按 MINOR 先改 spec，
        客户端必须容忍未知值（读路径遇未知值由服务端拒绝，不静默记账）。
      enum:
        - chain_tx
        - payment_attempt
        - conversion_trade
        - usage_settle
        - lock_expiry
        - payout_accrual
        - payout_item
        - payout_batch
        - wallet_transfer
        - refund
        - chargeback
        - rebate
        - fx_reval
        - loss_pool
        - void
        - unidentified

    NotificationPreferences:
      type: object
      additionalProperties: true
      required: [email, in_app, webhook]
      properties:
        email: { type: boolean }
        in_app: { type: boolean }
        webhook: { type: boolean }
        quiet_hours:
          type: object
          additionalProperties: false
          properties:
            start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            timezone: { type: string }
        digest:
          type: string
          enum: [realtime, daily, weekly]
        p0_opt_out:
          type: boolean
          enum: [false]
          description: P0 通知不可退订；写入 true 返回 `40902`。

    WebhookSubscription:
      type: object
      additionalProperties: true
      required: [id, url, events, status]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        status:
          type: string
          enum: [active, paused, disabled]
        created_at: { type: string, format: date-time }

    WebhookSubscriptionList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        page: { $ref: '#/components/schemas/Page' }

    WebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        description: { type: string, maxLength: 200 }

    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 签名密钥，**仅创建时返回一次**；服务端只存哈希。

    QuoteSettings:
      type: object
      additionalProperties: true
      required: [min_price, max_price, currency]
      properties:
        min_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        max_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, enum: [USD] }
        updated_at: { type: string, format: date-time }
      description: 区间整体替换（PUT 覆盖式）；用方为出价范围，供方为价格范围。

    ReportEnvelope:
      type: object
      additionalProperties: true
      required: [report_id, period, generated_at]
      properties:
        report_id:
          type: string
          enum: [REP-01, REP-02, REP-03, REP-04, REP-06]
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: 自然月 `YYYY-MM`（与 `/verify/{period}` 同粒度；审计锚定日是日粒度）。
        generated_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: 报表主体（字段随 report_id 不同，见 v4 §23.2）。

    TreasuryIntent:
      type: object
      additionalProperties: true
      required: [intent_id, kind, chain_id, expires_at, nonce]
      properties:
        intent_id: { type: string }
        kind:
          type: string
          enum: [PAYOUT, REFUND, SWEEP, REBALANCE, GAS_TOPUP, POLICY_CHANGE, RECOVERY, WALLET_PROVISION]
          description: 第八个取值 `WALLET_PROVISION` 属追加枚举；不复用 `POLICY_CHANGE`。
        chain_id: { type: integer }
        wallet_id: { type: string }
        amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        expires_at: { type: string, format: date-time }
        nonce: { type: integer, minimum: 0 }
        policy_version: { type: string }

    Wallet:
      type: object
      additionalProperties: true
      required: [wallet_id, status]
      properties:
        wallet_id: { type: string }
        status:
          type: string
          enum: [active, paused, draining, retired, provisioning, zero, frozen]
          description: 四值基线 + 退休四步中间态 `provisioning / zero / frozen`；共七值。
        switch_state:
          type: string
          enum: [standby, in_service, switching_out, draining]
          description: 仅对 `active` 有意义。
        fund_class: { type: string, enum: [hot, warm, cold] }
        balance: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }

    SigningEvent:
      type: object
      additionalProperties: true
      required: [signing_event_id, signing_request_id, event, occurred_at]
      properties:
        signing_event_id: { type: string }
        signing_request_id: { type: string }
        event:
          type: string
          enum: [requested, presented, signed, verified, co_signed, broadcast]
        signer_type: { type: string, enum: [owner, reviewer, company] }
        signer_ref: { type: string }
        signature_hash: { type: string }
        device_id: { type: string }
        auth_hash: { type: string }
        txid: { type: string }
        error_code: { type: integer }
        occurred_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 身份与租户（M01，spec 1.2.0）
    AuthTokens:
      type: object
      additionalProperties: true
      required: [access_token, refresh_token, token_type, expires_in]
      description: 会话令牌对。`refresh_token` 一次性轮换，旧令牌重放按 `40103` 处理并要求重新登录。
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          minimum: 1
          description: access_token 剩余有效期（秒）。
        session_id: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    LoginRequest:
      type: object
      additionalProperties: true
      required: [method, identifier]
      description: 登录入参。`secret` 只上行一次，**不得**进日志、事件或 fixtures。
      properties:
        method:
          type: string
          enum: [password, oauth, sms_code]
        identifier:
          type: string
          description: 邮箱或手机号（服务端只存不可逆哈希与掩码，不回传原文）。
        secret:
          type: string
          description: 口令或一次性验证码；失败不区分「账号不存在 / 口令错误」。
        provider:
          type: string
          description: OAuth 提供方（`method=oauth` 时必填）。
        device_id: { type: string }
        mfa_code:
          type: string
          description: 二次认证码（账号启用 MFA 时必填）。

    LoginResponse:
      type: object
      additionalProperties: true
      required: [tokens, account, mfa_required]
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        account:
          $ref: '#/components/schemas/AccountProfile'
        mfa_required:
          type: boolean
          description: 为 true 时 `tokens.access_token` 只可用于 step-up，不能调用业务接口。

    RefreshRequest:
      type: object
      additionalProperties: true
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      additionalProperties: true
      properties:
        refresh_token:
          type: string
          description: 可选；不带时按当前 access_token 定位会话。
        all_devices:
          type: boolean
          default: false
          description: 为 true 时撤销该账号全部会话（`session_epoch++`）。

    LogoutAck:
      type: object
      additionalProperties: true
      required: [revoked_sessions, revoked_at]
      properties:
        revoked_sessions:
          type: integer
          minimum: 0
        revoked_at: { type: string, format: date-time }

    AccountProfile:
      type: object
      additionalProperties: true
      required: [account_id, tenant_id, state, roles, created_at]
      description: |
        账户与租户视图（脱敏）。`balance` 是 M06 `account_balances` 的只读镜像，
        结算与对账一律以账本分录为准。
      properties:
        account_id: { type: string }
        tenant_id: { type: string }
        display_name: { type: string }
        locale:
          type: string
          description: BCP 47 语言标签（如 `zh-CN`）。
        state:
          type: string
          enum: [pending_verify, normal, frozen, closing, closed]
          description: 五态机；`closing` / `closed` 只读。客户端须容忍未知值。
        frozen_until:
          type: [string, 'null']
          format: date-time
          description: 冻结到期（`state=frozen` 时非空，≤180 天）。
        roles:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
          description: 后台八角色（03-facts §5）；普通用方为空数组。
        balance:
          $ref: '#/components/schemas/Amount'
        created_at: { type: string, format: date-time }

    AccountProfileUpdateRequest:
      type: object
      additionalProperties: true
      minProperties: 1
      description: 只允许展示类字段；身份字段（account_id / tenant_id / state）不可经此改。
      properties:
        display_name:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 16

    ApiKeySummary:
      type: object
      additionalProperties: true
      required: [key_id, prefix, created_at]
      description: Key 元数据。**永不**返回明文或哈希。
      properties:
        key_id: { type: string }
        prefix:
          type: string
          description: 8 位前缀（仅展示与排障）。
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        qps:
          type: integer
          minimum: 1
        revoked_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    ApiKeyPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        page:
          $ref: '#/components/schemas/Page'

    ApiKeyCreateRequest:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
        scopes:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }

    ApiKeyCreated:
      type: object
      additionalProperties: true
      required: [key_id, key, prefix, created_at]
      description: 创建 / 轮换响应。`key` 只在本次响应出现一次，平台只存 `sha256(key)`。
      properties:
        key_id: { type: string }
        key: { type: string }
        prefix: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ApiKeyRotateRequest:
      type: object
      additionalProperties: true
      properties:
        name: { type: string }
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: 旧钥重叠期（≤24 h）；重叠期内旧钥只验签、不接受新注册。

    AccountStateChangeRequest:
      type: object
      additionalProperties: true
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
        frozen_until:
          type: string
          format: date-time
          description: 冻结必填（≤180 天）；解冻忽略此字段。
        evidence_ref:
          type: string
          description: 证据引用（工单 / 案件号），不得写入 PII。

    AccountStateAck:
      type: object
      additionalProperties: true
      required: [account_id, state, changed_at]
      properties:
        account_id: { type: string }
        state:
          type: string
          enum: [pending_verify, normal, frozen, closing, closed]
        frozen_until:
          type: [string, 'null']
          format: date-time
        changed_at: { type: string, format: date-time }

    AccountRoleChangeRequest:
      type: object
      additionalProperties: true
      required: [reason, second_approver]
      properties:
        grant:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        revoke:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        scope:
          type: string
          description: 角色作用域（如 global / tenant:<id>）。
        reason:
          type: string
          maxLength: 500
        second_approver:
          type: string
          description: 复核人（≠ 操作人）；缺失或不一致 → 409 + `40902`。

    AccountRoles:
      type: object
      additionalProperties: true
      required: [account_id, roles, session_epoch]
      properties:
        account_id: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        session_epoch:
          type: integer
          minimum: 1
          description: 角色变更后 +1；旧会话凭 epoch 不符返回 401 + `40102`。

    TenantQuotaEntry:
      type: object
      additionalProperties: true
      required: [kind, value]
      properties:
        kind:
          type: string
          description: 配额种类（如 concurrency / daily_spend / qps）。
        value:
          description: 配额值（数值或结构化阈值；单位见 `unit`）。
        unit: { type: string }
        key_id:
          type: string
          description: 可选，配额下钻到单个 API Key。

    TenantQuotasRequest:
      type: object
      additionalProperties: true
      required: [quotas, reason]
      properties:
        quotas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TenantQuotaEntry'
        reason:
          type: string
          maxLength: 500
        second_approver:
          type: string
          description: 升配额超阈值时必填（FIN 复核）；降配额可缺省。

    TenantQuotasAck:
      type: object
      additionalProperties: true
      required: [tenant_id, quotas, policy_version]
      properties:
        tenant_id: { type: string }
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/TenantQuotaEntry'
        policy_version:
          type: string
          description: 配额变更生成新版本，随请求写入，不覆盖历史。
        effective_at: { type: string, format: date-time }

    ScanStatus:
      type: object
      additionalProperties: true
      required: [status, expires_at, retry_after_s]
      description: |
        扫码登录票据的轮询状态（一次性票据，中间态 TTL ≤120 s）。票据只存 `sha256(ticket)`，
        明文只出现在二维码里一次，不落库、不落日志。`202` 响应**顶层**即本 schema 的三个字段；
        过渡期另带 `scan` 同值包裹（`additionalProperties: true` 允许，客户端读顶层）。
        正常收尾：`confirmed` 后下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回
        `409` + `40905`。202 中实际可见 `pending` 与 `scanned`；M01-T2 已把内部 `created`
        映射为对外 `pending`。
      properties:
        status:
          type: string
          enum: [pending, created, scanned, confirmed, expired]
          description: |
            票据状态。`created` 是 M01-T2 更早的内部实现值，与 `pending` **同义**；对外已映射为
            `pending`（S1 保留同义值，S2 前收敛，见 CR-5），客户端两者都必须接受。
            `confirmed` / `expired` 保留以覆盖同义实现，正常收尾分别为 `200` / `409`。
            未知值忽略不报错（tolerant reader，只加不改）。
        expires_at:
          type: string
          format: date-time
          description: 票据到期时间（UTC）；到期后必须重新发起扫码，不得续期。
        retry_after_s:
          type: integer
          minimum: 1
          description: 建议轮询间隔（秒）；实现取 min(5, 剩余秒)，下限 1。

    # ------------------------------------------------------------ 节点供给（M02，spec 1.2.0）
    NodePairRequest:
      type: object
      additionalProperties: true
      required: [node_id]
      properties:
        node_id: { type: string }
        rotate:
          type: boolean
          default: false
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: 轮换重叠期（≤24 h）；重叠期内旧钥只验签。

    NodePairResponse:
      type: object
      additionalProperties: true
      required: [node_id, key_id, client_key, created_at]
      description: 'client_key` 只在本次响应出现一次；平台只存 `sha256(key)` 与 8 位前缀。'
      properties:
        node_id: { type: string }
        key_id: { type: string }
        client_key: { type: string }
        key_prefix: { type: string }
        previous_key_expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    NodeBinding:
      type: object
      additionalProperties: true
      required: [node_id, state]
      description: 一个节点同时只有一条有效绑定；解绑 / 换绑不删除历史收据与锁定收益。
      properties:
        node_id: { type: string }
        state:
          type: string
          enum: [unbound, pending, bound, revoked]
        bound_account_id:
          type: [string, 'null']
        bound_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time

    NodeBindingRequest:
      type: object
      additionalProperties: true
      required: [node_id, code]
      properties:
        node_id: { type: string }
        code:
          type: string
          description: 一次性绑定码（网页端生成；一次性、短时效）。
        account_id:
          type: string
          description: 可选；缺省绑定到当前会话账户。

    NodeProbeReport:
      type: object
      additionalProperties: true
      required: [upstream_id, reachable, checked_at]
      description: |
        本地体检**结论**（服务端不发起探测）。只收结论与耗时，
        **不收**凭据、上游响应正文或模型输出。
      properties:
        upstream_id: { type: string }
        reachable: { type: boolean }
        latency_ms:
          type: integer
          minimum: 0
        error_class:
          type: string
          description: 粗粒度错误分类（如 timeout / tls / auth / model_missing），不含细节。
        model_checks:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [model, ok]
            properties:
              model: { type: string }
              ok: { type: boolean }
              error_class: { type: string }
        checked_at: { type: string, format: date-time }

    NodeProbeAck:
      type: object
      additionalProperties: true
      required: [upstream_id, state, recorded_at]
      properties:
        upstream_id: { type: string }
        state:
          type: string
          enum: [declared, probing, verified, rejected]
        rejected_reason_code: { type: string }
        recorded_at: { type: string, format: date-time }

    NodeReviewRequest:
      type: object
      additionalProperties: true
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
          description: approve → `pending → active`；reject 保留 `pending` 并通知。
        reason:
          type: string
          maxLength: 500
        tier:
          type: string
          description: 可选准入档位（用于下发初始策略，不改变状态机）。

    NodeReviewAck:
      type: object
      additionalProperties: true
      required: [node_id, state, reviewed_at]
      properties:
        node_id: { type: string }
        state:
          type: string
          enum: [pending, active, frozen, retired]
        reviewed_at: { type: string, format: date-time }
        policy_version:
          type: string
          description: 准入通过后生成的策略版本（客户端据此拉取策略）。







    # ------------------------------------------------------------ M17 canary（C13，spec 1.2.15）
    CanaryIssueRequest:
      type: object
      additionalProperties: true
      required: [node_id, model]
      properties:
        node_id: { type: string }
        model: { type: string }
        upstream_id: { type: [string, 'null'] }

    CanaryRun:
      type: object
      additionalProperties: true
      required: [id, node_id, model, prompt_id, status, created_at, deadline_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string }
        upstream_id: { type: [string, 'null'] }
        model: { type: string }
        prompt_id: { type: string, format: uuid }
        status: { type: string, enum: [issued, passed, failed, missed] }
        response_hash: { type: [string, 'null'] }
        score: { type: [number, 'null'] }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    CanaryIssueResponse:
      type: object
      additionalProperties: true
      required: [run_id, node_id, model, prompt, nonce, deadline_at, status]
      properties:
        run_id: { type: string, format: uuid }
        node_id: { type: string }
        upstream_id: { type: [string, 'null'] }
        model: { type: string }
        prompt_key: { type: string }
        selection: { type: string }
        prompt: { type: string }
        nonce: { type: string }
        max_tokens: { type: integer, minimum: 1 }
        issued_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time }
        status: { type: string, const: issued }

    CanaryResultRequest:
      type: object
      additionalProperties: true
      required: [response_text]
      properties:
        response_text: { type: string }
        usage_prompt_tokens: { type: [integer, 'null'], minimum: 0 }
        latency_ms: { type: [integer, 'null'], minimum: 0 }

    CanaryMatch:
      type: object
      additionalProperties: true
      required: [passed, score, match, reason]
      properties:
        passed: { type: boolean }
        score: { type: number }
        match: { type: string }
        reason: { type: string }
        response_hash: { type: [string, 'null'] }

    CanaryResultResponse:
      type: object
      additionalProperties: true
      required: [run, match]
      properties:
        run: { $ref: '#/components/schemas/CanaryRun' }
        match: { $ref: '#/components/schemas/CanaryMatch' }

    CanaryRunList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CanaryRun' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    CanaryStats:
      type: object
      additionalProperties: true
      required: [node_id, model, window, total, passed, failed, missed]
      properties:
        node_id: { type: string }
        model: { type: string }
        window: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        pass_rate: { type: [number, 'null'] }

    CanaryExpireResponse:
      type: object
      additionalProperties: true
      required: [runs]
      properties:
        runs: { type: integer, minimum: 0 }

    # ------------------------------------------------------------ M17 抽检（C14b，spec 1.2.14）
    SamplingContribution:
      type: object
      additionalProperties: false
      required: [node_id, model, weight]
      properties:
        node_id: { type: string }
        model: { type: string }
        weight: { type: integer, minimum: 0 }

    SamplingEpoch:
      type: object
      additionalProperties: true
      required: [id, epoch_no, seed_commit, contributions, state, draw_count, committed_at]
      properties:
        id: { type: string, format: uuid }
        epoch_no: { type: integer, minimum: 1 }
        seed_commit: { type: string }
        seed_reveal: { type: [string, 'null'] }
        contributions:
          type: array
          items: { $ref: '#/components/schemas/SamplingContribution' }
        state: { type: string, enum: [committed, revealed, expired] }
        draw_count: { type: integer, minimum: 0 }
        committed_at: { type: string, format: date-time }
        revealed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    SamplingDraw:
      type: object
      additionalProperties: true
      required: [id, epoch_id, node_id, model, weight, rank, status, created_at]
      properties:
        id: { type: string, format: uuid }
        epoch_id: { type: string, format: uuid }
        node_id: { type: string }
        model: { type: string }
        weight: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
        challenge_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [pending, passed, failed, missed] }
        level: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    SamplingEpochOpenRequest:
      type: object
      additionalProperties: true
      required: [epoch_no, contributions, draw_count]
      properties:
        epoch_no: { type: integer, minimum: 1 }
        contributions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SamplingContribution' }
        draw_count: { type: integer, minimum: 0 }

    SamplingEpochOpenResponse:
      type: object
      additionalProperties: true
      required: [epoch, seed]
      properties:
        epoch: { $ref: '#/components/schemas/SamplingEpoch' }
        seed:
          type: string
          description: 32B seed 的 hex；**只在本次响应出现一次**，库内只存 sha256。

    SamplingRevealRequest:
      type: object
      additionalProperties: true
      required: [seed]
      properties:
        seed: { type: string }

    SamplingRevealResponse:
      type: object
      additionalProperties: true
      required: [epoch, draws, idempotent]
      properties:
        epoch: { $ref: '#/components/schemas/SamplingEpoch' }
        draws:
          type: array
          items: { $ref: '#/components/schemas/SamplingDraw' }
        idempotent: { type: boolean }

    SamplingEpochList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SamplingEpoch' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    SamplingEpochDetail:
      type: object
      additionalProperties: true
      required: [epoch, draws]
      properties:
        epoch: { $ref: '#/components/schemas/SamplingEpoch' }
        draws:
          type: array
          items: { $ref: '#/components/schemas/SamplingDraw' }

    SamplingResultRequest:
      type: object
      additionalProperties: true
      required: [evidence]
      properties:
        evidence: { $ref: '#/components/schemas/AttestationEvidenceRequest' }

    SamplingResultResponse:
      type: object
      additionalProperties: true
      required: [draw, attestation]
      properties:
        draw: { $ref: '#/components/schemas/SamplingDraw' }
        attestation: { $ref: '#/components/schemas/ModelAttestation' }

    SamplingVerifyRequest:
      type: object
      additionalProperties: true
      required: [epoch_id]
      properties:
        epoch_id: { type: string, format: uuid }

    SamplingVerifyResponse:
      type: object
      additionalProperties: true
      required: [epoch_id, consistent, commit_ok]
      properties:
        epoch_id: { type: string, format: uuid }
        consistent: { type: boolean }
        commit_ok: { type: boolean }
        draw_count: { type: integer, minimum: 0 }
        expected: { type: array, items: { type: object, additionalProperties: true } }
        actual: { type: array, items: { type: object, additionalProperties: true } }

    # ------------------------------------------------------------ M12a 节点通知（C15，spec 1.2.13）
    NodeNotification:
      type: object
      additionalProperties: true
      required: [id, severity, category, template_key, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        severity: { type: string, enum: [P0, P1, P2] }
        category: { type: string }
        template_key: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        read_at: { type: [string, 'null'], format: date-time }

    NodeNotificationList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeNotification' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    NodeNotificationUnread:
      type: object
      additionalProperties: true
      required: [unread]
      properties:
        unread: { type: integer, minimum: 0 }

    NodeNotificationAck:
      type: object
      additionalProperties: true
      required: [accepted, state]
      properties:
        accepted: { type: boolean }
        state: { type: string, enum: [queued, delivered, read, expired] }

    NodeNotificationEnqueueRequest:
      type: object
      additionalProperties: true
      required: [node_id, severity, category, template_key]
      properties:
        node_id: { type: string }
        severity: { type: string, enum: [P0, P1, P2] }
        category: { type: string }
        template_key: { type: string }
        payload: { type: object, additionalProperties: true }
        dedupe_key: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }

    NodeNotificationAdmin:
      type: object
      additionalProperties: true
      required: [id, node_id, severity, category, state]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string }
        severity: { type: string, enum: [P0, P1, P2] }
        category: { type: string }
        template_key: { type: string }
        payload: { type: object, additionalProperties: true }
        state: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
        dedupe_key: { type: [string, 'null'] }
        delivery_count: { type: [integer, 'null'] }

    NodeNotificationAdminList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeNotificationAdmin' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    # ------------------------------------------------------------ M18 模型同步（C17，spec 1.2.12）
    VendorModel:
      type: object
      additionalProperties: true
      required: [vendor, canonical, tokenizer_family, tokenizer_version]
      properties:
