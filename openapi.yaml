# ==========================================================================
# DJB Protocol · OpenAPI 3.1（机器可读的协议契约）
#
# 本文件是对外协议的**唯一契约**。任何实现（客户端、云端、SDK）都必须以它为准，
# 不得自行定义字段或状态码。
#
# 三条硬规则：
#   1. 只加不改：同一 MAJOR 内不删字段、不改类型/语义/状态码；未知字段必须被忽略。
#   2. 反作弊不进 spec：只描述「可能返回 429/403 + 粗粒度原因码 + Retry-After」，
#      不写阈值、名单、评分权重、判定条件。
#   3. 所有时间戳 UTC（RFC 3339）；金额与系数用十进制字符串，不用浮点。
#
# 校验：python3 -c "import yaml; yaml.safe_load(open('openapi.yaml'))"
# ==========================================================================
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: DJB Protocol API
  version: 1.2.16
  summary: W1 冻结 + M16 审计链 + W2/W3 契约面（127 路径 / 145 操作；覆盖 M01–M14、M16；1.2.9 增 C10 节点通道）
  description: |
    DJB 联脑的对外可观测契约。spec 是唯一真相源：客户端 SDK、云端路由与校验、
    契约测试、文档站都从本文件生成或对照，任何一方不得绕过 spec 自行定义。

    - 命名空间：`/v1/*` 为 OpenAI 兼容网关面；`/api/v1/*` 为控制面（节点/用方/协议/后台）。
    - 版本：URL 中的 `v1` 是**协议 MAJOR**，冻结；新 MAJOR 走新前缀（`/v2`、`/api/v2`）
      并与旧前缀并存一个弃用周期，不得在旧前缀内做破坏性变更。
    - 兼容：同 MAJOR 内只加不改。客户端必须容忍未知字段/未知 enum 值（tolerant reader）。
    - 错误：统一 `error` 信封（`type` / `code` / `message` / `request_id`）。数字错误码
      见 `components/schemas/Error`；1.2.0 起按 00-conventions §5 码段登记（401xx / 402xx /
      403xx / 409xx / 422xx / 424xx / 426xx / 45xxx–49xxx），本文件不重复阈值与名单。
    - 风控：429/403 只给粗粒度原因码与 `Retry-After`；本文件**不含**任何阈值、名单、
      评分权重或判定条件——那是私有配置（`djb/risk-config`），不进公开仓。
    - 幂等：写操作接受 `X-DJB-Idempotency-Key`（24h）；非流式请求体指纹 300s 去重；
      流式仅请求级 60s 去重。不做请求签名（保 OpenAI 兼容）。
    - 大小上限、超时与重试：超时/重试在客户端侧，服务端以 429 +
      `Retry-After` 与 503 表达可重试性。

    说明：少数进阶字段（batch 输入形态、用量汇总分组维度）在首个实现落地前仍需最终确认；
    此类字段的调整一律先改本 spec 再改实现，不允许实现先行。
  termsOfService: https://example.invalid/djb/terms
  contact:
    name: DJB Protocol WG
    url: https://example.invalid/djb/spec
  license:
    name: Apache-2.0
    identifier: Apache-2.0

externalDocs:
  description: spec 使用与变更流程
  url: https://example.invalid/djb/README.md

servers:
  - url: https://api.example.invalid
    description: 占位：公网网关（真实域名与证书在发布时注入）
  - url: http://127.0.0.1:1717
    description: |
      本机镜像端点：由客户端本地注入凭据，客户端决定实时/慢任务。
      仅回环绑定；对端仍按同一 spec 校验。

security:
  - userBearer: []

tags:
  - name: gateway
    description: OpenAI 兼容网关（用方）
  - name: user
    description: 用方用量与账单
  - name: node
    description: 共享节点（客户端）
  - name: protocol
    description: 协议能力协商与弃用
  - name: schedule
    description: 公开容量公告与快照（可离线复算）
  - name: admin
    description: 后台只读查询（内网/VPN + 强 MFA，公网不可达）
  - name: ops
    description: 平台运维内部面（mTLS + 服务令牌；公网不可达；审计链只追加）
  - name: pay
    description: 用方支付面（M08：支付订单 / PSP 回调 / 退款；资金写不自动重试；管理面见 admin）
  - name: provider
    description: 共享方控制台面（M08 分润 / 出款地址；M04 报价设置；不与 pay 合并）

paths:
  # ---------------------------------------------------------------- 网关
  /v1/chat/completions:
    post:
      tags: [gateway]
      summary: 对话调用（OpenAI 兼容）
      operationId: createChatCompletion
      description: |
        非流式返回单个 `chat.completion`；`stream: true` 返回 SSE（`text/event-stream`），
        事件以 `data: {...}` 逐块下发、以 `data: [DONE]` 结束。流式请求也计费一次。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/Capabilities'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            成功。非流式返回 `application/json`（`chat.completion`）；`stream: true`
            返回 `text/event-stream`，逐块 `data: <json>`，结束为 `data: [DONE]`。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'SSE：逐块 `data: <json>`，结束为 `data: [DONE]`。'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/models:
    get:
      tags: [gateway]
      summary: 模型清单与价格
      operationId: listModels
      description: |
        返回可路由模型（模型 slug 不可变，见正式文档 §18.1）。价格是公开信息但不是
        结算依据；结算以账本分录为准。鉴权保持 `userBearer`（1.2.6 **不改**鉴权）；
        `price_version` 为**可选**字段：公开侧（未登录文档站 / 降级镜像）可缺省或不返回，
        客户端必须容忍缺失并按降级展示，不得据此推断结算价。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 模型清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- 慢任务
  /v1/batches:
    post:
      tags: [gateway]
      summary: 提交批量任务
      operationId: createBatch
      description: |
        异步受理，立即返回 `batch_id` / `eta_seconds` / 预估成本；实际成本以完成后的
        收据与账本分录为准。大任务必须走这里，不得占用实时决策资源。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '202':
          description: 已受理
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: 轮询地址（指向 GET /v1/batches/{id}）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/batches/{id}:
    get:
      tags: [gateway]
      summary: 批量任务进度与结果
      operationId: getBatch
      description: |
        返回进度、检查点恢复次数、结果引用与实际成本。结果内容本身另走签名 URL
        （≤15 分钟），不在本响应内联。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 任务状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/batches/{id}/cancel:
    post:
      tags: [gateway]
      summary: 取消批量任务
      operationId: cancelBatch
      description: |
        幂等：对已结束任务重复取消返回当前状态而非报错。已产生的用量照常计费。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 取消结果（含当前状态）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- 用方
  /api/v1/user/usage/summary:
    get:
      tags: [user]
      summary: 用量汇总
      operationId: getUserUsageSummary
      description: |
        `from`/`to` 为 UTC 日期（含端点）。明细（logs）是另一条端点，未纳入本版本。 分组维度是否含 `day` 待正式文档确认。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [model, day]
            default: model
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 用量汇总
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- 节点
  /api/v1/node/register:
    post:
      tags: [node]
      summary: 节点注册
      operationId: registerNode
      description: |
        首次注册进入 `pending`，需人工准入审核（后台 `/api/v1/admin/supply/nodes/{id}/review`）。
        `hardware_fingerprint` 只上报哈希；平台不回传原始硬件信息。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegisterRequest'
      responses:
        '201':
          description: 已受理（pending）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/node/heartbeat:
    post:
      tags: [node]
      summary: 心跳 + 容量公告
      operationId: postNodeHeartbeat
      description: |
        心跳携带 `protocol_version` 与 `policy_version`（两者不是一回事，见）
        以及本轮容量公告（`capacity_announcement`，字段见）。
        公告是**时序**数据：服务端以最新一次为准，历史进快照。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/Capabilities'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeHeartbeatRequest'
      responses:
        '200':
          description: 心跳确认
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/node/upstream:
    post:
      tags: [node]
      summary: 申报接入方式（A1/A2/B）
      operationId: declareNodeUpstream
      description: |
        申报接入类型、端点与模型清单。**凭据永不上行**（H1）：请求里只放本地凭据句柄
        `credential_handle`，服务端不接收、不存储、不代持凭据本体。连通性检查走
        `/api/v1/node/upstream/probe`（本地发起）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpstreamRequest'
      responses:
        '200':
          description: 申报已登记
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeUpstreamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/node/receipts:
    post:
      tags: [node]
      summary: 批量提交双签收据
      operationId: submitNodeReceipts
      description: |
        收据是计量的原始凭证，**供方与需方各签**（`sig_provider` / `sig_consumer`，
        字段见）。服务端验签后入账；单边签名或无签名直接拒收。
        批量提交按 receipt 粒度返回 accepted/rejected，不做整批回滚。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptBatchRequest'
      responses:
        '200':
          description: 逐条受理结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/node/policy:
    get:
      tags: [node]
      summary: 拉取策略与配额（版本化）
      operationId: getNodePolicy
      description: |
        返回按节点下发的策略与配额**结构与当前版本号**。具体数值由服务端下发，
        spec 不规定数值；客户端只按 `policy_version` 应用，不得猜测。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
        - name: If-None-Match
          in: header
          required: false
          description: 传上次的 `policy_version`；命中则 304，省流量。
          schema:
            type: string
      responses:
        '200':
          description: 当前策略
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              description: 即 policy_version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePolicy'
        '304':
          description: 未变更（客户端 policy_version 仍有效）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- 协议
  /api/v1/protocol/capabilities:
    get:
      tags: [protocol]
      summary: 能力协商
      operationId: getProtocolCapabilities
      description: |
        返回 `protocol_version` 与 `capabilities[]`。双方只启用交集；**未知 capability
        忽略不报错**。客户端带 `DJB-Protocol-Version` 且不受支持时返回 426（`42601`）。
      security: []
      parameters:
        - $ref: '#/components/parameters/ProtocolVersion'
        - $ref: '#/components/parameters/Capabilities'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 能力清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolCapabilities'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/protocol/deprecations:
    get:
      tags: [protocol]
      summary: 弃用清单与退役日期
      operationId: getProtocolDeprecations
      description: |
        列出已弃用端点/字段、替代方案与 `sunset_at`。弃用提前 ≥90 天公示，
        且至少跨 2 个 MAJOR。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: protocol_major
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 弃用清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecationList'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- 调度快照
  /api/v1/schedule/snapshot/{period}:
    get:
      tags: [schedule]
      summary: 公开容量公告与出价快照（离线复算）
      operationId: getScheduleSnapshot
      description: |
        按周期发布的容量公告与出价快照，供任何第三方离线复算。只含**输入**与版本
        （`quote_version`），不含调度评分、权重或淘汰原因——那些在决策日志里，
        经审批后按审计流程提供。
      security: []
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 周期快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- 账本（后台只读）
  /api/v1/admin/ledger/entries:
    get:
      tags: [admin]
      summary: 账本只读查询
      operationId: listLedgerEntries
      description: |
        只读查询账本分录（`ledger_entry`，字段见）。账本只追加：
        没有写接口，调整只能走冲正流程（后台双人复核）。本端点属管理面：
        内网/VPN + 强 MFA + 敏感页 step-up（≤5 分钟有效），公网不可达。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: entry_type
          in: query
          required: false
          schema:
            type: string
        - name: source_type
          in: query
          required: false
          description: 按幂等键来源过滤（16 值白名单，见 SourceType）。
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: status
          in: query
          required: false
          description: 5 值枚举（同 LedgerEntry.status）；reversed 已退役，冲正改用 void + reverse_of。
          schema:
            type: string
            enum: [pending, confirmed, locked, settled, void]
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/RequestId'
        - name: X-Admin-Step-Up
          in: header
          required: true
          description: 敏感页二次认证凭据（≤5 分钟有效）
          schema:
            type: string
      responses:
        '200':
          description: 分页分录
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntriesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ----------------------------------------------------------------------
  # 配置中心（管理面；RPT-0002 §3 / 产品设计 §21.12）
  # 写进 spec ≠ 公网可达：内网/加密专线 + 强 MFA + step-up（≤5 分钟）
  # ----------------------------------------------------------------------
  /api/v1/admin/config/items:
    get:
      tags: [admin]
      summary: 配置项检索（不返回敏感值）
      operationId: listConfigItems
      description: |
        按前缀/作用域检索配置项元数据。敏感项只返回 `secret_ref` 或脱敏摘要，
        绝不明文回传。三源（desired / effective / running）漂移见 `listConfigDrifts`。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: prefix
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 配置项分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/drifts:
    get:
      tags: [admin]
      summary: 配置三源漂移清单（目标 0）
      operationId: listConfigDrifts
      description: 返回 desired / effective / running 三源不一致的配置项；目标恒为 0，非 0 即告警。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 漂移清单
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDriftList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}:
    get:
      tags: [admin]
      summary: 读取单个配置项
      operationId: getConfigItem
      description: 按 key 读取；可用 `version` / `scope` 指定历史版本与作用域。敏感值不返回明文。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 配置项
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [admin]
      summary: 创建配置草稿（不生效）
      operationId: createConfigDraft
      description: |
        只建草稿，不改变运行值；生效必须走 `publishConfigItem` 并完成复核。
        幂等键 24h，与审计记录同事务。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigDraftRequest' }
      responses:
        '201':
          description: 草稿已创建
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/publish:
    post:
      tags: [admin]
      summary: 发起配置发布（生成发布单）
      operationId: publishConfigItem
      description: |
        发起发布单，进入 `pending_approval`；复核人 ≠ 发起人。P0 配置需 Step-Up + 双人 + 冷却；
        灰度按桶推进，不自动全量。`expired` **不自动放行**。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPublishRequest' }
      responses:
        '202':
          description: 发布单已创建（待复核）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/publish-requests/{id}/approve:
    post:
      tags: [admin]
      summary: 复核配置发布（复核人 ≠ 发起人）
      operationId: approveConfigPublish
      description: 复核人批准或驳回发布单；自批自核必须被拒绝（返回 403）。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigApprovalRequest' }
      responses:
        '200':
          description: 复核结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/rollback:
    post:
      tags: [admin]
      summary: 回滚到不可变历史版本
      operationId: rollbackConfigItem
      description: 回滚 = 以历史版本为内容生成一次新的发布；历史版本本身不可修改。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigRollbackRequest' }
      responses:
        '200':
          description: 回滚发布单
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/kill-switch:
    post:
      tags: [admin]
      summary: 紧急收紧开关（只能收紧，≤24h 转正）
      operationId: killSwitchConfigItem
      description: |
        只允许把配置收紧（更保守），不允许借 kill-switch 放开权限或阈值；
        `ttl_seconds ≤ 86400`，到期自动回到上一生效版本并留审计。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigKillSwitchRequest' }
      responses:
        '200':
          description: 开关已生效
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

