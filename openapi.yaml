        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/model-sync/state:
    get:
      tags: [admin]
      summary: 节点模型同步状态（版本/漂移/错误类）
      operationId: listNodeModelSyncState
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: node_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 节点状态列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeModelSyncStateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # M17 模型身份证明（C12，spec 1.2.11）
  # 服务端自己发挑战、自己计数；客户端证据只作线索
  # ----------------------------------------------------------------------
  /api/v1/node/upstream/attest/challenge:
    post:
      tags: [node]
      summary: 申请 L1–L3 证明挑战（合成 prompt，5 分钟有效）
      operationId: issueAttestationChallenge
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationChallengeRequest' }
      responses:
        '200':
          description: 挑战已签发（一次性；重放/过期拒绝）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/node/upstream/attest:
    post:
      tags: [node]
      summary: 回传证明证据（服务端自己比对 tokenizer 后定级）
      operationId: submitAttestationEvidence
      description: |
        服务端消费挑战并用自己的 tokenizer 计数比对：`|usage - expected| <= max(1, ceil(expected*1%))`
        → L3；超容差 → L2 + `tokenizer_mismatch`（**不判作弊**）；无 usage → L2/L1；failed → L0。
        挑战一次性：重放/过期/跨 node/model → 409/404，不消费原挑战。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttestationEvidenceRequest' }
      responses:
        '200':
          description: 已定级（只升不降）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationSubmitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '426': { $ref: '#/components/responses/UpgradeRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/supply/integrity/attestations:
    get:
      tags: [admin]
      summary: 模型证明列表（node/model/level 过滤 + 游标）
      operationId: listModelAttestations
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: node_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: level
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AttestationLevel' }
      responses:
        '200':
          description: 证明列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelAttestationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # M17 待分润冻结（C14，spec 1.2.10）
  # 只冻结「待分润」：不写账本、不改余额；S2 全开 I0–I4（罚没留 S3）
  # ----------------------------------------------------------------------
  /api/v1/admin/supply/integrity/holds:
    get:
      tags: [admin]
      summary: 待分润冻结列表（active/all + 节点/模型/等级过滤 + 游标）
      operationId: listIntegrityHolds
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [active, all, released, expired], default: active }
        - name: node_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: level
          in: query
          required: false
          schema: { $ref: '#/components/schemas/IntegrityLevel' }
      responses:
        '200':
          description: 冻结列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityHoldList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: 创建 / 升级冻结（I0 只留事件；已有 active 只升不降）
      operationId: createIntegrityHold
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrityHoldCreateRequest' }
      responses:
        '201':
          description: 已创建（I0 为 200 noted，hold=null）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityHoldMutation' }
        '200':
          description: 已升级 / I0 已记录（action=escalated|noted）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityHoldMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/supply/integrity/holds/{id}:
    get:
      tags: [admin]
      summary: 冻结详情（含事件流水）
      operationId: getIntegrityHold
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 冻结详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityHoldDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/supply/integrity/holds/{id}/release:
    post:
      tags: [admin]
      summary: 解除冻结（I0/I1 一人；I2 双人；I3/I4 双人 + 高权限 scope）
      operationId: releaseIntegrityHold
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrityHoldReleaseRequest' }
      responses:
        '200':
          description: 已解除（幂等：重复 release 回同一结果）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityHoldMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ----------------------------------------------------------------------
  # 调度与定价（M04；spec 1.2.0 补登记：M04 CR-2）
  # /api/v1/schedule/route · /replay · /decisions/{id}
  # 决策日志只追加、丢弃率 0；不含正文与凭据
  # ----------------------------------------------------------------------
  /api/v1/schedule/route:
    post:
      tags: [schedule]
      summary: 内部路由决策（返回 decision_id + chosen + ETA）
      operationId: createRouteDecision
      description: |
        一次请求最多 2 次尝试、只计费一次（计费归 M05）。相同
        (`snapshot_ts`,`quote_version`,`policy_version`,`request_digest`) 必得同一决策，
        复算一致率 100%（INV-03）。候选集为空时按降级顺序执行，最终拒绝带
        `45001` + 三个可选动作。**调用方是 M03 网关**（服务间 mTLS），不对外暴露给终端；
        终端入口只有 `/v1/chat/completions` 与 `/v1/batches*`。
      security:
        - internalMTLS: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '201':
          description: 决策已生成
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/schedule/replay:
    post:
      tags: [schedule]
      summary: 异步复算（202 + job_id，并发 1）
      operationId: createScheduleReplay
      description: |
        按窗口重放决策：同一输入必须复现同一 `chosen`；差异 ≠0 即 P0。复算是**只读**的，
        不改历史决策。同一时刻只允许 1 个复算作业（并发 1），重复提交返回 409 + `40901`。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayRequest' }
      responses:
        '202':
          description: 已受理（异步复算）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/schedule/decisions/{decision_id}:
    get:
      tags: [schedule]
      summary: 决策下钻（价格 / 延迟 / 亲和 / 兜底 + 淘汰码）
      operationId: getRoutingDecision
      description: |
        只读下钻单条决策：含价格、ETA、亲和命中、兜底链与**淘汰码**。不含评分权重与
        阈值（私有配置）；正文与凭据不入决策日志（INV-12）。决策日志保留 12 个月
        （M04 CR-3），更早的数据按审计流程申请。
      security:
        - adminBearer: []
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 决策详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ----------------------------------------------------------------------
  # 调度定价补充（M04 §4.1：quotes / bids；additive 补登，见证据「裁决假设 AH-1」）
  # 供方区间报价、用方区间出价；成交价 ∈ [max(a_lo,b_lo), min(a_hi,b_hi)]
  # ----------------------------------------------------------------------
  /api/v1/schedule/quotes:
    post:
      tags: [node]
      summary: 供方区间报价（节点侧）
      operationId: createQuote
      description: |
        节点按 `(access, model, unit)` 提交区间要价与 TTL；可成交 ⟺ 区间与用方出价重叠
        （INV-01），成交价取区间交集内的策略价（mid / floor / ceiling）。报价只追加，
        过期（`expired`）不复活，只能新建。`ask_price` 是节点要价，**不是**评分权重。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: 报价已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/schedule/bids:
    post:
      tags: [user]
      summary: 用方区间出价（租户侧）
      operationId: createBid
      description: |
        用方按模型提交区间出价：`min_price` 缺省为 0、`max_price` 缺省为不设上限（单边退化
        为单边比较，INV-01）。出价只追加，过期不复活；成交由 M04 决策产生，本端点不锁量。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidRequest' }
      responses:
        '201':
          description: 出价已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 计量与收据（M05；spec 1.2.0 补登记：M05 CR-1）
  # /api/v1/user/usage/records · /node/receipts/{receipt_id} · /admin/usage/*
  # 收据只追加、逐条受理；校正只追加不改历史
  # ----------------------------------------------------------------------
  /api/v1/user/usage/records:
    get:
      tags: [user]
      summary: 用量明细（游标分页）
      operationId: listUserUsageRecords
      description: |
        明细是**逐次调用**的元数据与金额，不含 prompt / response 正文。游标分页，
        默认 50、上限 200。`state=corrected` 的行带 `correction_id`，原值不可改，
        差额以追加校正表达（INV-06）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [recorded, settled, corrected] }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 用量明细分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/receipts/{receipt_id}:
    get:
      tags: [node]
      summary: 单条收据受理结果（节点自查）
      operationId: getNodeReceipt
      description: |
        节点自查单条收据是否被受理：`accepted` / `rejected` / `duplicate` / `expired`。
        `duplicate` 表示重复提交且返回首次结果（不重复计量，INV-03）。签名不匹配回
        `46001`（HTTP 422）。只返回状态与码，不回显收据正文。
      security:
        - nodeClientKey: []
      parameters:
        - name: receipt_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 收据状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/usage/upstream-bills:
    post:
      tags: [admin]
      summary: 上游账单导入（FIN / OPS）
      operationId: importUpstreamBills
      description: |
        导入上游账单行（`imported → reconciled`）。导入**只追加**，不覆盖原用量；
        与本地计量差异 >1% 进差异工单（INV-07），不静默取大或取小。逐行受理，
        单行失败不回滚整批。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamBillImportRequest' }
      responses:
        '200':
          description: 逐行受理结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamBillImportAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/usage/corrections:
    post:
      tags: [admin]
      summary: 人工校正（≥50 USD 双人复核）
      operationId: createUsageCorrection
      description: |
        校正只追加（`proposed → applied / rejected`），不改历史行。单条 usage 的累计
        校正不得超过原额；负向校正（退款方向）必须人工复核；校正额 ≥50 USD 时
        `second_approver` 必填且 ≠ 操作人（缺复核 409 + `40902`）。写入后由 M06 走冲正。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageCorrectionRequest' }
      responses:
        '202':
          description: 校正已受理（`proposed` 或直接 `applied`）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageCorrectionAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 账本只读管理面（M06；spec 1.2.0 补登记：M06 CR-L4）
  # 试算平衡 / 42 科目余额 / 期间 Merkle 根 / 全量复算（只读，不修数据）
  # 内网/VPN + 强 MFA + step-up（≤5 分钟）；账本无 UPDATE / DELETE
  # ----------------------------------------------------------------------
  /api/v1/admin/ledger/trial-balance:
    get:
      tags: [admin]
      summary: 试算平衡（Σ借 = Σ贷）
      operationId: getLedgerTrialBalance
      description: |
        按 `as_of` 汇总试算平衡：同期 Σ借 = Σ贷、科目在 42 条白名单内、未知科目直接报错
        （不静默跳过，INV-05）。`balanced=false` 即 P0，账本转只读（不自动修数据）。
        尾差（≤1 最小单位）累积在 `2901`，单独给出 `tail_diff`。
      security:
        - adminBearer: []
      parameters:
        - name: as_of
          in: query
          required: false
          description: 截止时间（UTC）；缺省为最近一次日结。
          schema: { type: string, format: date-time }
        - name: unit_type
          in: query
          required: false
          description: 币种维度；COP 与 USD 不互转（INV-04）。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 试算平衡
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/accounts:
    get:
      tags: [admin]
      summary: 42 科目与余额
      operationId: listLedgerAccounts
      description: |
        列举科目表与派生余额（`account_balances` 为唯一余额源，由分录派生、可全量重建）。
        科目数 42（资产 12 / 负债权益 12 / 收入 6 / 费用损失 10 / 非现金 2，见 03-facts §6）。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: fund_class
          in: query
          required: false
          schema: { type: string, enum: [CLIENT, PLATFORM, FEE] }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 科目与余额分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerAccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/merkle/{period}:
    get:
      tags: [admin]
      summary: 期间 Merkle 根与复算入口
      operationId: getLedgerMerkleRoot
      description: |
        期间根可**由当期分录重算复现**；发布后不可改（INV-13）。本端点只读，
        不触发锚定；`verify_hint` 给出重算所需的只读入口。锚定周期见
        `ledger.merkle_interval_h`（1 h）。目标期间无根返回 404 + `40924`。
      security:
        - adminBearer: []
      parameters:
        - name: period
          in: path
          required: true
          description: 锚定周期：日 `YYYY-MM-DD` 或小时 `YYYY-MM-DDTHH`。
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2}(T[0-9]{2})?)?$' }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [journal, daily_close], default: journal }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 期间根
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerkleCommitment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/recompute:
    post:
      tags: [admin]
      summary: 触发全量复算（只读，不修数据）
      operationId: recomputeLedger
      description: |
        分页重算 hash 链与余额派生，**只读、不自动修**：差异 ≠0 即 P0 并冻结写入口。
        复算与日结共用同一入口；`dry_run` 默认 true，显式 false 才发布校验结果
        （仍不修数据）。同一时刻只允许 1 个复算作业（409 + `40920`）。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecomputeRequest' }
      responses:
        '202':
          description: 复算已受理
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecomputeAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ----------------------------------------------------------------------
  # 账本冲正与凭证（M06 §4.1：journals/{id} · reversals；additive 补登 AH-1）
  # 冲正是账本**唯一写路径**：整单取反、等额、双人复核；禁部分冲正
  # ----------------------------------------------------------------------
  /api/v1/admin/ledger/journals/{id}:
    get:
      tags: [admin]
      summary: 凭证 + 行 + 冲正链（只读）
      operationId: getLedgerJournal
      description: |
        返回单张凭证及其行、以及冲正链（`reversal_of_journal` / `reverse_chain`）。
        记账后凭证只有 `posted` 与 `voided`（被冲正）两种状态，**禁止覆盖写与部分冲正**。
        凭证不存在或已归档返回 404 + `40924`。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 凭证详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/reversals:
    post:
      tags: [admin]
      summary: 发起冲正（双人复核、整单等额）
      operationId: createLedgerReversal
      description: |
        对原凭证逐行取反、等额整单冲正（INV-07）：每张原凭证至多一条冲正，禁止部分冲正。
        必须双人复核（`second_approver` ≠ 操作人）且带理由。原凭证已被冲正返回 409 + `40921`；
        冲正期间并发冲突返回 409 + `40920`；金额不齐 / 借贷不平衡返回 422 + `42220`。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReversalRequest' }
      responses:
        '201':
          description: 冲正凭证已生成（待复核或已入账）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReversalAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 配置中心补充 5 条（M10；spec 1.2.0 补登记：M10 CR-1 / CR-3）
  # namespaces · {key}/diff · {key}/impact · publish-requests/{id}/promote · {key}/audit
  # S1 只实现只读三项（namespaces / diff / audit）；impact 与 promote 在 S2 落实现
  # ----------------------------------------------------------------------
  /api/v1/admin/config/namespaces:
    get:
      tags: [admin]
      summary: 配置命名空间清单（十域注册）
      operationId: listConfigNamespaces
      description: |
        列出已注册的配置命名空间与键数量（十域注册见 03-facts §9）。`namespaces` 是
        **保留段**：具体路径优先于模板路径，配置键不得以 `namespaces` 为名注册。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 命名空间清单
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigNamespaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/diff:
    get:
      tags: [admin]
      summary: 版本差异（结构化 diff）
      operationId: getConfigDiff
      description: |
        比较同一 key 的两个不可变版本，返回字段级 diff。敏感值只给 `masked=true` 的
        掩码，不返回明文；`content_digest` 可独立复算（`sha256(canonical_json)`）。
        版本不存在返回 404 + `47006`。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - name: from_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 结构化差异
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/impact:
    get:
      tags: [admin]
      summary: 影响面分析（消费方 / 风险级 / 是否需重启）
      operationId: getConfigImpact
      description: |
        发布前影响面：列出消费方模块、`risk_level`（P0/P1/P2）、是否需要重启或下次锚定
        生效、以及受影响的键集。影响面是发布单的**前置输入**，不改变运行值。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 影响面
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/publish-requests/{id}/promote:
    post:
      tags: [admin]
      summary: 推进发布单（灰度桶前进 / 全量）
      operationId: promoteConfigPublish
      description: |
        按灰度计划 1 → 5 → 25 → 100 推进；观测窗未满不得推进（409 + `47007`），
        发布窗口外拒绝（409 + `47008`）。`expired` 不自动放行，只能新建发布单。
        P0 需 step-up + 双人；缺 step-up 返回 424 + `42401`（过渡期 403 + `47009`）。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPromoteRequest' }
      responses:
        '200':
          description: 发布单新状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/audit:
    get:
      tags: [admin]
      summary: 配置审计链（只读）
      operationId: listConfigAudit
      description: |
        该 key 的审计事件（草稿、发布、复核、推进、回滚、kill-switch、漂移）。
        审计事实源是 M16 `audit_log`，本端点只做按 key 的只读聚合，不提供删除或修改。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 审计事件分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigAuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- 平台运维（内部）
  /healthz:
    get:
      tags: [ops]
      operationId: getHealthz
      summary: 存活 / 就绪探针（只返回状态与版本，不暴露拓扑）
      security: []
      responses:
        '200':
          description: 服务状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '500':
          description: 依赖不可用（数据库 / 审计链密钥 / 配置服务）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/ops/audit/entries:
    post:
      tags: [ops]
      operationId: appendAuditEntry
      summary: 追加审计条目（append-only，HMAC-SHA256 链；高危字段缺失即拒）
      description: |
        业务模块写审计的唯一入口。服务端在同一事务内读上一条 `hash` → 计算
        `hmac-sha256(prev_hash + canonical_json(entry))` → 追加；`prev_hash` 断链即 409。
        高危动作（`reason_code` 非空的动作）必须给 `actor_type` / `role` / `before` /
        `after` / `reason_code` / `ticket`，且 `approval_chain` 至少两人、propose ≠ approve。
        幂等：同 `X-DJB-Idempotency-Key` 重复提交返回首次结果（`duplicate=true`），不重复入链。
      security: [{ internalMTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditAppendRequest' }
      responses:
        '201':
          description: 已追加
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditAppendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423':
          description: 审计链锁定（校验进行中 / 密钥缺失或未激活），拒绝写入
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [ops]
      operationId: listAuditEntries
      summary: 只读查询审计链（管理后台 / 排障用；不提供 UPDATE / DELETE）
      security: [{ internalMTLS: [] }]
      parameters:
        - name: from_seq
          in: query
          required: false
          description: 起始序号（含）；缺省从 1 开始。
          schema: { type: integer, minimum: 1 }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: target
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 审计条目分页（按 seq 升序）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /internal/ops/audit/verify:
    post:
      tags: [ops]
      operationId: verifyAuditChain
      summary: 逐条重算校验审计链（可选固化当日 Merkle 根）
      description: |
        逐条重算 `hash` 并校验 `prev_hash`、算法一致、字段完整、审批链非自批、
        `pending_approval` 超时；发现断链返回 200 + `ok=false` + `broken_seq`（不修链、不重算覆盖）。
        `seal=true` 时同日幂等写 `audit_anchors`（同日重复调用返回同一 `merkle_root`）。
      security: [{ internalMTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditVerifyRequest' }
      responses:
        '200':
          description: 校验结果（`ok=false` 表示断链 / 算法降级 / 自批 / 超时）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- 站内信（M12）
  /api/v1/user/notifications:
    get:
      tags: [user]
      operationId: listNotifications
      summary: 站内信列表（游标分页；P0 不可退订但可标记已读）
      description: |
        只返回当前账户的站内记录；按 `created_at` 倒序。`unread_only=true` 只返回未读。
        `payload` 只含 id / 金额 / 时间 / 原因码，不含正文与 PII（M12 INV-07）。
      security: [{ userBearer: [] }]
      parameters:
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [P0, P1, P2] }
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 站内信分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/notifications/{id}/read:
    post:
      tags: [user]
      operationId: markNotificationRead
      summary: 标记单条已读；`id=all` 标记该账户全部未读
      description: |
        重复标记无副作用（幂等）。`id=all` 是保留字，不对应任何真实通知 id。
        已读只影响未读提醒，不移除站内记录（M12 INV-02）。
      security: [{ userBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 通知 id；保留值 `all` 表示全部已读。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已读结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadAck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

