  /v1/messages:
    post:
      operationId: createMessage
      summary: 创建一条 Anthropic Messages 兼容的对话补全
      description: 'Anthropic Messages API 兼容面：可用 `x-api-key` 或 `Authorization: Bearer` 鉴权；

        `stream: true` 返回 Anthropic SSE（6 类事件），否则返回单个 message 对象。

        本端点复用 OpenAI 面的路由/额度/幂等/计量链路，仅翻译报文形状。

        字段口径（缓存标记剥离、工具/思考拒绝等）见 16-ANTHROPIC-COMPAT-DECISIONS.md。

        '
      x-djb-availability: m03
      tags:
      - gateway
      security:
      - AnthropicApiKey: []
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: anthropic-version
        in: header
        required: false
        description: 协议版本；缺失按 2023-06-01 记录，未知值放行（只记录不拒绝）。
        schema:
          type: string
          default: '2023-06-01'
      - name: anthropic-beta
        in: header
        required: false
        description: beta 能力声明，可重复；本期只记录不参与判定。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: '`stream=false` → `AnthropicMessage`；`stream=true` → `text/event-stream`，

            事件序 message_start → content_block_start → content_block_delta* →

            content_block_stop → message_delta → message_stop；流内失败改发 `event: error`

            且**不**补 message_stop。

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            request-id:
              description: 与 X-Request-Id 同值（Anthropic SDK 读取的官方头名）。
              schema:
                type: string
            X-DJB-Usage-Input:
              description: 与账本同源的输入 token 数（仅非流式）。
              schema:
                type: integer
                minimum: 0
            X-DJB-Usage-Output:
              description: 与账本同源的输出 token 数（仅非流式）。
              schema:
                type: integer
                minimum: 0
            x-djb-ignored-fields:
              description: 被剥离而非 400 的请求字段名（逗号分隔，已排序，最多 20 个）。
              schema:
                type: string
            X-DJB-Stop-Reason:
              description: 仅当上游因内容过滤结束时出现，值为 content_filter。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessage'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AnthropicStreamEvent'
        '400':
          description: 参数不合法（含 `tools`/`tool_choice`/`thinking`、非文本内容块、`max_tokens` ≤ 0）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '401':
          description: 缺少或非法 Key（`x-api-key` 与 Bearer 均无）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '402':
          description: 余额不足。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '403':
          description: Key 策略拒绝。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '404':
          description: '路径/模型不存在。注意：**特性开关关闭时本端点不挂载**，返回与其他未挂载路径

            完全一致的 404 `{"detail":"Not Found"}`（不含 Anthropic 信封），以便回滚可验证。

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '413':
          description: 请求体超过上限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '429':
          description: 限流或日额度上限（带 Retry-After）。
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '441':
          description: '流已建立后上游中断（已发出的 SSE 之后以 `event: error` 结束）。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '502':
          description: 上游错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '503':
          description: 无可用节点 / 依赖未接线（fail-closed）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
        '504':
          description: 上游超时。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicError'
  /api/v1/user/provider/ask-settings:
    get:
      operationId: listUserProviderAskSettings
      summary: 列出本账户的供方按模型申报（含账户默认行）
      tags:
      - model-bids
      security:
      - userBearer: []
      parameters:
      - name: node_id
        in: query
        required: false
        description: 作用域过滤。缺省 `*`（账户默认行）；给具体节点时只返回该节点 + `*` 的行。非本账户的节点按「看不见」处理（回退 `*`，不报 403）。
        schema:
          type: string
          maxLength: 128
          default: '*'
      responses:
        '200':
          description: 顶层裸对象（不包 `data` 信封，与 /user/model-bids 同款）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAskSettingsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidArgument'
  /api/v1/user/provider/ask-settings/{model}:
    x-djb-path-model: '模型 slug 允许包含 `/`；`{model}` 是单个路径参数，服务端同时接受原样 `org/model` 与 percent-encoded `org%2Fmodel`。'
    parameters:
    - name: model
      in: path
      required: true
      description: 模型 slug（服务端归一化：小写 + 折叠空白 + 去首尾斜杠）。`_default` 是 `*` 的别名（账户默认行）。
      schema:
        type: string
    - name: node_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
        default: '*'
    get:
      operationId: getUserProviderAskSetting
      summary: 读取单个模型的申报（未设置 → enabled=true、无价、version=0）
      tags:
      - model-bids
      security:
      - userBearer: []
      responses:
        '200':
          description: 单模型视图（含 market / warnings / effective / recommended）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAskSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidArgument'
    put:
      operationId: updateUserProviderAskSetting
      summary: 部分更新单个模型的申报（内容不变 → 幂等，不升版本）
      tags:
      - model-bids
      security:
      - userBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 可选；只校验长度 8..128，不参与去重（PUT 本身按内容幂等）。
        schema:
          type: string
          minLength: 8
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderAskSettingPatch'
            examples:
              set_band:
                summary: 设最低价 + 申报上限
                value:
                  ask_min: '1.20'
                  ask_max: '2.50'
              cancel:
                summary: 撤单（存量 ≤1 TTL 自然过期，不 403 用方）
                value:
                  enabled: false
              adopt:
                summary: 采用系统建议值（服务端不替你填数字，必须同请求带价）
                value:
                  adopt_recommendation: recommend:settled_7d
                  ask_min: '1.30'
      responses:
        '200':
          description: 更新后的单模型视图，额外带 `changed`
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ProviderAskSetting'
                - type: object
                  required:
                  - changed
                  properties:
                    changed:
                      type: boolean
                      description: false = 内容未变，version/updated_at 未动
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 40301 node_not_owned —— 写的节点不在本账户名下（node_id='*' 恒允许）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '424':
          description: 42401 step_up_required —— 开关 model_bid.put_step_up 打开且会话未二次认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/provider/recommended-prices/{model}:
    x-djb-path-model: '模型 slug 允许包含 `/`；`{model}` 是单个路径参数，服务端同时接受原样 `org/model` 与 percent-encoded `org%2Fmodel`。'
    get:
      operationId: getUserProviderRecommendedPrice
      summary: 系统建议值（只读；ETag/304）
      description: '三级回退：近 7 天成交（n≥20）→ 当前有效报价 → 运营建议价簿（§9-④ 拍板 a）。 `scheduling.model_bid.recommend` 关时 `recommended=null`、`baseline=null`、`market`
        全 null。

        '
      tags:
      - model-bids
      security:
      - userBearer: []
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 推荐值块
          headers:
            ETag:
              schema:
                type: string
              description: 响应体规范化 JSON 的 sha256
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationBlock'
        '304':
          description: ETag 命中（无响应体）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/InvalidArgument'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: DJB-Key
      description: '用方 API Key（一枚 Key 通吃所有可路由模型）。Key 只显示一次；

        平台只存哈希；客户端应存于 OS 安全存储，不进日志、不进仓库。

        '
    nodeClientKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: '节点客户端密钥，由 `/api/v1/node/pair` 生成、可轮换（重叠 ≤24h）

        与撤销（立即停单，在途不受影响）。只存哈希（字段 client_key），

        平台不回显明文。

        '
    hostedAgentBearer:
      type: http
      scheme: bearer
      bearerFormat: DJB-HostedAgent
      description: '供方托管 Agent 的一次性 scoped token（`djb_ha_` 前缀，仅在 `/api/v1/hosted/*` 生效）。

        服务端只存 sha256 + 前缀；撤销或轮换后旧 token 立即 401。

        '
    internalMTLS:
      type: mutualTLS
      description: '服务间 mTLS + service token（仅集群内可达，公网不可达；不进客户端 SDK，

        不发动态口令）。仅用于 `/api/v1/schedule/route` 这类**内部**端点。

        '
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: Admin-Session
      description: '后台会话（强制 MFA；敏感动作 step-up ≤5 分钟；break-glass 只读模式见）。管理面仅内网/VPN，公网不可达。

        '
    nodeKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: 既有节点密钥（复用 M02 凭据体系，F6 不新开鉴权路径）。
    AnthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Anthropic 风格鉴权；与 `Authorization: Bearer` 等价。两者同时出现时以 `x-api-key` 为准

        （并记录一次 header 冲突告警，不记录 Key 内容）。

        '
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方生成的请求标识（UUID）；服务端原样回显，贯穿日志与链路追踪。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-DJB-Idempotency-Key
      in: header
      required: false
      description: '写操作幂等键，24h 有效且与账本写入同事务。缺省时服务端按

        请求体指纹做 300s 去重（流式仅 60s）。

        '
      schema:
        type: string
        minLength: 16
        maxLength: 128
    AdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      description: 敏感操作二次认证凭据（≤5 分钟有效）；P0 配置发布必备。
      schema:
        type: string
    ReportPeriod:
      name: period
      in: query
      required: true
      description: '报表周期：自然月 `YYYY-MM`，或日粒度 `YYYY-MM-DD`（REP-01/02/04 需要日粒度时用；

        `/admin/ledger/merkle/{period}` 仍只接受月）。日粒度只加不改，月粒度行为不变。

        '
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$
    ProtocolVersion:
      name: DJB-Protocol-Version
      in: header
      required: false
      description: 调用方协议版本（`MAJOR.MINOR.PATCH`）。缺省按服务端当前版本；不兼容返回 426。
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    Capabilities:
      name: DJB-Capabilities
      in: header
      required: false
      description: '调用方启用的能力标识（逗号分隔，如 `chat_completions,batch`）。双方只启用交集；

        未知 capability **忽略不报错**。

        '
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页的不透明游标；首次不传。不得猜测或自行构造。
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数上限。服务端可返回更少；`has_more` 判断是否继续。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      description: 起始时间（UTC，含端点）。日期或 RFC 3339 日期时间。
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: 结束时间（UTC，含端点）。
      schema:
        type: string
        format: date-time
    Period:
      name: period
      in: path
      required: true
      description: 周期标识（UTC 日期）。
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    RequestId:
      description: 服务端/调用方请求标识，原样回显。
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: 建议重试等待秒数（429/503）。客户端必须遵守并加抖动。
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: 请求不合法（结构、枚举、大小上限）。不得回显内部堆栈或 SQL。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或凭据无效/过期。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: '已认证但无权限，或命中风控。对外只给粗粒度原因码（如 `account_restricted`），

        不返回具体规则/阈值/名单。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（含无权查看时的统一 404，避免枚举）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突（重复幂等键的不同载荷、状态机不允许的迁移）。无更细码时用通用 `40919`；细分码见 `Error.code`。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: 协议版本不兼容（`42601`，HTTP 426）。响应体给出可升级的版本范围。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: '请求体超过上限（HTTP 413，专用码 `40013`；chat 请求建议 ≤1 MiB；receipts 批 ≤500 条/次；

        上限属实现参数，放宽不算破坏性变更，收紧算）。只给上限提示，不回显请求内容。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: '限流或配额耗尽。只给粗粒度原因码与 `Retry-After`；具体阈值属私有配置，

        不在响应中暴露。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 暂时不可用/过载/维护；可安全重试（遵守 `Retry-After`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-DJB-Route:
          description: '可选（1.11.0 加性）：只在对 `djb/auto` 的请求上出现；值为 `routed`。

            无候选时 fail-closed，不返回任何模型回答。

            '
          schema:
            type: string
            enum:
            - routed
        X-DJB-Route-Strategy:
          description: 可选（1.11.0 加性）：本次请求的路由策略（见 200 同名头）。
          schema:
            type: string
            enum:
            - cheap
            - fast
            - reliable
            - balanced
        X-DJB-Route-Candidates:
          description: 可选（1.11.0 加性）：候选数（无候选时为 `0`）。
          schema:
            type: integer
            minimum: 0
        X-DJB-Route-Reason:
          description: 可选（1.11.0 加性）：无候选归因（见 200 同名头）。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: '余额不足 / 欠费（`40201`，HTTP 402）。只给粗粒度原因与充值提示，

        不返回额度细节、风控阈值或判定条件；客户端应停止重试并引导充值。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpRequired:
      description: '二次认证（step-up）缺失或已过期（`42401`，HTTP 424）。敏感动作须重新完成

        step-up（≤5 分钟有效）后重放；过渡期实现也可返回 403 + `47009`（M10 CR-3），

        客户端必须同时处理两种。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: '语义 / 业务校验失败（HTTP 422，`422xx` 段）。具体码值按模块段位登记

        （如账本 `42220–42223`）；结构与类型错误一律 `400`，两者不混用。

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TokenRouteInvalid:
      description: 非法声明（400 / 40001）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required:
                - type
                - code
                - message
                - request_id
                properties:
                  type:
                    type: string
                    enum:
                    - invalid_request_error
                  code:
                    type: integer
                    enum:
                    - 40001
                  message:
                    type: string
                  request_id:
                    type: string
                  reason:
                    type: string
                    enum:
                    - overlap_out_of_range
                    - vocab_out_of_range
                    - same_model
                    - shape_conflict
                    - unknown_field
                  field:
                    type: string
                    description: 出错的字段路径，如 token_route.overlap
    TokenRouteUnauthenticated:
      description: 未认证（401 / 40101）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - authentication_error
                  code:
                    type: integer
                    enum:
                    - 40101
                  message:
                    type: string
                  request_id:
                    type: string
    TokenRouteForbidden:
      description: 缺 scope（403 / 40301）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - permission_error
                  code:
                    type: integer
                    enum:
                    - 40301
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                    - forbidden
                  request_id:
                    type: string
    TokenRouteNodeNotFound:
      description: 节点不存在 / 越权（404 / 40401，不泄露存在性）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - not_found_error
                  code:
                    type: integer
                    enum:
                    - 40401
                  message:
                    type: string
                  node_id:
                    type: string
                  request_id:
                    type: string
    TokenRouteStepUpRequired:
      description: 缺 step-up 二次认证（424 / 42401）
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - permission_error
                  code:
                    type: integer
                    enum:
                    - 42401
                  message:
                    type: string
                  request_id:
                    type: string
    InvalidArgument:
      description: 400 / 40001（含未知字段、ask_min=0、ask_max<ask_min、node_id 含空白）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SupportTicketKind:
      type: string
      enum:
      - fault
      - billing
      - security
      - idea
    SupportTicketStatus:
      type: string
      enum:
      - pending_verify
      - open
      - pending_user
      - resolved
      - closed
      description: '`pending_verify` 永不进运营队列（D4）'
    SupportTicketVisibility:
      type: string
      enum:
      - public
      - internal
      description: internal = 内部备注，仅运营可见（客户读路径 SQL 层过滤）
    SupportTicket:
      type: object
      description: 对客工单视图：**不含**内部 uuid、email_hash、ip_hash、email_ct
      required:
      - public_id
      - kind
      - title
      - status
      - created_at
      - updated_at
      properties:
        public_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10,16}$
        kind:
          $ref: '#/components/schemas/SupportTicketKind'
        title:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/SupportTicketStatus'
        account_bound:
          type: boolean
          description: true = 登录用户单（不暴露 account_id 本身）
        created_at:
          type: string
          format: date-time
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: pending_verify 时为 null
        updated_at:
          type: string
          format: date-time
    SupportTicketCreateRequest:
      type: object
      required:
      - email
      - kind
      - title
      - body
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 只用于发验证信；库里只存 HMAC 哈希
        kind:
          $ref: '#/components/schemas/SupportTicketKind'
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: 不进日志 / 不进审计
        source_path:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 提交页路径，可选
        honeypot:
          type: string
          description: 反机器人陷阱字段：**真人留空**。非空时服务端静默丢弃（仍回 201，不落库， 回包里的 `public_id` 是**从未写库**的随机串），并打点计数（不含个人数据）。 前端**必须**满足三条，否则会误伤真人（密码管理器/自动填充会写可见输入框）：
            视觉隐藏（离屏或 `aria-hidden="true"`）、`tabindex="-1"`、`autocomplete="off"`； **不要**只写 `display:none` 却仍让自动填充可写入。
    SupportTicketVerification:
      type: object
      description: 发信闸门的**粗粒度**结论（不下发配额、阈值、剩余次数）
      required:
      - status
      properties:
        status:
          type: string
          description: '**发信闸门的原始结论（闭集）**，不是"三态糊一糊"。`sent` 才算真发出； `transport_not_wired` / `failed` 表示**没发出去**；`skipped_*`
            表示按规则跳过。 `not_needed` 表示该单**根本不需要验证**（登录用户提单），与 `pending`（等待中 / 无发信记录）严格区分。**加值等于改契约**（须走 patch diff）；客户端不得把非
            `sent` 当成功。

            **通用约定（所有闭集适用）**：客户端遇到**未知** `status` 值必须按"未验证"保守处理 ——既不得显示"已发送"，也不得显示"已验证"。这样后端加值时不会把老客户端带进沟里。'
          enum:
          - sent
          - pending
          - skipped_flag
          - transport_not_wired
          - failed
          - skipped_cap
          - skipped_quota
          - not_needed
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: sent 时有值
        notice_code:
          type:
          - string
          - 'null'
          description: '**机器可读**提示码（稳定、可断言）。Web 端（djb-web）**只认本字段**并按语言渲染； `sent` / `skipped_flag` / `not_needed` 时为 `null`（`not_needed`
            无可告知的事就不给码）。 加值等于改契约。'
          enum:
          - transport_unavailable
          - rate_limited
        notice:
          type:
          - string
          - 'null'
          description: 兜底**文本**（中文，给 CLI / SDK / 无模板客户端用），不含任何数字（配额、阈值、 剩余次数都不下发）。Web 端不要直接展示本字段，请用 `notice_code` 渲染。 **禁止**在此字段或
            `status` 里谎报"已发送"。
          maxLength: 120
        replayed:
          type: boolean
          default: false
          description: 幂等回放：本次请求命中同一 Idempotency-Key，未新建工单、未再发信
