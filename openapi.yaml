          additionalProperties: true
          description: '收银台会话（spec 1.8.2 加性字段，optional）。**仅** `POST /api/v1/pay/orders` 的

            201 创建响应返回；GET 详情 / 列表 / 幂等重放不返回（重放不产生新的收银台会话）。

            mock / test 通道的 `pay_url` 形如 `mock://checkout/<order_no>`，仅供联调；

            生产 PSP 未接线时该字段可为 null，门户必须容忍缺省（降级为「稍后重试」，

