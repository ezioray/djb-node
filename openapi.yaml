  /api/v1/auth/login:
    post:
      tags:
      - user
      summary: 登录（密码 / OAuth / 验证码）
      operationId: createAuthSession
      description: '`method` 区分登录方式，成功后返回会话令牌。MFA 未完成时返回 `mfa_required=true`

        的短期令牌（只可用于 step-up 换正式令牌）。凭据错误统一 `40110`，

        **不区分**「账号不存在」与「口令错误」（防枚举）；失败锁定与风控只给

        429 / 403 + 粗粒度原因码，不含阈值与名单。扫码登录的**轮询中间态**复用本条端点：

        票据未确认时返回 `202` + `ScanStatus`，确认后返回 `200` 令牌。

        401 除 `40110`（凭据错误）外，另有：`40111 captcha_required`（阈值触发但请求未带

        验证码，响应体 `error.captcha_required=true`）与 `40112 captcha_invalid`

        （验证码不存在/过期/已用/次数用尽/答案错，同一码不泄露分支）。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功（或 `mfa_required=true` 的短期令牌）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '202':
          description: '扫码登录中间态（轮询）。响应体**顶层即 `ScanStatus`**（`status` / `expires_at` /

            `retry_after_s`），客户端按 `retry_after_s` 继续轮询同一条端点；`confirmed` 后

            下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回 `409` + `40905`（一次性令牌家族）。

            **过渡期**：M01-T2 额外携带一份 `scan` 同值包裹（`{status, expires_at, retry_after_s}`），

            属纯增量；`ScanStatus` 声明 `additionalProperties: true` 允许该包裹，客户端只读顶层字段。

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
