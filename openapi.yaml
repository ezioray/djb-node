        bundle: { $ref: '#/components/schemas/ModelSyncBundle' }
        auto_published: { type: boolean }

    ModelSyncBundleList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelSyncBundle' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    ModelSyncBundleCreateRequest:
      type: object
      additionalProperties: true
      properties:
        source: { type: string }
        note: { type: [string, 'null'] }

    NodeModelSyncState:
      type: object
      additionalProperties: true
      required: [node_id, applied_version, updated_at, in_sync]
      properties:
        node_id: { type: string }
        applied_version: { type: integer, minimum: 0 }
        applied_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        in_sync: { type: boolean }
        drift:
          type: object
          additionalProperties: true
        error_class: { type: [string, 'null'] }

    NodeModelSyncStateList:
      type: object
      additionalProperties: true
      required: [items, has_more, server_version]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NodeModelSyncState' }
        server_version: { type: integer, minimum: 0 }
        has_more: { type: boolean }

    # ------------------------------------------------------------ M17 证明（C12，spec 1.2.11）
    AttestationLevel:
      type: string
      enum: [L0, L1, L2, L3, L4, L5]
      description: 服务端定级；L3+ 才可服务付费流量（S2 最低门槛）。

    AttestationChallengeRequest:
      type: object
      additionalProperties: true
      required: [model]
      properties:
        model: { type: string }
        upstream_id: { type: [string, 'null'] }

    AttestationChallenge:
      type: object
      additionalProperties: true
      required: [challenge_id, model, prompt, nonce, expires_at]
      description: 合成探针 prompt（不含用户数据）；一次性消费，TTL 5 分钟。
      properties:
        challenge_id: { type: string, format: uuid }
        model: { type: string }
        upstream_id: { type: [string, 'null'] }
        prompt: { type: string }
        nonce: { type: string }
        expires_at: { type: string, format: date-time }

    AttestationEvidenceRequest:
      type: object
      additionalProperties: true
      required: [challenge_id, model, result]
      properties:
        challenge_id: { type: string, format: uuid }
        model: { type: string }
        upstream_id: { type: [string, 'null'] }
        result:
          type: string
          enum: [reachable, inference_ok, tokenizer_match, failed]
          description: 客户端自述；**等级由服务端判，不采信该字段**。
        usage_prompt_tokens: { type: [integer, 'null'], minimum: 0 }
        response_hash: { type: [string, 'null'] }
        latency_ms: { type: [integer, 'null'], minimum: 0 }
        error_class: { type: [string, 'null'] }

    ModelAttestation:
      type: object
      additionalProperties: true
      required: [id, node_id, model, level, state, source, evidence_ref, verified_at]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string }
        upstream_id: { type: [string, 'null'] }
        model: { type: string }
        level: { $ref: '#/components/schemas/AttestationLevel' }
        state: { type: string, enum: [active, expired, suspended] }
        source: { type: string, enum: [server_challenge, client_report, provider] }
        tokenizer_version: { type: [string, 'null'] }
        evidence_ref: { type: string }
        verified_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }

    AttestationEvent:
      type: object
      additionalProperties: true
      required: [event_id, event, created_at]
      properties:
        event_id: { type: string, format: uuid }
        event: { type: string }
        level: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    AttestationSubmitResponse:
      type: object
      additionalProperties: true
      required: [attestation, event]
      properties:
        attestation: { $ref: '#/components/schemas/ModelAttestation' }
        event: { $ref: '#/components/schemas/AttestationEvent' }

    ModelAttestationList:
      type: object
      additionalProperties: true
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelAttestation' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }

    # ------------------------------------------------------------ M17 冻结（C14，spec 1.2.10）
    IntegrityLevel:
      type: string
      enum: [I0, I1, I2, I3, I4]
      description: 作弊等级；冻结比例 I0=0 / I1=50% / I2=80% / I3=I4=100%。

    IntegrityHold:
      type: object
      additionalProperties: true
      required: [id, node_id, model, level, ratio_bp, base_amount_micro,
                 frozen_amount_micro, state, reason, created_at, version]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string }
        upstream_id: { type: [string, 'null'] }
        model: { type: string }
        level: { $ref: '#/components/schemas/IntegrityLevel' }
        ratio_bp: { type: integer, minimum: 0, maximum: 10000 }
        base_amount_micro: { type: integer, minimum: 0 }
        frozen_amount_micro: { type: integer, minimum: 0 }
        state: { type: string, enum: [active, released, expired] }
        reason: { type: string }
        evidence_ref: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        released_at: { type: [string, 'null'], format: date-time }
        release_reason: { type: [string, 'null'] }
        reviewer_a: { type: [string, 'null'] }
        reviewer_b: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: [string, 'null'], format: date-time }

    IntegrityHoldEvent:
      type: object
      additionalProperties: true
      required: [event_id, node_id, model, event, actor, created_at]
      properties:
        event_id: { type: string, format: uuid }
        hold_id: { type: [string, 'null'], format: uuid }
        node_id: { type: string }
        model: { type: string }
        event: { type: string, enum: [created, escalated, released, expired] }
        from_level: { type: [string, 'null'] }
        to_level: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }
        actor: { type: string }
        created_at: { type: string, format: date-time }

    IntegrityHoldList:
      type: object
      additionalProperties: true
      required: [items, has_more, state]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IntegrityHold' }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
        state: { type: string }

    IntegrityHoldCreateRequest:
      type: object
      additionalProperties: true
      required: [node_id, model, level, base_amount_micro, reason]
      properties:
        node_id: { type: string }
        upstream_id: { type: [string, 'null'] }
        model: { type: string }
        level: { $ref: '#/components/schemas/IntegrityLevel' }
        base_amount_micro:
          type: integer
          minimum: 0
          description: 待分润基数（由调用方从 M05 快照取；本接口不读账本）。
        reason: { type: string }
        evidence_ref: { type: string }

    IntegrityHoldReleaseRequest:
      type: object
      additionalProperties: true
      required: [reason]
      properties:
        reviewers:
          type: array
          items: { type: string }
          description: I2 需 2 个不同 reviewer；I3/I4 另需操作者 integrity:release:high。
        reason: { type: string }

    IntegrityHoldMutation:
      type: object
      additionalProperties: true
      required: [action]
      properties:
        action: { type: string, enum: [created, escalated, noted, released] }
        hold: { oneOf: [{ $ref: '#/components/schemas/IntegrityHold' }, { type: 'null' }] }
        event: { oneOf: [{ $ref: '#/components/schemas/IntegrityHoldEvent' }, { type: 'null' }] }

    IntegrityHoldDetail:
      type: object
      additionalProperties: true
      required: [hold, events]
      properties:
        hold: { $ref: '#/components/schemas/IntegrityHold' }
        events:
          type: array
          items: { $ref: '#/components/schemas/IntegrityHoldEvent' }

    # ------------------------------------------------------------ 调度与定价（M04，spec 1.2.0）
    RouteRequest:
      type: object
      additionalProperties: true
      required: [model, kind]
      description: 路由输入。选填项缺省时取快照默认值；金额一律十进制字符串（Amount）。
      properties:
        model: { type: string }
        kind:
          type: string
          enum: [realtime, batch]
          description: 只允许 realtime 抢 batch；batch 互不抢占（INV-09）。
        requested_tokens:
          type: integer
          minimum: 1
        deadline_seconds:
          type: integer
          minimum: 1
        required_access:
          type: array
          items:
            type: string
            enum: [A1, A2, B]
        max_price:
          $ref: '#/components/schemas/Amount'
        tenant_id: { type: string }
        trace_id:
          type: string
          description: 调用方链路标识（与 `X-Request-Id` 一致时便于关联）。

    RouteChosen:
      type: object
      additionalProperties: true
      required: [node_id, upstream_id, access, model]
      properties:
        node_id: { type: string }
        upstream_id: { type: string }
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }

    RouteDecision:
      type: object
      additionalProperties: true
      required: [decision_id, chosen, quote_version, decided_at]
      description: |
        只追加的决策记录。相同 (`snapshot_ts`,`quote_version`,`policy_version`,`request_digest`)
        必得同一决策；**不含**评分权重、阈值与正文。
      properties:
        decision_id: { type: string }
        chosen:
          $ref: '#/components/schemas/RouteChosen'
        eta_seconds:
          type: integer
          minimum: 0
        price:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本为准）。
        quote_version: { type: string }
        policy_version: { type: string }
        snapshot_ts: { type: string, format: date-time }
        tie_break:
          type: string
          description: 固定顺序：内网亲和 → 质量系数 → node_id 字典序；不含平台收入因子。
        fallback_used: { type: boolean }
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/RouteChosen'
        eliminated:
          type: array
          description: 淘汰候选与**粗粒度淘汰码**（不含阈值）。
          items:
            type: object
            additionalProperties: true
            required: [node_id, reason_code]
            properties:
              node_id: { type: string }
              reason_code: { type: string }
        decided_at: { type: string, format: date-time }

    ReplayRequest:
      type: object
      additionalProperties: true
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        kind:
          type: string
          enum: [realtime, batch]
        decision_ids:
          type: array
          description: 可选；只复算指定决策（缺省复算窗口内全部）。
          items: { type: string }

    ReplayAccepted:
      type: object
      additionalProperties: true
      required: [job_id, state, requested_at]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        decisions_total:
          type: integer
          minimum: 0
        requested_at: { type: string, format: date-time }


    # ------------------------------------------------------------ 定价补充（M04 §4.1，AH-1）
    QuoteRequest:
      type: object
      additionalProperties: true
      required: [access, model, unit, ttl_s]
      description: 供方区间报价。区间可单边缺省（缺省端按 0 / 不设上限处理）。
      properties:
        node_id:
          type: string
          description: 可选；缺省按当前 `X-Client-Key` 对应节点。
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }
        unit:
          type: string
          description: 计量单位（与 Amount.unit 一致，如 token）。
        price_min:
          $ref: '#/components/schemas/Amount'
        price_max:
          $ref: '#/components/schemas/Amount'
        ttl_s:
          type: integer
          minimum: 1
          description: 报价有效期（秒）；到期转 `expired`，不复活。

    QuoteAck:
      type: object
      additionalProperties: true
      required: [quote_id, state, quote_version, expires_at]
      properties:
        quote_id: { type: string }
        state:
          type: string
          enum: [active, consumed, expired]
        quote_version: { type: string }
        expires_at: { type: string, format: date-time }

    BidRequest:
      type: object
      additionalProperties: true
      required: [model]
      description: 用方区间出价。未设端取 0 / 不设上限（单边比较，INV-01）。
      properties:
        model: { type: string }
        min_price:
          $ref: '#/components/schemas/Amount'
        max_price:
          $ref: '#/components/schemas/Amount'
        strategy:
          type: string
          enum: [mid, floor, ceiling]
          description: 取价策略（mid 默认 / floor 冷启动 / ceiling 供给紧张）。
        window_seconds:
          type: integer
          minimum: 1
          description: 出价有效窗口（秒）。

    BidAck:
      type: object
      additionalProperties: true
      required: [bid_id, state, expires_at]
      properties:
        bid_id: { type: string }
        state:
          type: string
          enum: [active, expired]
        expires_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 计量与收据（M05，spec 1.2.0）
    UsageRecord:
      type: object
      additionalProperties: true
      required: [usage_id, request_id, state, recorded_at]
      description: 用量明细（逐次调用）。只含元数据与金额，**不含** prompt / response 正文。
      properties:
        usage_id: { type: string }
        request_id: { type: string }
        attempt_no:
          type: integer
          minimum: 1
        node_id: { type: string }
        model: { type: string }
        access:
          type: string
          enum: [A1, A2, B]
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        amount:
          $ref: '#/components/schemas/Amount'
        usage_source:
          type: string
          enum: [client_reported, server_measured, dual, estimated]
        state:
          type: string
          enum: [recorded, settled, corrected]
        receipt_id: { type: string }
        correction_id:
          type: [string, 'null']
          description: 'state=corrected` 时指向追加的校正记录。'
        recorded_at: { type: string, format: date-time }

    UsageRecordPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        page:
          $ref: '#/components/schemas/Page'

    ReceiptStatus:
      type: object
      additionalProperties: true
      required: [receipt_id, state, received_at]
      description: 收据受理状态（节点自查）。`duplicate` 返回首次结果，不重复计量。
      properties:
        receipt_id: { type: string }
        state:
          type: string
          enum: [accepted, rejected, duplicate, expired]
        code:
          type: integer
          description: 拒绝 / 过期时的数字错误码（如 `46001` 签名不匹配）。
        message:
          type: string
          description: 只描述契约问题（签名 / 字段），不含内部细节。
        received_at: { type: string, format: date-time }
        settled_at:
          type: [string, 'null']
          format: date-time

    UpstreamBillRow:
      type: object
      additionalProperties: true
      required: [row_id, amount]
      properties:
        row_id:
          type: string
          description: 上游账单行号（幂等键的一半：(usage_id, upstream_bill_id)）。
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }
        usage_id: { type: string }
        amount:
          $ref: '#/components/schemas/Amount'

    RejectedBillRow:
      type: object
      additionalProperties: true
      required: [row_id, code, message]
      properties:
        row_id: { type: string }
        code: { type: integer }
        message: { type: string }

    UpstreamBillImportRequest:
      type: object
      additionalProperties: true
      required: [provider, period, rows]
      description: 逐行受理，单行失败不回滚整批；导入只追加，不覆盖原用量。
      properties:
        provider:
          type: string
          description: 上游供应方标识。
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
        checksum:
          type: string
          description: 账单文件校验和（用于重放检测；同名同校验和重复导入幂等）。
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/UpstreamBillRow'

    UpstreamBillImportAck:
      type: object
      additionalProperties: true
      required: [import_id, rows_accepted, rows_rejected, imported_at]
      properties:
        import_id: { type: string }
        rows_accepted:
          type: integer
          minimum: 0
        rows_rejected:
          type: integer
          minimum: 0
        total_amount:
          $ref: '#/components/schemas/Amount'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedBillRow'
        imported_at: { type: string, format: date-time }

    UsageCorrectionRequest:
      type: object
      additionalProperties: true
      required: [usage_id, delta, reason_code]
      description: |
        校正只追加（不改历史行）。校正额 ≥50 USD 时 `second_approver` 必填且 ≠ 操作人；
        负向校正（退款方向）必须人工复核。
      properties:
        usage_id: { type: string }
        upstream_bill_id: { type: string }
        delta:
          $ref: '#/components/schemas/Amount'
        reason_code: { type: string }
        evidence_ref: { type: string }
        second_approver: { type: string }

    UsageCorrectionAck:
      type: object
      additionalProperties: true
      required: [correction_id, state]
      properties:
        correction_id: { type: string }
        state:
          type: string
          enum: [proposed, applied, rejected]
        applied_at:
          type: [string, 'null']
          format: date-time

    # ------------------------------------------------------------ 账本管理面（M06，spec 1.2.0）
    TrialBalanceLine:
      type: object
      additionalProperties: true
      required: [coa_code, debit, credit]
      properties:
        coa_code: { type: string }
        name: { type: string }
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        debit:
          $ref: '#/components/schemas/Amount'
        credit:
          $ref: '#/components/schemas/Amount'
        balance:
          $ref: '#/components/schemas/Amount'

    TrialBalance:
      type: object
      additionalProperties: true
      required: [as_of, unit_type, balanced, totals, accounts]
      description: 试算平衡。`balanced=false` 即 P0，账本转只读且**不自动修数据**。
      properties:
        as_of: { type: string, format: date-time }
        unit_type:
          type: string
          description: 币种维度；COP 与 USD 不互转，借贷平衡只在本 unit_type 内判定。
        balanced: { type: boolean }
        totals:
          type: object
          additionalProperties: true
          required: [debit, credit]
          properties:
            debit:
              $ref: '#/components/schemas/Amount'
            credit:
              $ref: '#/components/schemas/Amount'
        tail_diff:
          $ref: '#/components/schemas/Amount'
        entry_count:
          type: integer
          minimum: 0
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceLine'

    LedgerAccount:
      type: object
      additionalProperties: true
      required: [coa_code, unit_type, balance]
      description: 科目与派生余额（`account_balances` 为唯一余额源，可由分录全量重建）。
      properties:
        coa_code: { type: string }
        name: { type: string }
        unit_type: { type: string }
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        balance:
          $ref: '#/components/schemas/Amount'
        updated_at: { type: string, format: date-time }

    LedgerAccountPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        page:
          $ref: '#/components/schemas/Page'

    MerkleCommitment:
      type: object
      additionalProperties: true
      required: [period, kind, root, entry_count, published_at]
      description: 期间根。可由当期分录重算复现；发布后不可改（INV-13）。
      properties:
        period:
          type: string
          description: 锚定周期；日 `YYYY-MM-DD` 或小时 `YYYY-MM-DDTHH`。
        kind:
          type: string
          enum: [journal, daily_close]
          description: M06 负责 journal / daily_close 两类根；audit / por 根归 M16 / M09。
        root:
          type: string
          description: Merkle 根（十六进制）。
        entry_count:
          type: integer
          minimum: 0
        published_at: { type: string, format: date-time }
        reproducible:
          type: boolean
          description: 重算一致为 true；false 表示存在差异（P0，转只读）。
        verify_hint:
          type: string
          description: 重算所需的只读入口提示（不返回内部算法参数）。

    RecomputeRequest:
      type: object
      additionalProperties: true
      description: 全量复算入参。复算只读，不修数据；`dry_run` 默认 true。
      properties:
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2}(T[0-9]{2})?)?$'
          description: 可选；缺省复算全部期间。
        scope:
          type: string
          enum: [period, all]
          default: all
        dry_run:
          type: boolean
          default: true
          description: 为 false 时发布校验结果（仍不修数据）。

    RecomputeAck:
      type: object
      additionalProperties: true
      required: [job_id, state, requested_at]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        dry_run: { type: boolean }
        diff_count:
          type: integer
          minimum: 0
          description: 差异条数；≠0 即 P0，冻结账本写入口。
        verified: { type: boolean }
        requested_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 账本凭证与冲正（M06 §4.1，AH-1）
    JournalLine:
      type: object
      additionalProperties: true
      required: [line_no, coa_code, dc, amount]
      properties:
        line_no:
          type: integer
          minimum: 1
        ledger_entry_id: { type: string }
        account_id: { type: string }
        coa_code:
          type: string
          description: 科目代码（42 条白名单内；未知科目读路径报错，不静默跳过）。
        dc:
          type: string
          enum: [debit, credit]
          description: 借贷方向（库内 `D` / `C`，对外统一为 debit / credit）。
        amount:
          $ref: '#/components/schemas/Amount'
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        wallet_id: { type: string }

    JournalVoucher:
      type: object
      additionalProperties: true
      required: [journal_id, ts, state, lines]
      description: 凭证（一次资金事件的凭证）。只有 posted / voided 两种状态，禁止覆盖写。
      properties:
        journal_id: { type: string }
        ts: { type: string, format: date-time }
        unit_type:
          type: string
          description: 币种维度；借贷平衡只在本 unit_type 内判定。
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_id: { type: string }
        event_seq:
          type: integer
          minimum: 1
        policy_version: { type: string }
        fx_rate_ref: { type: string }
        reversal_of_journal:
          type: [string, 'null']
          description: 冲正指向的原凭证；非冲正为 null。
        reverse_chain:
          type: array
          description: 冲正链（按时间顺序的 journal_id）。
          items: { type: string }
        hash: { type: string }
        state:
          type: string
          enum: [posted, voided]
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'

    ReversalRequest:
      type: object
      additionalProperties: true
      required: [journal_id, reason, second_approver]
      properties:
        journal_id:
          type: string
          description: 待冲正的原凭证；每张原凭证至多一条冲正。
        reason:
          type: string
          maxLength: 500
        evidence_ref: { type: string }
        second_approver:
          type: string
          description: 复核人（≠ 操作人）；缺失或不一致 → 409 + `40902`。

    ReversalAck:
      type: object
      additionalProperties: true
      required: [reversal_id, journal_id, state, created_at]
      properties:
        reversal_id:
          type: string
          description: 冲正凭证 `journal_id`（新凭证，不改原凭证）。
        journal_id:
          type: string
          description: 原凭证 `journal_id`。
        state:
          type: string
          enum: [pending_approval, posted, rejected]
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 配置中心补充（M10，spec 1.2.0）
    ConfigNamespace:
      type: object
      additionalProperties: true
      required: [namespace, item_count]
      properties:
        namespace:
          type: string
          description: 配置命名空间（十域注册见 03-facts §9）。
        item_count:
          type: integer
          minimum: 0
        prefixes:
          type: array
          items: { type: string }
        consumers:
          type: array
          items: { type: string }
        dangerous_keys:
          type: array
          description: 不可经 API 修改的危险键（危险键禁改，403 + `47004`）。
          items: { type: string }

    ConfigNamespaceList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigNamespace'
        page:
          $ref: '#/components/schemas/Page'

    ConfigDiffChange:
      type: object
      additionalProperties: true
      required: [path, before, after]
      properties:
        path:
          type: string
          description: 变更位置（JSON Pointer）。
        before:
          description: 旧值；敏感项为掩码。
        after:
          description: 新值；敏感项为掩码。
        masked:
          type: boolean
          default: false
          description: 为 true 时 before / after 已脱敏，**永不**返回明文。

    ConfigDiff:
      type: object
      additionalProperties: true
      required: [key, from_version, to_version, changes]
      properties:
        key: { type: string }
        scope: { type: string }
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDiffChange'
        digest_before: { type: string }
        digest_after: { type: string }

    ConfigImpact:
      type: object
      additionalProperties: true
      required: [key, risk_level, consumers, affected_modules]
      description: 发布前影响面（发布单前置输入，不改变运行值）。
      properties:
        key: { type: string }
        scope: { type: string }
        risk_level:
          type: string
          enum: [P0, P1, P2]
        consumers:
          type: array
          items: { type: string }
        affected_modules:
          type: array
          items: { type: string }
        requires_restart:
          type: boolean
          description: 为 true 时需消费方重启或重新加载才生效。
        effective_on:
          type: string
          enum: [immediate, next_anchor, next_restart]
        gray_buckets:
          type: array
          description: 灰度桶序列（1 → 5 → 25 → 100）；P0 不得跳过观测窗。
          items:
            type: integer
            minimum: 1
            maximum: 100
        notes:
          type: string

