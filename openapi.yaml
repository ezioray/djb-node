  /api/v1/user/nodes/{node_id}/proxy-authorization:
    get:
      tags:
      - user
      operationId: getProxyAuthorization
      summary: 我的节点代理授权状态（默认关闭）
      description: '读取当前账户对 `node_id` 的共享代理授权事实：`proxy_serve` 开关 + 模型对白名单。

        **默认关闭**：无授权记录时返回 `proxy_serve=false`、`model_pairs=[]`、`revision=0`、

        `revoked_at=null`、`active=false`（200，不是 404）。

        账户归属只读 M02 供给节点快照（`v_supply_node_snapshot`）；节点不属于本账户或不存在

        统一 **404 + `40401`**（不泄露存在性）。`revision` 每次成功写入（PUT / DELETE）递增 1，

        客户端据此判断是否有新变更。

        响应不含凭据、上游地址、请求正文或价格。鉴权未接线 fail-closed → 401 + `40101`。

        '
      security:
      - userBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 授权状态（未授权时为默认值，不是 404）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyAuthorizationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务端失败；不返回凭据或内部异常详情（沿用 identity 错误信封，`50001`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - user
      operationId: putProxyAuthorization
      summary: 设置我的节点代理授权（默认关闭；开启/修改需 step-up）
      description: '写入（upsert，单节点单行）当前账户对 `node_id` 的代理授权。`proxy_serve` 必填布尔；

        `model_pairs` 为 `execution_model → lead_model` 二元组白名单，缺省按空数组处理

        （**等价于清空白名单**）；服务端去重并按 `execution_model, lead_model` 稳定排序，

        单字段 ≤128 字符（超长/空 → 400 + `40001`）。

        `proxy_serve=true` 需 **step-up**；`proxy_serve=false`（立即停）不需要。

        步进认证缺失的口径：当前实现返回 **403 + `40301`**，平台登记口径为 424 + `42401`

        （`StepUpRequired`），客户端必须同时处理两种。

        账户归属只读 M02 供给节点快照；越权或节点不存在统一 **404 + `40401`**。

        每次成功写入 `revision` 递增 1：同一载荷重复 PUT 不产生重复授权行、最终状态一致，

        但 `revision` 会变（**不是严格幂等**，客户端以返回值为准）；写入同时清空 `revoked_at`。

        变更写 `node_events`（`kind=proxy_authorization`），payload 只含 action / 布尔 /

        模型对 / revision，不含凭据、正文或价格。

        '
      security:
      - userBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Admin-Step-Up
        in: header
        required: false
        description: '二次认证凭据（M01 step-up grant，或已 step-up 的有效会话；≤5 分钟有效）。

          `proxy_serve=true` 时必需；`proxy_serve=false` 时忽略。

          '
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyAuthorizationUpdate'
      responses:
        '200':
          description: 写入后的授权状态（含递增后的 `revision`）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyAuthorizationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '424':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务端失败；不返回凭据或内部异常详情（沿用 identity 错误信封，`50001`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/nodes/{node_id}/proxy-authorization/{scope}:
    delete:
      tags:
      - user
      operationId: deleteProxyAuthorization
      summary: 单项撤销代理授权（立即生效；不需要 step-up）
      description: '按 `scope` 单项撤销，用于立即停止服务，**不需要 step-up**：

        - `scope=proxy_serve`：关闭开关、清空白名单并写 `revoked_at`；

        - `scope=proxy_model_pairs`：只清空白名单，`proxy_serve` 保持不变。

        撤销后 `revision` 递增 1，授权行保留（不删除历史，用于审计追溯）。

        未授权时调用返回 200 + 当前/默认状态（`proxy_serve=false`、`revision` 为 0 或现值），

        不创建新行、不报 404。`scope` 非法 → 400 + `40001`；越权或节点不存在统一 404 + `40401`。

        '
      security:
      - userBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - name: scope
        in: path
        required: true
        description: 撤销范围；`proxy_serve` 同时清空白名单。
        schema:
          type: string
          enum:
          - proxy_serve
          - proxy_model_pairs
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 撤销后的授权状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyAuthorizationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务端失败；不返回凭据或内部异常详情（沿用 identity 错误信封，`50001`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/user/billing/export:
    get:
      tags:
      - user
      operationId: exportUserBilling
      summary: 导出我的账单（流式 CSV / JSON；Content-Disposition + TTL）
      description: '流式账单导出，只含当前账户有权数据；不含 prompt / response 正文、凭据与 PII 正文。

        `format=csv` 返回 `text/csv`（UTF-8 含表头），`format=json` 返回 `application/json`

        （JSON 数组或 NDJSON 流，按实现；客户端按行 / 数组解析均应容忍）。

        文件名走 `Content-Disposition: attachment`；流 / 下载凭据有效期由

        `X-DJB-Export-Expires-At` 给出（TTL，≤15 分钟，过期需重新申请）。

        服务端不落导出正文；导出本身进审计。时间窗过大请拆分（超限 → 400 + `40001`）。

        '
      security:
      - userBearer: []
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - json
          default: csv
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 流式账单（CSV / JSON；错误仍为 JSON 错误信封）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              description: '`attachment; filename="billing-<period>.<csv|json>"`；不暴露内部路径。'
              schema:
                type: string
            X-DJB-Export-Expires-At:
              description: 流 / 下载凭据过期时间（RFC 3339 UTC，TTL ≤15 分钟）；过期需重新申请。
              schema:
                type: string
                format: date-time
          content:
            text/csv:
              schema:
                type: string
                description: CSV 文本流（UTF-8，含表头）。
            application/json:
              schema:
                type: string
                description: JSON 数组或 NDJSON 流（UTF-8）；元素结构按账单口径。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/nodes/{node_id}/upstreams:
    get:
      tags:
      - node
      summary: 我的节点的上游接入（请求链接 / 协议 / 模型）
      description: '用户态只读：网页端据此显示「请求链接配在哪、协议是哪种」。


        凭据**不下发**（只回 ``credential_registered`` 布尔），密钥始终只在客户端本机。'
      operationId: listUserNodeUpstreams
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  type: object
                  additionalProperties: true
                type:
                  type: object
                  additionalProperties: true
                title:
                  type: object
                  additionalProperties: true
    post:
      tags:
      - node
      summary: 登记我的节点的上游接入（需 step-up）
      description: '用户态登记上游：``access_type`` / ``base_url``（请求链接）/ ``models`` /

        ``protocol``（``openai-chat`` 或 ``anthropic-messages``）/ ``upstream_kind``。


        **不接受上游密钥**：凭据由客户端本机 0600 文件持有，这里只登记引用

        （``credential_handle``）。登记含出网地址，属敏感操作 → 需 step-up。'
      operationId: declareUserNodeUpstream
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  type: object
                  additionalProperties: true
                type:
                  type: object
                  additionalProperties: true
                title:
                  type: object
                  additionalProperties: true
  /api/v1/node/token-route:
    post:
      operationId: declareNodeTokenRoute
      summary: 申报本节点的 token-route 声明（严格校验）
      description: '幂等写入：内容相同 → 200（不刷新 revision、不失效授权）；内容变化 → 201 且

        **授权自动失效**（``authorization_reset=true``），需重新授权。

        '
      tags:
      - Node
      - TokenRoute
      security:
      - nodeKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_route
              properties:
                node_id:
                  type: string
                  description: 可省略；给了就必须等于本凭据的节点 id，否则 404。
                token_route:
                  $ref: '#/components/schemas/TokenRouteDeclaration'
      responses:
        '200':
          description: 声明未变化（幂等重报）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '201':
          description: 声明已建立或内容更新（授权失效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '400':
          $ref: '#/components/responses/TokenRouteInvalid'
        '401':
          $ref: '#/components/responses/TokenRouteUnauthenticated'
        '404':
          $ref: '#/components/responses/TokenRouteNodeNotFound'
    get:
      operationId: getNodeTokenRoute
      summary: 读本节点的 token-route 声明与生效状态（诊断）
      description: '``token_route_authorized`` 是「已授权 **且** 开关开」的合取结果；

        未授权或开关关时恒为 false，``annotation`` 为 null。

        '
      tags:
      - Node
      - TokenRoute
      security:
      - nodeKey: []
      parameters:
      - name: node_id
        in: query
        required: false
        schema:
          type: string
        description: 可省略；给了就必须等于本凭据的节点 id，否则 404。
      responses:
        '200':
          description: 当前声明与生效状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '401':
          $ref: '#/components/responses/TokenRouteUnauthenticated'
        '404':
          $ref: '#/components/responses/TokenRouteNodeNotFound'
    delete:
      operationId: withdrawNodeTokenRoute
      summary: 撤回本节点的 token-route 声明（连带授权失效）
      description: '删除声明行并留痕 ``token_route_withdrawn``。**授权随之消失**——否则节点本地清空后

        服务端仍留着一份已授权声明，「清空」就成了假清空。重复撤回归 200 + ``withdrawn=false``。

        '
      tags:
      - Node
      - TokenRoute
      security:
      - nodeKey: []
      parameters:
      - name: node_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 已撤回（或本来就没有）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '401':
          $ref: '#/components/responses/TokenRouteUnauthenticated'
        '404':
          $ref: '#/components/responses/TokenRouteNodeNotFound'
  /api/v1/admin/nodes/{node_id}/token-route:
    get:
      operationId: getAdminNodeTokenRoute
      summary: 后台读节点 token-route 声明与生效状态
      description: 只读；不需要 scope（有后台角色 + step-up 即可），用于授权前后对比。
      tags:
      - Admin
      - TokenRoute
      security:
      - adminBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 声明与生效状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '401':
          $ref: '#/components/responses/TokenRouteUnauthenticated'
        '404':
          $ref: '#/components/responses/TokenRouteNodeNotFound'
        '424':
          $ref: '#/components/responses/TokenRouteStepUpRequired'
  /api/v1/admin/nodes/{node_id}/token-route/authorize:
    post:
      operationId: authorizeNodeTokenRoute
      summary: 授权 / 撤销节点的 token-route 声明
      description: '只写授权列，**不改声明**（声明是节点的事实）。无声明时授权 → 404（不预建空壳行）。


        `authorization_effective` 明确回答「授权后是否真生效」：开关关着时为 false。

        '
      tags:
      - Admin
      - TokenRoute
      security:
      - adminBearer: []
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Admin-Step-Up
        in: header
        required: true
        schema:
          type: string
        description: M01 step-up 凭据（或 5 分钟内已完成 step-up 的会话）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - authorized
              additionalProperties: false
              properties:
                authorized:
                  type: boolean
                note:
                  type: string
                  maxLength: 500
                  description: 备注（进留痕；不要写凭据）。
      responses:
        '200':
          description: 决策已生效（授权或撤销）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRouteView'
        '400':
          $ref: '#/components/responses/TokenRouteInvalid'
        '401':
          $ref: '#/components/responses/TokenRouteUnauthenticated'
        '403':
          $ref: '#/components/responses/TokenRouteForbidden'
        '404':
          $ref: '#/components/responses/TokenRouteNodeNotFound'
        '424':
          $ref: '#/components/responses/TokenRouteStepUpRequired'
  /api/v1/client/releases:
    get:
      tags:
      - client-release
      summary: 客户端版本清单（公开读；fail-closed）
      description: '门户下载页与客户端自更新读取的发布清单。**公开读、无需鉴权**（只回版本 / 下载地址 / 校验值）。

        清单由发布方生成（服务端环境变量 `DJB_CLIENT_MANIFEST_FILE`），服务端只读，不生成安装包、不验签真伪——

        `signature_status` 是发布方写进清单的事实（`unsigned-test` / `signed` / `notarized`）。

        失败一律 **fail-closed 503**（宁可不给下载，也不给"看起来能下"的空清单）：

        `release_manifest_unconfigured`（未配置）/ `release_manifest_missing`（文件不存在）/

        `release_manifest_invalid`（JSON 坏了、结构不合格、sha256 非 64 位 hex）。

        '
      operationId: getClientReleases
      security: []
      responses:
        '200':
          description: 清单读取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientReleaseManifest'
        '503':
          description: fail-closed——清单未配置 / 缺失 / 不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/treasury/wallet-drafts:
    get:
      tags:
      - admin
      - treasury
      summary: 多签钱包草稿列表（flag wallet_draft，默认关）
      description: '多签钱包（multisig）建房稿流程的列表。**开关 `wallet_draft` 默认关**：关闭时整组端点返回 `403`。

        响应体形状由 `app/chain/wallet_store.py` 决定，本契约只锁路径/方法/鉴权与错误码，不锁定内部字段

        （`x-djb-visibility: internal`：不面向第三方 SDK 生成）。

        '
      operationId: listWalletDrafts
      x-djb-visibility: internal
      responses:
        '200':
          description: 草稿列表
          content:
            application/json:
              schema:
                type: object
        '403':
          description: 开关 `wallet_draft` 关闭，或多签后台未启用
    post:
      tags:
      - admin
      - treasury
      summary: 建多签钱包草稿（返回每个 owner 要签的 EIP-712 摘要）
      description: '**只回摘要，不收回签名**：服务端为每个 owner 生成待签摘要，owner 在各自钱包里签，

        再通过 `attestations` 端点只提交 `signature_hash`。开关 `wallet_draft` 关闭时 `403`。

        '
      operationId: createWalletDraft
      x-djb-visibility: internal
      responses:
        '200':
          description: 草稿已建（含各 owner 待签摘要）
          content:
            application/json:
              schema:
                type: object
        '403':
          description: 开关 `wallet_draft` 关闭，或鉴权/step-up 不足
  /api/v1/admin/treasury/wallet-drafts/{draft_id}:
    get:
      tags:
      - admin
      - treasury
      summary: 草稿详情 + 证明收集进度
      operationId: getWalletDraft
      x-djb-visibility: internal
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 草稿详情与已收集的 owner 证明数
          content:
            application/json:
              schema:
                type: object
        '404':
          description: 草稿不存在
  /api/v1/admin/treasury/wallet-drafts/{draft_id}/attestations:
    post:
      tags:
      - admin
      - treasury
      summary: 登记 owner 证明（只收 signature_hash）
      description: '**只收 `signature_hash`**，不收签名字节、不收私钥。服务端据此推进 `signed` 计数；

        凑不齐阈值不得进 `deploy`（对应 INV-02 / INV-10 的口径）。

        '
      operationId: addWalletOwnerAttestation
      x-djb-visibility: internal
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 证明已登记（返回当前进度）
          content:
            application/json:
              schema:
                type: object
        '409':
          description: '该 owner 已登记 / 草稿状态不允许追加。`reason` 取值：`illegal_state`（当前状态

            不接收证明）、`illegal_transition`（状态机不允许的迁移）、

            `concurrent_state_change`（并发改走状态，需重读）、`draft_expired`（草稿已过期）。

            '
  /api/v1/admin/treasury/wallet-drafts/{draft_id}/deploy:
    post:
      tags:
      - admin
      - treasury
      summary: 登记部署交易（不代签、不广播）
      operationId: markWalletDraftDeployed
      x-djb-visibility: internal
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 部署交易已登记
          content:
            application/json:
              schema:
                type: object
        '409':
          description: '签名数不足 / 状态不允许。`reason` 取值：`illegal_state`（当前状态不允许部署）、

            `illegal_transition`（状态机不允许的迁移）、`concurrent_state_change`（并发改走状态）、

            `attestation_incomplete`（证明不够数或必签槽位未签）、`attempts_exhausted`（重播达上限）。

            '
  /api/v1/admin/treasury/wallet-drafts/{draft_id}/verify:
    post:
      tags:
      - admin
      - treasury
      summary: V1–V8 回读校验（全绿才 active）
      description: '链上回读校验：V1–V8 全部通过才置 `active`；任一不过则保持非 active 并回逐项失败原因。

        真链执行未实现时返回 `409` + `chain_execution_unavailable`（不是 `500`）。

        '
      operationId: verifyWalletDraft
      x-djb-visibility: internal
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 校验结果（V1–V8 逐项）
          content:
            application/json:
              schema:
                type: object
        '409':
          description: '校验未全绿 / 真链执行不可用 / 状态不允许回读。错误信封的 `reason` 取值：

            `illegal_state`、`illegal_transition`、`concurrent_state_change`。

            '
  /api/v1/admin/treasury/multisig-wallets:
    get:
      tags:
