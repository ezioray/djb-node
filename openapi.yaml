        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ----------------------------------------------------------------------
  # M17 可验证随机抽检（C14b，spec 1.2.14）
  # commit-reveal + 贡献量加权；seed 只在 open 响应出现一次
  # ----------------------------------------------------------------------
  /api/v1/admin/supply/integrity/sampling/epochs:
    post:
      tags: [admin]
      summary: 开启抽检轮次（先承诺 seed，seed 仅此一次返回）
      operationId: openSamplingEpoch
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingEpochOpenRequest' }
      responses:
        '201':
          description: 已承诺（seed 只返回一次，库内只有 sha256）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingEpochOpenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [admin]
      summary: 抽检轮次列表
      operationId: listSamplingEpochs
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [committed, revealed, expired] }
      responses:
        '200':
          description: 轮次列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingEpochList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/supply/integrity/sampling/epochs/{id}:
    get:
      tags: [admin]
      summary: 轮次详情（含 draws）
      operationId: getSamplingEpoch
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 轮次详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingEpochDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/supply/integrity/sampling/epochs/{id}/reveal:
    post:
      tags: [admin]
      summary: 揭晓 seed 并生成 draws（幂等重放）
      operationId: revealSamplingEpoch
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingRevealRequest' }
      responses:
        '200':
          description: 已揭晓并抽签
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingRevealResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/supply/integrity/sampling/draws/{id}/result:
    post:
      tags: [admin]
      summary: 回填抽检结果（复用 C12 证据；L3→passed）
      operationId: recordSamplingResult
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingResultRequest' }
      responses:
        '200':
          description: 已回填
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/supply/integrity/sampling/verify:
    post:
      tags: [admin]
      summary: 复算轮次（同 seed 重算一致）
      operationId: verifySamplingEpoch
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingVerifyRequest' }
      responses:
        '200':
          description: 复算结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

