        vocab_ok:
          type: boolean
          description: '词表指纹标定结论（加性可选，M17 §8.4）。`false` → 上游判 `rejected`，

            `rejected_reason_code=vocab_mismatch`，该上游退出调度候选（自动切到其他供应方）。

            省略 = 未标定，按原口径处理（不因缺省拒绝）。

            '
