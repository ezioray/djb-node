          description: 长轮询最长等待秒数（1–30，默认 25）；到点无任务返回 `204`。
        capabilities:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
          description: 本节点可承接的能力标识（可选）；未知值**忽略不报错**，只按双方交集派单。
    NodeChannelJob:
      type: object
      additionalProperties: true
      required:
      - job_id
      - kind
      - request_id
      - request
      - lease_expires_at
      description: '通道派发的单个任务。**不含任何凭据 / 上游端点**（H1 口径不变）；

        `request` 是待转发的请求正文，只在内存与响应体过一手，不进库 / 不进日志 / 不进事件。

        **`model` / `messages` 不在 job 顶层**，统一放在 `request` 内（与客户端 `parse_job` 对齐）。

        '
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - chat.completions
        request_id:
          type: string
          description: 平台请求标识（贯穿网关 / 调度 / 收据）。
        request:
          type: object
          additionalProperties: true
          required:
          - model
          - messages
          properties:
            model:
              type: string
            messages:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true
                required:
                - role
                - content
                properties:
                  role:
                    type: string
                    enum:
                    - system
                    - user
                    - assistant
                  content:
                    type: string
            max_tokens:
              type: integer
              minimum: 1
            temperature:
              type: number
              minimum: 0
              maximum: 2
            stop:
              type: array
              items:
                type: string
            tools:
              type: array
              description: 工具定义（OpenAI tools 形态）；客户端负责按上游协议转换。
              items:
                type: object
                additionalProperties: true
            tool_choice:
              description: 工具选择（字符串或对象，OpenAI 形态）。
              oneOf:
              - type: string
              - type: object
                additionalProperties: true
            response_format:
              type: object
              additionalProperties: true
              description: 输出格式（如 {"type":"json_object"}）。
            top_p:
              type: number
              minimum: 0
              maximum: 1
            seed:
              type: integer
              description: 随机种子（尽力而为，不承诺跨上游可复现）。
            frequency_penalty:
              type: number
              minimum: -2
              maximum: 2
            presence_penalty:
              type: number
              minimum: -2
              maximum: 2
        timeout_s:
          type: number
          minimum: 1
          description: 平台侧请求总超时（秒，可选）；缺省由客户端按自身策略。
        lease_expires_at:
          type: string
          format: date-time
          description: 租约到期时刻；到期未回传由通道层重派（≤2 次）。
    NodeChannelPollResponse:
