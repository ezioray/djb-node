        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/model-sync/bundles/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚到上一 published（发布副本，不改历史）
