          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: 统计
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanaryStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/supply/integrity/canary/expire:
    post:
      tags: [admin]
      summary: 把超期 issued 翻 missed（运维）
      operationId: expireCanaryRuns
      security:
        - adminBearer: []
