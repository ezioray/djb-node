  /api/v1/admin/notifications/node:
    post:
      tags: [admin]
      summary: 入队一条节点通知（运营/测试）
      operationId: enqueueNodeNotification
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNotificationEnqueueRequest' }
      responses:
        '201':
          description: 已入队（dedupe 命中返回已有）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeNotificationAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [admin]
      summary: 节点通知列表/投递状态（排障）
      operationId: listNodeNotificationsAdmin
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - name: node_id
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 通知列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeNotificationAdminList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------------
  # M18 模型/tokenizer 同步（C17，spec 1.2.12）
  # 只分发元数据/指纹，不分发厂商 tokenizer 权重
  # ----------------------------------------------------------------------
  /api/v1/node/model-catalog:
    get:
