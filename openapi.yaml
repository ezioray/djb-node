      tags:
      - user
      summary: 获取登录防撞库验证码（自绘 SVG）
      operationId: createAuthCaptcha
      description: '公开端点（登录前可调，`security: []`）。签发一次性验证码：4 位、大小写不敏感、

        TTL 300 秒、单张最多校验 5 次（第 5 次失败即作废）。答案**只以** sha256(salt:answer)

        落库，响应与日志都不含明文。图片为服务端自绘 SVG（无 `<text>` 节点，不受字体影响）。

        `Cache-Control: no-store` 必须由客户端/网关原样透传（一次性凭证不得进任何缓存）。

        开关 `identity.captcha` 关闭时整条端点 404（`40401 captcha_disabled`），

        客户端应按「该端点不存在」处理（降级为不带验证码的登录）。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 签发成功（`expires_in` 固定 300 秒）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: '固定 `no-store`（同时给 `Pragma: no-cache`）'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login/email-otp/request:
    post:
      tags:
      - identity
      summary: 邮箱验证码登录：第一步（发码；可信设备可免码直登）
      operationId: requestEmailOtpLogin
      description: '公开端点（登录前可调，`security: []`）。响应文案**不区分**邮箱是否已注册（防枚举），

        因此 202 只表示「已受理」，不代表账号存在。已注册邮箱签发一次性 6 位码（TTL 600 秒，

        连错 5 次即作废）；SMTP 投递在事务外、线程池内执行，不阻塞事件循环。

        命中**未过期可信设备**且账号存在时：不发码，直接 200 返回会话（`trusted=true`、

        `skip_otp=true`）。`Cache-Control: no-store` 必须由客户端/网关原样透传。

        反作弊（频控/黑名单）只表现为 429 + `Retry-After`，不写阈值。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpLoginRequest'
      responses:
        '200':
          description: 可信设备命中，免码直接签发会话
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: '固定 `no-store`（同时给 `Pragma: no-cache`）'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailOtpLoginSession'
        '202':
          description: 已受理（不论邮箱是否存在，文案一致）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailOtpLoginAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login/email-otp/verify:
    post:
      tags:
      - identity
      summary: 邮箱验证码登录：第二步（校验并签发会话）
      operationId: verifyEmailOtpLogin
      description: '校验一次性验证码并签发会话。失败不区分「码错 / 已过期 / 已作废」；

        连续失败达上限后该码作废（重新发码）。成功后按需登记/续期可信设备，

        `device_id`/`device_expires_at` 回传该设备状态（开关关闭时为 `null`）。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOtpLoginVerifyRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: 固定 `no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailOtpLoginSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/register/request:
    post:
      tags:
      - identity-registration
      summary: 自助注册：第一步（校验口令并发送邮箱验证码）
      operationId: requestUserRegistration
      description: '开关 `identity.self_registration` 默认关（404）。口令先校验；已注册邮箱 409；

        新邮箱发 6 位码（10 分钟有效，限流 3/10 分钟）。响应不区分后续失败细节。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/register/confirm:
    post:
      tags:
      - identity-registration
      summary: 自助注册：第二步（校验验证码、建号并签发会话）
      operationId: confirmUserRegistration
      description: '验证码错误/过期 400；连错 5 次作废。成功建 users + personal account（邮箱已验证），

        直接签发与登录同构的令牌，并可选记录受信设备。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationConfirmRequest'
      responses:
        '201':
          description: 注册成功并签发会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/security/reminders:
    get:
      tags:
      - identity-registration
      summary: 安全提醒（可关闭、不阻塞；TOTP 为可选二因子）
      operationId: listUserSecurityReminders
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 提醒项（不阻塞任何操作）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReminders'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/step-up:
    post:
      tags:
      - user
      summary: 已登录用户会话二次认证（非登录续接）
      operationId: createAuthStepUp
      description: '仅接受有效的已登录 user 会话 Bearer；先认证，拒绝 API Key、admin、mfa_pending

        与 step_up 类型令牌。本接口不是 MFA pending 登录续接，也不签发登录或刷新令牌。

        每次请求均验证账户已配置的 MFA 因子；不缓存、不提供幂等响应回放，客户端不得自动重试。

        返回独立的短期 step_up grant，同时沿用既有服务在源会话上标记二次认证窗口的行为。

        grant 有效期不超过 300 秒，不能作为本接口的源会话继续签发；业务权限仍由目标接口校验。

        MFA 未启用沿用现行 IdentityError：409 / 40902（reason=mfa_not_enabled）；

        凭据错误为 401 / 40110，失效或不支持的会话为 401 / 40102，失败锁定为 429 / 42901。

        所有响应均带 Cache-Control: no-store；请求因子与响应令牌不得记录到日志、事件或幂等表。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: 二次认证成功（仅短期 grant，不含 refresh 或密码）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: 服务端失败；不返回凭据或内部异常详情（沿用 identity 错误信封）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - user
      summary: 完成 MFA（mfa_pending 半认证令牌 → 正式会话）
      operationId: verifyAuthMfa
      description: '`mfa_pending` 是「口令 / 邮箱验证码已通过、第二因子未验」的 5 分钟半认证令牌

        （登录返回 `mfa_required=true` 时给出，不能访问业务端点）。此前没有任何端点能把它换成

        正式会话，登录只能反复拿到新的 pending —— 本接口补上这一步。

        请求体与 `POST /api/v1/auth/step-up` 同形，`mfa_code` 为账户已配置的因子（PIN 或 TOTP 动态码）。

        成功后签发与登录同构的令牌对（`AuthTokens`），并**撤销**该半认证会话（不叠加两条可用令牌）。

        非 `mfa_pending` 会话调用 → 401 / 40102（reason=mfa_not_pending），不重复签发令牌；

        因子错误 → 401 / 40110（reason=invalid_mfa_code），与 step-up 同码同文案，不泄漏因子类型。

        不做幂等回放：每次都必须重新验一次因子。所有响应带 Cache-Control: no-store；

        请求因子与响应令牌不得记录到日志、事件或幂等表。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: MFA 完成，返回正式会话令牌对
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags:
      - user
      summary: 刷新令牌（轮换）
      operationId: refreshAuthSession
      description: '刷新即轮换：旧 `refresh_token` 立即失效，返回新的令牌对。重放已轮换的令牌

        按 `40103`（令牌已撤销）处理，并要求重新登录。刷新不延长绝对过期时间。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新令牌对
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
      - user
      summary: 退出（撤销会话）
      operationId: revokeAuthSession
      description: '撤销当前会话；`all_devices=true` 时撤销该账号全部会话（`session_epoch++`，

        旧令牌立即失效）。幂等：重复退出返回首次结果，不报错。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 已撤销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/trusted-devices:
    get:
      tags:
      - identity
      summary: 本人的可信设备（可免邮箱验证码的设备）
      operationId: listUserTrustedDevices
      description: '只列**有效**设备（未撤销且未过期），按最近活跃倒序。库里只存 IP/UA 的不可逆哈希，

        因此 `ip_masked`/`ua_family` 返回的是 `hash:<前 8 位>…` 形式的不可再识别前缀——

        这是隐私换来的代价，不是数据错误。`Cache-Control: no-store`。

        '
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 设备列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - identity
      summary: 撤销全部可信设备（退出所有设备）
      operationId: revokeAllUserTrustedDevices
      description: '撤销本人全部有效设备，返回撤销条数。**不需要** step-up：收紧权限不加摩擦。

        别人的设备、不存在的设备、已撤销的设备一律 404（不泄漏"有没有这台"）。

        '
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已全部撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDevicesRevokedAll'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/user/trusted-devices/{device_id}:
    delete:
      tags:
      - identity
      summary: 撤销单台可信设备
      operationId: revokeUserTrustedDevice
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDeviceRevoked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/user/profile:
    get:
      tags:
      - user
      summary: 账户与租户视图（脱敏）
      operationId: getUserProfile
      description: '返回脱敏后的账户与租户视图：只给 `email_hash` 派生的展示掩码，不回传

        原始邮箱 / 手机号 / 硬件信息。`balance` 是 M06 `account_balances` 的

        **只读镜像**，结算与对账一律以账本分录为准。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 账户视图
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - user
      summary: 修改昵称与语言（局部更新）
      operationId: updateUserProfile
      description: '只允许修改展示类字段（`display_name` / `locale`）。未出现的字段保持原值；

        身份字段（`account_id` / `tenant_id` / `state`）不可经此端点修改。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdateRequest'
      responses:
        '200':
          description: 更新后的账户视图
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/api-keys:
    get:
      tags:
      - user
      summary: 列举 API Key（只回前缀）
      operationId: listApiKeys
      description: '只返回 8 位前缀与元数据，**永不回传明文或哈希**。撤销后的 Key 默认不返回，

        `include_revoked=true` 时可查（保留 24 个月）。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Key 分页
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - user
      summary: 创建 API Key（明文只回一次）
      operationId: createApiKey
      description: '明文只在本次响应出现一次，平台只存 `sha256(key)` 与前缀。`frozen` / `closed`

        账户禁止建 Key（403 + `40304`）。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: Key 已创建（`key` 仅此一次可见）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/api-keys/{id}:
    delete:
      tags:
      - user
      summary: 撤销 API Key（幂等）
      operationId: revokeApiKey
      description: '撤销后立即失效；重复撤销返回首次结果（不报 5xx）。跨租户访问一律 404（防枚举）。

        '
      security:
      - userBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 撤销结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
