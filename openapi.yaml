          - string
          - 'null'
          description: 失败原因码（通道无关的粗粒度码；不含通道原文）。
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    PaymentOrderDetail:
      type: object
      additionalProperties: true
      required:
      - order
      properties:
        order:
          $ref: '#/components/schemas/PaymentOrder'
        original_route_masked:
          type:
          - string
          - 'null'
          readOnly: true
          description: '原路展示用掩码（`psp:<provider>:****<末4>`，末 4 位为原路标识末尾）；

            无成功 `payment_attempt` 时为 null。**只用于展示，永不作为入参**；

            真实原路不入响应（退款只回原路哈希）。

            '
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
    PaymentWebhookAck:
      type: object
      additionalProperties: true
      required:
      - received
      properties:
        received:
          type: boolean
          description: 恒 true；验签失败走 400 + 40001，金额不符走 409 + 40911。
        duplicate:
          type: boolean
          description: true 表示重复回调，返回首次处理结果（幂等，不重复入账；409 + 40910 亦表示重复）。
        order_no:
          type:
          - string
          - 'null'
        provider_txn_id:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
          description: 处理后订单状态（同 PaymentOrder.status）；未关联订单时为 null。
    RefundRequestCreateRequest:
      type: object
      additionalProperties: true
      required:
      - order_no
      - amount_minor
      - reason_code
      properties:
        order_no:
          type: string
          minLength: 3
          maxLength: 32
        amount_minor:
          type: integer
          minimum: 1
          description: ≤ 已付未消耗（INV-12）；币种与原单一致。
        reason_code:
          type: string
          minLength: 1
          maxLength: 512
          description: 退款原因码 / 说明（人类可读；不含凭据）。
        original_route:
          type: string
          minLength: 1
          maxLength: 512
          description: '原路标识（与支付方式一致）。**可省略**：省略时服务端按 `order_no` 对应的**唯一**成功

            `payment_attempt` 推导真实原路；提供时必须**逐字等于**真实原路（掩码串

            `psp:<provider>:****<末4>` 不接受）。无法唯一确定（无成功 attempt 或多次成功）

            → `409` + `40919`（`reason=original_route_unavailable`）。服务端只存哈希，不回显原文。

            '
        evidence_ref:
          type:
          - string
          - 'null'
          maxLength: 128
    RefundRequest:
      type: object
      additionalProperties: true
      required:
      - refund_request_id
      - refund_no
      - order_no
      - amount_minor
      - currency
      - status
      - deadline_at
      - created_at
      properties:
        refund_request_id:
          type: string
        refund_no:
          type: string
          description: 对外退款单号（唯一；一条订单唯一 refund_request）。
        order_no:
          type: string
        amount_minor:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        reason_code:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - requested
          - approved
          - executing
          - succeeded
          - failed
          - cancelled
        original_route_hash:
          type:
          - string
          - 'null'
          description: 原路哈希（不回原文 / 卡令牌 / 地址明文；INV-12）。请求省略 original_route 时，按服务端推导出的真实原路计算，掩码不回传。
        deadline_at:
          type: string
          format: date-time
          description: 退款申请窗口截止（14 天；03-facts §5）。
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
        succeeded_at:
          type:
          - string
          - 'null'
          format: date-time
        failure_code:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    PayoutItemInput:
      type: object
      additionalProperties: true
      required:
      - payee_account_id
      - payee_address
      - gross_minor
      properties:
        payee_account_id:
          type: string
        payee_address:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: 收款地址（须在白名单且冷却期满；INV-13）。
        gross_minor:
          type: integer
          minimum: 0
          description: 应付金额（整数最小单位）；net 由服务端按 policy_version 计算。
        fee_minor:
          type:
          - integer
          - 'null'
          minimum: 0
        address_id:
          type:
          - string
          - 'null'
    PayoutBatchCreateRequest:
      type: object
      additionalProperties: true
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 单批 ≤50 笔（PAYOUT_BATCH_MAX_ITEMS）；超出 → 400。
          items:
            $ref: '#/components/schemas/PayoutItemInput'
        gas_mode:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL_PLATFORM
          - EXTERNAL_PAYER
          description: 本批 gas 模式快照；缺省按当前策略（下一批生效、不追溯，INV-14）。
        attestation_ref:
          type:
          - string
          - 'null'
          description: M09 对账凭证引用；出款四要素之一（缺则 409 + 40916，INV-10）。
    PayoutItem:
      type: object
      additionalProperties: true
      required:
      - item_id
      - gross_minor
      - fee_minor
      - net_minor
      - status
      properties:
        item_id:
          type: string
        payee_account_id:
          type:
          - string
          - 'null'
        payee_address:
          type:
          - string
          - 'null'
          description: 出款地址（链上公开标识）；只读展示，不含密钥。
        gross_minor:
          type: integer
          minimum: 0
        fee_minor:
          type: integer
          minimum: 0
        net_minor:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - pending
          - sent
          - carried
          - failed
          description: fee > gross 时置 carried，滚存下批（不在本批出款）。
        gas_mode:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL_PLATFORM
          - EXTERNAL_PAYER
        chain_tx_id:
          type:
          - string
          - 'null'
        failure_reason:
          type:
          - string
          - 'null'
    PayoutBatch:
      type: object
      additionalProperties: true
      required:
      - batch_id
      - batch_no
      - status
      - item_count
      - total_gross_minor
      - total_fee_minor
      - total_net_minor
      - created_at
      properties:
        batch_id:
          type: string
        batch_no:
          type: string
          description: 对外批次号（≤32 字符，全局唯一）；审批后明细冻结，改单 = 新批次。
        status:
          type: string
          enum:
          - draft
          - prepared
          - checked
          - signed
          - broadcast
          - settled
          - partial
          - failed
        item_count:
          type: integer
          minimum: 0
        total_gross_minor:
          type: integer
          minimum: 0
        total_fee_minor:
          type: integer
          minimum: 0
        total_net_minor:
          type: integer
          minimum: 0
        items_hash:
          type:
          - string
          - 'null'
          description: 明细哈希（审批后冻结的锚；用于证明批次未被改单）。
        attestation_ref:
          type:
          - string
          - 'null'
          description: M09 对账凭证引用；出款四要素之一（缺则 409 + 40916，INV-10）。
        gas_mode:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL_PLATFORM
          - EXTERNAL_PAYER
        policy_version:
          type:
          - string
          - 'null'
        maker_id:
          type:
          - string
          - 'null'
          description: 制单人（≠ 复核人）。
        checker_id:
          type:
          - string
          - 'null'
          description: 复核人（≠ 制单人）。
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
        chain_tx_id:
          type:
          - string
          - 'null'
        failure_reason:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PayoutItem'
    PayoutBatchPage:
      type: object
      additionalProperties: true
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayoutBatch'
        page:
          $ref: '#/components/schemas/Page'
    PayoutApproveRequest:
      type: object
      additionalProperties: true
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 512
          description: 复核备注（人类可读）；不含签名字节。复核人 ≠ 制单人。
    PayoutSignEventRequest:
      type: object
      additionalProperties: false
      required:
      - event
      - signer_type
      properties:
        event:
          type: string
          enum:
          - requested
          - presented
          - signed
          - verified
          - co_signed
          - broadcast
          description: 六事件之一；阶段不得回退。
        signer_type:
          type: string
          enum:
          - owner
          - reviewer
          - company
          description: 签名人类型（2-of-3 按类型区分）。
        signer_ref:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 签名人标识（管理员 id / `company-hsm` 等）。
        signature_hash:
          type:
          - string
          - 'null'
          minLength: 16
          maxLength: 128
          description: 设备回传的签名摘要（hex）；服务不验签、不落原文到审计。
        device_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 设备标识（如 `hsm:<vendor>:<serial>`）。
        auth_hash:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 设备侧授权对象摘要。
        txid:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 仅 `broadcast` 事件可带。
        error_code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          description: 失败原因码（`event=failed` 语义扩展时用）。
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 设备发生时间；缺省用服务端时间。
    PayoutSignEventResult:
      type: object
      additionalProperties: false
      required:
      - signing_request
      - event
      - complete
      - signed_count
      - advanced
      properties:
        signing_request:
          $ref: '#/components/schemas/SigningRequest'
        event:
          type: object
          additionalProperties: true
          description: 刚落库的事件行（`signing_event_payload`）。
        complete:
          type: boolean
          description: 是否已满足 2/3 门槛（owner signed + verified + co_signed）。
        signed_count:
          type: integer
          minimum: 0
          maximum: 3
          description: 已签数（`signed` + `co_signed`）。
        advanced:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 聚合推进结果（owner_type / batch_id / status），未推进为 null。
    PayoutSigningView:
      type: object
      additionalProperties: false
      required:
      - signing_request
      - events
      - complete
      properties:
        signing_request:
          type: object
          additionalProperties: true
          description: 签名请求概要（id / intent_id / kind / status / threshold / signer_count / signed_count / expires_at）。
        intent:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 关联资金意图（`intent_payload`），不存在为 null。
        events:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 事件流水（按发生时间）。
        complete:
          type: boolean
          description: 是否已满足 2/3 门槛。
    PayoutBroadcastRequest:
      type: object
      additionalProperties: false
      properties:
        txid:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 链上交易号；空 = 交给注入的链上执行器，两者都没有则 `409` + `txid_missing`（不伪造）。
        confirmations:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 64
          description: 仅 E2E：向执行器请求的确认数；不进账本。
    PayoutSettleRequest:
      type: object
      additionalProperties: false
      properties:
        txid:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 达确认的交易号；空则沿用批次已保存的 `chain_tx_id`。
    PayoutTxRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - item_id
      - to
      - qty_minor
      - nonce
      - gas_limit
      - max_fee_per_gas
      - max_priority_fee_per_gas
      - data
      - digest
      - expires_at
      properties:
        request_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        to:
          type: string
          description: 收款地址（= 明细 `payee_address`，小写）。
        qty_minor:
          type: string
          description: 金额（最小单位，字符串避免 JS 53 位精度问题）。
        nonce:
          type: integer
          minimum: 0
        gas_limit:
          type: integer
          minimum: 1
        max_fee_per_gas:
          type: string
          description: legacy（EIP-155）视图下的 gas_price（协议当前只签 legacy 交易）。
        max_priority_fee_per_gas:
          type: string
          description: 与 `max_fee_per_gas` 同值（legacy 交易没有独立 priority fee）。
        data:
          type: string
          description: calldata；ERC20 transfer 的 data 由 to/qty 确定性推导，这里留空串。
        digest:
          type: string
          description: 构单摘要（待签请求 canonical JSON 的 keccak256；提交时重算比对）。
        expires_at:
          type: string
          format: date-time
    PayoutTxRequestBatch:
      type: object
      additionalProperties: false
      required:
      - batch_id
      - chain_id
      - hot_address
      - expires_at
      - requests
      properties:
        batch_id:
          type: string
        chain_id:
          type: integer
        hot_address:
          type: string
          description: 热钱包地址（交易 from；私钥不在服务进程）。
        expires_at:
          type: string
          format: date-time
        requests:
          type: array
          items:
            $ref: '#/components/schemas/PayoutTxRequest'
    PayoutTxSubmitRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - raw_tx
      - tx_hash
      properties:
        request_id:
          type: string
          format: uuid
        raw_tx:
          type: string
          minLength: 1
          maxLength: 131072
          description: 已签名交易（`0x` + hex）。服务端只留 sha256，不落原文、不进日志与审计。
        tx_hash:
          type: string
          description: 32 字节交易哈希（`0x` + 64 hex）；必须与 `raw_tx` 自洽。
    PayoutTxSubmitResult:
      type: object
      additionalProperties: false
      required:
      - batch_id
      - item_id
      - request_id
      - tx_hash
      - action
      - batch_status
      properties:
        batch_id:
          type: string
        item_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        tx_hash:
          type: string
        action:
          type: string
          enum:
          - broadcast
          - replayed
          - recovered
          description: replayed = 执行器认定该笔早已 sent，原样回既有 tx_hash 且不改状态。
        batch_status:
          type: string
    SigningRequest:
      type: object
      additionalProperties: true
      required:
      - signing_request_id
      - intent_id
      - status
      - expires_at
      properties:
        signing_request_id:
          type: string
        intent_id:
          type: string
          description: treasury_intent id（kind = PAYOUT / REFUND / SWEEP / REBALANCE / GAS_TOPUP / POLICY_CHANGE / RECOVERY
            / WALLET_PROVISION）。
        status:
          type: string
          enum:
          - pending
          - signed
          - expired
          - failed
        expires_at:
          type: string
          format: date-time
          description: 签名有效期（SIGNING_TTL_S = 1800s；WALLET_PROVISION 放宽 86400s）。
        signer_threshold:
          type: integer
          minimum: 1
          description: 签名门限（钱包与批次 2-of-3，SIGNER_THRESHOLD）。
        auth_hash_prefix:
          type:
          - string
          - 'null'
          description: 授权对象哈希前 16 位，供线下核对；完整哈希不进响应。
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    TreasuryWallet:
      type: object
      additionalProperties: true
      required:
      - wallet_id
      - status
      properties:
        wallet_id:
          type: string
        chain:
          type:
          - string
          - 'null'
          description: 链标识（一期 polygon）。
        address:
          type:
          - string
          - 'null'
          description: 链上地址（公开标识；后台 / 对账可见，不含密钥）。
        pool_id:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - hot
          - warm
        fund_class:
          type:
          - string
          - 'null'
          description: 资金分类（客户 / 平台）；取值收敛见 CR-P5。
        status:
          type: string
          enum:
          - provisioning
          - active
          - paused
          - draining
          - zero
          - frozen
          - retired
          - provisioning_failed
          description: 规格 7 值 + 预生成失败终态；终态不可回退。
        switch_state:
          type: string
          enum:
          - standby
          - in_service
          - switching_out
          - draining
          description: 仅对 active 有意义。
        cap_minor:
          type:
          - integer
          - 'null'
          minimum: 0
        balance_minor:
          type: integer
          minimum: 0
        gas_ok:
          type: boolean
          description: gas 预留是否健康（INV-03）。
        ready:
          type: boolean
          description: ready = active ∧ gas_ok（INV-03）；仅 ready 钱包可接新地址。
        provisioned_at:
          type:
          - string
          - 'null'
          format: date-time
        activated_at:
          type:
          - string
          - 'null'
          format: date-time
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
    TreasuryPool:
      type: object
      additionalProperties: true
      required:
      - pool_id
      - status
      properties:
        pool_id:
          type: string
          description: 池键 chain:role:fund_class，创建后不可变（INV-01）。
        chain:
          type:
          - string
          - 'null'
          description: 链标识（如 polygon）。
        role:
          type: string
          enum:
          - hot
          - warm
        fund_class:
          type:
          - string
          - 'null'
          description: 资金分类（客户 / 平台）。取值收敛见 CR-P5，本版不冻结枚举。
        status:
          type: string
          enum:
          - active
          - paused
          - retired
        min_spare:
          type: integer
          minimum: 0
          maximum: 8
        max_active:
          type: integer
          minimum: 1
          maximum: 20
        switch_threshold_pct:
          type: integer
          minimum: 50
          maximum: 95
        activate_batch_size:
          type: integer
          minimum: 1
          maximum: 8
        provision_lead_time_h:
          type: integer
          minimum: 1
          maximum: 48
        pool_cap_minor:
          type: integer
          minimum: 0
          description: 池合计上限（分）；50,000 USD 或 treasury 10% 取小（03-facts §2）。
        depth_ready:
          type: integer
          minimum: 0
          description: 可用只数（ready = active ∧ gas_ok，INV-03）；0 即池空 P0，但不停收款（INV-06）。
        depth_available:
          type: integer
          minimum: 0
          description: 可摊量 / 可切换的地址深度。
        in_service_count:
          type: integer
          minimum: 0
        active_balance_minor:
          type: integer
          minimum: 0
        policy_version:
          type:
          - string
          - 'null'
        wallets:
          type: array
          description: 池内钱包摘要（深度下钻；只读）。
          items:
            $ref: '#/components/schemas/TreasuryWallet'
    TreasuryPoolPage:
      type: object
      additionalProperties: true
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryPool'
        page:
          $ref: '#/components/schemas/Page'
    TreasuryPoolCreateRequest:
      type: object
      additionalProperties: true
      required:
      - chain
      - role
      - fund_class
      properties:
        chain:
          type: string
          description: 链标识（一期 polygon；一期单链 K6）。
        role:
          type: string
          enum:
          - hot
          - warm
        fund_class:
          type: string
          description: 资金分类；取值见 CR-P5（本版不冻结枚举）。
        min_spare:
          type: integer
          minimum: 0
          maximum: 8
          default: 3
        max_active:
          type: integer
          minimum: 1
          maximum: 20
        switch_threshold_pct:
          type: integer
