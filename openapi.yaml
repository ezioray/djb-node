    post:
      tags:
      - admin
      summary: 发起配置发布（生成发布单）
      operationId: publishConfigItem
      description: '发起发布单，进入 `pending_approval`；复核人 ≠ 发起人。P0 配置需 Step-Up + 双人 + 冷却；

        灰度按桶推进，不自动全量。`expired` **不自动放行**。

        '
      security:
      - adminBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,127}$
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AdminStepUp'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPublishRequest'
      responses:
        '202':
          description: 发布单已创建（待复核）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPublishAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '424':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
