          type: array
          items: { $ref: '#/components/schemas/VendorModel' }

    NodeModelSyncStateRequest:
      type: object
      additionalProperties: true
      required: [applied_version]
      properties:
        applied_version: { type: integer, minimum: 0 }
        drift:
          type: array
          items: { type: string }
        error_class: { type: [string, 'null'] }

    NodeModelSyncStateAck:
      type: object
      additionalProperties: true
