        policy_version:
          type: string
          description: 配额变更生成新版本，随请求写入，不覆盖历史。
        effective_at:
          type: string
          format: date-time
    ScanStatus:
      type: object
      additionalProperties: true
      required:
      - status
      - expires_at
      - retry_after_s
      description: '扫码登录票据的轮询状态（一次性票据，中间态 TTL ≤120 s）。票据只存 `sha256(ticket)`，

        明文只出现在二维码里一次，不落库、不落日志。`202` 响应**顶层**即本 schema 的三个字段；

        过渡期另带 `scan` 同值包裹（`additionalProperties: true` 允许，客户端读顶层）。

        正常收尾：`confirmed` 后下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回

        `409` + `40905`。202 中实际可见 `pending` 与 `scanned`；M01-T2 已把内部 `created`

        映射为对外 `pending`。

        '
      properties:
        status:
          type: string
          enum:
          - pending
          - created
          - scanned
          - confirmed
          - expired
          description: '票据状态。`created` 是 M01-T2 更早的内部实现值，与 `pending` **同义**；对外已映射为

            `pending`（S1 保留同义值，S2 前收敛，见 CR-5），客户端两者都必须接受。

            `confirmed` / `expired` 保留以覆盖同义实现，正常收尾分别为 `200` / `409`。

            未知值忽略不报错（tolerant reader，只加不改）。

            '
        expires_at:
          type: string
          format: date-time
          description: 票据到期时间（UTC）；到期后必须重新发起扫码，不得续期。
        retry_after_s:
          type: integer
          minimum: 1
          description: 建议轮询间隔（秒）；实现取 min(5, 剩余秒)，下限 1。
