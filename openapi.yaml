            application/json:
              schema: { $ref: '#/components/schemas/NodeModelSyncStateAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/admin/model-sync/bundles:
    get:
      tags: [admin]
      summary: 模型同步 bundle 列表（含 draft/published/rolled_back）
      operationId: listModelSyncBundles
