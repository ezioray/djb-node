      summary: 构单：出未签名交易参数 + 请求摘要（两阶段出款第一步）
      description: '只**出参数**，不动钱：不写账本、不改批次状态、不落 `chain_tx_id`。请求体必须为空对象

        （收款人 / 金额 / nonce 全部由库里的批次明细推导，客户端没有可调项）。


        前置：批次 `checked` / `signed`（否则 `409` + `illegal_transition`）；明细全部 `pending`

        （否则 `409` + `item_not_pending`）；净额合计与批次一致（否则 `409` + `amount_mismatch`）；

        单笔 ≥ 50 USDT（否则 `422` + `42210`，`reason=below_min_payout`）；对账闸门平

        （否则 `409` + `40916`）；执行器须为**外部签名机模式**（否则 `409` + `executor_not_ready`）。


        **nonce 不复用**：从 `eth_getTransactionCount(hot, "pending")` 起按明细顺序递增并落库；

        重复调用返回同一批 `built` 记录（同一 nonce），不二次取号。构单有效期由

        `DJB_CHAIN_SIGN_REQUEST_TTL` 决定（默认 900s，最小 60s）；过期后重新构单才换 nonce。

        金额字段一律字符串（JS 53 位安全），`nonce` / `gas_limit` 为整数。

        '
      security:
      - adminBearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: 分润批次号 `batch_no`。
        schema:
          type: string
      - $ref: '#/components/parameters/AdminStepUp'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: 构单已就绪（`status=built`，可离线签名）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutTxRequestBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: '单笔出款低于下限（`42210` / `reason=below_min_payout`）；提交期的同码不同因见

            `/tx-submit`（`reason=request_mismatch`）。

            结构与类型错误仍走 `400`（两者不混用）。

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: object
                    additionalProperties: true
                    required:
                    - type
                    - code
                    - message
                    - request_id
                    - reason
                    properties:
                      type:
                        type: string
                        enum:
                        - invalid_request_error
                      code:
                        type: integer
                        enum:
                        - 42210
                      message:
                        type: string
                      request_id:
                        type: string
                      reason:
                        type: string
                        enum:
                        - below_min_payout
        '424':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/treasury/payouts/{id}/tx-submit:
    post:
      tags:
      - admin
      operationId: submitTreasuryPayoutSignedTx
      summary: 提交已签名交易（两阶段出款第三步：验签 → 广播 → 落状态）
      description: '请求体只接受 `request_id` / `raw_tx` / `tx_hash`；收款人、金额、nonce **只认库里的构单**，

        提交时改不了。服务端先 `keccak256(raw_tx)` + RLP 逐字段比对构单，再核白名单 / 单笔 /

        日累计，最后交执行器广播；任何一道不过都**不广播、不改状态、不落 txid**。


        同一 `request_id` 只能提交一次（二次 → `409` + `request_consumed`）；构单过期 →

        `409` + `request_expired`；构单不存在或不属于该批次 → `409` + `request_not_found`；

        已签交易与构单不符（含 `tx_hash` 与 `raw_tx` 不符）→ `422` + `42210`，

        `reason=request_mismatch`。广播成功才在**同一事务**里把构单置 `submitted`、明细置 `sent`

        并落 `chain_tx_id`；全部 sent 时批次置 `broadcast`。账本零写入。


        `action=replayed` 表示执行器认定该笔早已 sent（例如先走过 `/broadcast`）：原样回既有

        `tx_hash`，不改状态。审计只记 `request_id` / `tx_hash` / 明细数，**不记 `raw_tx`**。

        '
      security:
      - adminBearer: []
      parameters:
      - name: id
        in: path
        required: true
        description: 分润批次号 `batch_no`。
        schema:
          type: string
      - $ref: '#/components/parameters/AdminStepUp'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutTxSubmitRequest'
      responses:
        '200':
          description: 已提交（`action=broadcast/replayed/recovered`）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutTxSubmitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: '已签交易与构单不符（`42210` / `reason=request_mismatch`，含 `tx_hash` 与 `raw_tx` 不符、

            构单摘要被改写）；构单期的同码不同因见 `/tx-requests`（`reason=below_min_payout`）。

            结构与类型错误仍走 `400`（两者不混用）。

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - error
                properties:
                  error:
                    type: object
                    additionalProperties: true
                    required:
                    - type
                    - code
                    - message
                    - request_id
                    - reason
                    properties:
                      type:
                        type: string
                        enum:
                        - invalid_request_error
                      code:
                        type: integer
                        enum:
                        - 42210
                      message:
                        type: string
                      request_id:
                        type: string
                      reason:
                        type: string
                        enum:
                        - request_mismatch
        '424':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
