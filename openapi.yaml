# ==========================================================================
# components
# ==========================================================================
  # ----------------------------------------------------------------------
  # 身份与租户（M01；spec 1.2.0 补登记：M01 CR-1 / _CR-LOG S1）
  # /api/v1/auth/* · /user/profile · /user/api-keys · /admin/accounts|tenants
  # 写进 spec ≠ 公网可达：管理面内网/VPN + 强 MFA + step-up（≤5 分钟）
  # ----------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [user]
      summary: 登录（密码 / OAuth / 验证码）
      operationId: createAuthSession
      description: |
        `method` 区分登录方式，成功后返回会话令牌。MFA 未完成时返回 `mfa_required=true`
        的短期令牌（只可用于 step-up 换正式令牌）。凭据错误统一 `40110`，
        **不区分**「账号不存在」与「口令错误」（防枚举）；失败锁定与风控只给
        429 / 403 + 粗粒度原因码，不含阈值与名单。扫码登录的**轮询中间态**复用本条端点：
        票据未确认时返回 `202` + `ScanStatus`，确认后返回 `200` 令牌。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功（或 `mfa_required=true` 的短期令牌）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '202':
          description: |
            扫码登录中间态（轮询）。响应体**顶层即 `ScanStatus`**（`status` / `expires_at` /
            `retry_after_s`），客户端按 `retry_after_s` 继续轮询同一条端点；`confirmed` 后
            下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回 `409` + `40905`（一次性令牌家族）。
            **过渡期**：M01-T2 额外携带一份 `scan` 同值包裹（`{status, expires_at, retry_after_s}`），
            属纯增量；`ScanStatus` 声明 `additionalProperties: true` 允许该包裹，客户端只读顶层字段。
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [user]
      summary: 刷新令牌（轮换）
      operationId: refreshAuthSession
      description: |
        刷新即轮换：旧 `refresh_token` 立即失效，返回新的令牌对。重放已轮换的令牌
        按 `40103`（令牌已撤销）处理，并要求重新登录。刷新不延长绝对过期时间。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 新令牌对
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [user]
      summary: 退出（撤销会话）
      operationId: revokeAuthSession
      description: |
        撤销当前会话；`all_devices=true` 时撤销该账号全部会话（`session_epoch++`，
        旧令牌立即失效）。幂等：重复退出返回首次结果，不报错。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 已撤销
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/profile:
    get:
      tags: [user]
      summary: 账户与租户视图（脱敏）
      operationId: getUserProfile
      description: |
        返回脱敏后的账户与租户视图：只给 `email_hash` 派生的展示掩码，不回传
        原始邮箱 / 手机号 / 硬件信息。`balance` 是 M06 `account_balances` 的
        **只读镜像**，结算与对账一律以账本分录为准。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 账户视图
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [user]
      summary: 修改昵称与语言（局部更新）
      operationId: updateUserProfile
      description: |
        只允许修改展示类字段（`display_name` / `locale`）。未出现的字段保持原值；
        身份字段（`account_id` / `tenant_id` / `state`）不可经此端点修改。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdateRequest' }
      responses:
        '200':
          description: 更新后的账户视图
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys:
    get:
      tags: [user]
      summary: 列举 API Key（只回前缀）
      operationId: listApiKeys
      description: |
        只返回 8 位前缀与元数据，**永不回传明文或哈希**。撤销后的 Key 默认不返回，
        `include_revoked=true` 时可查（保留 24 个月）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Key 分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [user]
      summary: 创建 API Key（明文只回一次）
      operationId: createApiKey
      description: |
        明文只在本次响应出现一次，平台只存 `sha256(key)` 与前缀。`frozen` / `closed`
        账户禁止建 Key（403 + `40304`）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
      responses:
        '201':
          description: Key 已创建（`key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys/{id}:
    delete:
      tags: [user]
      summary: 撤销 API Key（幂等）
      operationId: revokeApiKey
      description: |
        撤销后立即失效；重复撤销返回首次结果（不报 5xx）。跨租户访问一律 404（防枚举）。
      security:
        - userBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 撤销结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/api-keys/{id}/rotate:
    post:
      tags: [user]
      summary: 轮换 API Key（旧钥立即失效）
      operationId: rotateApiKey
      description: |
        生成新 Key 并撤销旧 Key；新明文只在本次响应出现一次。若声明重叠期，
        重叠 ≤24 h 且旧钥在重叠期内**只验签**、不接受新注册（INV-10）。
      security:
        - userBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyRotateRequest' }
      responses:
        '201':
          description: 新 Key（`key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/freeze:
    post:
      tags: [admin]
      summary: 冻结账户（理由 + 期限必填）
      operationId: freezeAccount
      description: |
        冻结后账户只读 + 可申诉，禁止建 Key / 充值 / 接新单。`frozen_until` 必填且
        ≤180 天（超期属参数错误，400 + `40001`）。解冻须**非原冻结人**（409 + `40902`）。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStateChangeRequest' }
      responses:
        '200':
          description: 已冻结
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStateAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/unfreeze:
    post:
      tags: [admin]
      summary: 解冻账户（非原冻结人）
      operationId: unfreezeAccount
      description: |
        解冻人与原冻结人必须不同（409 + `40902`）；到期自动解冻由定时 job 执行并留痕，
        重放不产生重复状态事件。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStateChangeRequest' }
      responses:
        '200':
          description: 已解冻
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStateAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/accounts/{id}/roles:
    post:
      tags: [admin]
      summary: 授予 / 回收后台角色（第二人确认）
      operationId: updateAccountRoles
      description: |
        `admin_role` ∈ 八角色（SUPER / SVC / OPS / AUDIT / RISK / FIN / CS / VIEWER，
        见 03-facts §5）。授予与回收都必须带复核人（`second_approver` ≠ 操作人），
        变更后 `session_epoch++`（旧会话 401 + `40102`）。SVC 不得绑自然人邮箱。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRoleChangeRequest' }
      responses:
        '200':
          description: 角色已更新
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRoles' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/tenants/{id}/quotas:
    post:
      tags: [admin]
      summary: 修改租户配额（升配额超阈值需 FIN 复核）
      operationId: updateTenantQuotas
      description: |
        配额主体为 `tenant_quotas`（`kind` / `value` / `policy_version`）。生效值 =
        min(租户, Key, 节点能力)，并随请求写 `policy_version`。升配额超阈值必须 FIN
        复核（`second_approver` 必填），降配额立即生效。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantQuotasRequest' }
      responses:
        '200':
          description: 配额已更新
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantQuotasAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 节点供给（M02；spec 1.2.0 补登记：M02 CR-2 / CR-3 / CR-5 / CR-7）
  # /api/v1/node/pair · /node/binding · /node/upstream/probe · /admin/supply/nodes/{id}/review
  # 节点侧认证 X-Client-Key；审核属管理面（内网 + 强 MFA + step-up）
  # ----------------------------------------------------------------------
  /api/v1/node/pair:
    post:
      tags: [node]
      summary: 生成 / 轮换客户端密钥（明文只回一次）
      operationId: pairNodeClientKey
      description: |
        生成节点客户端密钥（`X-Client-Key`），明文只在本次响应出现一次；平台只存
        `sha256(key)` 与 8 位前缀。轮换重叠 ≤24 h，重叠期内旧钥**只验签**、
        不接受新注册。状态非 `active` 的节点拒绝换钥（403 + `40305`）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePairRequest' }
      responses:
        '201':
          description: 已签发（`client_key` 仅此一次可见）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePairResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/binding:
    get:
      tags: [node]
      summary: 查询节点绑定（当前账户）
      operationId: getNodeBinding
      description: |
        一个节点同时只有**一条**有效绑定（INV-08）。解绑 / 换绑不删除历史收据与锁定收益。
        绑定关系存 `nodes` 列 + `node_events` 历史，不建独立表（M02 CR-4）。
      security:
        - nodeClientKey: []
      parameters:
        - name: node_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 绑定状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [node]
      summary: 网页端绑定节点
      operationId: bindNode
      description: |
        用一次性绑定码把节点绑定到当前账户；绑定码一次性、短时效。节点须为 `active`，
        否则 403 + `40305`（`pending` 未准入 / `frozen` / `retired`）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeBindingRequest' }
      responses:
        '200':
          description: 绑定成功
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [node]
      summary: 解绑节点（幂等）
      operationId: unbindNode
      description: |
        解绑后节点停新单，在途任务按清退两段处理（先降权再摘除），不强制中断（INV-09）。
        重复解绑返回首次结果。
      security:
        - nodeClientKey: []
      parameters:
        - name: node_id
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已解绑
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/upstream/probe:
    post:
      tags: [node]
      summary: 上报本地体检结论（回执式，服务端不探测）
      operationId: reportNodeUpstreamProbe
      description: |
        **服务端不发起探测**：由客户端在本地探测上游连通性后上报结论，服务端只按回执
        改 `NodeUpstream.state`（`probing → verified / rejected`）。只收结论与耗时，
        不收凭据、不收上游响应正文（H1）。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeProbeReport' }
      responses:
        '200':
          description: 回执已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeProbeAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/supply/nodes/{id}/review:
    post:
      tags: [admin]
      summary: 节点准入审核（通过 / 驳回）
      operationId: reviewSupplyNode
      description: |
        准入审核：`approve` 使 `pending → active`；`reject` 保留 `pending` 并通知
        （不落 `retired`）。数据与状态归 M02，页面归 M14。审核必须留理由；
        状态迁移不合法（如已 `active` 再审）返回 403 + `40305`。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeReviewRequest' }
      responses:
        '200':
          description: 审核结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeReviewAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 调度与定价（M04；spec 1.2.0 补登记：M04 CR-2）
  # /api/v1/schedule/route · /replay · /decisions/{id}
  # 决策日志只追加、丢弃率 0；不含正文与凭据
  # ----------------------------------------------------------------------
  /api/v1/schedule/route:
    post:
      tags: [schedule]
      summary: 内部路由决策（返回 decision_id + chosen + ETA）
      operationId: createRouteDecision
      description: |
        一次请求最多 2 次尝试、只计费一次（计费归 M05）。相同
        (`snapshot_ts`,`quote_version`,`policy_version`,`request_digest`) 必得同一决策，
        复算一致率 100%（INV-03）。候选集为空时按降级顺序执行，最终拒绝带
        `45001` + 三个可选动作。**调用方是 M03 网关**（服务间 mTLS），不对外暴露给终端；
        终端入口只有 `/v1/chat/completions` 与 `/v1/batches*`。
      security:
        - internalMTLS: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '201':
          description: 决策已生成
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/schedule/replay:
    post:
      tags: [schedule]
      summary: 异步复算（202 + job_id，并发 1）
      operationId: createScheduleReplay
      description: |
        按窗口重放决策：同一输入必须复现同一 `chosen`；差异 ≠0 即 P0。复算是**只读**的，
        不改历史决策。同一时刻只允许 1 个复算作业（并发 1），重复提交返回 409 + `40901`。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplayRequest' }
      responses:
        '202':
          description: 已受理（异步复算）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/schedule/decisions/{decision_id}:
    get:
      tags: [schedule]
      summary: 决策下钻（价格 / 延迟 / 亲和 / 兜底 + 淘汰码）
      operationId: getRoutingDecision
      description: |
        只读下钻单条决策：含价格、ETA、亲和命中、兜底链与**淘汰码**。不含评分权重与
        阈值（私有配置）；正文与凭据不入决策日志（INV-12）。决策日志保留 12 个月
        （M04 CR-3），更早的数据按审计流程申请。
      security:
        - adminBearer: []
      parameters:
        - name: decision_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 决策详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDecision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ----------------------------------------------------------------------
  # 调度定价补充（M04 §4.1：quotes / bids；additive 补登，见证据「裁决假设 AH-1」）
  # 供方区间报价、用方区间出价；成交价 ∈ [max(a_lo,b_lo), min(a_hi,b_hi)]
  # ----------------------------------------------------------------------
  /api/v1/schedule/quotes:
    post:
      tags: [node]
      summary: 供方区间报价（节点侧）
      operationId: createQuote
      description: |
        节点按 `(access, model, unit)` 提交区间要价与 TTL；可成交 ⟺ 区间与用方出价重叠
        （INV-01），成交价取区间交集内的策略价（mid / floor / ceiling）。报价只追加，
        过期（`expired`）不复活，只能新建。`ask_price` 是节点要价，**不是**评分权重。
      security:
        - nodeClientKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: 报价已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/schedule/bids:
    post:
      tags: [user]
      summary: 用方区间出价（租户侧）
      operationId: createBid
      description: |
        用方按模型提交区间出价：`min_price` 缺省为 0、`max_price` 缺省为不设上限（单边退化
        为单边比较，INV-01）。出价只追加，过期不复活；成交由 M04 决策产生，本端点不锁量。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BidRequest' }
      responses:
        '201':
          description: 出价已登记
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BidAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 计量与收据（M05；spec 1.2.0 补登记：M05 CR-1）
  # /api/v1/user/usage/records · /node/receipts/{receipt_id} · /admin/usage/*
  # 收据只追加、逐条受理；校正只追加不改历史
  # ----------------------------------------------------------------------
  /api/v1/user/usage/records:
    get:
      tags: [user]
      summary: 用量明细（游标分页）
      operationId: listUserUsageRecords
      description: |
        明细是**逐次调用**的元数据与金额，不含 prompt / response 正文。游标分页，
        默认 50、上限 200。`state=corrected` 的行带 `correction_id`，原值不可改，
        差额以追加校正表达（INV-06）。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [recorded, settled, corrected] }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 用量明细分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/node/receipts/{receipt_id}:
    get:
      tags: [node]
      summary: 单条收据受理结果（节点自查）
      operationId: getNodeReceipt
      description: |
        节点自查单条收据是否被受理：`accepted` / `rejected` / `duplicate` / `expired`。
        `duplicate` 表示重复提交且返回首次结果（不重复计量，INV-03）。签名不匹配回
        `46001`（HTTP 422）。只返回状态与码，不回显收据正文。
      security:
        - nodeClientKey: []
      parameters:
        - name: receipt_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 收据状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/usage/upstream-bills:
    post:
      tags: [admin]
      summary: 上游账单导入（FIN / OPS）
      operationId: importUpstreamBills
      description: |
        导入上游账单行（`imported → reconciled`）。导入**只追加**，不覆盖原用量；
        与本地计量差异 >1% 进差异工单（INV-07），不静默取大或取小。逐行受理，
        单行失败不回滚整批。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamBillImportRequest' }
      responses:
        '200':
          description: 逐行受理结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamBillImportAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/usage/corrections:
    post:
      tags: [admin]
      summary: 人工校正（≥50 USD 双人复核）
      operationId: createUsageCorrection
      description: |
        校正只追加（`proposed → applied / rejected`），不改历史行。单条 usage 的累计
        校正不得超过原额；负向校正（退款方向）必须人工复核；校正额 ≥50 USD 时
        `second_approver` 必填且 ≠ 操作人（缺复核 409 + `40902`）。写入后由 M06 走冲正。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageCorrectionRequest' }
      responses:
        '202':
          description: 校正已受理（`proposed` 或直接 `applied`）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageCorrectionAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 账本只读管理面（M06；spec 1.2.0 补登记：M06 CR-L4）
  # 试算平衡 / 42 科目余额 / 期间 Merkle 根 / 全量复算（只读，不修数据）
  # 内网/VPN + 强 MFA + step-up（≤5 分钟）；账本无 UPDATE / DELETE
  # ----------------------------------------------------------------------
  /api/v1/admin/ledger/trial-balance:
    get:
      tags: [admin]
      summary: 试算平衡（Σ借 = Σ贷）
      operationId: getLedgerTrialBalance
      description: |
        按 `as_of` 汇总试算平衡：同期 Σ借 = Σ贷、科目在 42 条白名单内、未知科目直接报错
        （不静默跳过，INV-05）。`balanced=false` 即 P0，账本转只读（不自动修数据）。
        尾差（≤1 最小单位）累积在 `2901`，单独给出 `tail_diff`。
      security:
        - adminBearer: []
      parameters:
        - name: as_of
          in: query
          required: false
          description: 截止时间（UTC）；缺省为最近一次日结。
          schema: { type: string, format: date-time }
        - name: unit_type
          in: query
          required: false
          description: 币种维度；COP 与 USD 不互转（INV-04）。
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 试算平衡
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/accounts:
    get:
      tags: [admin]
      summary: 42 科目与余额
      operationId: listLedgerAccounts
      description: |
        列举科目表与派生余额（`account_balances` 为唯一余额源，由分录派生、可全量重建）。
        科目数 42（资产 12 / 负债权益 12 / 收入 6 / 费用损失 10 / 非现金 2，见 03-facts §6）。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: fund_class
          in: query
          required: false
          schema: { type: string, enum: [CLIENT, PLATFORM, FEE] }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 科目与余额分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerAccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/merkle/{period}:
    get:
      tags: [admin]
      summary: 期间 Merkle 根与复算入口
      operationId: getLedgerMerkleRoot
      description: |
        期间根可**由当期分录重算复现**；发布后不可改（INV-13）。本端点只读，
        不触发锚定；`verify_hint` 给出重算所需的只读入口。锚定周期见
        `ledger.merkle_interval_h`（1 h）。目标期间无根返回 404 + `40924`。
      security:
        - adminBearer: []
      parameters:
        - name: period
          in: path
          required: true
          description: 锚定周期：日 `YYYY-MM-DD` 或小时 `YYYY-MM-DDTHH`。
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2}(T[0-9]{2})?)?$' }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [journal, daily_close], default: journal }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 期间根
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerkleCommitment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/recompute:
    post:
      tags: [admin]
      summary: 触发全量复算（只读，不修数据）
      operationId: recomputeLedger
      description: |
        分页重算 hash 链与余额派生，**只读、不自动修**：差异 ≠0 即 P0 并冻结写入口。
        复算与日结共用同一入口；`dry_run` 默认 true，显式 false 才发布校验结果
        （仍不修数据）。同一时刻只允许 1 个复算作业（409 + `40920`）。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecomputeRequest' }
      responses:
        '202':
          description: 复算已受理
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecomputeAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }


  # ----------------------------------------------------------------------
  # 账本冲正与凭证（M06 §4.1：journals/{id} · reversals；additive 补登 AH-1）
  # 冲正是账本**唯一写路径**：整单取反、等额、双人复核；禁部分冲正
  # ----------------------------------------------------------------------
  /api/v1/admin/ledger/journals/{id}:
    get:
      tags: [admin]
      summary: 凭证 + 行 + 冲正链（只读）
      operationId: getLedgerJournal
      description: |
        返回单张凭证及其行、以及冲正链（`reversal_of_journal` / `reverse_chain`）。
        记账后凭证只有 `posted` 与 `voided`（被冲正）两种状态，**禁止覆盖写与部分冲正**。
        凭证不存在或已归档返回 404 + `40924`。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 凭证详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalVoucher' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/ledger/reversals:
    post:
      tags: [admin]
      summary: 发起冲正（双人复核、整单等额）
      operationId: createLedgerReversal
      description: |
        对原凭证逐行取反、等额整单冲正（INV-07）：每张原凭证至多一条冲正，禁止部分冲正。
        必须双人复核（`second_approver` ≠ 操作人）且带理由。原凭证已被冲正返回 409 + `40921`；
        冲正期间并发冲突返回 409 + `40920`；金额不齐 / 借贷不平衡返回 422 + `42220`。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReversalRequest' }
      responses:
        '201':
          description: 冲正凭证已生成（待复核或已入账）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReversalAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------------------
  # 配置中心补充 5 条（M10；spec 1.2.0 补登记：M10 CR-1 / CR-3）
  # namespaces · {key}/diff · {key}/impact · publish-requests/{id}/promote · {key}/audit
  # S1 只实现只读三项（namespaces / diff / audit）；impact 与 promote 在 S2 落实现
  # ----------------------------------------------------------------------
  /api/v1/admin/config/namespaces:
    get:
      tags: [admin]
      summary: 配置命名空间清单（十域注册）
      operationId: listConfigNamespaces
      description: |
        列出已注册的配置命名空间与键数量（十域注册见 03-facts §9）。`namespaces` 是
        **保留段**：具体路径优先于模板路径，配置键不得以 `namespaces` 为名注册。
      security:
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 命名空间清单
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigNamespaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/diff:
    get:
      tags: [admin]
      summary: 版本差异（结构化 diff）
      operationId: getConfigDiff
      description: |
        比较同一 key 的两个不可变版本，返回字段级 diff。敏感值只给 `masked=true` 的
        掩码，不返回明文；`content_digest` 可独立复算（`sha256(canonical_json)`）。
        版本不存在返回 404 + `47006`。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - name: from_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 结构化差异
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/impact:
    get:
      tags: [admin]
      summary: 影响面分析（消费方 / 风险级 / 是否需重启）
      operationId: getConfigImpact
      description: |
        发布前影响面：列出消费方模块、`risk_level`（P0/P1/P2）、是否需要重启或下次锚定
        生效、以及受影响的键集。影响面是发布单的**前置输入**，不改变运行值。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: scope
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 影响面
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/publish-requests/{id}/promote:
    post:
      tags: [admin]
      summary: 推进发布单（灰度桶前进 / 全量）
      operationId: promoteConfigPublish
      description: |
        按灰度计划 1 → 5 → 25 → 100 推进；观测窗未满不得推进（409 + `47007`），
        发布窗口外拒绝（409 + `47008`）。`expired` 不自动放行，只能新建发布单。
        P0 需 step-up + 双人；缺 step-up 返回 424 + `42401`（过渡期 403 + `47009`）。
      security:
        - adminBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPromoteRequest' }
      responses:
        '200':
          description: 发布单新状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigPublishAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/config/{key}/audit:
    get:
      tags: [admin]
      summary: 配置审计链（只读）
      operationId: listConfigAudit
      description: |
        该 key 的审计事件（草稿、发布、复核、推进、回滚、kill-switch、漂移）。
        审计事实源是 M16 `audit_log`，本端点只做按 key 的只读聚合，不提供删除或修改。
      security:
        - adminBearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{2,127}$'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 审计事件分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigAuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- 平台运维（内部）
  /healthz:
    get:
      tags: [ops]
      operationId: getHealthz
      summary: 存活 / 就绪探针（只返回状态与版本，不暴露拓扑）
      security: []
      responses:
        '200':
          description: 服务状态
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '500':
          description: 依赖不可用（数据库 / 审计链密钥 / 配置服务）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/ops/audit/entries:
    post:
      tags: [ops]
      operationId: appendAuditEntry
      summary: 追加审计条目（append-only，HMAC-SHA256 链；高危字段缺失即拒）
      description: |
        业务模块写审计的唯一入口。服务端在同一事务内读上一条 `hash` → 计算
        `hmac-sha256(prev_hash + canonical_json(entry))` → 追加；`prev_hash` 断链即 409。
        高危动作（`reason_code` 非空的动作）必须给 `actor_type` / `role` / `before` /
        `after` / `reason_code` / `ticket`，且 `approval_chain` 至少两人、propose ≠ approve。
        幂等：同 `X-DJB-Idempotency-Key` 重复提交返回首次结果（`duplicate=true`），不重复入链。
      security: [{ internalMTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditAppendRequest' }
      responses:
        '201':
          description: 已追加
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditAppendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423':
          description: 审计链锁定（校验进行中 / 密钥缺失或未激活），拒绝写入
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [ops]
      operationId: listAuditEntries
      summary: 只读查询审计链（管理后台 / 排障用；不提供 UPDATE / DELETE）
      security: [{ internalMTLS: [] }]
      parameters:
        - name: from_seq
          in: query
          required: false
          description: 起始序号（含）；缺省从 1 开始。
          schema: { type: integer, minimum: 1 }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: target
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 审计条目分页（按 seq 升序）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /internal/ops/audit/verify:
    post:
      tags: [ops]
      operationId: verifyAuditChain
      summary: 逐条重算校验审计链（可选固化当日 Merkle 根）
      description: |
        逐条重算 `hash` 并校验 `prev_hash`、算法一致、字段完整、审批链非自批、
        `pending_approval` 超时；发现断链返回 200 + `ok=false` + `broken_seq`（不修链、不重算覆盖）。
        `seal=true` 时同日幂等写 `audit_anchors`（同日重复调用返回同一 `merkle_root`）。
      security: [{ internalMTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditVerifyRequest' }
      responses:
        '200':
          description: 校验结果（`ok=false` 表示断链 / 算法降级 / 自批 / 超时）
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- 站内信（M12）
  /api/v1/user/notifications:
    get:
      tags: [user]
      operationId: listNotifications
      summary: 站内信列表（游标分页；P0 不可退订但可标记已读）
      description: |
        只返回当前账户的站内记录；按 `created_at` 倒序。`unread_only=true` 只返回未读。
        `payload` 只含 id / 金额 / 时间 / 原因码，不含正文与 PII（M12 INV-07）。
      security: [{ userBearer: [] }]
      parameters:
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [P0, P1, P2] }
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 站内信分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/notifications/{id}/read:
    post:
      tags: [user]
      operationId: markNotificationRead
      summary: 标记单条已读；`id=all` 标记该账户全部未读
      description: |
        重复标记无副作用（幂等）。`id=all` 是保留字，不对应任何真实通知 id。
        已读只影响未读提醒，不移除站内记录（M12 INV-02）。
      security: [{ userBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: 通知 id；保留值 `all` 表示全部已读。
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已读结果
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadAck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- 对账（M09）
  /api/v1/admin/treasury/recon/runs:
    get:
      tags: [admin]
      operationId: listReconRuns
      summary: 对账批次列表（按 cutoff_at 倒序）
      security: [{ adminBearer: [] }]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [chain, psp, bank, receipt, daily_close] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [scheduled, running, matched, exceptions_open, signed_off, closed] }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 批次分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/runs/{run_id}:
    get:
      tags: [admin]
      operationId: getReconRun
      summary: 批次详情 + 差异汇总（按严重度 / 状态）
      security: [{ adminBearer: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 批次详情
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconRunDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/runs/{run_id}/sign-off:
    post:
      tags: [admin]
      operationId: signOffReconRun
      summary: 双人签核（存在未结 P0/P1 时拒绝）
      description: |
        制单人与复核人必须不同（INV-05）；存在未结 P0/P1 差异返回 409 + `49202`；
        已签核或已关闭再签返回 409 + `49203`。签核后批次只读。
      security: [{ adminBearer: [] }]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconSignOffRequest' }
      responses:
        '200':
          description: 已签核的批次
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/exceptions:
    get:
      tags: [admin]
      operationId: listReconExceptions
      summary: 差异列表（severity / status / owner / 到期）
      security: [{ adminBearer: [] }]
      parameters:
        - name: run_id
          in: query
          required: false
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [P0, P1, P2] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, investigating, escalated, resolved, accepted, closed] }
        - name: owner
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 差异分页
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconExceptionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/exceptions/{exception_id}/resolve:
    post:
      tags: [admin]
      operationId: resolveReconException
      summary: 差异处置（调整分录 / 外部修正 / 核销 / 误报）
      description: |
        `resolution_code=adjust_journal` 必须带 `resolution_journal_id`（已入账的调整分录）；
        关闭后不可重开，新差异开新 run（M09 §3.2）。
      security: [{ adminBearer: [] }]
      parameters:
        - name: exception_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconExceptionResolveRequest' }
      responses:
        '200':
          description: 已处置的差异
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconException' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/attestations:
    post:
      tags: [admin]
      operationId: submitReconAttestation
      summary: 提交复核凭证（同一期间 + batch_hash 只能一个 valid）
      description: |
        签名覆盖 `ledger_root + batch_hash + balances + payable_total_minor`；复核人 ≠ 制单人。
        同 `(period_start, period_end, batch_hash)` 已有 valid 凭证返回 409 + `49205`。
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminStepUp'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconAttestationRequest' }
      responses:
        '201':
          description: 已受理的凭证
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconAttestation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/StepUpRequired' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/attestations/{attestation_id}:
    get:
      tags: [admin]
      operationId: getReconAttestation
      summary: 查询复核凭证
      security: [{ adminBearer: [] }]
      parameters:
        - name: attestation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 凭证
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconAttestation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/treasury/recon/attestations/{attestation_id}/validate:
    get:
      tags: [admin]
      operationId: validateReconAttestation
      summary: 出款前校验（服务间调用；只返回结论，不返回凭证正文）
      description: |
        供 M08 出款前置校验：`valid=true` 且未过期才允许出款。服务间 mTLS + 服务令牌，
        不具备 admin 会话也能调用，但只返回 `valid/status/reasons`。
      security: [{ internalMTLS: [] }]
      parameters:
        - name: attestation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 校验结论
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconAttestationValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: DJB-Key
      description: |
        用方 API Key（一枚 Key 通吃所有可路由模型）。Key 只显示一次；
        平台只存哈希；客户端应存于 OS 安全存储，不进日志、不进仓库。
    nodeClientKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: |
        节点客户端密钥，由 `/api/v1/node/pair` 生成、可轮换（重叠 ≤24h）
        与撤销（立即停单，在途不受影响）。只存哈希（字段 client_key），
        平台不回显明文。
    internalMTLS:
      type: mutualTLS
      description: |
        服务间 mTLS + service token（仅集群内可达，公网不可达；不进客户端 SDK，
        不发动态口令）。仅用于 `/api/v1/schedule/route` 这类**内部**端点。
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: Admin-Session
      description: |
        后台会话（强制 MFA；敏感动作 step-up ≤5 分钟；break-glass 只读模式见）。管理面仅内网/VPN，公网不可达。

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 调用方生成的请求标识（UUID）；服务端原样回显，贯穿日志与链路追踪。
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-DJB-Idempotency-Key
      in: header
      required: false
      description: |
        写操作幂等键，24h 有效且与账本写入同事务。缺省时服务端按
        请求体指纹做 300s 去重（流式仅 60s）。
      schema:
        type: string
        minLength: 16
        maxLength: 128
    AdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      description: 敏感操作二次认证凭据（≤5 分钟有效）；P0 配置发布必备。
      schema:
        type: string

    ReportPeriod:
      name: period
      in: query
      required: true
      description: |
        报表周期：自然月 `YYYY-MM`，或日粒度 `YYYY-MM-DD`（REP-01/02/04 需要日粒度时用；
        `/admin/ledger/merkle/{period}` 仍只接受月）。日粒度只加不改，月粒度行为不变。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2})?$'

    ProtocolVersion:
      name: DJB-Protocol-Version
      in: header
      required: false
      description: 调用方协议版本（`MAJOR.MINOR.PATCH`）。缺省按服务端当前版本；不兼容返回 426。
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Capabilities:
      name: DJB-Capabilities
      in: header
      required: false
      description: |
        调用方启用的能力标识（逗号分隔，如 `chat_completions,batch`）。双方只启用交集；
        未知 capability **忽略不报错**。
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标分页的不透明游标；首次不传。不得猜测或自行构造。
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 单页条数上限。服务端可返回更少；`has_more` 判断是否继续。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      required: false
      description: 起始时间（UTC，含端点）。日期或 RFC 3339 日期时间。
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: 结束时间（UTC，含端点）。
      schema:
        type: string
        format: date-time
    Period:
      name: period
      in: path
      required: true
      description: 周期标识（UTC 日期）。
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: string

  headers:
    RequestId:
      description: 服务端/调用方请求标识，原样回显。
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: 建议重试等待秒数（429/503）。客户端必须遵守并加抖动。
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: 请求不合法（结构、枚举、大小上限）。不得回显内部堆栈或 SQL。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证或凭据无效/过期。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        已认证但无权限，或命中风控。对外只给粗粒度原因码（如 `account_restricted`），
        不返回具体规则/阈值/名单。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（含无权查看时的统一 404，避免枚举）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 状态冲突（重复幂等键的不同载荷、状态机不允许的迁移）。无更细码时用通用
        `40919`；细分码见 `Error.code`。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: 协议版本不兼容（`42601`，HTTP 426）。响应体给出可升级的版本范围。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        请求体超过上限（HTTP 413，专用码 `40013`；chat 请求建议 ≤1 MiB；receipts 批 ≤500 条/次；
        上限属实现参数，放宽不算破坏性变更，收紧算）。只给上限提示，不回显请求内容。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        限流或配额耗尽。只给粗粒度原因码与 `Retry-After`；具体阈值属私有配置，
        不在响应中暴露。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 暂时不可用/过载/维护；可安全重试（遵守 `Retry-After`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PaymentRequired:
      description: |
        余额不足 / 欠费（`40201`，HTTP 402）。只给粗粒度原因与充值提示，
        不返回额度细节、风控阈值或判定条件；客户端应停止重试并引导充值。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StepUpRequired:
      description: |
        二次认证（step-up）缺失或已过期（`42401`，HTTP 424）。敏感动作须重新完成
        step-up（≤5 分钟有效）后重放；过渡期实现也可返回 403 + `47009`（M10 CR-3），
        客户端必须同时处理两种。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        语义 / 业务校验失败（HTTP 422，`422xx` 段）。具体码值按模块段位登记
        （如账本 `42220–42223`）；结构与类型错误一律 `400`，两者不混用。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ------------------------------------------------------------ 通用
    Error:
      type: object
      additionalProperties: true
      required: [error]
      description: |
        统一错误信封。客户端必须容忍未知字段（只加不改）；`message` 只供人类阅读，
        程序判断一律用 `type` / `code`，不得解析 `message` 文案。
      properties:
        error:
          type: object
          additionalProperties: true
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - rate_limit_error
                - not_found_error
                - conflict_error
                - protocol_error
                - server_error
                - upstream_error
            code:
              type: integer
              description: |
                数字错误码。已核实：`40301` 管理接口签名失败（recon/01:265）、
                `42601` 协议版本不兼容（recon/01:393）；已登记资金段
                `40910–40918`、`42210`、`42211`、`40201`。

                spec 1.2.0 新登记（按 00-conventions §5 码段，只加不改）：
                `40110` 登录凭据错误（M01）；`40013` 请求体超上限（HTTP 413 专用码）与
                `40919` 状态冲突通用码（HTTP 409 无更细码时）；`40305` 节点状态不允许该动作（M02）；
                账本 `40920–40924`、`42220–42223`（M06，见 §10.3 CR-L1）；
                `42401` step-up 缺失或过期（HTTP 424，M10 CR-3）；
                配置中心 `47001–47009`（47001 校验失败 / 47002 复核人 = 发起人 / 47003 键被未完结发布单锁定 /
                47004 危险键禁改 / 47005 冷却期未到 / 47006 目标版本不存在 / 47007 灰度或观测窗非法 /
                47008 发布窗口外 / 47009 需 step-up）。

                spec 1.2.1 新登记（M01 T2 已在用，仅文档补登；不改结构/响应/枚举）：
                `40103` 刷新令牌无效 / 已轮换或撤销（重放）/ 过期 → 重新登录（HTTP 401）；
                `40905` 一次性令牌失效（扫码票据 / 邀请令牌：已用、过期、票据与账户不匹配）→ 重新发起（HTTP 409）。

                spec 1.2.3 新登记（W2 通知 / 对账错误码，仅文档补登）：
                `40902` 不可退订 / 偏好冲突（M12：P0 通知不得退订，HTTP 409）；
                `49201` 对账批次不存在（404）/ `49202` 存在未结 P0·P1 不得签核（409）/
                `49203` 批次已签核或已关闭（409）/ `49204` 差异状态不允许该处置（409）/
                `49205` 同一期间 + batch_hash 已有 valid 凭证（409）/ `49206` 出款前凭证校验失败（403）/
                `49210` 报表周期非法或无数据（404）/ `49211` 渲染件不存在（404）/ `49212` 凭证不存在（404）。

                spec 1.2.2 新登记（M03 网关错误码，仅文档补登；不改结构 / 响应 / 枚举）：
                `42901` QPS 超限 / `42902` 每日花费上限（HTTP 429）；
                `44101` 流式中断、用量按估算（HTTP 441）；
                `45001` 统一错误模型自检失败兜底（HTTP 500）；
                `45201` 慢任务超 ETA / `45202` 需确认预估成本 / `45203` 组网准入不足（HTTP 408 / 202 / 403）；
                `50901` 无可用节点 / `50902` 上游超时 / `50903` 上游异常（HTTP 503 / 504 / 502）；
                `50904` 鉴权不可用（S1 过渡期用 503 + 45001 + reason=unavailable，登记后切换）；
                `40401` 资源不存在（HTTP 404 专用码，无更细码时）；`42601` 协议版本不兼容（HTTP 426）；
                `47010` 角色不足 / 越权（M10，HTTP 403；在 47002 之外区分「角色不足」与「复核人=发起人」）；
                `47011` 审计不可用（M10 → M16 接线后，HTTP 503；未接线前沿用 409 + 40919）。

                未登记的码一律不返回；新增码先改本 spec 与 04 码段表。其余以产品设计 §6.3 与附录 C.4 为准。
            message:
              type: string
              description: 人类可读，不含内部堆栈/规则细节/凭据。
            request_id:
              type: string
              format: uuid
            retry_after:
              type: integer
              minimum: 0
              description: 仅 429/503 有意义；与 `Retry-After` 头一致。
            reason:
              type: string
              enum: [rate_limited, quota_exceeded, account_restricted, policy_blocked]
              description: |
                粗粒度原因码，供客户端做退避与提示。**不含**判定细节；
                具体规则/阈值/名单在私有配置，不对外。

    Page:
      type: object
      required: [has_more]
      additionalProperties: true
      properties:
        cursor:
          type: string
          description: 本页起始游标（回显；首页为空）。
        has_more:
          type: boolean
        next_cursor:
          type: [string, 'null']
          description: 下一页游标；`has_more=false` 时为 `null`。

    # ------------------------------------------------------------ 网关
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
          maxLength: 1048576
        name:
          type: string

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model:
          type: string
          description: 模型 slug（不可变）。取自 `/v1/models`。
        messages:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stop:
          type: array
          items:
            type: string
        user:
          type: string
          description: 可选的调用方自定义稳定标识（用于防滥用去重，不留 PII）。

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      additionalProperties: true
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix 秒（UTC）。
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                enum: [stop, length, tool_calls, content_filter, upstream_error]
        usage:
          $ref: '#/components/schemas/Usage'

    Model:
      type: object
      additionalProperties: true
      required: [id, object, owned_by]
      properties:
        id:
          type: string
          description: 模型 slug。
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
        context_window:
          type: integer
        unit:
          type: string
          description: 计量单位（如 token）。
        price:
          type: object
          additionalProperties: true
          description: 公开参考价；结算是以账本分录为准，不以本字段为准。
          properties:
            amount:
              type: string
              description: 十进制字符串（不用浮点）。
            unit:
              type: string

    ModelList:
      type: object
      additionalProperties: true
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    BatchCreateRequest:
      type: object
      additionalProperties: true
      required: [kind, model, items]
      properties:
        kind:
          type: string
          enum: [chat, completion]
          description: 慢任务类型。
        model:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [custom_id]
            properties:
              custom_id:
                type: string
                maxLength: 128
              input:
                $ref: '#/components/schemas/ChatCompletionRequest'
        deadline_seconds:
          type: integer
          minimum: 60
          description: 期望完成时限（尽力而为，不构成 SLA）。
        webhook_url:
          type: string
          format: uri
          description: 完成回调（可选；回调带签名，禁止携带凭据）。
        metadata:
          type: object
          additionalProperties: true

    BatchAccepted:
      type: object
      additionalProperties: true
      required: [batch_id, status, eta_seconds]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        eta_seconds:
          type: integer
          minimum: 0
        cost_estimate:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本分录为准）。

    BatchStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
      description: 未知状态值必须被客户端容忍（只加不改）。

    Amount:
      type: object
      additionalProperties: true
      required: [amount, unit]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: 十进制字符串；不在客户端做浮点运算。
        unit:
          type: string
          description: 计量/计价单位（如 token、gpu_second、gb_hour）。

    Batch:
      type: object
      additionalProperties: true
      required: [batch_id, status, created_at]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        progress:
          type: object
          additionalProperties: true
          properties:
            completed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        eta_seconds:
          type: integer
          minimum: 0
        checkpoint_resumes:
          type: integer
          minimum: 0
          description: 检查点恢复次数（抢占/故障后恢复的计数）。
        results_ref:
          type: string
          description: 结果对象签名 URL（≤15 分钟有效）；过期需重新获取。
        cost_estimate:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本分录为准）。
        cost:
          type: object
          additionalProperties: true
          properties:
            estimated:
              $ref: '#/components/schemas/Amount'
            actual:
              $ref: '#/components/schemas/Amount'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    BatchCancelAck:
      type: object
      additionalProperties: true
      required: [batch_id, status]
      properties:
        batch_id:
          type: string
        status:
          $ref: '#/components/schemas/BatchStatus'
        canceled_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ 用方
    UsageSummary:
      type: object
      additionalProperties: true
      required: [period, totals, groups]
      properties:
        period:
          type: object
          additionalProperties: true
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        totals:
          type: object
          additionalProperties: true
          properties:
            requests:
              type: integer
              minimum: 0
            prompt_tokens:
              type: integer
              minimum: 0
            completion_tokens:
              type: integer
              minimum: 0
            billable:
              $ref: '#/components/schemas/Amount'
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [key]
            properties:
              key:
                type: string
                description: 分组键（模型 slug 或 UTC 日期）。
              requests:
                type: integer
                minimum: 0
              tokens:
                type: integer
                minimum: 0
              billable:
                $ref: '#/components/schemas/Amount'

    # ------------------------------------------------------------ 节点
    NodeRegisterRequest:
      type: object
      additionalProperties: true
      required: [platform, hardware_fingerprint, client_version, protocol_version]
      properties:
        platform:
          type: string
          enum: [macos, windows, linux]
        hardware_fingerprint:
          type: string
          description: |
            硬件指纹**哈希**（客户端本地计算）。平台不回传原值、不落明文；
            原始指纹不出客户设备。
        client_version:
          type: string
        protocol_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        capabilities:
          type: array
          items:
            type: string
        access_modes:
          type: array
          description: 申报的接入方式（A1 直填 Key / A2 本机代理 / B 企业网关）。
          items:
            type: string
            enum: [A1, A2, B]

    NodeRegisterResponse:
      type: object
      additionalProperties: true
      required: [node_id, state, policy_version, protocol_version, server_time]
      properties:
        node_id:
          type: string
        state:
          type: string
          enum: [pending, active, frozen, retired]
        policy_version:
          type: string
        protocol_version:
          type: string
        server_time:
          type: string
          format: date-time

    CapacityAnnouncement:
      type: object
      additionalProperties: true
      required: [kind, access, model, max_qps, unit]
      description: |
        容量公告（字段 capacity_announcement）；时序数据。
        `ask_price` 是节点要价，**不是**风控/评分权重。
      properties:
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
          description: 十进制字符串。
        unit:
          type: string
        resource_level:
          type: string

    NodeHeartbeatRequest:
      type: object
      additionalProperties: true
      required: [node_id, protocol_version, policy_version]
      properties:
        node_id:
          type: string
        protocol_version:
          type: string
        policy_version:
          type: string
        runtime_state:
          type: string
          description: |
            可选：客户端运行态自述（§5.9 未绑定 / 已上线 / 配额用尽 / 让路暂停 / 用户暂停 / 异常）。
            约定值 unbound / online / quota_exhausted / yield_paused / user_paused / error；
            **未知值忽略不报错**（服务端不落成枚举）。仅作调度输入，不参与信誉分计算。
        capacity:
          type: array
          items:
            $ref: '#/components/schemas/CapacityAnnouncement'
        load:
          type: object
          additionalProperties: true
          description: 可选的本机负载自述（仅用于调度输入，不参与信誉分计算）。
          properties:
            inflight:
              type: integer
              minimum: 0
            queue_seconds:
              type: number
              minimum: 0

    NodeHeartbeatResponse:
      type: object
      additionalProperties: true
      required: [server_time, protocol_version, policy_version]
      properties:
        server_time:
          type: string
          format: date-time
        protocol_version:
          type: string
        policy_version:
          type: string
        next_heartbeat_seconds:
          type: integer
          minimum: 1
        policy_updated:
          type: boolean
          description: 为 true 时客户端应立即拉取 `/api/v1/node/policy`。

    NodeUpstreamRequest:
      type: object
      additionalProperties: true
      required: [access_type, base_url, models]
      properties:
        access_type:
          type: string
          enum: [A1, A2, B]
          description: |
            A1 直填 Key（属直连）、A2 本机代理、B 企业网关。分类口径见正式文档
            「接入方式分类」；H1 约束的是**平台**（不下发/不上传/不托管凭据），
            不是客户端持有凭据。
        base_url:
          type: string
          format: uri
          description: 上游端点（可含路径）。不得带用户名/口令等 userinfo。
        models:
          type: array
          minItems: 1
          items:
            type: string
        credential_handle:
          type: string
          description: |
            **本地**凭据句柄（客户端内部标识，如 keychain 条目名）。服务端不解析、
            不存储、不回显；凭据本体永不上行（H1）。
        protocol:
          type: string
          description: 上游协议（如 openai-chat）。未知值按适配器容错处理。

    NodeUpstreamResponse:
      type: object
      additionalProperties: true
      required: [upstream_id, state, models_declared]
      properties:
        upstream_id:
          type: string
        state:
          type: string
          enum: [declared, probing, verified, rejected]
        models_declared:
          type: array
          items:
            type: string
        probe_hint:
          type: string
          description: 提示本地发起体检（`/api/v1/node/upstream/probe`），不在服务端探。

    ReceiptInput:
      type: object
      additionalProperties: true
      required:
        - receipt_id
        - task_id
        - access
        - usage
        - price
        - sig_provider
        - sig_consumer
      properties:
        receipt_id:
          type: string
        task_id:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        usage:
          type: object
          additionalProperties: true
          required: [amount, unit]
          properties:
            amount:
              type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
            unit:
              type: string
        price:
          $ref: '#/components/schemas/Amount'
        sig_provider:
          type: string
          description: 供方签名（对收据规范字段的签名；算法随协议版本，见协议仓）。
        sig_consumer:
          type: string
          description: 需方签名。双签缺一即拒收。
        usage_source:
          type: string
          enum: [client_reported, server_measured, dual]
        task_kind:
          type: string

    ReceiptBatchRequest:
      type: object
      additionalProperties: false
      required: [receipts]
      properties:
        receipts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReceiptInput'

    RejectedReceipt:
      type: object
      additionalProperties: true
      required: [receipt_id, code, message]
      properties:
        receipt_id:
          type: string
        code:
          type: integer
        message:
          type: string
          description: 拒绝原因（只描述契约问题，如签名不匹配/字段缺失）。

    ReceiptBatchResponse:
      type: object
      additionalProperties: true
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items:
            type: string
            description: 已受理的 receipt_id。
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedReceipt'

    NodePolicy:
      type: object
      additionalProperties: true
      required: [policy_version, protocol_version, issued_at]
      properties:
        policy_version:
          type: string
          description: 策略版本号（与 protocol_version 不是一回事）。
        protocol_version:
          type: string
        issued_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        digest:
          type: string
          description: 策略包摘要（用于校验下发内容未被篡改）。
        quotas:
          type: array
          description: |
            配额**结构**由 spec 定义，具体数值由服务端按节点下发（私有配置）。
            客户端不得内置默认值。
          items:
            type: object
            additionalProperties: true
            required: [name, window_seconds]
            properties:
              name:
                type: string
              window_seconds:
                type: integer
                minimum: 1
              value:
                type: integer
                description: 窗口内额度；值由服务端给出，spec 不规定。
        directives:
          type: array
          description: 可选指令（如暂停接单、要求升级）；未知指令必须忽略。
          items:
            type: string

    # ------------------------------------------------------------ 协议
    ProtocolCapabilities:
      type: object
      additionalProperties: true
      required: [protocol_version, min_supported_version, capabilities, server_time]
      properties:
        protocol_version:
          type: string
        min_supported_version:
          type: string
          description: 服务端仍接受的最低版本；低于此值返回 426。
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, version]
            properties:
              id:
                type: string
                description: 能力标识（如 `chat_completions`、`batch`、`receipts`）。
              version:
                type: string
              status:
                type: string
                enum: [stable, beta, deprecated]
        server_time:
          type: string
          format: date-time

    DeprecationList:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [path, method, deprecated_at, sunset_at]
            properties:
              path:
                type: string
              method:
                type: string
              deprecated_at:
                type: string
                format: date-time
              sunset_at:
                type: string
                format: date-time
                description: 退役日期；提前 ≥90 天公示，且至少跨 2 个 MAJOR。
              replacement:
                type: string
                description: 替代端点/字段（无替代时为空）。
              supported_majors:
                type: array
                items:
                  type: string

    # ------------------------------------------------------------ 调度快照
    SnapshotNode:
      type: object
      additionalProperties: true
      required: [node_id, kind, access, model, max_qps, unit]
      description: 快照里的单条容量公告（**输入**，不含评分/权重/淘汰原因）。
      properties:
        node_id:
          type: string
        kind:
          type: string
        access:
          type: string
          enum: [A1, A2, B]
        model:
          type: string
        max_qps:
          type: number
          minimum: 0
        ask_price:
          type: string
        unit:
          type: string
        resource_level:
          type: string

    ScheduleSnapshot:
      type: object
      additionalProperties: true
      required: [period, quote_version, published_at, nodes]
      properties:
        period:
          type: string
          format: date
        quote_version:
          type: string
          description: 报价版本（复算输入的一部分）。
        published_at:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNode'
        verify_url:
          type: string
          format: uri
          description: 对应周期的 Merkle 根与复算工具（`/verify/{period}`）。

    # ------------------------------------------------------------ 账本
    LedgerEntry:
      type: object
      additionalProperties: true
      required:
        - entry_id
        - entry_type
        - unit_type
        - channel_id
        - asset_ref
        - amount
        - status
        - policy_version
      description: |
        账本分录（只追加）。语义字段（`entry_type` / `unit_type` /
        `status`）语义不因版本改变；旧分录永远可复算。
      properties:
        entry_id:
          type: string
        entry_type:
          type: string
        unit_type:
          type: string
        channel_id:
          type: string
        asset_ref:
          type: string
        amount:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        ref_id:
          type: string
        quality_coef:
          type: string
        stability_coef:
          type: string
        status:
          type: string
          enum: [pending, confirmed, locked, settled, void]
          description: |
            分录状态。与产品设计 §20.4 对齐：pending → confirmed → locked → settled；
            异常终止为 void；冲正不改原分录，新增 reverse_of 指向原 entry_id。
            reversed 退役（v1 未发布，无兼容负担）；客户端仍须容忍未知值。
        lock_until:
          type: string
          format: date-time
        reverse_of:
          type: [string, 'null']
          description: 冲正指向的原始 `entry_id`；非冲正为 null。
        policy_version:
          type: string
        created_at:
          type: string
          format: date-time

    LedgerEntriesPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        page:
          $ref: '#/components/schemas/Page'

    ConfigItem:
      type: object
      additionalProperties: true
      required: [key, scope, version, value_type, state, updated_at]
      properties:
        key:
          type: string
        scope:
          type: string
          description: 作用域（global / chain / tier / bucket 等）
        version:
          type: integer
          minimum: 1
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        value:
          description: 非敏感配置值；敏感项必须为空，只给 `secret_ref` 或脱敏摘要。
        secret_ref:
          type: [string, 'null']
          description: 敏感值的引用（KMS/密钥库路径），不是明文。
        state:
          type: string
          enum: [draft, active, rolled_back, retired]
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    ConfigItemPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigItem'
        page:
          $ref: '#/components/schemas/Page'

    ConfigDraftRequest:
      type: object
      additionalProperties: false
      required: [value_type, reason]
      properties:
        value:
          description: 非敏感值；敏感项改用 `secret_ref`。
        secret_ref:
          type: string
        value_type:
          type: string
          enum: [string, integer, number, boolean, json]
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        effective_at:
          type: string
          format: date-time

    ConfigPublishRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 4
        ticket:
          type: string
        gray_plan:
          type: object
          additionalProperties: false
          properties:
            buckets:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 100
            observation_seconds:
              type: integer
              minimum: 60

    ConfigApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 4

    ConfigRollbackRequest:
      type: object
      additionalProperties: false
      required: [target_version, reason]
      properties:
        target_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 4
        ticket:
          type: string

    ConfigKillSwitchRequest:
      type: object
      additionalProperties: false
      required: [reason, ttl_seconds]
      properties:
        reason:
          type: string
          minLength: 4
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: 到期自动回到上一生效版本；上限 24h。
        tighten_only:
          type: boolean
          enum: [true]
          description: 只允许收紧；借开关放开权限/阈值必须拒绝。

    ConfigPublishAck:
      type: object
      additionalProperties: true
      required: [request_id, state]
      properties:
        request_id:
          type: string
        state:
          type: string
          enum:
            - pending_approval
            - approved
            - scheduled
            - rolling_out
            - active
            - rejected
            - expired
            - cancelled
            - rolled_back
            - failed
          description: |
            发布单状态机：pending_approval → approved → scheduled → rolling_out → active；
            终止态 rejected / expired / cancelled / rolled_back / failed。
            `expired` **不自动放行**。
        version:
          type: integer
          minimum: 1
        effective_at:
          type: string
          format: date-time
        approvals_required:
          type: integer
          minimum: 1
        approvals_received:
          type: integer
          minimum: 0

    ConfigDrift:
      type: object
      additionalProperties: true
      required: [key, detected_at]
      properties:
        key:
          type: string
        scope:
          type: string
        desired_version:
          type: integer
        effective_version:
          type: integer
        running_version:
          type: integer
        detected_at:
          type: string
          format: date-time

    ConfigDriftList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDrift'
        page:
          $ref: '#/components/schemas/Page'

    SourceType:
      type: string
      description: |
        记账网关维护的 `source_type` 白名单（16 值，TEC-02）。用于 journal 幂等键
        `(source_type, source_id, event_seq)`。属**版本化枚举**：新增值按 MINOR 先改 spec，
        客户端必须容忍未知值（读路径遇未知值由服务端拒绝，不静默记账）。
      enum:
        - chain_tx
        - payment_attempt
        - conversion_trade
        - usage_settle
        - lock_expiry
        - payout_accrual
        - payout_item
        - payout_batch
        - wallet_transfer
        - refund
        - chargeback
        - rebate
        - fx_reval
        - loss_pool
        - void
        - unidentified

    NotificationPreferences:
      type: object
      additionalProperties: true
      required: [email, in_app, webhook]
      properties:
        email: { type: boolean }
        in_app: { type: boolean }
        webhook: { type: boolean }
        quiet_hours:
          type: object
          additionalProperties: false
          properties:
            start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
            timezone: { type: string }
        digest:
          type: string
          enum: [realtime, daily, weekly]
        p0_opt_out:
          type: boolean
          enum: [false]
          description: P0 通知不可退订；写入 true 返回 `40902`。

    WebhookSubscription:
      type: object
      additionalProperties: true
      required: [id, url, events, status]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        status:
          type: string
          enum: [active, paused, disabled]
        created_at: { type: string, format: date-time }

    WebhookSubscriptionList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookSubscription' }
        page: { $ref: '#/components/schemas/Page' }

    WebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [task.completed, task.failed, payment.settled, payout.sent, security.alert]
        description: { type: string, maxLength: 200 }

    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 签名密钥，**仅创建时返回一次**；服务端只存哈希。

    QuoteSettings:
      type: object
      additionalProperties: true
      required: [min_price, max_price, currency]
      properties:
        min_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        max_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, enum: [USD] }
        updated_at: { type: string, format: date-time }
      description: 区间整体替换（PUT 覆盖式）；用方为出价范围，供方为价格范围。

    ReportEnvelope:
      type: object
      additionalProperties: true
      required: [report_id, period, generated_at]
      properties:
        report_id:
          type: string
          enum: [REP-01, REP-02, REP-03, REP-04, REP-06]
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: 自然月 `YYYY-MM`（与 `/verify/{period}` 同粒度；审计锚定日是日粒度）。
        generated_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: 报表主体（字段随 report_id 不同，见 v4 §23.2）。

    TreasuryIntent:
      type: object
      additionalProperties: true
      required: [intent_id, kind, chain_id, expires_at, nonce]
      properties:
        intent_id: { type: string }
        kind:
          type: string
          enum: [PAYOUT, REFUND, SWEEP, REBALANCE, GAS_TOPUP, POLICY_CHANGE, RECOVERY, WALLET_PROVISION]
          description: 第八个取值 `WALLET_PROVISION` 属追加枚举；不复用 `POLICY_CHANGE`。
        chain_id: { type: integer }
        wallet_id: { type: string }
        amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        expires_at: { type: string, format: date-time }
        nonce: { type: integer, minimum: 0 }
        policy_version: { type: string }

    Wallet:
      type: object
      additionalProperties: true
      required: [wallet_id, status]
      properties:
        wallet_id: { type: string }
        status:
          type: string
          enum: [active, paused, draining, retired, provisioning, zero, frozen]
          description: 四值基线 + 退休四步中间态 `provisioning / zero / frozen`；共七值。
        switch_state:
          type: string
          enum: [standby, in_service, switching_out, draining]
          description: 仅对 `active` 有意义。
        fund_class: { type: string, enum: [hot, warm, cold] }
        balance: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }

    SigningEvent:
      type: object
      additionalProperties: true
      required: [signing_event_id, signing_request_id, event, occurred_at]
      properties:
        signing_event_id: { type: string }
        signing_request_id: { type: string }
        event:
          type: string
          enum: [requested, presented, signed, verified, co_signed, broadcast]
        signer_type: { type: string, enum: [owner, reviewer, company] }
        signer_ref: { type: string }
        signature_hash: { type: string }
        device_id: { type: string }
        auth_hash: { type: string }
        txid: { type: string }
        error_code: { type: integer }
        occurred_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 身份与租户（M01，spec 1.2.0）
    AuthTokens:
      type: object
      additionalProperties: true
      required: [access_token, refresh_token, token_type, expires_in]
      description: 会话令牌对。`refresh_token` 一次性轮换，旧令牌重放按 `40103` 处理并要求重新登录。
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          minimum: 1
          description: access_token 剩余有效期（秒）。
        session_id: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    LoginRequest:
      type: object
      additionalProperties: true
      required: [method, identifier]
      description: 登录入参。`secret` 只上行一次，**不得**进日志、事件或 fixtures。
      properties:
        method:
          type: string
          enum: [password, oauth, sms_code]
        identifier:
          type: string
          description: 邮箱或手机号（服务端只存不可逆哈希与掩码，不回传原文）。
        secret:
          type: string
          description: 口令或一次性验证码；失败不区分「账号不存在 / 口令错误」。
        provider:
          type: string
          description: OAuth 提供方（`method=oauth` 时必填）。
        device_id: { type: string }
        mfa_code:
          type: string
          description: 二次认证码（账号启用 MFA 时必填）。

    LoginResponse:
      type: object
      additionalProperties: true
      required: [tokens, account, mfa_required]
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        account:
          $ref: '#/components/schemas/AccountProfile'
        mfa_required:
          type: boolean
          description: 为 true 时 `tokens.access_token` 只可用于 step-up，不能调用业务接口。

    RefreshRequest:
      type: object
      additionalProperties: true
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      additionalProperties: true
      properties:
        refresh_token:
          type: string
          description: 可选；不带时按当前 access_token 定位会话。
        all_devices:
          type: boolean
          default: false
          description: 为 true 时撤销该账号全部会话（`session_epoch++`）。

    LogoutAck:
      type: object
      additionalProperties: true
      required: [revoked_sessions, revoked_at]
      properties:
        revoked_sessions:
          type: integer
          minimum: 0
        revoked_at: { type: string, format: date-time }

    AccountProfile:
      type: object
      additionalProperties: true
      required: [account_id, tenant_id, state, roles, created_at]
      description: |
        账户与租户视图（脱敏）。`balance` 是 M06 `account_balances` 的只读镜像，
        结算与对账一律以账本分录为准。
      properties:
        account_id: { type: string }
        tenant_id: { type: string }
        display_name: { type: string }
        locale:
          type: string
          description: BCP 47 语言标签（如 `zh-CN`）。
        state:
          type: string
          enum: [pending_verify, normal, frozen, closing, closed]
          description: 五态机；`closing` / `closed` 只读。客户端须容忍未知值。
        frozen_until:
          type: [string, 'null']
          format: date-time
          description: 冻结到期（`state=frozen` 时非空，≤180 天）。
        roles:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
          description: 后台八角色（03-facts §5）；普通用方为空数组。
        balance:
          $ref: '#/components/schemas/Amount'
        created_at: { type: string, format: date-time }

    AccountProfileUpdateRequest:
      type: object
      additionalProperties: true
      minProperties: 1
      description: 只允许展示类字段；身份字段（account_id / tenant_id / state）不可经此改。
      properties:
        display_name:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 16

    ApiKeySummary:
      type: object
      additionalProperties: true
      required: [key_id, prefix, created_at]
      description: Key 元数据。**永不**返回明文或哈希。
      properties:
        key_id: { type: string }
        prefix:
          type: string
          description: 8 位前缀（仅展示与排障）。
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        qps:
          type: integer
          minimum: 1
        revoked_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    ApiKeyPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        page:
          $ref: '#/components/schemas/Page'

    ApiKeyCreateRequest:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
        scopes:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }

    ApiKeyCreated:
      type: object
      additionalProperties: true
      required: [key_id, key, prefix, created_at]
      description: 创建 / 轮换响应。`key` 只在本次响应出现一次，平台只存 `sha256(key)`。
      properties:
        key_id: { type: string }
        key: { type: string }
        prefix: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ApiKeyRotateRequest:
      type: object
      additionalProperties: true
      properties:
        name: { type: string }
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: 旧钥重叠期（≤24 h）；重叠期内旧钥只验签、不接受新注册。

    AccountStateChangeRequest:
      type: object
      additionalProperties: true
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
        frozen_until:
          type: string
          format: date-time
          description: 冻结必填（≤180 天）；解冻忽略此字段。
        evidence_ref:
          type: string
          description: 证据引用（工单 / 案件号），不得写入 PII。

    AccountStateAck:
      type: object
      additionalProperties: true
      required: [account_id, state, changed_at]
      properties:
        account_id: { type: string }
        state:
          type: string
          enum: [pending_verify, normal, frozen, closing, closed]
        frozen_until:
          type: [string, 'null']
          format: date-time
        changed_at: { type: string, format: date-time }

    AccountRoleChangeRequest:
      type: object
      additionalProperties: true
      required: [reason, second_approver]
      properties:
        grant:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        revoke:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        scope:
          type: string
          description: 角色作用域（如 global / tenant:<id>）。
        reason:
          type: string
          maxLength: 500
        second_approver:
          type: string
          description: 复核人（≠ 操作人）；缺失或不一致 → 409 + `40902`。

    AccountRoles:
      type: object
      additionalProperties: true
      required: [account_id, roles, session_epoch]
      properties:
        account_id: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [SUPER, SVC, OPS, AUDIT, RISK, FIN, CS, VIEWER]
        session_epoch:
          type: integer
          minimum: 1
          description: 角色变更后 +1；旧会话凭 epoch 不符返回 401 + `40102`。

    TenantQuotaEntry:
      type: object
      additionalProperties: true
      required: [kind, value]
      properties:
        kind:
          type: string
          description: 配额种类（如 concurrency / daily_spend / qps）。
        value:
          description: 配额值（数值或结构化阈值；单位见 `unit`）。
        unit: { type: string }
        key_id:
          type: string
          description: 可选，配额下钻到单个 API Key。

    TenantQuotasRequest:
      type: object
      additionalProperties: true
      required: [quotas, reason]
      properties:
        quotas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TenantQuotaEntry'
        reason:
          type: string
          maxLength: 500
        second_approver:
          type: string
          description: 升配额超阈值时必填（FIN 复核）；降配额可缺省。

    TenantQuotasAck:
      type: object
      additionalProperties: true
      required: [tenant_id, quotas, policy_version]
      properties:
        tenant_id: { type: string }
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/TenantQuotaEntry'
        policy_version:
          type: string
          description: 配额变更生成新版本，随请求写入，不覆盖历史。
        effective_at: { type: string, format: date-time }

    ScanStatus:
      type: object
      additionalProperties: true
      required: [status, expires_at, retry_after_s]
      description: |
        扫码登录票据的轮询状态（一次性票据，中间态 TTL ≤120 s）。票据只存 `sha256(ticket)`，
        明文只出现在二维码里一次，不落库、不落日志。`202` 响应**顶层**即本 schema 的三个字段；
        过渡期另带 `scan` 同值包裹（`additionalProperties: true` 允许，客户端读顶层）。
        正常收尾：`confirmed` 后下一次轮询返回 `200` 令牌；过期 / 已用 / 未知票据返回
        `409` + `40905`。202 中实际可见 `pending` 与 `scanned`；M01-T2 已把内部 `created`
        映射为对外 `pending`。
      properties:
        status:
          type: string
          enum: [pending, created, scanned, confirmed, expired]
          description: |
            票据状态。`created` 是 M01-T2 更早的内部实现值，与 `pending` **同义**；对外已映射为
            `pending`（S1 保留同义值，S2 前收敛，见 CR-5），客户端两者都必须接受。
            `confirmed` / `expired` 保留以覆盖同义实现，正常收尾分别为 `200` / `409`。
            未知值忽略不报错（tolerant reader，只加不改）。
        expires_at:
          type: string
          format: date-time
          description: 票据到期时间（UTC）；到期后必须重新发起扫码，不得续期。
        retry_after_s:
          type: integer
          minimum: 1
          description: 建议轮询间隔（秒）；实现取 min(5, 剩余秒)，下限 1。

    # ------------------------------------------------------------ 节点供给（M02，spec 1.2.0）
    NodePairRequest:
      type: object
      additionalProperties: true
      required: [node_id]
      properties:
        node_id: { type: string }
        rotate:
          type: boolean
          default: false
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: 轮换重叠期（≤24 h）；重叠期内旧钥只验签。

    NodePairResponse:
      type: object
      additionalProperties: true
      required: [node_id, key_id, client_key, created_at]
      description: 'client_key` 只在本次响应出现一次；平台只存 `sha256(key)` 与 8 位前缀。'
      properties:
        node_id: { type: string }
        key_id: { type: string }
        client_key: { type: string }
        key_prefix: { type: string }
        previous_key_expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    NodeBinding:
      type: object
      additionalProperties: true
      required: [node_id, state]
      description: 一个节点同时只有一条有效绑定；解绑 / 换绑不删除历史收据与锁定收益。
      properties:
        node_id: { type: string }
        state:
          type: string
          enum: [unbound, pending, bound, revoked]
        bound_account_id:
          type: [string, 'null']
        bound_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time

    NodeBindingRequest:
      type: object
      additionalProperties: true
      required: [node_id, code]
      properties:
        node_id: { type: string }
        code:
          type: string
          description: 一次性绑定码（网页端生成；一次性、短时效）。
        account_id:
          type: string
          description: 可选；缺省绑定到当前会话账户。

    NodeProbeReport:
      type: object
      additionalProperties: true
      required: [upstream_id, reachable, checked_at]
      description: |
        本地体检**结论**（服务端不发起探测）。只收结论与耗时，
        **不收**凭据、上游响应正文或模型输出。
      properties:
        upstream_id: { type: string }
        reachable: { type: boolean }
        latency_ms:
          type: integer
          minimum: 0
        error_class:
          type: string
          description: 粗粒度错误分类（如 timeout / tls / auth / model_missing），不含细节。
        model_checks:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [model, ok]
            properties:
              model: { type: string }
              ok: { type: boolean }
              error_class: { type: string }
        checked_at: { type: string, format: date-time }

    NodeProbeAck:
      type: object
      additionalProperties: true
      required: [upstream_id, state, recorded_at]
      properties:
        upstream_id: { type: string }
        state:
          type: string
          enum: [declared, probing, verified, rejected]
        rejected_reason_code: { type: string }
        recorded_at: { type: string, format: date-time }

    NodeReviewRequest:
      type: object
      additionalProperties: true
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
          description: approve → `pending → active`；reject 保留 `pending` 并通知。
        reason:
          type: string
          maxLength: 500
        tier:
          type: string
          description: 可选准入档位（用于下发初始策略，不改变状态机）。

    NodeReviewAck:
      type: object
      additionalProperties: true
      required: [node_id, state, reviewed_at]
      properties:
        node_id: { type: string }
        state:
          type: string
          enum: [pending, active, frozen, retired]
        reviewed_at: { type: string, format: date-time }
        policy_version:
          type: string
          description: 准入通过后生成的策略版本（客户端据此拉取策略）。

    # ------------------------------------------------------------ 调度与定价（M04，spec 1.2.0）
    RouteRequest:
      type: object
      additionalProperties: true
      required: [model, kind]
      description: 路由输入。选填项缺省时取快照默认值；金额一律十进制字符串（Amount）。
      properties:
        model: { type: string }
        kind:
          type: string
          enum: [realtime, batch]
          description: 只允许 realtime 抢 batch；batch 互不抢占（INV-09）。
        requested_tokens:
          type: integer
          minimum: 1
        deadline_seconds:
          type: integer
          minimum: 1
        required_access:
          type: array
          items:
            type: string
            enum: [A1, A2, B]
        max_price:
          $ref: '#/components/schemas/Amount'
        tenant_id: { type: string }
        trace_id:
          type: string
          description: 调用方链路标识（与 `X-Request-Id` 一致时便于关联）。

    RouteChosen:
      type: object
      additionalProperties: true
      required: [node_id, upstream_id, access, model]
      properties:
        node_id: { type: string }
        upstream_id: { type: string }
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }

    RouteDecision:
      type: object
      additionalProperties: true
      required: [decision_id, chosen, quote_version, decided_at]
      description: |
        只追加的决策记录。相同 (`snapshot_ts`,`quote_version`,`policy_version`,`request_digest`)
        必得同一决策；**不含**评分权重、阈值与正文。
      properties:
        decision_id: { type: string }
        chosen:
          $ref: '#/components/schemas/RouteChosen'
        eta_seconds:
          type: integer
          minimum: 0
        price:
          $ref: '#/components/schemas/Amount'
        price_saved_pct:
          type: number
          minimum: 0
          maximum: 100
          description: 可选；相对公开参考价的节省比例（仅展示，结算以账本为准）。
        quote_version: { type: string }
        policy_version: { type: string }
        snapshot_ts: { type: string, format: date-time }
        tie_break:
          type: string
          description: 固定顺序：内网亲和 → 质量系数 → node_id 字典序；不含平台收入因子。
        fallback_used: { type: boolean }
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/RouteChosen'
        eliminated:
          type: array
          description: 淘汰候选与**粗粒度淘汰码**（不含阈值）。
          items:
            type: object
            additionalProperties: true
            required: [node_id, reason_code]
            properties:
              node_id: { type: string }
              reason_code: { type: string }
        decided_at: { type: string, format: date-time }

    ReplayRequest:
      type: object
      additionalProperties: true
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        kind:
          type: string
          enum: [realtime, batch]
        decision_ids:
          type: array
          description: 可选；只复算指定决策（缺省复算窗口内全部）。
          items: { type: string }

    ReplayAccepted:
      type: object
      additionalProperties: true
      required: [job_id, state, requested_at]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        decisions_total:
          type: integer
          minimum: 0
        requested_at: { type: string, format: date-time }


    # ------------------------------------------------------------ 定价补充（M04 §4.1，AH-1）
    QuoteRequest:
      type: object
      additionalProperties: true
      required: [access, model, unit, ttl_s]
      description: 供方区间报价。区间可单边缺省（缺省端按 0 / 不设上限处理）。
      properties:
        node_id:
          type: string
          description: 可选；缺省按当前 `X-Client-Key` 对应节点。
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }
        unit:
          type: string
          description: 计量单位（与 Amount.unit 一致，如 token）。
        price_min:
          $ref: '#/components/schemas/Amount'
        price_max:
          $ref: '#/components/schemas/Amount'
        ttl_s:
          type: integer
          minimum: 1
          description: 报价有效期（秒）；到期转 `expired`，不复活。

    QuoteAck:
      type: object
      additionalProperties: true
      required: [quote_id, state, quote_version, expires_at]
      properties:
        quote_id: { type: string }
        state:
          type: string
          enum: [active, consumed, expired]
        quote_version: { type: string }
        expires_at: { type: string, format: date-time }

    BidRequest:
      type: object
      additionalProperties: true
      required: [model]
      description: 用方区间出价。未设端取 0 / 不设上限（单边比较，INV-01）。
      properties:
        model: { type: string }
        min_price:
          $ref: '#/components/schemas/Amount'
        max_price:
          $ref: '#/components/schemas/Amount'
        strategy:
          type: string
          enum: [mid, floor, ceiling]
          description: 取价策略（mid 默认 / floor 冷启动 / ceiling 供给紧张）。
        window_seconds:
          type: integer
          minimum: 1
          description: 出价有效窗口（秒）。

    BidAck:
      type: object
      additionalProperties: true
      required: [bid_id, state, expires_at]
      properties:
        bid_id: { type: string }
        state:
          type: string
          enum: [active, expired]
        expires_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 计量与收据（M05，spec 1.2.0）
    UsageRecord:
      type: object
      additionalProperties: true
      required: [usage_id, request_id, state, recorded_at]
      description: 用量明细（逐次调用）。只含元数据与金额，**不含** prompt / response 正文。
      properties:
        usage_id: { type: string }
        request_id: { type: string }
        attempt_no:
          type: integer
          minimum: 1
        node_id: { type: string }
        model: { type: string }
        access:
          type: string
          enum: [A1, A2, B]
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        amount:
          $ref: '#/components/schemas/Amount'
        usage_source:
          type: string
          enum: [client_reported, server_measured, dual, estimated]
        state:
          type: string
          enum: [recorded, settled, corrected]
        receipt_id: { type: string }
        correction_id:
          type: [string, 'null']
          description: 'state=corrected` 时指向追加的校正记录。'
        recorded_at: { type: string, format: date-time }

    UsageRecordPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        page:
          $ref: '#/components/schemas/Page'

    ReceiptStatus:
      type: object
      additionalProperties: true
      required: [receipt_id, state, received_at]
      description: 收据受理状态（节点自查）。`duplicate` 返回首次结果，不重复计量。
      properties:
        receipt_id: { type: string }
        state:
          type: string
          enum: [accepted, rejected, duplicate, expired]
        code:
          type: integer
          description: 拒绝 / 过期时的数字错误码（如 `46001` 签名不匹配）。
        message:
          type: string
          description: 只描述契约问题（签名 / 字段），不含内部细节。
        received_at: { type: string, format: date-time }
        settled_at:
          type: [string, 'null']
          format: date-time

    UpstreamBillRow:
      type: object
      additionalProperties: true
      required: [row_id, amount]
      properties:
        row_id:
          type: string
          description: 上游账单行号（幂等键的一半：(usage_id, upstream_bill_id)）。
        access:
          type: string
          enum: [A1, A2, B]
        model: { type: string }
        usage_id: { type: string }
        amount:
          $ref: '#/components/schemas/Amount'

    RejectedBillRow:
      type: object
      additionalProperties: true
      required: [row_id, code, message]
      properties:
        row_id: { type: string }
        code: { type: integer }
        message: { type: string }

    UpstreamBillImportRequest:
      type: object
      additionalProperties: true
      required: [provider, period, rows]
      description: 逐行受理，单行失败不回滚整批；导入只追加，不覆盖原用量。
      properties:
        provider:
          type: string
          description: 上游供应方标识。
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
        checksum:
          type: string
          description: 账单文件校验和（用于重放检测；同名同校验和重复导入幂等）。
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/UpstreamBillRow'

    UpstreamBillImportAck:
      type: object
      additionalProperties: true
      required: [import_id, rows_accepted, rows_rejected, imported_at]
      properties:
        import_id: { type: string }
        rows_accepted:
          type: integer
          minimum: 0
        rows_rejected:
          type: integer
          minimum: 0
        total_amount:
          $ref: '#/components/schemas/Amount'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedBillRow'
        imported_at: { type: string, format: date-time }

    UsageCorrectionRequest:
      type: object
      additionalProperties: true
      required: [usage_id, delta, reason_code]
      description: |
        校正只追加（不改历史行）。校正额 ≥50 USD 时 `second_approver` 必填且 ≠ 操作人；
        负向校正（退款方向）必须人工复核。
      properties:
        usage_id: { type: string }
        upstream_bill_id: { type: string }
        delta:
          $ref: '#/components/schemas/Amount'
        reason_code: { type: string }
        evidence_ref: { type: string }
        second_approver: { type: string }

    UsageCorrectionAck:
      type: object
      additionalProperties: true
      required: [correction_id, state]
      properties:
        correction_id: { type: string }
        state:
          type: string
          enum: [proposed, applied, rejected]
        applied_at:
          type: [string, 'null']
          format: date-time

    # ------------------------------------------------------------ 账本管理面（M06，spec 1.2.0）
    TrialBalanceLine:
      type: object
      additionalProperties: true
      required: [coa_code, debit, credit]
      properties:
        coa_code: { type: string }
        name: { type: string }
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        debit:
          $ref: '#/components/schemas/Amount'
        credit:
          $ref: '#/components/schemas/Amount'
        balance:
          $ref: '#/components/schemas/Amount'

    TrialBalance:
      type: object
      additionalProperties: true
      required: [as_of, unit_type, balanced, totals, accounts]
      description: 试算平衡。`balanced=false` 即 P0，账本转只读且**不自动修数据**。
      properties:
        as_of: { type: string, format: date-time }
        unit_type:
          type: string
          description: 币种维度；COP 与 USD 不互转，借贷平衡只在本 unit_type 内判定。
        balanced: { type: boolean }
        totals:
          type: object
          additionalProperties: true
          required: [debit, credit]
          properties:
            debit:
              $ref: '#/components/schemas/Amount'
            credit:
              $ref: '#/components/schemas/Amount'
        tail_diff:
          $ref: '#/components/schemas/Amount'
        entry_count:
          type: integer
          minimum: 0
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/TrialBalanceLine'

    LedgerAccount:
      type: object
      additionalProperties: true
      required: [coa_code, unit_type, balance]
      description: 科目与派生余额（`account_balances` 为唯一余额源，可由分录全量重建）。
      properties:
        coa_code: { type: string }
        name: { type: string }
        unit_type: { type: string }
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        balance:
          $ref: '#/components/schemas/Amount'
        updated_at: { type: string, format: date-time }

    LedgerAccountPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        page:
          $ref: '#/components/schemas/Page'

    MerkleCommitment:
      type: object
      additionalProperties: true
      required: [period, kind, root, entry_count, published_at]
      description: 期间根。可由当期分录重算复现；发布后不可改（INV-13）。
      properties:
        period:
          type: string
          description: 锚定周期；日 `YYYY-MM-DD` 或小时 `YYYY-MM-DDTHH`。
        kind:
          type: string
          enum: [journal, daily_close]
          description: M06 负责 journal / daily_close 两类根；audit / por 根归 M16 / M09。
        root:
          type: string
          description: Merkle 根（十六进制）。
        entry_count:
          type: integer
          minimum: 0
        published_at: { type: string, format: date-time }
        reproducible:
          type: boolean
          description: 重算一致为 true；false 表示存在差异（P0，转只读）。
        verify_hint:
          type: string
          description: 重算所需的只读入口提示（不返回内部算法参数）。

    RecomputeRequest:
      type: object
      additionalProperties: true
      description: 全量复算入参。复算只读，不修数据；`dry_run` 默认 true。
      properties:
        period:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}(-[0-9]{2}(T[0-9]{2})?)?$'
          description: 可选；缺省复算全部期间。
        scope:
          type: string
          enum: [period, all]
          default: all
        dry_run:
          type: boolean
          default: true
          description: 为 false 时发布校验结果（仍不修数据）。

    RecomputeAck:
      type: object
      additionalProperties: true
      required: [job_id, state, requested_at]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        dry_run: { type: boolean }
        diff_count:
          type: integer
          minimum: 0
          description: 差异条数；≠0 即 P0，冻结账本写入口。
        verified: { type: boolean }
        requested_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 账本凭证与冲正（M06 §4.1，AH-1）
    JournalLine:
      type: object
      additionalProperties: true
      required: [line_no, coa_code, dc, amount]
      properties:
        line_no:
          type: integer
          minimum: 1
        ledger_entry_id: { type: string }
        account_id: { type: string }
        coa_code:
          type: string
          description: 科目代码（42 条白名单内；未知科目读路径报错，不静默跳过）。
        dc:
          type: string
          enum: [debit, credit]
          description: 借贷方向（库内 `D` / `C`，对外统一为 debit / credit）。
        amount:
          $ref: '#/components/schemas/Amount'
        fund_class:
          type: string
          enum: [CLIENT, PLATFORM, FEE]
        wallet_id: { type: string }

    JournalVoucher:
      type: object
      additionalProperties: true
      required: [journal_id, ts, state, lines]
      description: 凭证（一次资金事件的凭证）。只有 posted / voided 两种状态，禁止覆盖写。
      properties:
        journal_id: { type: string }
        ts: { type: string, format: date-time }
        unit_type:
          type: string
          description: 币种维度；借贷平衡只在本 unit_type 内判定。
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_id: { type: string }
        event_seq:
          type: integer
          minimum: 1
        policy_version: { type: string }
        fx_rate_ref: { type: string }
        reversal_of_journal:
          type: [string, 'null']
          description: 冲正指向的原凭证；非冲正为 null。
        reverse_chain:
          type: array
          description: 冲正链（按时间顺序的 journal_id）。
          items: { type: string }
        hash: { type: string }
        state:
          type: string
          enum: [posted, voided]
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'

    ReversalRequest:
      type: object
      additionalProperties: true
      required: [journal_id, reason, second_approver]
      properties:
        journal_id:
          type: string
          description: 待冲正的原凭证；每张原凭证至多一条冲正。
        reason:
          type: string
          maxLength: 500
        evidence_ref: { type: string }
        second_approver:
          type: string
          description: 复核人（≠ 操作人）；缺失或不一致 → 409 + `40902`。

    ReversalAck:
      type: object
      additionalProperties: true
      required: [reversal_id, journal_id, state, created_at]
      properties:
        reversal_id:
          type: string
          description: 冲正凭证 `journal_id`（新凭证，不改原凭证）。
        journal_id:
          type: string
          description: 原凭证 `journal_id`。
        state:
          type: string
          enum: [pending_approval, posted, rejected]
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 配置中心补充（M10，spec 1.2.0）
    ConfigNamespace:
      type: object
      additionalProperties: true
      required: [namespace, item_count]
      properties:
        namespace:
          type: string
          description: 配置命名空间（十域注册见 03-facts §9）。
        item_count:
          type: integer
          minimum: 0
        prefixes:
          type: array
          items: { type: string }
        consumers:
          type: array
          items: { type: string }
        dangerous_keys:
          type: array
          description: 不可经 API 修改的危险键（危险键禁改，403 + `47004`）。
          items: { type: string }

    ConfigNamespaceList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigNamespace'
        page:
          $ref: '#/components/schemas/Page'

    ConfigDiffChange:
      type: object
      additionalProperties: true
      required: [path, before, after]
      properties:
        path:
          type: string
          description: 变更位置（JSON Pointer）。
        before:
          description: 旧值；敏感项为掩码。
        after:
          description: 新值；敏感项为掩码。
        masked:
          type: boolean
          default: false
          description: 为 true 时 before / after 已脱敏，**永不**返回明文。

    ConfigDiff:
      type: object
      additionalProperties: true
      required: [key, from_version, to_version, changes]
      properties:
        key: { type: string }
        scope: { type: string }
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDiffChange'
        digest_before: { type: string }
        digest_after: { type: string }

    ConfigImpact:
      type: object
      additionalProperties: true
      required: [key, risk_level, consumers, affected_modules]
      description: 发布前影响面（发布单前置输入，不改变运行值）。
      properties:
        key: { type: string }
        scope: { type: string }
        risk_level:
          type: string
          enum: [P0, P1, P2]
        consumers:
          type: array
          items: { type: string }
        affected_modules:
          type: array
          items: { type: string }
        requires_restart:
          type: boolean
          description: 为 true 时需消费方重启或重新加载才生效。
        effective_on:
          type: string
          enum: [immediate, next_anchor, next_restart]
        gray_buckets:
          type: array
          description: 灰度桶序列（1 → 5 → 25 → 100）；P0 不得跳过观测窗。
          items:
            type: integer
            minimum: 1
            maximum: 100
        notes:
          type: string

    ConfigPromoteRequest:
      type: object
      additionalProperties: true
      required: [target_stage]
      properties:
        target_stage:
          type: string
          enum: [next_bucket, full]
        reason:
          type: string
          maxLength: 500
        observe_window_satisfied:
          type: boolean
          description: 观测窗已满方可推进；false 或缺失 → 409 + `47007`。

    ConfigAuditEvent:
      type: object
      additionalProperties: true
      required: [at, action, result]
      description: 配置审计事件（事实源为 M16 `audit_log`，本端点只读聚合）。
      properties:
        at: { type: string, format: date-time }
        action:
          type: string
          enum: [draft_created, publish_requested, approved, rejected, promoted, rolled_back, kill_switch, drift_detected]
        actor: { type: string }
        key: { type: string }
        scope: { type: string }
        version:
          type: integer
          minimum: 1
        request_id: { type: string }
        result:
          type: string
          enum: [ok, denied, failed]

    ConfigAuditPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConfigAuditEvent'
        page:
          $ref: '#/components/schemas/Page'

    HealthStatus:
      type: object
      additionalProperties: true
      required: [status, version, checked_at]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        checked_at:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties: true
          description: 依赖健康摘要（只给状态，不给拓扑 / 地址 / 凭据）。

    AuditEntry:
      type: object
      additionalProperties: true
      required: [seq, entry_id, ts, actor, actor_type, role, action, target, status, alg, prev_hash, hash]
      properties:
        seq:
          type: integer
          minimum: 1
        entry_id:
          type: string
        ts:
          type: string
          format: date-time
        actor:
          type: string
        actor_type:
          type: string
          enum: [human, agent, service, lead]
        role:
          type: string
        action:
          type: string
          description: 点分动作名（如 `authorize.window`、`execute.release`）。
        target:
          type: string
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        reason_code:
          type: string
        ticket:
          type: string
        evidence:
          type: string
        approval_chain:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              actor: { type: string }
              role: { type: string }
              decision: { type: string, enum: [propose, approve, execute, reject] }
              at: { type: string, format: date-time }
        status:
          type: string
          enum: [recorded, pending_approval, approved, rejected, revoked]
        alg:
          type: string
          enum: [hmac-sha256]
        prev_hash:
          type: string
        hash:
          type: string

    AuditAppendRequest:
      type: object
      additionalProperties: true
      required: [actor, actor_type, role, action, target]
      properties:
        actor: { type: string }
        actor_type:
          type: string
          enum: [human, agent, service, lead]
        role: { type: string }
        action: { type: string }
        target: { type: string }
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        reason_code: { type: string }
        ticket: { type: string }
        evidence: { type: string }
        approval_chain:
          type: array
          items:
            type: object
            additionalProperties: true
        status:
          type: string
          enum: [recorded, pending_approval, approved, rejected, revoked]
        alg:
          type: string
          enum: [hmac-sha256]

    AuditAppendResponse:
      type: object
      additionalProperties: true
      required: [entry_id, seq, ts, alg, prev_hash, hash]
      properties:
        entry_id: { type: string }
        seq: { type: integer, minimum: 1 }
        ts: { type: string, format: date-time }
        alg:
          type: string
          enum: [hmac-sha256]
        prev_hash: { type: string }
        hash: { type: string }
        duplicate:
          type: boolean
          description: 幂等命中时为 true（返回首次结果，不重复入链）。

    AuditEntryPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/Page'

    AuditVerifyRequest:
      type: object
      additionalProperties: true
      properties:
        period:
          type: string
          description: 归档周期（`YYYY-MM-DD`，UTC 日）。缺省为当日。
        seal:
          type: boolean
          default: false
          description: 为 true 时固化当日 Merkle 根（同日幂等）。
        expected_alg:
          type: string
          enum: [hmac-sha256]

    AuditVerifyResponse:
      type: object
      additionalProperties: true
      required: [ok, period, entries, alg, checked_at]
      properties:
        ok: { type: boolean }
        period: { type: string }
        entries: { type: integer, minimum: 0 }
        alg:
          type: string
          enum: [hmac-sha256]
        checked_at: { type: string, format: date-time }
        merkle_root:
          type: [string, 'null']
        sealed:
          type: boolean
        broken_seq:
          type: [integer, 'null']
        expired_pending:
          type: integer
          minimum: 0
        problems:
          type: array
          items: { type: string }
          description: 人类可读的问题清单（不含密钥 / 正文）。


    Notification:
      type: object
      additionalProperties: true
      required: [id, level, type, channel_count, status, created_at]
      properties:
        id: { type: string }
        level:
          type: string
          enum: [P0, P1, P2]
        type: { type: string }
        template_key: { type: string }
        channels:
          type: array
          items: { type: string, enum: [in_app, email, webhook] }
        channel_count:
          type: integer
          minimum: 1
          description: 合并去重后的实际条数（M12 INV-03 同窗口合并时 >1）。
        status:
          type: string
          enum: [queued, sending, delivered, partial, failed, dead]
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        read_at: { type: [string, 'null'], format: date-time }

    NotificationList:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { $ref: '#/components/schemas/Page' }
        unread:
          type: integer
          minimum: 0

    NotificationReadAck:
      type: object
      additionalProperties: true
      required: [marked, unread]
      properties:
        notification_id:
          type: [string, 'null']
          description: "当 id=all（全部已读）时为 null。"
        marked:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
        read_at: { type: string, format: date-time }

    ReconRun:
      type: object
      additionalProperties: true
      required: [run_id, scope, period_start, period_end, cutoff_at, status, diff_minor]
      properties:
        run_id: { type: string }
        scope:
          type: string
          enum: [chain, psp, bank, receipt, daily_close]
        subject_ref: { type: [string, 'null'] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        cutoff_at: { type: string, format: date-time }
        block_height: { type: [integer, 'null'] }
        book_minor: { type: integer }
        external_minor: { type: integer }
        diff_minor: { type: integer, description: 有符号整数最小单位（分）。 }
        matched_count: { type: integer, minimum: 0 }
        unmatched_count: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [scheduled, running, matched, exceptions_open, signed_off, closed]
        rule_version: { type: string }
        policy_version: { type: [string, 'null'] }
        report_ref: { type: [string, 'null'] }
        signed_off_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ReconRunPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReconRun' }
        page: { $ref: '#/components/schemas/Page' }

    ReconDiffSummary:
      type: object
      additionalProperties: true
      required: [pending_p0_p1, by_severity, by_status]
      properties:
        pending_p0_p1: { type: integer, minimum: 0 }
        by_severity:
          type: object
          additionalProperties: true
          properties:
            P0: { type: integer, minimum: 0 }
            P1: { type: integer, minimum: 0 }
            P2: { type: integer, minimum: 0 }
        by_status:
          type: object
          additionalProperties: true
          properties:
            open: { type: integer, minimum: 0 }
            investigating: { type: integer, minimum: 0 }
            escalated: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            accepted: { type: integer, minimum: 0 }
            closed: { type: integer, minimum: 0 }

    ReconRunDetail:
      type: object
      additionalProperties: true
      required: [run, diff_summary]
      properties:
        run: { $ref: '#/components/schemas/ReconRun' }
        diff_summary: { $ref: '#/components/schemas/ReconDiffSummary' }

    ReconException:
      type: object
      additionalProperties: true
      required: [exception_id, run_id, scope, kind, severity, diff_minor, status, sla_due]
      properties:
        exception_id: { type: string }
        run_id: { type: string }
        scope:
          type: string
          enum: [chain, psp, bank, receipt, daily_close]
        kind: { type: string }
        severity:
          type: string
          enum: [P0, P1, P2]
        ref_type: { type: [string, 'null'] }
        ref_id: { type: [string, 'null'] }
        diff_minor: { type: integer }
        owner: { type: [string, 'null'] }
        sla_due: { type: string, format: date-time }
        status:
          type: string
          enum: [open, investigating, escalated, resolved, accepted, closed]
        resolution_code:
          type: [string, 'null']
          enum: [adjust_journal, external_fix, write_off, false_positive, null]
        resolution_journal_id: { type: [string, 'null'] }
        root_cause: { type: [string, 'null'] }
        evidence_ref: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }

    ReconExceptionPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReconException' }
        page: { $ref: '#/components/schemas/Page' }

    ReconSignOffRequest:
      type: object
      additionalProperties: true
      properties:
        reviewer_note: { type: string, maxLength: 512 }
        attestation_id: { type: [string, 'null'] }

    ReconExceptionResolveRequest:
      type: object
      additionalProperties: true
      required: [resolution_code]
      properties:
        resolution_code:
          type: string
          enum: [adjust_journal, external_fix, write_off, false_positive]
        root_cause: { type: string, maxLength: 512 }
        resolution_journal_id: { type: [string, 'null'] }
        evidence_ref: { type: [string, 'null'] }

    ReconAttestationRequest:
      type: object
      additionalProperties: true
      required: [period_start, period_end, ledger_root, batch_hash, payable_total_minor, signature_ref]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        ledger_root: { type: string }
        chain_snapshot_ref: { type: [string, 'null'] }
        bank_snapshot_ref: { type: [string, 'null'] }
        payable_total_minor: { type: integer, minimum: 0 }
        batch_hash: { type: string }
        signature_ref: { type: string }

    ReconAttestation:
      type: object
      additionalProperties: true
      required: [attestation_id, period_start, period_end, ledger_root, batch_hash, payable_total_minor, status, signature_ref, created_at]
      properties:
        attestation_id: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        ledger_root: { type: string }
        chain_snapshot_ref: { type: [string, 'null'] }
        bank_snapshot_ref: { type: [string, 'null'] }
        payable_total_minor: { type: integer, minimum: 0 }
        batch_hash: { type: string }
        reviewer_id: { type: [string, 'null'] }
        reviewer_pubkey_ref: { type: [string, 'null'] }
        signature_ref: { type: string }
        hsm_verified_at: { type: [string, 'null'], format: date-time }
        status:
          type: string
          enum: [valid, superseded, revoked]
        created_at: { type: string, format: date-time }

    ReconAttestationValidation:
      type: object
      additionalProperties: true
      required: [valid, status, checked_at]
      properties:
        valid: { type: boolean }
        status:
          type: string
          enum: [valid, superseded, revoked, expired, unknown]
        checked_at: { type: string, format: date-time }
        reasons:
          type: array
          items: { type: string }
          description: 人类可读的拒绝原因（不含凭证正文 / 签名 / 金额明细）。

