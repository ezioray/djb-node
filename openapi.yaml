          type: string
          enum:
          - active
          - paused
          - draining
          - retired
          - provisioning
          - zero
          - frozen
          description: 四值基线 + 退休四步中间态 `provisioning / zero / frozen`；共七值。
        switch_state:
          type: string
          enum:
          - standby
          - in_service
          - switching_out
          - draining
          description: 仅对 `active` 有意义。
        fund_class:
          type: string
          enum:
          - hot
          - warm
          - cold
        balance:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
    SigningEvent:
      type: object
      additionalProperties: true
      required:
      - signing_event_id
      - signing_request_id
      - event
      - occurred_at
      properties:
        signing_event_id:
          type: string
        signing_request_id:
          type: string
        event:
          type: string
          enum:
          - requested
          - presented
          - signed
          - verified
          - co_signed
          - broadcast
        signer_type:
          type: string
          enum:
          - owner
          - reviewer
          - company
        signer_ref:
          type: string
        signature_hash:
          type: string
        device_id:
          type: string
        auth_hash:
          type: string
        txid:
          type: string
        error_code:
          type: integer
        occurred_at:
          type: string
          format: date-time
    AuthTokens:
      type: object
      additionalProperties: true
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      description: 会话令牌对。`refresh_token` 一次性轮换，旧令牌重放按 `40103` 处理并要求重新登录。
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: access_token 剩余有效期（秒）。
        session_id:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: true
      required:
      - method
      - identifier
      description: 登录入参。`secret` 只上行一次，**不得**进日志、事件或 fixtures。
      properties:
        method:
          type: string
          enum:
          - password
          - oauth
          - sms_code
        identifier:
          type: string
          description: 邮箱或手机号（服务端只存不可逆哈希与掩码，不回传原文）。
        secret:
          type: string
          description: 口令或一次性验证码；失败不区分「账号不存在 / 口令错误」。
        password:
          type: string
          description: '兼容注册接口的 `password` 别名（P3-6）。与 `secret` 同时提供时必须一致；

            两者冲突返回 400。新客户端仍建议使用 `secret`。

            '
        provider:
          type: string
          description: OAuth 提供方（`method=oauth` 时必填）。
        device_id:
          type: string
        mfa_code:
          type: string
          description: 二次认证码（账号启用 MFA 时必填）。
        captcha_id:
          type: string
          maxLength: 64
          description: '服务端要求人机验证时必填。触发条件：同一 `identifier` + 客户端 IP 在 10 分钟内

            登录失败 ≥3 次 → 后续登录返回 `401 / 40111`（`captcha_required=true`），

            客户端取图后带 `captcha_id` + `captcha_answer` 重试同一端点。

            未触发时传了也被忽略（不报错）。

            '
        captcha_answer:
          type: string
          maxLength: 32
          description: 验证码答案（大小写不敏感；一次性；单张最多 5 次；300 秒过期）。
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required:
      - captcha_id
      - svg
      - expires_in
      properties:
        captcha_id:
          type: string
          minLength: 8
          maxLength: 64
          description: 一次性验证码 id（登录时回传）。
        svg:
          type: string
          description: 自绘 SVG 文本（`<svg` 开头，宽 168 / 高 62，viewBox 同尺寸）。
        expires_in:
          type: integer
          description: 有效期（秒），固定 300。
    RegistrationRequest:
      type: object
