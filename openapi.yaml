        批次还没有签名请求 → `409` + `signature_missing`。2/3 齐（owner `signed` + `verified`

        + `co_signed`，签名人 ≥ 门限）时 `complete=true` 并把批次推到 `signed`。

        审计只记 `event` / `signer_type` / `complete` / `signed_count`，**不记摘要原文**。

