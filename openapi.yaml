        '400':
          description: 40001 status / limit / before 非法
        '401':
          description: 40101 未认证
        '403':
          description: 40301 缺 scope：support.read
        '404':
          description: 40401 开关 support_tickets 关闭；error.reason=feature_disabled（与记录不存在可判别）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
  /api/v1/admin/support/tickets/{public_id}:
    get:
      operationId: getSupportQueueTicket
      summary: 运营读单条（含内部备注）
      description: '队列只给聚合计数，正文在这里取。后台**必须**走本路径，**不得**借用用户凭据读

        `/api/v1/support/tickets/{public_id}`：用户面只认用户主体（API Key / M01），

        `adminBearer` 会被当成匿名，凡是绑定账号的单一律 404 —— 那样后台的权限模型就是假的。


        与用户面的另一处差别：本路径返回 `visibility=internal` 的条目（运营内部备注）。

        `pending_verify` 的单在两处都是 404（未验证不入队，D4 的必然结果，不是缺陷）。

        '
      tags:
      - Admin
      - Support
      security:
      - adminBearer: []
      parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{10,16}$
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 工单 + 会话（含 internal）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportQueueTicketThread'
        '401':
          description: 40101 未认证
        '403':
          description: 40301 缺 scope：support.read
        '404':
          description: 40401 不存在 / 未验证（pending_verify）/ 开关关闭（开关关闭时 error.reason=feature_disabled）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportFeatureDisabledError'
  /api/v1/admin/support/tickets/{public_id}/messages:
    post:
      operationId: replySupportQueueTicket
      summary: 运营回复 / 内部备注
      description: '`visibility=internal` 的备注只对运营可见（客户读路径在 SQL 层过滤）。

        客户侧正文**不进日志、不进审计**（审计只记 id / 长度 / 角色）。

