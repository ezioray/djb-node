      summary: 记录签名设备 / HSM 回传的签名事件（服务只记录，不签名）
      description: '六事件按序推进：`requested → presented → signed → verified → co_signed → broadcast`。

        本服务**不签名、不读私钥**：`signature_hash` 是设备回传的摘要（可选），服务只落库并推进状态。

