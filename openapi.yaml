    SupportFeatureDisabledError:
      type: object
      description: '开关关闭时的 404 响应体。共享 `Error` 信封里 `error.code` 与"记录不存在"同为 `40401`， 若只凭状态码，前端会把"功能未开放"渲染成"记录不存在"——两者的运营动作完全不同
        （申请权限/等开关 vs 查记录）。因此本域 404 额外给**可判别**字段： `error.reason="feature_disabled"` 与本域开关名 `error.feature`。 共享 `Error` schema
        未做任何修改（它 `additionalProperties: true`，故本结构向后兼容）。

        ⚠️ **隐式承重依赖（写在这里，因为两年后收紧它的人不会来读工单域）**： 本 schema 与"404 + reason==feature_disabled → 功能未开放"这条前端判别**都依赖** `Error.error.additionalProperties:
        true`。**一旦有人把它收紧成 `false`**，后端输出的 `reason` / `feature` 会被判为非法字段，本域 404 判别立即失效，全站 404 话术随之错乱 （运营会把"功能未开放"读成"记录不存在"）。要收紧它，必须先把这两个字段提升进
        共享 `Error` 的 `properties`，并同步前端判别规则。'
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          - request_id
          - reason
          properties:
            type:
              type: string
              enum:
              - FeatureDisabled
            code:
              type: integer
              enum:
              - 40401
            reason:
              type: string
              enum:
              - feature_disabled
            feature:
              type: string
              description: 本域开关名（当前恒为 support_tickets）
            message:
              type: string
              description: 人类可读；程序判断一律用 code + reason
            request_id:
              type: string
    SupportQueueTicketThread:
      type: object
      description: '运营单条读的响应。**与用户面的关键差别**：`messages[]` 含 `visibility=internal` （运营内部备注）。

        ⚠️ **设计来源，务必照着实现**：`visibility=internal` 的条目对**用户完全不可见**。 因此前端**必须**在视觉上把它与对外回复区分开（例如标记「内部 · 用户看不到」）， **不得**把 internal
        条目当成"已经和用户沟通过了"的证据。 这条事故形态是真实存在的：运营写了一条给同事看的话，回用户时以为用户已经看到了。 契约写在这里，是因为不写下来，三年后没人分得清这是设计还是疏漏。'
      required:
      - request_id
      - ticket
      - messages
      properties:
        request_id:
          type: string
        ticket:
          $ref: '#/components/schemas/SupportTicket'
        message_count:
          type: integer
          minimum: 0
          description: 含内部备注
        public_message_count:
          type: integer
          minimum: 0
          description: 客户可见条数
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        messages:
          type: array
          description: 按 `created_at, id` 升序的**混排**（internal 与 public 按时间交织）。 每条**必带** `visibility`：禁止靠位置或"内容口气"推断可见性。
          items:
            $ref: '#/components/schemas/SupportTicketMessage'
        verification:
          type: object
          description: 该单**最后一次**发信动作的结论（只读）。给详情页说人话用； `status` / `notice_code` 都是闭集，**不要**用 `verified_at is null` 反推 "验证信没发"——那个字段为空也可能是别的路径造成的，用空字段反推状态就是猜。
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - sent
              - pending
              - skipped_flag
              - transport_not_wired
              - failed
              - skipped_cap
              - skipped_quota
              - not_needed
              description: '`not_needed` = 该单**根本不需要验证**（如登录用户提单，邮箱视为可信，未发信）； 此时 `notice_code` 与 `notice` 均为 null（无可告知的事就不给码）。
                **与 `pending` 严格区分**：`pending` 是"等待中/无发信记录"，`not_needed` 是 "不需要"。让一个值承担两种含义，就是逼前端瞎猜该不该提示"去查收验证信"。'
            notice_code:
              type:
              - string
              - 'null'
              enum:
              - transport_unavailable
              - rate_limited
            expires_at:
              type:
              - string
              - 'null'
              format: date-time
    SupportVerifyResult:
      type: object
      required:
      - request_id
      - public_id
