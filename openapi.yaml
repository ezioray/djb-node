    NodeProbeReport:
      type: object
      additionalProperties: true
      required:
      - upstream_id
      - reachable
      - checked_at
      description: '本地体检**结论**（服务端不发起探测）。只收结论与耗时，

        **不收**凭据、上游响应正文或模型输出。

        '
      properties:
        upstream_id:
          type: string
        reachable:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        error_class:
          type: string
          description: 粗粒度错误分类（如 timeout / tls / auth / model_missing），不含细节。
        model_checks:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
