        page:
          $ref: '#/components/schemas/Page'
    MerkleCommitment:
      type: object
      additionalProperties: true
      required:
      - period
      - kind
      - root
      - entry_count
      - published_at
      description: 期间根。可由当期分录重算复现；发布后不可改（INV-13）。
      properties:
        period:
          type: string
          description: 锚定周期；日 `YYYY-MM-DD` 或小时 `YYYY-MM-DDTHH`。
        kind:
          type: string
          enum:
          - journal
          - daily_close
          description: M06 负责 journal / daily_close 两类根；audit / por 根归 M16 / M09。
        root:
          type: string
          description: Merkle 根（十六进制）。
        entry_count:
          type: integer
          minimum: 0
        published_at:
          type: string
          format: date-time
        reproducible:
          type: boolean
          description: 重算一致为 true；false 表示存在差异（P0，转只读）。
        verify_hint:
          type: string
          description: 重算所需的只读入口提示（不返回内部算法参数）。
    RecomputeRequest:
      type: object
      additionalProperties: true
      description: 全量复算入参。复算只读，不修数据；`dry_run` 默认 true。
      properties:
        period:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}(-[0-9]{2}(T[0-9]{2})?)?$
          description: 可选；缺省复算全部期间。
        scope:
          type: string
          enum:
          - period
          - all
          default: all
        dry_run:
          type: boolean
          default: true
          description: 为 false 时发布校验结果（仍不修数据）。
