                $ref: '#/components/schemas/ConfigDriftList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/config/{key}:
    get:
      tags:
      - admin
      summary: 读取单个配置项
      operationId: getConfigItem
      description: 按 key 读取；可用 `version` / `scope` 指定历史版本与作用域。敏感值不返回明文。
      security:
      - adminBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,127}$
      - name: version
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 配置项
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - admin
      summary: 创建配置草稿（不生效）
      operationId: createConfigDraft
      description: '只建草稿，不改变运行值；生效必须走 `publishConfigItem` 并完成复核。

        幂等键 24h，与审计记录同事务。

        '
      security:
      - adminBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{2,127}$
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigDraftRequest'
      responses:
        '201':
          description: 草稿已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '424':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
