        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [user]
      summary: 覆盖式更新通知偏好
      operationId: updateNotificationPreferences
      description: |
        覆盖式写入（区间/集合整体替换）。P0 通知项**不可退订**，尝试关闭返回 `40902`。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: 更新后的偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/webhooks:
    get:
      tags: [user]
      summary: 列出 Webhook 订阅
      operationId: listWebhookSubscriptions
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 订阅列表（不含签名密钥）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [user]
      summary: 注册 Webhook 订阅（签名密钥仅返回一次）
      operationId: createWebhookSubscription
      description: |
        `events` 支持慢任务完成与 P0 事件；`secret` 只在创建响应里返回一次，
        服务端只存哈希。重复提交按幂等键去重。
      security:
        - userBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionRequest' }
      responses:
        '201':
          description: 创建成功（含一次性 secret）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/user/webhooks/{id}:
    delete:
      tags: [user]
      summary: 删除 Webhook 订阅
      operationId: deleteWebhookSubscription
      security:
        - userBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: 已删除
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

