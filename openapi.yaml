          - notify
          - tag
          - freeze
          - unfreeze
          - retire
          - limit_adjust
          - payout_proposal
          - refund_proposal
          description: preview 必填：批量动作类型（涉资金 / 冻结类强制双人复核）。
        target:
          type: object
          additionalProperties: true
          description: preview 用范围；无 target.ids 时必须接线 Owner 查询适配器（不猜影响面）。
          properties:
            object:
              type: string
              enum:
              - account
              - node
              - key
              - wallet
              - ticket
              - config
            ids:
              type: array
              maxItems: 200
              items:
                type: string
            filter:
              type: object
              additionalProperties: true
        reason:
          type:
          - string
          - 'null'
          maxLength: 512
        labels:
          type: object
          additionalProperties:
            type: string
          description: 预览展示用的标签（id → 人类可读名）；不含 PII 正文。
        batch_id:
          type:
          - string
          - 'null'
          description: execute / undo 必填：预览返回的批次操作 id（UUID）。
    OpsBatchOp:
      type: object
      additionalProperties: true
      required:
      - batch_id
      - state
      - step
      - action_type
      - count
      - dual_review_required
      properties:
        batch_id:
          type: string
        state:
          type: string
          enum:
          - previewed
          - executed
          - undone
          - failed
        step:
          type: string
          enum:
          - preview
          - execute
          - undo
        action_type:
          type: string
          enum:
          - notify
          - tag
          - freeze
          - unfreeze
          - retire
          - limit_adjust
          - payout_proposal
          - refund_proposal
        target:
          type: object
          additionalProperties: true
        reason:
          type:
          - string
          - 'null'
        count:
          type: integer
          minimum: 0
        impact:
          type: array
          description: 影响清单（id + 展示标签）。
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              label:
                type:
                - string
                - 'null'
        sample:
          type: array
          description: 随机抽样（≤10 条，逐条确认）。
          items:
            type: string
        sample_size:
          type: integer
          minimum: 0
        dual_review_required:
          type: boolean
        max_items:
          type: integer
          minimum: 1
        undo_window_s:
          type: integer
          minimum: 0
        initiator:
          type:
          - string
          - 'null'
        approver:
          type:
          - string
          - 'null'
        previewed_at:
          type:
          - string
          - 'null'
          format: date-time
        executed_at:
          type:
          - string
          - 'null'
          format: date-time
        undo_deadline:
          type:
          - string
          - 'null'
          format: date-time
          description: 撤销窗口截止（执行后 10 分钟）；过期不可撤销（409 + 40901）。
        results:
          type: array
          description: 逐条执行回执（保留成功项 + 失败清单）。
          items:
            type: object
            additionalProperties: true
        undo_results:
          type: array
          description: 逐条撤销回执（撤销也留痕）。
          items:
            type: object
            additionalProperties: true
        succeeded_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
    AuditReplayEvent:
      type: object
      additionalProperties: true
      required:
      - occurred_at
      - source
      - action
      properties:
        occurred_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - audit
          - event
          description: audit = 审计链条目；event = 事件 outbox 记录。
        trace_id:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
          description: 操作者内部 id（不写邮箱 / 手机）。
        action:
          type: string
        target:
          type:
          - string
          - 'null'
        reason_code:
          type:
          - string
          - 'null'
        evidence:
          type:
          - string
          - 'null'
        detail:
          type: object
          additionalProperties: true
          description: 脱敏后的审计 after 摘要（最多 3 层 / 200 字符；敏感键被剔除）。
        event_id:
          type:
          - string
          - 'null'
        aggregate_type:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        payload:
          type: object
          additionalProperties: true
          description: 脱敏后的事件 payload（不含正文 / PII / 密钥）。
    AuditReplay:
      type: object
      additionalProperties: true
      required:
      - data
      - page
      - observed_at
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditReplayEvent'
        page:
          $ref: '#/components/schemas/Page'
        source:
          type: object
          additionalProperties: true
          description: 数据源可用性。
          properties:
            audit_log:
              type: string
              enum:
              - ok
              - unavailable
            outbox:
              type: string
              enum:
              - ok
              - unavailable
        observed_at:
          type: string
          format: date-time
    UserNode:
      type: object
      additionalProperties: true
      required:
      - node_id
      - state
      properties:
        node_id:
          type: string
        state:
          type: string
          enum:
          - unbound
          - pending_receipt
          - bound
          - revoked
          description: 绑定视图状态；pending_receipt = 绑定已下发、待节点回执（M13 NodeBindingView 口径）。
        lifecycle_state:
          type: string
          enum:
          - pending
          - active
          - frozen
          - retired
          description: M02 权威生命周期（以心跳与 node_events 为准）。
        last_seen:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近心跳时间（无心跳为 null）。
        applied_version:
          type:
          - string
          - 'null'
          description: 节点回传的已生效版本（M10 running applied_version）；未回传为 null。
        pending_reason:
          type:
          - string
          - 'null'
          description: pending / pending_receipt 的粗粒度原因（不含规则、名单或内部判定）。
        bound_at:
          type:
          - string
          - 'null'
          format: date-time
        unbound_at:
          type:
          - string
          - 'null'
          format: date-time
    UserNodePage:
      type: object
      additionalProperties: true
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserNode'
        page:
          $ref: '#/components/schemas/Page'
    UserNodeUnbindRequest:
      type: object
      additionalProperties: true
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 512
          description: 解绑原因（人类可读；审计留痕，不含凭据）。
    ProxyModelPair:
      type: object
      additionalProperties: true
      required:
      - execution_model
      - lead_model
      description: '模型对白名单条目：执行模型 → 领队模型。两端均为模型标识字符串（≤128 字符，

        服务端做 strip 与去重排序）；未知字段被忽略（tolerant reader），不改变语义。

        '
      properties:
        execution_model:
          type: string
          minLength: 1
          maxLength: 128
          description: 节点实际执行的模型标识（与 `/v1/models` 的 `id` 同词表）。
        lead_model:
          type: string
          minLength: 1
          maxLength: 128
          description: 领队/编排侧模型标识（该模型对在平台侧统一映射后使用）。
    ProxyAuthorizationUpdate:
      type: object
      additionalProperties: true
      required:
      - proxy_serve
      description: '代理授权写入请求。`proxy_serve` 必填；`model_pairs` 缺省按空数组处理

        （**等价于清空白名单**），因此只改开关时也必须显式回传现有白名单。

        '
      properties:
        proxy_serve:
          type: boolean
          description: 是否允许以本节点为他人 token 提供代理服务；默认 false，开启需 step-up。
        model_pairs:
          type: array
          default: []
          description: '允许代理的模型对白名单；重复项服务端去重并按 `execution_model, lead_model`

            稳定排序。为空表示不代理任何模型对（即便 `proxy_serve=true` 也不放行）。

            '
          items:
            $ref: '#/components/schemas/ProxyModelPair'
    ProxyAuthorizationState:
      type: object
      additionalProperties: true
      required:
      - node_id
      - account_id
      - proxy_serve
      - model_pairs
      - revision
      - revoked_at
      - active
      description: '代理授权事实（只读投影）。`active=true` 当且仅当 `proxy_serve=true` 且 `revoked_at=null`

        ——这是"是否允许公告/接单"的唯一判据，未激活一律按未授权处理（默认拒绝）。

        `revision` 每次成功写入递增 1，可用于发现并发变更；客户端必须容忍未知字段。

        '
      properties:
        node_id:
          type: string
          description: 节点标识（M02 节点 ID）。
        account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 授权归属账户；节点侧读取（`/api/v1/node/proxy-authorization`）固定为 `null`。
        proxy_serve:
          type: boolean
          description: 代理服务开关（默认 false）。
        model_pairs:
          type: array
          description: 已授权的模型对白名单（去重、稳定排序）；空数组表示不放行任何模型对。
          items:
            $ref: '#/components/schemas/ProxyModelPair'
        revision:
          type: integer
          minimum: 0
          description: 授权版本号；无授权记录为 0，每次成功写入递增 1。
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次 `proxy_serve` 撤销时间（UTC，RFC 3339）；未撤销为 `null`，再次授权会清空。
        active:
          type: boolean
          description: 是否处于可用授权态（`proxy_serve=true` 且未撤销）。
    TokenRouteDeclaration:
      type: object
      additionalProperties: false
      required:
      - pair
      - vocab_size
      - overlap
      properties:
        pair:
          type: object
          additionalProperties: false
          required:
          - from
          - to
          properties:
            from:
              type: string
              minLength: 1
              maxLength: 128
            to:
              type: string
              minLength: 1
              maxLength: 128
          description: from ≠ to；两个不同的模型/词表标识。
        vocab_size:
          type: integer
          minimum: 1
          description: 词表大小（> 0；bool 不算整数）。
        overlap:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: '词表重叠比例 [0,1] 浮点。**不是** M04 的 overlap 枚举（shared_gpu|dedicated）。

            '
        declared_at:
          type: string
          format: date-time
          description: 可省略（服务端按上报时刻补）；给了必须是 ISO8601，不带时区按 UTC。
    TokenRouteDecision:
      type: object
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 500
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_by:
          type:
          - string
          - 'null'
        revision:
          type:
          - integer
          - 'null'
          minimum: 1
      description: 最近一次授权决策（撤销后仍保留，便于审计「谁授权过 / 谁撤销过」）。
    TokenRouteView:
      type: object
      required:
      - node_id
      - declared
      - token_route
      - token_route_authorized
      - switch_enabled
      - declaration_authorized
      - effective
      - annotation
      - decision
      - switch
      properties:
        node_id:
          type: string
        declared:
          type: boolean
          description: 是否有声明行。
        token_route:
          oneOf:
          - $ref: '#/components/schemas/TokenRouteDeclaration'
          - type: 'null'
        token_route_authorized:
          type: boolean
          description: '【诊断字段】已授权 **且** 开关打开才为 true；未授权或开关关一律 false

            （读路径当「没有声明」处理）。

            '
        declaration_authorized:
          type: boolean
          description: 仅「后台已授权」（不含开关）。
        switch_enabled:
          type: boolean
          description: 开关 token_route.authorized 当前是否打开（默认 false）。
        effective:
          type: boolean
          description: 唯一生效判定 = declared ∧ declaration_authorized ∧ switch_enabled。
        annotation:
          type:
          - string
          - 'null'
          description: 生效时的标注文本（"已授权 token-route（from→to / overlap x）"）；不生效为 null。
        decision:
          $ref: '#/components/schemas/TokenRouteDecision'
        switch:
          type: object
          properties:
            name:
              type: string
              enum:
              - token_route.authorized
            default:
              type: boolean
              enum:
              - false
            rollback_rule:
              type: string
        withdrawn:
          type: boolean
          description: 仅 DELETE 响应带：本次是否真的删了行。
        authorization_reset:
          type: boolean
          description: 仅 POST 声明响应带：本次声明变化是否把授权清掉了。
        authorization_effective:
          type: boolean
          description: 仅授权响应带：授权后是否**真的**生效（开关关着时为 false）。
    ClientReleaseChannel:
      type: object
      description: 一个平台/架构的发布通道条目（发布方生成，服务端原样透出）。
      required:
      - platform
      - arch
      - kind
      - version
      - url
      - sha256
      properties:
        platform:
          type: string
          enum:
          - windows
          - macos
          - linux
          - container
        arch:
          type: string
          description: 如 x64 / arm64 / universal
        kind:
          type: string
          description: 如 portable-zip / dmg / tar.gz
        version:
          type: string
          description: 该通道的产物版本（可与清单 version 不同）
        url:
          type: string
          description: 下载地址（https）
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 64 位小写 hex
        size_bytes:
          type: integer
          minimum: 0
        signature_status:
          type: string
          enum:
          - unsigned-test
          - signed
          - notarized
        notes:
          type: string
    ClientReleaseManifest:
      type: object
      description: '`GET /api/v1/client/releases` 的响应（形状冻结）。清单缺失或不合格时**不返回本对象**，

        而是 `503` + 错误信封（`release_manifest_unconfigured` / `_missing` / `_invalid`）。

        '
      required:
      - version
      - generated_at
      - channels
      properties:
        version:
          type: string
          description: 清单版本号
        generated_at:
          type: string
          format: date-time
          description: 发布方生成时间（UTC）
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ClientReleaseChannel'
    ProviderAskSettingPatch:
      type: object
      description: 部分更新；未知字段一律 40001（不静默忽略）。
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: false = 撤单：不再生成新报价（409/40902），存量按 TTL 自然过期；不 403 用方
        ask_min:
          type: string
          pattern: ^\d{1,7}(\.\d{1,2})?$
          description: 最低申报价（USD/百万 token，十进制字符串 ≤2 位小数）。0 被拒绝（0 = 白送）。
          examples:
          - '1.20'
        ask_max:
          type: string
          pattern: ^\d{1,7}(\.\d{1,2})?$
          description: 申报上限（映射 quotes.price_max_minor）；必须 ≥ ask_min，NULL/缺省 = 不设上限
          examples:
          - '2.50'
        currency:
          type: string
          enum:
          - USD
        adopt_recommendation:
          type: string
          maxLength: 64
          description: 采用标记（如 recommend:settled_7d）；必须与 ask_min/ask_max 同请求给出
      minProperties: 1
    MarketQuote:
      type: object
      description: 当前有效报价（state='active' 且未过期）的只读快照
      required:
      - count
      properties:
        low:
          type:
          - string
          - 'null'
          description: 最低 active 报价；无报价时 null（不是 0）
        p50:
          type:
          - string
          - 'null'
        count:
          type: integer
          minimum: 0
    BaselineBand:
      type: object
      description: 运营建议价簿（已发布版本）的护栏价带；无已发布簿时整段为 null
      required:
      - book_version
      - price_min
      - price_max
      properties:
        book_version:
          type: integer
        price_min:
          type: string
        price_max:
          type: string
        effective_at:
          type:
          - string
          - 'null'
          format: date-time
    Recommendation:
      type: object
      description: 系统建议值（**只读、不自动生效、不参与撮合**）
      required:
      - min
      - max
      - method
      - samples
      - as_of
      - currency
      - unit
      properties:
        min:
          type: string
          description: 区间下界（USD/百万 token，十进制字符串）
        max:
          type: string
          description: 区间上界；单点区间允许 min == max（只有一个市价时）
        method:
          type: string
          enum:
          - settled_7d
          - market_ask
          - baseline
          description: 实际用到的来源：近 7 天成交 / 当前有效报价 / 运营建议价簿
        samples:
          type:
          - integer
          - 'null'
          description: 样本数（成交笔数或市场报价条数）；来源是运营簿时为 null（不编造 0）
        as_of:
          type: string
          format: date-time
        currency:
          type: string
          enum:
          - USD
        unit:
          type: string
          examples:
          - USD/百万 token
        sources:
          type: array
          description: 所有**可用**来源（没有用到的不编数字）
          items:
            type: object
            required:
            - kind
            properties:
              kind:
                type: string
                enum:
                - settled
                - market_ask
                - baseline
    RecommendationBlock:
      type: object
      required:
      - model
      - role
      - recommended
      - market
      - baseline
      - as_of
      properties:
        model:
          type: string
        role:
          type: string
          enum:
          - consumer
          - provider
        recommended:
          oneOf:
          - $ref: '#/components/schemas/Recommendation'
          - type: 'null'
          description: null = 三级来源全缺（页面显示「暂无建议」，绝不补 0）
        market:
          $ref: '#/components/schemas/MarketQuote'
        baseline:
          oneOf:
          - $ref: '#/components/schemas/BaselineBand'
          - type: 'null'
        as_of:
          type: string
          format: date-time
    EffectivePrice:
      type: object
      description: 生效价（供方申报总闸打开时才出现；关闸时整段不出现）
      required:
      - ask_min
      - ask_max
      - price_source
      properties:
        ask_min:
          type:
          - string
          - 'null'
        ask_max:
          type:
          - string
          - 'null'
        price_source:
          type: string
          enum:
          - node_reported
          - ask_settings
          description: node_reported = 节点自报价生效；ask_settings = 云端申报覆盖生效
    ProviderAskSetting:
      type: object
      required:
      - model
      - node_id
      - enabled
      - ask_min
      - ask_max
      - currency
      - version
      - is_default
      - configured
      - resolved_from
      - warnings
      - applies_to_nodes
      properties:
        model:
          type: string
          description: '`*` = 账户默认行'
        node_id:
          type: string
          description: 命中的那一行的节点维度（`*` = 账户默认）
        enabled:
          type: boolean
          description: false = 撤单（`configured` 仍可能为 true：价还在，只是不报价）
        ask_min:
          type:
          - string
          - 'null'
        ask_max:
          type:
          - string
          - 'null'
        currency:
          type: string
          enum:
          - USD
        version:
          type: integer
          minimum: 0
          description: 0 = 从未设置过
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        is_default:
          type: boolean
        configured:
          type: boolean
          description: 是否设过价（false ⇒ 完全跟随节点自报）
        adopted_from:
          type:
          - string
          - 'null'
          description: 采用标记，人工改价后自动清空
        resolved_from:
          type: string
          enum:
          - node_model
          - node_default
          - tenant_model
          - tenant_default
          - none
          description: 4 行优先级的命中来源（none ⇒ 节点自报生效）
        market:
          $ref: '#/components/schemas/MarketQuote'
        effective:
          $ref: '#/components/schemas/EffectivePrice'
        recommended:
          $ref: '#/components/schemas/Recommendation'
        warnings:
          type: array
          description: 只提示、不拒绝
          items:
            type: string
            enum:
            - above_market
            - no_market
            - baseline_conflict
        applies_to_nodes:
          type: array
          items:
            type: string
          description: 本账户当前有效节点（供 UI 选择器；读路径不泄露他人节点）
    ProviderAskSettingsList:
      type: object
      required:
      - currency
      - count
      - default
      - items
      - applies_to_nodes
      - applied
      properties:
        currency:
          type: string
          enum:
          - USD
        count:
          type: integer
          minimum: 0
        default:
          $ref: '#/components/schemas/ProviderAskSetting'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderAskSetting'
        applies_to_nodes:
          type: array
          items:
            type: string
        applied:
          type: boolean
          description: 供方申报总闸是否打开（false ⇒ 页面应显示「申报暂未生效」提示）
    AnthropicMessageRequest:
      type: object
      additionalProperties: false
      required:
      - model
      - max_tokens
      - messages
      properties:
        model:
          type: string
          minLength: 1
        max_tokens:
          type: integer
          minimum: 1
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
              content:
                oneOf:
                - type: string
                - type: array
                  items:
                    $ref: '#/components/schemas/AnthropicContentBlock'
        system:
          description: 字符串或 text 块数组；数组中的非 text 块被忽略（不报错）。
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/AnthropicContentBlock'
        stop_sequences:
          type: array
          items:
            type: string
            minLength: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stream:
          type: boolean
          default: false
        metadata:
          type: object
          properties:
            user_id:
              type: string
              maxLength: 64
          additionalProperties: true
        top_k:
          description: 本期**剥离**（OpenAI 面无对等参数），名字回显在 x-djb-ignored-fields。
          type: integer
        cache_control:
          description: 本期**剥离**（缓存由我方内部策略决定），名字回显在 x-djb-ignored-fields。
          type: object
          additionalProperties: true
        tools:
          description: 本期不支持，出现即 400（避免静默降级为纯文本）。
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          description: 本期不支持，出现即 400。
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
        thinking:
          description: 本期不支持，出现即 400。
          type: object
          additionalProperties: true
      example:
        model: claude-sonnet-4
        max_tokens: 256
        system: 你是简洁的助手。
        messages:
        - role: user
          content: 你好
        stop_sequences:
        - '


          Human:'
        stream: false
    AnthropicContentBlock:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
          - image
          - document
          - tool_use
          - tool_result
          - thinking
          - redacted_thinking
        text:
          type: string
        cache_control:
          description: 逐块缓存标记：本期剥离并回显字段名。
          type: object
          additionalProperties: true
      description: 本期仅 `text` 被接受；其余类型返回 400，字段路径为 messages[i].content[j].type。
    AnthropicMessage:
      type: object
      required:
      - id
      - type
      - role
      - model
      - content
      - stop_reason
      - stop_sequence
      - usage
      properties:
        id:
          type: string
          pattern: ^msg_[0-9a-f]+$
        type:
          type: string
          enum:
          - message
        role:
          type: string
          enum:
          - assistant
        model:
          type: string
        content:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicContentBlock'
          description: 空正文时为 []（不是 [{"type":"text","text":""}]）。
        stop_reason:
          type: string
          enum:
          - end_turn
          - max_tokens
          - tool_use
          - refusal
        stop_sequence:
          type: string
          nullable: true
          description: 本期恒为 null（不猜测命中了哪个 stop 序列）。
        usage:
          $ref: '#/components/schemas/AnthropicUsage'
      example:
        id: msg_9f1e2d3c4b5a69788a9b0c1d2e3f4a5b
        type: message
        role: assistant
        model: claude-sonnet-4
        content:
        - type: text
          text: 你好！
        stop_reason: end_turn
        stop_sequence: null
        usage:
          input_tokens: 25
          output_tokens: 118
    AnthropicUsage:
      type: object
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
    AnthropicStreamEvent:
      type: string
      description: 'SSE 帧文本：每帧包含 `event: <name>` 行与 `data: <json>` 行，且 `data.type == event`。

        事件序：message_start → content_block_start → content_block_delta* →

        content_block_stop → message_delta → message_stop；流内失败只发 error 且不发 message_stop。

        message_start.message.content 恒为 []；usage.input_tokens 为该帧的本机估算，

        message_delta.usage 只带 output_tokens（上游实际值）。

        '
      enum:
      - message_start
      - content_block_start
      - content_block_delta
      - content_block_stop
      - message_delta
      - message_stop
      - error
    AnthropicError:
      type: object
      required:
      - type
      - error
      properties:
        type:
          type: string
          enum:
          - error
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
              enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - not_found_error
              - request_too_large
              - rate_limit_error
              - billing_error
              - api_error
              - overloaded_error
            message:
              type: string
        request_id:
          type: string
      example:
        type: error
        error:
          type: invalid_request_error
          message: max_tokens 必须是 ≥1 的整数
        request_id: 9f1e2d3c-4b5a-6978-8a9b-0c1d2e3f4a5b
