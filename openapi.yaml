      operationId: pollNodeChannel
      description: '**节点出站长轮询**（C10 决策单 A：HTTP 长轮询 + 内存队列，正文不落库、默认关）。

        客户端用 `X-Client-Key` 鉴权，携带 `wait_s` 阻塞至多 N 秒取一个任务；到点无任务返回

        `204`（无响应体）。单节点同时只允许 **1 个在途任务**（由通道层保证）。

        任务正文（`messages`）**只在内存与响应体过一手**：平台不落库、不进日志、不进事件。

        未接线 / 通道关闭 / 节点离线 → `503` + `50903`（不静默回落 Echo；是否回落由部署层显式选择）。

