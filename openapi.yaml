  /api/v1/user/email/change:
    post:
      tags:
      - identity
      summary: 申请更换登录邮箱（先 pending，未确认前登录邮箱不变）
      operationId: changeUserEmail
      description: '**不假装已生效**：只写 pending（`state=pending`），`users.email_hash` 不变。

        当前没有邮件通道（归 M12），因此 `confirm_available=false`、

        `confirm_blocked_reason=email_channel_not_available`——调用方据此如实展示「待验证」。

        已启用 MFA 时需 step-up。新邮箱只存 `sha256`，响应只回**掩码**。

        '
      security:
      - userBearer: []
      parameters:
      - name: X-User-Step-Up
        in: header
        required: false
        description: 已启用 MFA 时必填。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              properties:
                new_email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '200':
          description: 已登记待确认（登录邮箱未变）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '424':
          $ref: '#/components/responses/StepUpRequired'
    delete:
      tags:
      - identity
      summary: 取消待确认的换邮箱申请（幂等；登录邮箱不变）
      operationId: cancelUserEmailChange
      description: '只撤销 pending 申请，不改 users.email_hash；没有待确认申请时按幂等成功返回。

        已启用 MFA 时需 step-up（X-User-Step-Up 或 5 分钟窗口），否则 424。

        '
      security:
      - userBearer: []
      parameters:
      - name: X-User-Step-Up
        in: header
        required: false
        description: 已启用 MFA 时必填。
        schema:
          type: string
      responses:
        '200':
          description: 已取消（或本来就没有待确认申请）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '424':
          $ref: '#/components/responses/StepUpRequired'
  /api/v1/user/mfa/disable:
    post:
      tags:
      - identity
      summary: 关闭 MFA（带当前因子，或已通过 step-up）
      operationId: disableUserMfa
      description: '两条路径：请求体带 `code`（当前因子）→ 直接关闭；

        不带 `code` → **必须**已通过 step-up（`X-User-Step-Up` 或 5 分钟窗口），否则 424。

        '
      security:
      - userBearer: []
      parameters:
      - name: X-User-Step-Up
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStateAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '424':
          $ref: '#/components/responses/StepUpRequired'
  /api/v1/user/mfa/enroll:
    post:
      tags:
      - identity
      summary: 登记 MFA 因子（因子只显示一次）
      operationId: enrollUserMfa
      description: '不传 `method`（或 `method=pin`）：服务端生成 6 位因子（与 `POST /api/v1/auth/step-up`

        的 `mfa_code` 同一因子），**只在本次响应里出现一次**；库中只有 scrypt 派生串 + salt。

        状态机：`none → pending`；需再调 `/user/mfa/verify` 才算启用。

        已启用时重复登记 → 409（先关闭再登记）。

        `method=totp`（加性，2026-11-02）：改为登记 TOTP 因子，响应带 `secret` / `otpauth_uri` /

        `recovery_codes`（同样只出现一次）；TOTP 的启用状态在 `identity_totp_factors`，

        **不改** `users.mfa_state` 语义；`/user/mfa/verify` 提交动态码即完成绑定。

        开关 `identity.mfa_totp` 关闭时 `method=totp` 返回 404（reason=totp_disabled）。

        '
      security:
      - userBearer: []
      requestBody:
        required: false
        description: 可选；缺省 = pin（与历史行为逐字一致）。
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum:
                  - pin
                  - totp
                  default: pin
      responses:
        '200':
          description: 因子已生成（pending）
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Pragma:
              schema:
                type: string
                enum:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/user/mfa/verify:
    post:
      tags:
      - identity
      summary: 校验因子并启用 MFA
      operationId: verifyUserMfa
      security:
      - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStateAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/user/mfa/totp/enroll:
    post:
      tags:
      - identity
      summary: 登记 TOTP（密钥/恢复码只回一次）
      operationId: enrollUserTotp
      description: '`identity.mfa_totp` 开关打开时可用；关闭时路径不存在（404）。

        状态 `none → pending`，需再调 `/user/mfa/totp/confirm` 才算启用。

        `secret` / `otpauth_uri` / `recovery_codes` 只在本次响应出现，服务端只存密文/哈希。

        '
      security:
      - userBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                account_name:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: 已生成（pending）
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - secret
                - otpauth_uri
                - account_name
                - recovery_codes
                - digits
                - period
                properties:
                  state:
                    type: string
                    enum:
                    - pending
                  secret:
                    type: string
                    description: Base32 密钥，只出现一次
                  otpauth_uri:
                    type: string
                    description: otpauth:// 配对链接，只出现一次
                  account_name:
                    type: string
                  recovery_codes:
                    type: array
                    items:
                      type: string
                  digits:
                    type: integer
                    enum:
                    - 6
                  period:
                    type: integer
                    enum:
                    - 30
                  status:
                    $ref: '#/components/schemas/TotpStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: 未配置 MFA 加密密钥（fail-closed）
  /api/v1/user/mfa/totp/confirm:
    post:
      tags:
      - identity
      summary: 确认 TOTP 绑定
      operationId: confirmUserTotp
      security:
      - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 16
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - confirmed_at
                - recovery_codes_left
                properties:
                  state:
                    type: string
                    enum:
                    - enabled
                  confirmed_at:
                    type: string
                    format: date-time
                  recovery_codes_left:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 尚未登记 TOTP
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/user/mfa/totp/disable:
    post:
      tags:
      - identity
      summary: 解绑 TOTP（口令 + 动态码/恢复码）
      operationId: disableUserTotp
      description: 双因子确认；成功后删除因子与全部恢复码，已启用 MFA 的登录回到无 TOTP 状态。
      security:
      - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              - code
              properties:
                password:
                  type: string
                  maxLength: 128
                code:
                  type: string
                  minLength: 6
                  maxLength: 16
      responses:
        '200':
          description: 已解绑
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - disabled_at
                properties:
                  state:
                    type: string
                    enum:
                    - none
                  disabled_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 尚未登记 TOTP
  /api/v1/user/mfa/totp:
    get:
      tags:
      - identity
      summary: TOTP 绑定状态（不回密钥）
      operationId: getUserTotp
      security:
      - userBearer: []
      responses:
        '200':
          description: 当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/user/password/change:
    post:
      tags:
      - identity
      summary: 修改口令（旧口令；已启用 MFA 时还需 step-up）
      operationId: changeUserPassword
      description: '两道因子：**旧口令**必填（证明知道当前口令）；账户已启用 MFA 时**另需 step-up**

        （`X-User-Step-Up` 头或 5 分钟内的会话 step-up 窗口）。

        成功后**撤销除当前会话外**的全部活跃会话（返回 `revoked_sessions` 条数）。

        旧口令错误返回 **400/40001**（不是 401：401 会被门户当成会话过期而跳登录）。

        '
      security:
      - userBearer: []
      parameters:
      - name: X-User-Step-Up
        in: header
        required: false
        description: step-up 令牌（`POST /api/v1/auth/step-up` 的返回值）；已启用 MFA 时必填。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - old_password
              - new_password
              properties:
                old_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          description: 已改密
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '424':
          $ref: '#/components/responses/StepUpRequired'
  /api/v1/user/requests/{request_id}:
    get:
      tags:
      - identity
      summary: 自助诊断：这条请求走了哪个节点 / 是否计费 / 为什么失败
      operationId: getUserRequestTrace
      description: '只读聚合三张既有表：`api_request_log`（M03，保留 7 天）、`usage_records`（M05）、

        `routing_decisions`（M04，保留 12 个月）。

        **404 不泄漏**：不存在 / 不属于本人 / request_id 格式非法 → 一律 40401 + `reason=not_found`。

        **脱敏**：不含 prompt/response（本就没存）、密钥、候选集与评分明细（INV-12）；

        `route` / `billing` / `failure_reason` 为**人可读字符串**（门户直接渲染），

        `route_detail` / `billing_detail` 为结构化明细。

        **不编造**：缺哪张表就少哪块，并在 `notes` 里写清原因（未采集 / 已过保留期）。

        '
      security:
      - userBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.:\-]+$
      responses:
        '200':
          description: 诊断视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTrace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/user/sessions:
    get:
      tags:
      - identity
      summary: 本人的活跃会话（安全中心「可信设备」）
      operationId: listUserSessions
      description: '只回本人、未撤销、未过期的会话；按最近活跃倒序，最多 50 条。

        **不含**令牌材料与明文 IP：`ip_masked` 是掩码（`192.168.***.***`），`user_agent` 截断 200 字符。

        当前请求所在会话带 `current=true`。

        '
      security:
      - userBearer: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/user/sessions/{session_id}:
    delete:
      tags:
      - identity
      summary: 撤销本人的某个会话
      operationId: revokeUserSession
      description: '幂等语义：已撤销 / 不存在 / 不属于本人 / id 非法 → **一律 404/40401**

        （不泄漏存在性，A6 口径）。撤销当前会话会让本次令牌立即失效。

        '
      security:
      - userBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/chat/completions:
    post:
      tags:
      - gateway
      summary: 对话调用（OpenAI 兼容）
      operationId: createChatCompletion
      description: '非流式返回单个 `chat.completion`；`stream: true` 返回 SSE（`text/event-stream`），

        事件以 `data: {...}` 逐块下发、以 `data: [DONE]` 结束。流式请求也计费一次。

        `model: djb/auto`（1.11.0 加性，需服务端开启路由型）表示按 `djb_route` 策略

        在 `/v1/models` 中 `call_modes` 含 `routed` 的候选里自动选一条成交：

        响应 `model` 是**实际成交模型**，诊断头 `X-DJB-Route-*` 给出策略 / 候选数 /

        选中模型 / reason（不含价格与内部成本）。没有候选时 fail-closed

        `503`（`50901`，`error.reason` ∈ `no_candidates` / `no_capacity` / `no_quote` /

        `no_compatible_model`），绝不编造回答或改走单模型；开关关闭时 `djb/auto`

        按 `404`（`40401`）处理。单模型请求语义与 1.10.0 完全一致。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/Capabilities'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: '成功。非流式返回 `application/json`（`chat.completion`）；`stream: true`

            返回 `text/event-stream`，逐块 `data: <json>`，结束为 `data: [DONE]`。

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-DJB-Proxy-Diag:
              description: '可选（1.3.0 加性）：代理模式诊断。值形如

                `mode=balanced; reason=latency_first_conflict; downgraded_from=max_save`；

                `fidelity` 下可缺省或为 `mode=fidelity`，客户端必须容忍缺失。

                该头只含口径（生效档位 / reason_code / 降级来源），不含凭据、正文、

                阈值或路由权重。

                '
              schema:
                type: string
            X-DJB-Route:
              description: '可选（1.11.0 加性）：本次调用是否走路由型。

                `single` = 指定模型直呼；`routed` = `model: djb/auto` 自动选路。

                开关关闭时缺省（旧行为逐字节不变）；客户端必须容忍缺失。

                '
              schema:
                type: string
                enum:
                - single
                - routed
            X-DJB-Route-Strategy:
              description: '可选（1.11.0 加性）：路由策略。单模型为 `single`；

                路由型为 `cheap` / `fast` / `reliable` / `balanced`（请求 `djb_route` 缺省

                `balanced`）。`fast` 在服务端没有延迟数据时回退为价格序，

                reason 会写 `latency_unavailable_price_order`。

                '
              schema:
                type: string
                enum:
                - single
                - cheap
                - fast
                - reliable
                - balanced
            X-DJB-Route-Candidates:
              description: '可选（1.11.0 加性）：选择时真实可参与比价的候选数（十进制整数）。

                单模型请求为 `1`；`0` 只出现在 fail-closed 错误响应里。

                幂等回放时缺省（原始候选数已不可知，不用 0 冒充）。

                '
              schema:
                type: integer
                minimum: 0
            X-DJB-Route-Selected:
              description: '可选（1.11.0 加性）：实际成交的模型 slug（路由型时**不是** `djb/auto`）。

                只回模型名，不回节点、价格或凭据。

                '
              schema:
                type: string
            X-DJB-Route-Reason:
              description: '可选（1.11.0 加性）：选择原因的稳定代码（逗号分隔，可扩展，客户端按前缀

                容忍未知值）：`direct` / `lowest_price` / `availability_then_price` /

                `availability_freshness_price` / `latency_unavailable_price_order` /

                `only_candidate` / `idempotent_replay` / `no_candidate` /

                `no_candidates` / `no_capacity` / `no_quote` / `no_compatible_model` /

                `retried`。只含口径，不含价格、阈值、节点或内部成本。

                '
              schema:
                type: string
            X-DJB-Composition:
              description: '可选（1.11.0 加性，补登既有的 1.3.0 行为）：**生效**的组合形态。

                已降级为 single 时不返回该头（不谎报组合）。

                '
              schema:
                type: string
                enum:
                - mono_pair
                - hetero_pair
            X-DJB-Composition-Downgraded-From:
              description: '可选（1.11.0 加性，补登既有的 1.3.0 行为）：被诚实降级的原始组合形态。

                出现该头即表示服务端没有按组合执行；错误响应同样携带，并在

                `error.djb_composition_downgraded_from` 重复一次（头 + 正文双写）。

                '
              schema:
                type: string
                enum:
                - mono_pair
                - hetero_pair
            X-DJB-Degraded:
              description: '可选（1.11.0 加性）：`1` 表示本次响应存在**已声明**的降级

                （目前用于组合降级），与 `X-DJB-Composition-Downgraded-From` 同时出现。

                '
              schema:
                type: string
                enum:
                - '1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'SSE：逐块 `data: <json>`，结束为 `data: [DONE]`。'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/models:
    get:
      tags:
      - gateway
      summary: 模型清单与价格
      operationId: listModels
      description: '返回可路由模型（模型 slug 不可变，见正式文档 §18.1）。价格是公开信息但不是

        结算依据；结算以账本分录为准。鉴权保持 `userBearer`（1.2.6 **不改**鉴权）；

        `price_version` 为**可选**字段：公开侧（未登录文档站 / 降级镜像）可缺省或不返回，

        客户端必须容忍缺失并按降级展示，不得据此推断结算价。

        1.11.0 起每个模型可带 `kind`（chat/image/video，服务端**不猜**，缺省即未标注）

        与 `call_modes`（`single` / `routed`）；服务端开启路由型时清单末尾追加

        `djb/auto`（`kind: chat`、`call_modes: ["routed"]`），关闭时不出现。

        真实模型恒为 `["single"]`——没有真实 routed 能力就不写 `routed`。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 模型清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/batches:
    post:
      tags:
      - gateway
      summary: 提交批量任务
      operationId: createBatch
      x-djb-availability: m03
      description: '异步受理，立即返回 `batch_id` / `eta_seconds` / 预估成本；实际成本以完成后的

        收据与账本分录为准。大任务必须走这里，不得占用实时决策资源。


        **部署可用性**：只在 M03 网关装配（`DJB_GATEWAY_M03=1`）时挂载；默认部署该路由

        不存在（404），调用方按「端点不存在」降级（见 `x-djb-availability: m03`）。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '202':
          description: 已受理
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Location:
              description: 轮询地址（指向 GET /v1/batches/{id}）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/batches/{id}:
    get:
      tags:
      - gateway
      summary: 批量任务进度与结果
      operationId: getBatch
      x-djb-availability: m03
      description: '返回进度、检查点恢复次数、结果引用与实际成本。结果内容本身另走签名 URL

        （≤15 分钟），不在本响应内联。


        **部署可用性**：只在 M03 网关装配（`DJB_GATEWAY_M03=1`）时挂载；默认部署该路由

        不存在（404），调用方按「端点不存在」降级（见 `x-djb-availability: m03`）。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 任务状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/batches/{id}/cancel:
    post:
      tags:
      - gateway
      summary: 取消批量任务
      operationId: cancelBatch
      x-djb-availability: m03
      description: '幂等：对已结束任务重复取消返回当前状态而非报错。已产生的用量照常计费。


        **部署可用性**：只在 M03 网关装配（`DJB_GATEWAY_M03=1`）时挂载；默认部署该路由

        不存在（404），调用方按「端点不存在」降级（见 `x-djb-availability: m03`）。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/BatchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 取消结果（含当前状态）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/user/usage/summary:
    get:
      tags:
      - user
      summary: 用量汇总
      operationId: getUserUsageSummary
      description: '`from`/`to` 为 UTC 日期（含端点）。明细（logs）是另一条端点，未纳入本版本。 分组维度是否含 `day` 待正式文档确认。

        '
      security:
      - userBearer: []
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: group_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - model
          - day
          default: model
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      responses:
        '200':
          description: 用量汇总
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/node/register:
    post:
      tags:
      - node
      summary: 节点注册
      operationId: registerNode
      description: '首次注册进入 `pending`，需人工准入审核（后台 `/api/v1/admin/supply/nodes/{id}/review`）。

        `hardware_fingerprint` 只上报哈希；平台不回传原始硬件信息。

        '
      security:
      - nodeClientKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegisterRequest'
      responses:
        '201':
          description: 已受理（pending）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/node/heartbeat:
    post:
      tags:
      - node
      summary: 心跳 + 容量公告
      operationId: postNodeHeartbeat
      description: '心跳携带 `protocol_version` 与 `policy_version`（两者不是一回事，见）

        以及本轮容量公告（`capacity_announcement`，字段见）。

        公告是**时序**数据：服务端以最新一次为准，历史进快照。

        '
      security:
      - nodeClientKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/Capabilities'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeHeartbeatRequest'
      responses:
        '200':
          description: 心跳确认
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/node/upstream:
    post:
      tags:
      - node
      summary: 申报接入方式（A1/A2/B）
      operationId: declareNodeUpstream
      description: '申报接入类型、端点与模型清单。**凭据永不上行**（H1）：请求里只放本地凭据句柄

        `credential_handle`，服务端不接收、不存储、不代持凭据本体。连通性检查走

        `/api/v1/node/upstream/probe`（本地发起）。

        '
      security:
      - nodeClientKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpstreamRequest'
      responses:
        '200':
          description: 申报已登记
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeUpstreamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/node/receipts:
    post:
      tags:
      - node
      summary: 批量提交双签收据
      operationId: submitNodeReceipts
      description: '收据是计量的原始凭证，**供方与需方各签**（`sig_provider` / `sig_consumer`，

        字段见）。服务端验签后入账；单边签名或无签名直接拒收。

        批量提交按 receipt 粒度返回 accepted/rejected，不做整批回滚。

        '
      security:
      - nodeClientKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptBatchRequest'
      responses:
        '200':
          description: 逐条受理结果
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
      - metering
      summary: List Node Receipts
      description: 节点控制台：本节点双签收据列表（只读；``hash`` 只给前 8 位）。
      operationId: list_node_receipts_api_v1_node_receipts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - array
                    description: 收据行（receipt_id/task_id/state/revenue_micro/tokens/hash 前 8 位/issued_at；非受理行 revenue_micro=null）
                  page:
                    type: object
                    description: cursor/has_more/next_cursor
  /api/v1/node/policy:
    get:
      tags:
      - node
      summary: 拉取策略与配额（版本化）
      operationId: getNodePolicy
      description: '返回按节点下发的策略与配额**结构与当前版本号**。具体数值由服务端下发，

        spec 不规定数值；客户端只按 `policy_version` 应用，不得猜测。

        '
      security:
      - nodeClientKey: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProtocolVersion'
      - name: If-None-Match
        in: header
        required: false
        description: 传上次的 `policy_version`；命中则 304，省流量。
        schema:
          type: string
      responses:
        '200':
          description: 当前策略
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              description: 即 policy_version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePolicy'
        '304':
          description: 未变更（客户端 policy_version 仍有效）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/protocol/capabilities:
    get:
      tags:
      - protocol
      summary: 能力协商
      operationId: getProtocolCapabilities
      description: '返回 `protocol_version` 与 `capabilities[]`。双方只启用交集；**未知 capability

        忽略不报错**。客户端带 `DJB-Protocol-Version` 且不受支持时返回 426（`42601`）。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersion'
      - $ref: '#/components/parameters/Capabilities'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 能力清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolCapabilities'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/protocol/deprecations:
    get:
      tags:
      - protocol
      summary: 弃用清单与退役日期
      operationId: getProtocolDeprecations
      description: '列出已弃用端点/字段、替代方案与 `sunset_at`。弃用提前 ≥90 天公示，

        且至少跨 2 个 MAJOR。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: protocol_major
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: 弃用清单
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecationList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/schedule/snapshot/{period}:
    get:
      tags:
      - schedule
      summary: 公开容量公告与出价快照（离线复算）
      operationId: getScheduleSnapshot
      description: '按周期发布的容量公告与出价快照，供任何第三方离线复算。只含**输入**与版本

        （`quote_version`），不含调度评分、权重或淘汰原因——那些在决策日志里，

        经审批后按审计流程提供。

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/Period'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 周期快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/ledger/entries:
    get:
      tags:
      - admin
      summary: 账本只读查询
      operationId: listLedgerEntries
      description: '只读查询账本分录（`ledger_entry`，字段见）。账本只追加：

        没有写接口，调整只能走冲正流程（后台双人复核）。本端点属管理面：

        内网/VPN + 强 MFA + 敏感页 step-up（≤5 分钟有效），公网不可达。

        '
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: entry_type
        in: query
        required: false
        schema:
          type: string
      - name: source_type
        in: query
        required: false
        description: 按幂等键来源过滤（16 值白名单，见 SourceType）。
        schema:
          $ref: '#/components/schemas/SourceType'
      - name: status
        in: query
        required: false
        description: 5 值枚举（同 LedgerEntry.status）；reversed 已退役，冲正改用 void + reverse_of。
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - locked
          - settled
          - void
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/RequestId'
      - name: X-Admin-Step-Up
        in: header
        required: true
        description: 敏感页二次认证凭据（≤5 分钟有效）
        schema:
          type: string
      responses:
        '200':
          description: 分页分录
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntriesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/config/items:
    get:
      tags:
