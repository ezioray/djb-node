          description: '1.11.0 加性：该模型**真实支持**的调用形态。`single` = 指定模型直呼；

            `routed` = 可作为 `djb/auto` 的候选被自动选路。真实模型恒为 `["single"]`

            （没有真实 routed 能力就不写 routed）；`djb/auto` 为 `["routed"]`。

            缺省按 `["single"]` 兼容读取。

            '
        description:
          type: string
          description: 1.11.0 加性：面向调用方的一句话说明（如 `djb/auto` 的选路语义）。
        context_window:
          type: integer
        unit:
          type: string
          description: 计量单位（如 token）。
        price:
          type: object
          additionalProperties: true
          description: 公开参考价；结算是以账本分录为准，不以本字段为准。
          properties:
            amount:
              type: string
              description: 十进制字符串（不用浮点）。
            unit:
              type: string
        price_version:
          type:
          - string
          - 'null'
          description: '价格快照版本（M04 model_catalog.price_version / M10 同族），用于三处同源校验。

            公开侧（未登录文档站 / 降级镜像）可缺省为 null；客户端不得据此推断结算价。

            '
        tokenizer_version:
          type:
          - string
          - 'null'
          description: 服务端已知的 tokenizer 版本（C17/M18）；缺省表示未同步/未知。
        model_sync_version:
          type:
          - integer
          - 'null'
          description: 该行来源的模型同步 bundle 版本（C17/M18）；缺省表示未同步。
        available:
          type: boolean
          description: '当前是否可服务（C9，1.2.8）。服务端按「容量公告 + 已验证上游（state=verified）

            且 verified_at 在新鲜窗口内」判定；字段缺省表示未计算/降级镜像，客户端不得推断为可用。

            '
        probe:
          type: object
          additionalProperties: false
          description: '可用性依据（C9，1.2.8）；只在服务端能给出时返回。reason 为 no_capacity / unverified /

            stale，available=true 时为 null。

            '
          properties:
            level:
              type:
              - string
              - 'null'
              description: 服务端已知的证明等级；S2 仅回传可用性，暂不宣称 L3+。
            verified_at:
              type:
              - string
              - 'null'
