          type: boolean
          default: false
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stop:
          type: array
          items:
            type: string
        user:
          type: string
          description: 可选的调用方自定义稳定标识（用于防滥用去重，不留 PII）。
        djb_proxy_mode:
          type: string
          enum:
          - fidelity
          - balanced
          - max_save
          default: fidelity
          description: '可选（1.3.0 加性）：代理激进程度。缺省 `fidelity`，与旧请求行为一致。

            `batch` 只有**显式**请求 `balanced` / `max_save` 才返回 `40003`；`fidelity`

            或省略照常服务（慢任务不被误伤）。未知值按 `40001` 处理，不静默降级。

            '
        djb_composition:
          type: string
          enum:
          - single
          - mono_pair
          - hetero_pair
          default: single
          description: '可选（1.3.0 加性）：模型组合形态。缺省 `single`，与旧请求行为一致。

            组合必须通过词表一致性门；不满足时按 `resolve_composition()` 退 `single`

            并在诊断头标 `downgraded_from`。

            '
        djb_effort:
          type: string
          enum:
          - minimal
          - low
          - medium
          - high
          - auto
          default: auto
          description: '可选（1.3.0 加性）：推理强度。`auto` 只在 `single` 形态可用；

            `mono_pair` / `hetero_pair` 下必须显式选，否则 `40001`。

            缺省 `auto` 不改变旧请求的 token 预算口径。

            '
        djb_route:
          oneOf:
          - type: string
            enum:
            - cheap
            - fast
            - reliable
            - balanced
          - type: object
            additionalProperties: true
            properties:
              strategy:
                type: string
                enum:
                - cheap
                - fast
                - reliable
                - balanced
                default: balanced
          description: '可选（1.11.0 加性）：路由型选择策略，只在 `model: djb/auto` 时有意义；

            单模型请求里出现该字段按忽略处理（不改变旧行为）。字符串简写等价于

            `{strategy: <值>}`，对象缺省 `strategy` 为 `balanced`，未知字段忽略

            （tolerant reader）。四个策略：`cheap` 最低参考价；`balanced` 已知可用

            优先再比价（默认）；`reliable` 已知可用 + 探针新鲜优先再比价；`fast` 在有

            真实延迟数据时按延迟、否则回退价格序并在 `X-DJB-Route-Reason` 写明

            `latency_unavailable_price_order`（不伪造「快」）。与 `djb_composition`

            非 `single` 同时使用时返回 `40001`（`reason=composition_with_routing`），

            不做「假装路由成功」的静默降级。

            '
