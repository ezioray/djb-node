        config_ref:
          type: [string, 'null']
          description: M10 配置键引用（阈值只在配置里，不进本接口）。

    RiskRuleRequest:
      type: object
      additionalProperties: true
      required: [rule_key, severity, action_class]
      properties:
        rule_key: { type: string }
        enabled: { type: boolean, default: true }
        severity:
          type: string
          enum: [P0, P1, P2, P3]
        action_class:
          type: string
          enum: [observe, throttle, freeze, retire, manual_review]
        config_ref: { type: [string, 'null'] }

    RiskRulePage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RiskRule' }
        page: { $ref: '#/components/schemas/Page' }

    RiskLimit:
      type: object
      additionalProperties: true
      required: [subject_type, subject_id, limit_type, value, window_s]
      properties:
        subject_type:
          type: string
          enum: [account, node, key, address]
        subject_id: { type: string }
        limit_type: { type: string }
        value: { type: integer, minimum: 0 }
        window_s: { type: integer, minimum: 0 }
        expires_at: { type: [string, 'null'], format: date-time }

    RiskLimitRequest:
      type: object
      additionalProperties: true
      required: [subject_type, subject_id, limit_type, value, window_s]
      properties:
        subject_type:
          type: string
          enum: [account, node, key, address]
        subject_id: { type: string }
        limit_type: { type: string }
        value: { type: integer, minimum: 0 }
        window_s: { type: integer, minimum: 0 }
        expires_at: { type: [string, 'null'], format: date-time }

    RiskLimitPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RiskLimit' }
        page: { $ref: '#/components/schemas/Page' }

    RiskCase:
      type: object
      additionalProperties: true
      required: [case_id, subject_hash, risk_type, severity, status, opened_at]
      properties:
        case_id: { type: string }
        subject_hash: { type: string, description: 加盐哈希或簇 ID，不存明文。 }
        risk_type:
          type: string
          enum: [self_trade, wash_volume, sybil, malicious_occupancy, receipt_mismatch, key_leak, chargeback_abuse, payout_address, content_abuse]
        severity:
          type: string
          enum: [P0, P1, P2, P3]
        status:
          type: string
          enum: [opened, triaged, actioned, appealed, in_review, closed, merged, dismissed]
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }

    RiskCasePage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RiskCase' }
        page: { $ref: '#/components/schemas/Page' }

    RiskCaseDetail:
      type: object
      additionalProperties: true
      required: [case, evidence_refs]
      properties:
        case: { $ref: '#/components/schemas/RiskCase' }
        evidence_refs:
          type: array
          items: { type: string }
          description: 证据引用（事件 id / 收据 id / 交易号 / 举报单），不含正文与阈值。
        decisions:
          type: array
          items: { $ref: '#/components/schemas/RiskDecision' }
        appeals:
          type: array
          items: { $ref: '#/components/schemas/RiskAppeal' }

    RiskDecisionRequest:
      type: object
      additionalProperties: true
      required: [action, reason, evidence_refs]
      properties:
        action:
          type: string
          enum: [freeze, unfreeze, retire_proposal, dismiss, merge, close]
        reason: { type: string, minLength: 1, maxLength: 512 }
        evidence_refs:
          type: array
          minItems: 1
          items: { type: string }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 冻结期限（≤180 天）。

    RiskDecision:
      type: object
      additionalProperties: true
      required: [case_id, action, decided_by, decided_at]
      properties:
        case_id: { type: string }
        action:
          type: string
          enum: [freeze, unfreeze, retire_proposal, dismiss, merge, close]
        reason: { type: string }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        proposal_id: { type: [string, 'null'] }

    RiskAppeal:
      type: object
      additionalProperties: true
      required: [appeal_id, case_id, status, submitted_at, sla_due]
      properties:
        appeal_id: { type: string }
        case_id: { type: string }
        status:
          type: string
          enum: [submitted, in_review, upheld, overturned, closed]
        submitted_at: { type: string, format: date-time }
        sla_due: { type: string, format: date-time }
        outcome: { type: [string, 'null'] }

    RiskAppealRequest:
      type: object
      additionalProperties: true
      required: [case_id, reason]
      properties:
        case_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 512 }

    RiskAppealDecisionRequest:
      type: object
      additionalProperties: true
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [upheld, overturned]
        reason: { type: string, minLength: 1, maxLength: 512 }


    # ------------------------------------------------------------ 支付与资金（M08，spec 1.2.5）
    # 敏感字段红线：不含卡号 / 私钥 / 助记词 / keystore / 完整签名；签名材料只以 hash 或 signing_request 引用出现。
    # 字段名与 M08 席位的 T1 模型（worktrees/M08-treasury）对齐；未落地项在证据「未定字段」列出。
    PaymentOrderCreateRequest:
      type: object
      additionalProperties: true
      required: [amount_minor, currency, method]
      properties:
        amount_minor:
          type: integer
          minimum: 1
          description: 金额整数最小单位（分）；不接受浮点，超精度直接拒绝（INV-07）。
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO-4217；一单一个币种。
        method:
          type: string
          enum: [card, bank_transfer, wechat, alipay]
          description: |
            支付方式（PSP 通道能力）。通道未开启 → 403 + `40310`；地区不支持 → 403 + `40311`；
            入金风控等级不足 → 403 + `40312`。链上收款走收款地址 + 回调，不用本字段。
        provider:
          type: [string, 'null']
          description: 通道适配器标识（如 mock / upg / gifpay）；缺省按服务端默认。新增通道属只加不改。
        description:
          type: [string, 'null']
          maxLength: 512
          description: 订单备注（人类可读；不含凭据 / 卡数据 / 个人信息）。
        expires_in_s:
          type: [integer, 'null']
          minimum: 60
          maximum: 604800
          description: 订单有效期（秒），60s–7d；缺省按通道默认。

    PaymentOrder:
      type: object
      additionalProperties: true
      required: [order_id, order_no, status, amount_minor, currency, created_at]
      properties:
        order_id: { type: string, description: 内部主键（UUID）。 }
        order_no:
          type: string
          description: 对外订单号（≤32 字符，全局唯一，创建后不变）。
        amount_minor: { type: integer, minimum: 1, description: 整数最小单位（分）。 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        method:
          type: string
          enum: [card, bank_transfer, wechat, alipay]
        provider: { type: [string, 'null'] }
        status:
          type: string
          enum: [created, pending, paid, credited, failed, closed, expired]
          description: created → pending → paid → credited；终止 failed / closed / expired（终态不可回退）。
        credited_minor:
          type: integer
          minimum: 0
          description: 已入账金额（确认数 ≥64，大额 ≥200；未达只挂账、不进本字段）。
        description: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        credited_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    PaymentAttempt:
      type: object
      additionalProperties: true
      required: [attempt_id, provider, status]
      properties:
        attempt_id: { type: string }
        provider: { type: string, description: 通道 / 链标识（PaymentProvider.id()）。 }
        provider_status:
          type: [string, 'null']
          description: 通道原始状态（已映射到 status；原样值可能随通道变化，客户端按 status 判断）。
        status:
          type: string
          enum: [initiated, succeeded, failed]
        amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: [string, 'null'] }
        signature_verified:
          type: boolean
          description: 验签结论（只存结论；原始签名 / 密钥不进 DB、不进响应）。
        failure_code:
          type: [string, 'null']
          description: 失败原因码（通道无关的粗粒度码；不含通道原文）。
        created_at: { type: [string, 'null'], format: date-time }

    PaymentOrderDetail:
      type: object
      additionalProperties: true
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/PaymentOrder' }
        original_route_masked:
          type: [string, 'null']
          readOnly: true
          description: |
            原路展示用掩码（`psp:<provider>:****<末4>`，末 4 位为原路标识末尾）；
            无成功 `payment_attempt` 时为 null。**只用于展示，永不作为入参**；
            真实原路不入响应（退款只回原路哈希）。
        attempts:
          type: array
          items: { $ref: '#/components/schemas/PaymentAttempt' }

    PaymentWebhookAck:
      type: object
      additionalProperties: true
      required: [received]
      properties:
        received:
          type: boolean
          description: 恒 true；验签失败走 400 + 40001，金额不符走 409 + 40911。
        duplicate:
          type: boolean
          description: true 表示重复回调，返回首次处理结果（幂等，不重复入账；409 + 40910 亦表示重复）。
        order_no: { type: [string, 'null'] }
        provider_txn_id: { type: [string, 'null'] }
        status:
          type: [string, 'null']
          description: 处理后订单状态（同 PaymentOrder.status）；未关联订单时为 null。

    RefundRequestCreateRequest:
      type: object
      additionalProperties: true
      required: [order_no, amount_minor, reason_code]
      properties:
        order_no: { type: string, minLength: 3, maxLength: 32 }
        amount_minor:
          type: integer
          minimum: 1
          description: ≤ 已付未消耗（INV-12）；币种与原单一致。
        reason_code:
          type: string
          minLength: 1
          maxLength: 512
          description: 退款原因码 / 说明（人类可读；不含凭据）。
        original_route:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            原路标识（与支付方式一致）。**可省略**：省略时服务端按 `order_no` 对应的**唯一**成功
            `payment_attempt` 推导真实原路；提供时必须**逐字等于**真实原路（掩码串
            `psp:<provider>:****<末4>` 不接受）。无法唯一确定（无成功 attempt 或多次成功）
            → `409` + `40919`（`reason=original_route_unavailable`）。服务端只存哈希，不回显原文。
        evidence_ref: { type: [string, 'null'], maxLength: 128 }

    RefundRequest:
      type: object
      additionalProperties: true
      required: [refund_request_id, refund_no, order_no, amount_minor, currency, status, deadline_at, created_at]
      properties:
        refund_request_id: { type: string }
        refund_no:
          type: string
          description: 对外退款单号（唯一；一条订单唯一 refund_request）。
        order_no: { type: string }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reason_code: { type: [string, 'null'] }
        status:
          type: string
          enum: [requested, approved, executing, succeeded, failed, cancelled]
        original_route_hash:
          type: [string, 'null']
          description: 原路哈希（不回原文 / 卡令牌 / 地址明文；INV-12）。请求省略 original_route 时，按服务端推导出的真实原路计算，掩码不回传。
        deadline_at:
          type: string
          format: date-time
          description: 退款申请窗口截止（14 天；03-facts §5）。
        approved_at: { type: [string, 'null'], format: date-time }
        succeeded_at: { type: [string, 'null'], format: date-time }
        failure_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    PayoutItemInput:
      type: object
      additionalProperties: true
      required: [payee_account_id, payee_address, gross_minor]
      properties:
        payee_account_id: { type: string }
        payee_address:
          type: string
          pattern: '^0x[0-9a-fA-F]{40}$'
          description: 收款地址（须在白名单且冷却期满；INV-13）。
        gross_minor:
          type: integer
          minimum: 0
          description: 应付金额（整数最小单位）；net 由服务端按 policy_version 计算。
        fee_minor: { type: [integer, 'null'], minimum: 0 }
        address_id: { type: [string, 'null'] }

    PayoutBatchCreateRequest:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: 单批 ≤50 笔（PAYOUT_BATCH_MAX_ITEMS）；超出 → 400。
          items: { $ref: '#/components/schemas/PayoutItemInput' }
        gas_mode:
          type: string
          enum: [INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER]
          description: 本批 gas 模式快照；缺省按当前策略（下一批生效、不追溯，INV-14）。
        attestation_ref:
          type: [string, 'null']
          description: M09 对账凭证引用；出款四要素之一（缺则 409 + 40916，INV-10）。

    PayoutItem:
      type: object
      additionalProperties: true
      required: [item_id, gross_minor, fee_minor, net_minor, status]
      properties:
        item_id: { type: string }
        payee_account_id: { type: [string, 'null'] }
        payee_address:
          type: [string, 'null']
          description: 出款地址（链上公开标识）；只读展示，不含密钥。
        gross_minor: { type: integer, minimum: 0 }
        fee_minor: { type: integer, minimum: 0 }
        net_minor: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [pending, sent, carried, failed]
          description: fee > gross 时置 carried，滚存下批（不在本批出款）。
        gas_mode:
          type: string
          enum: [INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER]
        chain_tx_id: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }

    PayoutBatch:
      type: object
      additionalProperties: true
      required: [batch_id, batch_no, status, item_count, total_gross_minor, total_fee_minor, total_net_minor, created_at]
      properties:
        batch_id: { type: string }
        batch_no:
          type: string
          description: 对外批次号（≤32 字符，全局唯一）；审批后明细冻结，改单 = 新批次。
        status:
          type: string
          enum: [draft, prepared, checked, signed, broadcast, settled, partial, failed]
        item_count: { type: integer, minimum: 0 }
        total_gross_minor: { type: integer, minimum: 0 }
        total_fee_minor: { type: integer, minimum: 0 }
        total_net_minor: { type: integer, minimum: 0 }
        items_hash:
          type: [string, 'null']
          description: 明细哈希（审批后冻结的锚；用于证明批次未被改单）。
        attestation_ref:
          type: [string, 'null']
          description: M09 对账凭证引用；出款四要素之一（缺则 409 + 40916，INV-10）。
        gas_mode:
          type: string
          enum: [INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER]
        policy_version: { type: [string, 'null'] }
        maker_id: { type: [string, 'null'], description: 制单人（≠ 复核人）。 }
        checker_id: { type: [string, 'null'], description: 复核人（≠ 制单人）。 }
        checked_at: { type: [string, 'null'], format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
        chain_tx_id: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/PayoutItem' }

    PayoutBatchPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PayoutBatch' }
        page: { $ref: '#/components/schemas/Page' }

    PayoutApproveRequest:
      type: object
      additionalProperties: true
      properties:
        note:
          type: [string, 'null']
          maxLength: 512
          description: 复核备注（人类可读）；不含签名字节。复核人 ≠ 制单人。

    SigningRequest:
      type: object
      additionalProperties: true
      required: [signing_request_id, intent_id, status, expires_at]
      properties:
        signing_request_id: { type: string }
        intent_id:
          type: string
          description: treasury_intent id（kind = PAYOUT / REFUND / SWEEP / REBALANCE / GAS_TOPUP / POLICY_CHANGE / RECOVERY / WALLET_PROVISION）。
        status:
          type: string
          enum: [pending, signed, expired, failed]
        expires_at:
          type: string
          format: date-time
          description: 签名有效期（SIGNING_TTL_S = 1800s；WALLET_PROVISION 放宽 86400s）。
        signer_threshold:
          type: integer
          minimum: 1
          description: 签名门限（钱包与批次 2-of-3，SIGNER_THRESHOLD）。
        auth_hash_prefix:
          type: [string, 'null']
          description: 授权对象哈希前 16 位，供线下核对；完整哈希不进响应。
        created_at: { type: [string, 'null'], format: date-time }

    TreasuryWallet:
      type: object
      additionalProperties: true
      required: [wallet_id, status]
      properties:
        wallet_id: { type: string }
        chain: { type: [string, 'null'], description: 链标识（一期 polygon）。 }
        address:
          type: [string, 'null']
          description: 链上地址（公开标识；后台 / 对账可见，不含密钥）。
        pool_id: { type: [string, 'null'] }
        role:
          type: string
          enum: [hot, warm]
        fund_class:
          type: [string, 'null']
          description: 资金分类（客户 / 平台）；取值收敛见 CR-P5。
        status:
          type: string
          enum: [provisioning, active, paused, draining, zero, frozen, retired, provisioning_failed]
          description: 规格 7 值 + 预生成失败终态；终态不可回退。
        switch_state:
          type: string
          enum: [standby, in_service, switching_out, draining]
          description: 仅对 active 有意义。
        cap_minor: { type: [integer, 'null'], minimum: 0 }
        balance_minor: { type: integer, minimum: 0 }
        gas_ok: { type: boolean, description: gas 预留是否健康（INV-03）。 }
        ready:
          type: boolean
          description: ready = active ∧ gas_ok（INV-03）；仅 ready 钱包可接新地址。
        provisioned_at: { type: [string, 'null'], format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }

    TreasuryPool:
      type: object
      additionalProperties: true
      required: [pool_id, status]
      properties:
        pool_id:
          type: string
          description: 池键 chain:role:fund_class，创建后不可变（INV-01）。
        chain: { type: [string, 'null'], description: 链标识（如 polygon）。 }
        role:
          type: string
          enum: [hot, warm]
        fund_class:
          type: [string, 'null']
          description: 资金分类（客户 / 平台）。取值收敛见 CR-P5，本版不冻结枚举。
        status:
          type: string
          enum: [active, paused, retired]
        min_spare: { type: integer, minimum: 0, maximum: 8 }
        max_active: { type: integer, minimum: 1, maximum: 20 }
        switch_threshold_pct: { type: integer, minimum: 50, maximum: 95 }
        activate_batch_size: { type: integer, minimum: 1, maximum: 8 }
        provision_lead_time_h: { type: integer, minimum: 1, maximum: 48 }
        pool_cap_minor:
          type: integer
          minimum: 0
          description: 池合计上限（分）；50,000 USD 或 treasury 10% 取小（03-facts §2）。
        depth_ready:
          type: integer
          minimum: 0
          description: 可用只数（ready = active ∧ gas_ok，INV-03）；0 即池空 P0，但不停收款（INV-06）。
        depth_available:
          type: integer
          minimum: 0
          description: 可摊量 / 可切换的地址深度。
        in_service_count: { type: integer, minimum: 0 }
        active_balance_minor: { type: integer, minimum: 0 }
        policy_version: { type: [string, 'null'] }
        wallets:
          type: array
          description: 池内钱包摘要（深度下钻；只读）。
          items: { $ref: '#/components/schemas/TreasuryWallet' }

    TreasuryPoolPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TreasuryPool' }
        page: { $ref: '#/components/schemas/Page' }

    TreasuryPoolCreateRequest:
      type: object
      additionalProperties: true
      required: [chain, role, fund_class]
      properties:
        chain: { type: string, description: 链标识（一期 polygon；一期单链 K6）。 }
        role:
          type: string
          enum: [hot, warm]
        fund_class:
          type: string
          description: 资金分类；取值见 CR-P5（本版不冻结枚举）。
        min_spare: { type: integer, minimum: 0, maximum: 8, default: 3 }
        max_active: { type: integer, minimum: 1, maximum: 20 }
        switch_threshold_pct: { type: integer, minimum: 50, maximum: 95, default: 70 }
        pool_cap_minor: { type: integer, minimum: 0 }
        activate_batch_size: { type: integer, minimum: 1, maximum: 8, default: 4 }
        provision_lead_time_h: { type: integer, minimum: 1, maximum: 48, default: 12 }
        reason: { type: [string, 'null'], maxLength: 512 }

    TreasuryProvisionRequest:
      type: object
      additionalProperties: true
      required: [pool_id]
      properties:
        pool_id: { type: string }
        wallet_count:
          type: integer
          minimum: 1
          maximum: 8
          default: 4
          description: 本批只数（默认 activate_batch_size=4；硬顶 MAX_BATCH_SIZE=8）。

    TreasuryProvisionBatch:
      type: object
      additionalProperties: true
      required: [batch_id, batch_no, status, wallet_count, created_at]
      properties:
        batch_id: { type: string }
        batch_no: { type: string, description: 对外批次号（≤32 字符）。 }
        pool_id: { type: [string, 'null'] }
        kind:
          type: [string, 'null']
          description: 批次用途；预生成即 WALLET_PROVISION（TreasuryIntent.kind 第八值）。
        wallet_count: { type: integer, minimum: 0 }
        descriptor_merkle_root:
          type: [string, 'null']
          description: 描述符 Merkle 根（可反证钱包属于哪一批、由谁签、何时生效）。
        status:
          type: string
          enum: [draft, pending_sign, signed, activated, expired, failed, cancelled]
          description: draft → pending_sign → signed → activated；终止 expired / failed / cancelled。
        nonce: { type: integer, minimum: 0 }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 批次 TTL 截止（24h；过期作废重签）。
        signing_request_id: { type: [string, 'null'] }
        activated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    TreasuryActivateRequest:
      type: object
      additionalProperties: true
      properties:
        signing_request_id:
          type: [string, 'null']
          description: 已收齐 2/3 签的签名请求 id；不接受签名字节或私钥材料。
        reason: { type: [string, 'null'], maxLength: 512 }

    TreasurySwitchRequest:
      type: object
      additionalProperties: true
      required: [pool_id, reason]
      properties:
        pool_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 512 }

    TreasurySwitchAck:
      type: object
      additionalProperties: true
      required: [pool_id, status]
      properties:
        pool_id: { type: string }
        status:
          type: string
          enum: [triggered, executing, done]
          description: 切换事件状态机；失败重试 1 次后转人工。
        from_wallet_id: { type: [string, 'null'] }
        to_wallet_id: { type: [string, 'null'] }
        switched_at: { type: [string, 'null'], format: date-time }

    TreasuryRetireRequest:
      type: object
      additionalProperties: true
      required: [wallet_id, step]
      properties:
        wallet_id: { type: string }
        step:
          type: string
          enum: [drain, zero, frozen, retire]
          description: 退休四步；retire 前须余额 0 且有有效 attestation（缺 → 409 + 40916）。
        attestation_ref: { type: [string, 'null'] }
        reason: { type: [string, 'null'], maxLength: 512 }

    TreasuryAddressRequest:
      type: object
      additionalProperties: true
      required: [chain, address, ownership_challenge_ref]
      properties:
        chain: { type: string, description: 链标识（一期 polygon）。 }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        ownership_challenge_ref:
          type: string
          minLength: 1
          maxLength: 128
          description: 所有权签名挑战的引用（不含签名原文）；服务端校验归属。
        risk_level:
          type: [string, 'null']
          enum: [low, medium, high, null]
          description: 地址风险评分结论（粗粒度；明细在私有配置）。
        label: { type: [string, 'null'], maxLength: 128 }

    TreasuryAddress:
      type: object
      additionalProperties: true
      required: [address_id, chain, address, status]
      properties:
        address_id: { type: string }
        account_id: { type: [string, 'null'], description: 归属账户（共享方出款地址时为本账户）。 }
        chain: { type: [string, 'null'], description: 链标识（一期 polygon）。 }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        status:
          type: string
          enum: [pending, whitelisted, rejected, revoked]
          description: 待冷却 / 已白名单 / 拒绝 / 撤销；仅 whitelisted 且冷却期满可出款。
        label: { type: [string, 'null'] }
        cooldown_until: { type: [string, 'null'], format: date-time }
        first_transfer_at: { type: [string, 'null'], format: date-time }
        first_transfer_minor:
          type: [integer, 'null']
          minimum: 0
          description: 首笔试转金额（USDT 最小单位；≤100 USDT，03-facts §3）。
        changed_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        risk_level: { type: [string, 'null'], enum: [low, medium, high, null] }

    TreasuryAddressPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TreasuryAddress' }
        page: { $ref: '#/components/schemas/Page' }

    DepositAddress:
      type: object
      additionalProperties: true
      required: [chain, address, updated_at]
      properties:
        chain: { type: [string, 'null'], description: 链标识（一期 polygon）。 }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        status:
          type: [string, 'null']
          description: 生效 / 已退役（取值待 M08 定稿，本版不冻结枚举）。
        published_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }
        monitoring_until:
          type: [string, 'null']
          format: date-time
          description: 旧地址继续监听至（≥90 天）。
        updated_at: { type: string, format: date-time }

    DepositAddressRequest:
      type: object
      additionalProperties: true
      required: [chain, address, reason, ticket]
      properties:
        chain: { type: string, description: 链标识（一期 polygon）。 }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        reason: { type: string, minLength: 1, maxLength: 512 }
        ticket:
          type: string
          minLength: 1
          description: 变更单号（高危四件套留痕；发布本身进审计链）。
        effective_at: { type: [string, 'null'], format: date-time }

    GasPolicy:
      type: object
      additionalProperties: true
      required: [gas_mode, policy_version]
      properties:
        gas_mode:
          type: string
          enum: [INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER]
          description: |
            03-facts §9 的 billing.gas_fee_mode 为 INTERNAL / EXTERNAL + bearer；
            M08 §8.1 把 EXTERNAL 拆成 EXTERNAL_PLATFORM / EXTERNAL_PAYER（等价于 bearer 组合）。
            两套写法的归一由 M08 policy.normalize_gas_mode 处理；差异见证据「未定字段」。
        gas_bearer:
          type: [string, 'null']
          enum: [PLATFORM, PAYER, null]
          description: EXTERNAL_* 时生效；INTERNAL 时为 null（03-facts §9）。
        scope:
          type: [string, 'null']
          enum: [global, chain, batch, null]
        policy_version: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }

    GasPolicyRequest:
      type: object
      additionalProperties: true
      required: [gas_mode]
      properties:
        gas_mode:
          type: string
          enum: [INTERNAL, EXTERNAL_PLATFORM, EXTERNAL_PAYER]
        gas_bearer:
          type: [string, 'null']
          enum: [PLATFORM, PAYER, null]
          description: EXTERNAL_* 必填；INTERNAL 须为 null（跨字段校验）。
        scope:
          type: [string, 'null']
          enum: [global, chain, batch, null]
        reason: { type: [string, 'null'], maxLength: 512 }

    # ------------------------------------------------------------ 数据治理与 Ops（M14，spec 1.2.5）
    # 只读聚合：不写业务表；导出 / 删除 / 批量一律由 Owner 执行，M14 只留申请与报告。
    # 敏感红线：不返回 prompt / response 正文、凭据明文、完整签名；审计只回脱敏摘要。
    # 字段名与 M14 席位的 T1 模型 / router（worktrees/M14-admin）对齐。
    ExportRequestCreateRequest:
      type: object
      additionalProperties: true
      required: [scope, reason]
      properties:
        scope:
          type: object
          additionalProperties: true
          required: [object]
          description: 导出范围（对象 + 时间窗 + 租户）；只允许请求人有权范围。
          properties:
            object:
              type: string
              enum: [usage, receipts, tickets, logs, backups, analytics]
              description: 导出对象（M14 §5 同一枚举）。
            from: { type: [string, 'null'], format: date-time }
            to: { type: [string, 'null'], format: date-time }
            tenant_id: { type: [string, 'null'] }
        format:
          type: array
          minItems: 1
          description: 导出格式；缺省一次打包 JSON + CSV（产品 §22.5）。
          items:
            type: string
            enum: [json, csv]
        reason: { type: string, minLength: 1, maxLength: 512 }
        estimated_rows:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
          description: 预估行数（用于双人复核判定；缺省 0）。
        contains_personal_data:
          type: boolean
          default: false
          description: 是否含个人信息（命中即强制双人复核；INV-04）。

    ExportRequest:
      type: object
      additionalProperties: true
      required: [export_id, export_no, scope, format, state, created_at, expires_at]
      properties:
        export_id: { type: string }
        export_no:
          type: string
          description: 对外申请号（≤32 字符，全局唯一）。
        requester: { type: [string, 'null'] }
        scope:
          type: object
          additionalProperties: true
          description: 导出范围（对象 + 时间窗 + 租户）。
        format:
          type: array
          items:
            type: string
            enum: [json, csv]
        reason: { type: [string, 'null'] }
        state:
          type: string
          enum: [pending, approved, running, done, failed, expired]
          description: pending → approved → running → done；终止 failed / expired，过期不自动续期（INV-04）。取消经 failed + failure_reason=cancelled_by_requester 表达（不新增 cancelled 值）。
        rows:
          type: integer
          minimum: 0
          description: 实际导出条数（row_count）。
        estimated_rows:
          type: integer
          minimum: 0
          description: 预估条数；>1,000 或含个人信息强制双人复核。
        contains_personal_data: { type: boolean }
        approval_required: { type: boolean, description: 是否需双人复核。 }
        approver: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 文件失效时间（7 天；INV-04）。
        watermark:
          type: [string, 'null']
          description: 文件水印标识（追责用；不含正文）。
        failure_reason:
          type: [string, 'null']
          description: 失败原因摘要（人类可读；不含内部堆栈 / 凭据）；取消时为 cancelled_by_requester。
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancelled_by: { type: [string, 'null'] }
        download:
          $ref: '#/components/schemas/ExportDownload'

    ExportDownload:
      type: object
      additionalProperties: true
      required: [available]
      properties:
        available:
          type: boolean
          description: 当前是否可下载（未完成 / 已过期 / 已消费 / 已签发新链接时为 false）。
        reason:
          type: [string, 'null']
          description: 不可用原因（state_* / file_expired / already_downloaded）。
        url:
          type: [string, 'null']
          description: 一次性签名下载链接（TTL ≤15 分钟）；带水印；不返回文件内容。
        expires_at: { type: [string, 'null'], format: date-time }
        ttl_s: { type: [integer, 'null'], minimum: 0 }
        one_time: { type: boolean, description: 链接一次性（第二次 409 + 40901）。 }
        watermark: { type: [string, 'null'] }

    ExportRequestPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ExportRequest' }
        page: { $ref: '#/components/schemas/Page' }

    RetentionJobCreateRequest:
      type: object
      additionalProperties: true
      required: [object]
      properties:
        object:
          type: string
          enum: [usage, receipts, tickets, logs, backups, analytics]
          description: 保留对象（产品 §22.5 矩阵）；同一 (object, cutoff) 只执行一次。
        cutoff:
          type: [string, 'null']
          format: date-time
          description: 保留截止时间（UTC 日界）；与 policy_days 二选一或同时给出（同时须一致）。
        policy_days:
          type: [integer, 'null']
          minimum: 1
          description: 保留天数；缺省与 cutoff 互推，均缺省时按 §22.5 矩阵。
        dry_run:
          type: boolean
          default: false
          description: true 只计算将删条数、不执行。
        reason: { type: [string, 'null'], maxLength: 512 }

    RetentionJob:
      type: object
      additionalProperties: true
      required: [job_id, job_no, object, cutoff, state, dry_run, created_at]
      properties:
        job_id: { type: string }
        job_no: { type: string, description: 对外任务号。 }
        object:
          type: string
          enum: [usage, receipts, tickets, logs, backups, analytics]
        policy_days: { type: integer, minimum: 0 }
        cutoff: { type: string, format: date-time }
        state:
          type: string
          enum: [queued, running, done, failed]
          description: queued → running → done；失败可幂等重放，连续 2 次升级 P0（INV-07）。
        dry_run: { type: boolean }
        deleted_count: { type: integer, minimum: 0 }
        retained_count:
          type: integer
          minimum: 0
          description: 部分保留条数（争议保全 / 账本类只去关联化）。
        report:
          type: object
          additionalProperties: true
          description: 删除报告摘要（已删 / 部分保留及原因 / 最迟清除日 / 方式）；不含被删数据正文。
        report_ref: { type: [string, 'null'], description: 报告引用。 }
        failure_reason: { type: [string, 'null'] }
        replay_count: { type: integer, minimum: 0 }
        requested_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        sla:
          type: object
          additionalProperties: true
          description: SLA 口径（30 天办结 / 40 天抽样，M14 §8.2）。
          properties:
            due_at: { type: [string, 'null'], format: date-time }
            overdue: { type: boolean }
            window_days: { type: integer, minimum: 0 }
            sampling_days: { type: integer, minimum: 0 }

    RetentionJobPage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RetentionJob' }
        page: { $ref: '#/components/schemas/Page' }

    OpsHealthBlock:
      type: object
      additionalProperties: true
      required: [block, status]
      properties:
        block:
          type: string
          enum: [gateway, scheduling, ledger, recon, wallet, config, notification]
          description: 七块健康总览（产品 §22.21）。
        status:
          type: string
          enum: [green, yellow, red]
        reason:
          type: [string, 'null']
          description: 粗粒度原因（probe_not_wired / unavailable / probe_error 等）；不含阈值。
        detail:
          type: [string, 'null']
          description: 结论摘要（组件名 + 状态；不含阈值 / 名单 / 依赖地址）。
        metrics:
          type: object
          additionalProperties: true
          description: 关键指标摘要（只读聚合；不含名单与判定条件）。
        checked_at: { type: [string, 'null'], format: date-time }
        last_change:
          type: object
          additionalProperties: true
          description: 最近一次变更（来源审计链；无则 null）。
          properties:
            action: { type: string }
            actor: { type: [string, 'null'] }
            at: { type: string, format: date-time }

    OpsHealth:
      type: object
      additionalProperties: true
      required: [data, overall, observed_at]
      properties:
        data:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OpsHealthBlock' }
        overall:
          type: string
          enum: [green, yellow, red]
          description: 取七块最差级别；红块须 5 分钟内可定位到组件与变更单。
        observed_at: { type: string, format: date-time }
        block_count: { type: integer, minimum: 0 }

    OpsChange:
      type: object
      additionalProperties: true
      required: [change_id, kind, action, status, window, rollback_plan, impact_scope, occurred_at]
      properties:
        change_id: { type: string }
        kind:
          type: string
          enum: [config_publish, config_rollback, deploy, backup, upgrade, release]
        action: { type: string, description: 审计动作名（如 config.publish）。 }
        status:
          type: string
          enum: [completed, failed, rolled_back, in_progress, recorded]
          description: 由审计动作推导的变更状态（执行在 M16，M14 只读展示）。
        actor: { type: [string, 'null'] }
        target: { type: [string, 'null'] }
        window:
          type: object
          additionalProperties: true
          description: 变更窗口（无登记时 start=end=发生时间）。
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        rollback_plan:
          type: string
          description: 回滚方案（人类可读）；未登记时标注以 M16 发布单为准。
        impact_scope:
          type: string
          description: 影响面（组件 / 用户可见性）；不含阈值与内部名单。
        occurred_at: { type: string, format: date-time }
        ticket: { type: [string, 'null'] }
        evidence: { type: [string, 'null'] }

    OpsChangePage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OpsChange' }
        page: { $ref: '#/components/schemas/Page' }
        source:
          type: object
          additionalProperties: true
          description: 数据源可用性（审计链 / 事件 outbox）。
          properties:
            audit_log:
              type: string
              enum: [ok, unavailable]
        observed_at: { type: string, format: date-time }

    OpsBatchOpRequest:
      type: object
      additionalProperties: true
      required: [step]
      properties:
        step:
          type: string
          enum: [preview, execute, undo]
          description: 五步流程的入口（无 preview 禁止 execute；INV-03）。1.2.6 冻结为三值，增改走 MINOR + 双写。
        action_type:
          type: string
          enum: [notify, tag, freeze, unfreeze, retire, limit_adjust, payout_proposal, refund_proposal]
          description: preview 必填：批量动作类型（涉资金 / 冻结类强制双人复核）。
        target:
          type: object
          additionalProperties: true
          description: preview 用范围；无 target.ids 时必须接线 Owner 查询适配器（不猜影响面）。
          properties:
            object:
              type: string
              enum: [account, node, key, wallet, ticket, config]
            ids:
              type: array
              maxItems: 200
              items: { type: string }
            filter:
              type: object
              additionalProperties: true
        reason: { type: [string, 'null'], maxLength: 512 }
        labels:
          type: object
          additionalProperties: { type: string }
          description: 预览展示用的标签（id → 人类可读名）；不含 PII 正文。
        batch_id:
          type: [string, 'null']
          description: execute / undo 必填：预览返回的批次操作 id（UUID）。

    OpsBatchOp:
      type: object
      additionalProperties: true
      required: [batch_id, state, step, action_type, count, dual_review_required]
      properties:
        batch_id: { type: string }
        state:
          type: string
          enum: [previewed, executed, undone, failed]
        step: { type: string, enum: [preview, execute, undo] }
        action_type:
          type: string
          enum: [notify, tag, freeze, unfreeze, retire, limit_adjust, payout_proposal, refund_proposal]
        target:
          type: object
          additionalProperties: true
        reason: { type: [string, 'null'] }
        count: { type: integer, minimum: 0 }
        impact:
          type: array
          description: 影响清单（id + 展示标签）。
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              label: { type: [string, 'null'] }
        sample:
          type: array
          description: 随机抽样（≤10 条，逐条确认）。
          items: { type: string }
        sample_size: { type: integer, minimum: 0 }
        dual_review_required: { type: boolean }
        max_items: { type: integer, minimum: 1 }
        undo_window_s: { type: integer, minimum: 0 }
        initiator: { type: [string, 'null'] }
        approver: { type: [string, 'null'] }
        previewed_at: { type: [string, 'null'], format: date-time }
        executed_at: { type: [string, 'null'], format: date-time }
        undo_deadline:
          type: [string, 'null']
          format: date-time
          description: 撤销窗口截止（执行后 10 分钟）；过期不可撤销（409 + 40901）。
        results:
          type: array
          description: 逐条执行回执（保留成功项 + 失败清单）。
          items:
            type: object
            additionalProperties: true
        undo_results:
          type: array
          description: 逐条撤销回执（撤销也留痕）。
          items:
            type: object
            additionalProperties: true
        succeeded_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }

    AuditReplayEvent:
      type: object
      additionalProperties: true
      required: [occurred_at, source, action]
      properties:
        occurred_at: { type: string, format: date-time }
        source:
          type: string
          enum: [audit, event]
          description: audit = 审计链条目；event = 事件 outbox 记录。
        trace_id: { type: [string, 'null'] }
        owner_id: { type: [string, 'null'], description: 操作者内部 id（不写邮箱 / 手机）。 }
        action: { type: string }
        target: { type: [string, 'null'] }
        reason_code: { type: [string, 'null'] }
        evidence: { type: [string, 'null'] }
        detail:
          type: object
          additionalProperties: true
          description: 脱敏后的审计 after 摘要（最多 3 层 / 200 字符；敏感键被剔除）。
        event_id: { type: [string, 'null'] }
        aggregate_type: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        payload:
          type: object
          additionalProperties: true
          description: 脱敏后的事件 payload（不含正文 / PII / 密钥）。

    AuditReplay:
      type: object
      additionalProperties: true
      required: [data, page, observed_at]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditReplayEvent' }
        page: { $ref: '#/components/schemas/Page' }
        source:
          type: object
          additionalProperties: true
          description: 数据源可用性。
          properties:
            audit_log:
              type: string
              enum: [ok, unavailable]
            outbox:
              type: string
              enum: [ok, unavailable]
        observed_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 用户态补丁（M02 / M05，spec 1.2.6）
    UserNode:
      type: object
      additionalProperties: true
      required: [node_id, state]
      properties:
        node_id: { type: string }
        state:
          type: string
          enum: [unbound, pending_receipt, bound, revoked]
          description: 绑定视图状态；pending_receipt = 绑定已下发、待节点回执（M13 NodeBindingView 口径）。
        lifecycle_state:
          type: string
          enum: [pending, active, frozen, retired]
          description: M02 权威生命周期（以心跳与 node_events 为准）。
        last_seen:
          type: [string, 'null']
          format: date-time
          description: 最近心跳时间（无心跳为 null）。
        applied_version:
          type: [string, 'null']
          description: 节点回传的已生效版本（M10 running applied_version）；未回传为 null。
        pending_reason:
          type: [string, 'null']
          description: pending / pending_receipt 的粗粒度原因（不含规则、名单或内部判定）。
        bound_at: { type: [string, 'null'], format: date-time }
        unbound_at: { type: [string, 'null'], format: date-time }

    UserNodePage:
      type: object
      additionalProperties: true
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserNode' }
        page: { $ref: '#/components/schemas/Page' }

    UserNodeUnbindRequest:
      type: object
      additionalProperties: true
      properties:
        reason:
          type: [string, 'null']
          maxLength: 512
          description: 解绑原因（人类可读；审计留痕，不含凭据）。
