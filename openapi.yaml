        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        is_default:
          type: boolean
          description: 该对象是否是全局默认行。
        configured:
          type: boolean
          description: 是否设过价（`bid_min`/`bid_max`/`use_realtime` 任一）。`false` = 按供方报价成交。
        reference_price:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 只读参考：当前该模型的最低有效报价（`{amount, unit}`），无报价时 `null`。
        effective_max:
          type:
          - string
          - 'null'
          description: 只读：如果现在路由，实际生效的上限（含实时价换算）。
        effective_min:
          type:
          - string
          - 'null'
          description: 只读：实际生效的下限。
        price_source:
          type:
          - string
          - 'null'
          enum:
          - bid_settings
          - realtime
          - ask_fallback
          - ask_missing
          - null
          description: '只读：生效口径来源；同一值会出现在调用的 `x-djb-price-source` 响应头。

            `ask_fallback` = 实时价取不到、降级为静态上限；`ask_missing` = 实时价取不到且无静态兜底。

            '
    ModelBidUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
