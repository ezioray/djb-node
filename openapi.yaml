  /api/v1/admin/treasury/sweeps:
    get:
      operationId: listChainSweeps
      summary: 归集单列表（管理面）
      tags:
      - Treasury
      - Chain
      security:
      - adminBearer: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - proposed
          - approved
          - executed
          - cancelled
          - expired
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 归集单列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChainSweep'
                  page:
                    $ref: '#/components/schemas/ChainPage'
        '403':
          description: 40301 缺少 treasury.sweep.read
    post:
      operationId: actOnChainSweep
      summary: 归集动作（propose / approve / execute）
      description: "状态机单向：``proposed → approved → executed``，另有 ``expired``（30 分钟窗口超时）。\n- **propose**：scope ``treasury.sweep.propose``；只写库、不动链不动账本；\n\
        \  小于尘埃阈值（默认 1 USDT）的地址不进提案。\n- **approve**：scope ``treasury.sweep.approve``；SoD 强制 ``checker != proposer``（40912）。\n\
        - **execute**：scope ``treasury.sweep.execute`` + step-up；mock 链真实移动余额并写\n  E9 两对分录；**真链执行 → 409 chain_execution_unavailable**（本服务无私钥、不广播）。\n"
      tags:
      - Treasury
      - Chain
      security:
      - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - propose
                  - approve
                  - execute
                sweep_id:
                  type: string
                  format: uuid
                  description: approve / execute 必填
                gas_fee_minor:
                  type: integer
                  minimum: 0
                  default: 0
                  description: propose：预置 gas 消耗（micro-USD）
                target_address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                  description: propose：默认取平台温钱包地址
                policy_version:
                  type: string
      responses:
        '201':
          description: propose 命中：返回提案单与明细
        '200':
          description: approve / execute / 无提案（no_sweep_needed）
        '400':
          description: 40001 action 非法或字段缺失
        '403':
          description: 40301 缺少对应 scope
        '404':
          description: 40401 归集单不存在
        '409':
          description: '40912 sod_violation（复核人=制单人）、40913 illegal_transition（状态不允许）、

            40919 xpub_missing / sweep_expired / insufficient_source_balance；

            **chain_execution_unavailable**：真链执行不可用（无签名服务）。

            后者是**预期**答复，不是故障：不得重试、不得改走 500。

            '
        '424':
          description: 42401 需要 step-up 复核
        '429':
          description: 42901 rate_limited
  /api/v1/internal/chain/mock/fund:
    post:
      operationId: mockFundChainAddress
      summary: mock 链打款（**仅测试网 / mock provider**）
      description: '让验收脚本能在没有真链的情况下跑通闭环。真链 provider 下返回

        ``503 chain_provider_unavailable``（本服务不广播任何交易）。

