        session_id:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        trusted:
          type: boolean
        skip_otp:
          type: boolean
        device_id:
          type:
          - string
          - 'null'
        device_expires_at:
          type:
          - string
          - 'null'
          format: date-time
    TrustedDevice:
