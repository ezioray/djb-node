{{- /*
C5 机房版 · ServiceAccount

节点客户端**不调用** Kubernetes API（不上报、不 watch、不读 Secret），
所以默认既最小权限又够用：
  * create=true 建一个空 SA（便于将来加审计用的 RBAC，不需要改 pod 模板）；
  * automountServiceAccountToken=false（默认）：Pod 里根本没有 token 卷，
    被攻破也拿不到集群凭据（对应 INV-02/INV-10 的「不隐藏、不提权」）。
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "djb-node.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "djb-node.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 注意：这里刻意不建 Role / RoleBinding —— 客户端不需要任何 API 权限。
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
