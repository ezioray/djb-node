name: 功能建议
description: 先描述问题，再描述方案
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: 要解决什么问题, placeholder: "谁在什么场景遇到什么；不要只写'加个功能'" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: 建议方案 }
  - type: textarea
    id: alternatives
    attributes: { label: 备选方案 / 不做的代价 }
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 不涉及绕过上游条款、风控、地域限制
        - label: 不包含真实凭据、阈值、名单
