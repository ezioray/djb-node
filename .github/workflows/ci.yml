# DJB djb-node · CI 门禁（spec 是唯一契约）
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spec-lint:
    name: OpenAPI 结构校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: 解析 + 基本断言
        run: |
          pip -q install pyyaml
          python - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('openapi.yaml', encoding='utf-8'))
          errs = []
          if str(d.get('openapi','')).split('.')[0] != '3': errs.append('openapi 必须 3.x')
          if not d.get('info',{}).get('title'):         errs.append('缺 info.title')
          if not d.get('paths'):                        errs.append('paths 为空')
          for p, item in d['paths'].items():
              if not p.startswith('/'):                 errs.append(f'path 必须以 / 开头: {p}')
              for m in item:
                  if m not in ('get','post','put','patch','delete','head','options','parameters','summary','description'):
                      errs.append(f'未知 method {m} @ {p}')
                  if m in ('get','post','put','patch','delete') and 'responses' not in item[m]:
                      errs.append(f'{m.upper()} {p} 缺 responses')
          # 红线：spec 里不得出现反作弊阈值/名单（只允许粗粒度状态码）
          raw = open('openapi.yaml', encoding='utf-8').read()
          for bad in ('blocklist','blacklist','score_weight','risk_rules'):
              if bad in raw: errs.append(f'出现反作弊内部字段: {bad}')
          print(f"paths={len(d['paths'])}  错误={len(errs)}")
          for e in errs: print('  -', e)
          sys.exit(1 if errs else 0)
          PY

  redline-scan:
    name: 红线词扫描
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 代码看实现形态 / 文档看主张式表述
        run: |
          set -e
          fail=0

          echo "== A. 代码里不得出现「代币化 / 绕限制 / 托管凭据」的实现 =="
          CODE_PAT='(token_?(mint|transfer|withdraw)|airdrop\(|proxy_?(pool|rotation)|rotate_?(account|key_pool)|fingerprint_?spoof|host_?customer_?key|store_?user_?credential)'
          if grep -rInE "$CODE_PAT" --include='*.py' --include='*.ts' --include='*.rs' --include='*.go' --include='*.js' . ; then
            echo "::error::代码中出现红线实现形态"; fail=1
          fi

          echo "== B. 文档不得【主张】这些能力（禁令/否定表述天然不匹配）=="
          DOC_PAT='(支持|提供|实现|允许|开放)(发币|空投|代币化|账号轮换池|托管.{0,4}凭据)|绕过(上游|站点)?限制的(方案|方法|功能)'
          if grep -rInE "$DOC_PAT" --include='*.md' --include='*.yaml' --include='*.yml' . \
             | grep -vE '(SECURITY|CONTRIBUTING|CODE_OF_CONDUCT)\.md' ; then
            echo "::error::文档中出现主张式红线表述"; fail=1
          fi

          [ "$fail" = 0 ] && echo "✅ 无红线"
          exit $fail

  dco:
    name: DCO（Signed-off-by）
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: 逐个提交检查 Signed-off-by
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ -z "$before" ] || printf '%s' "$before" | grep -qE '^0+$'; then
              range="$after~1..$after"
            else
              range="$before..$after"
            fi
          fi
          echo "检查区间: $range"
          fail=0
          for c in $(git rev-list "$range"); do
            who="$(git log -1 --pretty='%an <%ae>' "$c")"
            if git log -1 --pretty=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok   $c  $who"
            else
              echo "::error::commit $c ($who) 缺 Signed-off-by"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "✅ 区间内每个提交都有 Signed-off-by"
          exit $fail

  client-tests:
    name: 客户端单测（3.10/3.11/3.12）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '${{ matrix.python }}' }
      - name: 安装测试依赖
        run: pip -q install pytest pyyaml
      - name: 更新/签名/服务计划单测（RC8 必跑）
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_update.py tests/test_update_keyring.py \
            tests/test_service_plan.py tests/test_update_source.py
      - name: 机房版离线包测试（依赖 PyYAML）
        run: PYTHONPATH=. python -m pytest -q tests/test_machine_room.py -k "offline"

  update-signing:
    name: 更新验签矩阵（T3-a，离线）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: T3-a 16 类用例（含 13 类负例）
        run: PYTHONPATH=. python tests/rc8/t3_offline_verify.py
      - name: 密钥泄漏自检（仓库里不得有私钥/seed）
        run: |
          set -e
          if grep -rInE '(BEGIN (OPENSSH|RSA|EC|ED25519) PRIVATE KEY|-----BEGIN PRIVATE KEY-----)' . ; then
            echo "::error::仓库里出现私钥材料"; exit 1
          fi
          echo "✅ 无私钥材料"

  package:
    name: 制品构建（linux-src / official-supply / machine-room-offline / windows 载体）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: ['linux-src', 'official-supply', 'machine-room-offline', 'windows-assets']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }          # pkgbuild 要 git archive/git describe
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: 装构建后端（wheel 构建用；运行时不依赖）
        run: pip -q install build wheel setuptools
      # 0.3.5（B-PREP P1/P2）：--sha 必填 40 位；SOURCE_DATE_EPOCH 钉住 built_at/成员 mtime，
      # 重跑同 commit 必须得同 sha。用 commit 自己的 committer time，不取 pipeline 墙钟。
      # BUILD_SHA：PR 事件下 github.sha 是 **merge commit**（refs/pull/N/merge），拿它当 --sha
      # 会把 provenance 写成没进过任何分支的合成提交 ⇒ 优先取 PR head.sha，push/tag 才用 github.sha。
      # 注：fork PR 若 head.sha 不在 checkout 的图里，`git show` 会失败、但 echo 本身仍 rc=0，
      # 写进 GITHUB_ENV 的是**空值**；真正拦住的是下一步构建——--sha 收到空串 ⇒ rc=2 拒绝
      # （fail-closed，不会静默写错 provenance）。
      - name: 固定构建时间戳（可复现构建）
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${BUILD_SHA}")" >> "$GITHUB_ENV"
      - name: 构建 ${{ matrix.kind }}
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python ci/pkgbuild.py --kind ${{ matrix.kind }} --out dist --sha "${BUILD_SHA}"
      - name: 制品自检（包内自洽 + 显式 update_source）
        run: python ci/check_pkg_manifest.py --pkg-dir dist --require ${{ matrix.kind }}
      - name: 上传制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.kind }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  package-check:
    name: 四类制品汇总校验（缺一类即失败）
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: 下载全部制品
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true
      - name: 汇总校验（版本/自洽/显式 update_source 三项齐备才算过）
        run: |
          set -e
          ls -l dist
          python ci/check_pkg_manifest.py --pkg-dir dist \
            --require linux-src,official-supply,machine-room-offline,windows-assets

  linux-matrix-l0:
    name: Linux 包级矩阵 L0（4 发行版 × 3 制品）
    needs: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 拉真实制品（上一个 job 构建并校验过的同一批）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/pkg
          pattern: pkg-*
          merge-multiple: true
      - name: 制品必须在（缺一个就失败，不再占位跳过）
        run: |
          set -e
          ls -l /tmp/pkg
          for pattern in 'djb-node-*-linux-x64-src.tar.gz' \
                         'djb-node-*-machine-room-offline.tar.gz' \
                         'djb-node-*-official-supply-x64.tar.gz'; do
            ls /tmp/pkg/$pattern >/dev/null 2>&1 || {
              echo "::error::缺制品 $pattern（package job 没产出，矩阵不能空跑）"; exit 1; }
          done
      - name: L0 矩阵（容器 --network none；python3 缺失记 SKIP，不算 FAIL）
        run: sudo bash tests/rc8/t1_matrix.sh --pkg-dir /tmp/pkg --evidence /tmp/t1-evidence
      - name: 上传矩阵证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t1-matrix-evidence
          path: /tmp/t1-evidence
          if-no-files-found: warn
          retention-days: 14
