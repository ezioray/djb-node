# SPDX-License-Identifier: Apache-2.0
# M3 机器评估 · macOS(Apple Silicon) 专用取证 workflow。
#
# 与 ci.yml 完全独立：不挂 main 门禁、不参与 PR 必过项，只在
#   * push 到专用分支 e2e/macos-ci
#   * 手动 workflow_dispatch
# 时跑，产出 `macos.json`（djb.machine-eval/1）与安装/版本/诊断日志作为 artifact。
#
# 为什么单独一份：三端取证的 macOS 一段必须跑在真 Apple Silicon 上
# （Intel runner 的 GPU/内存字段语义不同，不能拿来充数）。
#
# 2026-11-02 记：原计划的 macos-14 镜像已进入退役 brownout（GitHub 官方
# actions/runner-images#13518），任务被直接 cancelled、一步都不跑。
# 因此改用 macos-15（同为 Apple Silicon / arm64）。
name: e2e-macos

on:
  push:
    branches: [e2e/macos-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-macos-${{ github.ref }}
  # 取证跑不能被后来的触发互相掐掉（第一次 push 就因为 cancel-in-progress 被自己取消）
  cancel-in-progress: false

jobs:
  machine-eval:
    name: 机器评估 + 安装/诊断冒烟（macos-15 / arm64）
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: 环境先行（谁在跑、什么架构）
        run: |
          set -eu
          mkdir -p artifacts
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image=$ImageOS"
            echo "commit=$GITHUB_SHA"
            sw_vers
            uname -a
            python3 -V
          } | tee artifacts/00-env.txt

      - name: 安装（pip install -e .，独立 DJB_HOME）
        run: |
          set -eu
          python3 -m pip -q install -e .
          export DJB_HOME="$RUNNER_TEMP/djb-e2e-macos"
          mkdir -p "$DJB_HOME"
          {
            echo '$ djb --version'
            python3 -m djb_node.cli --version
            echo "exit=$?"
          } | tee artifacts/01-version.txt

      - name: 机器评估（djb.machine-eval/1）
        run: |
          set -eu
          export DJB_HOME="$RUNNER_TEMP/djb-e2e-macos"
          mkdir -p artifacts
          # 拿不到基准就如实 null + unavailable_reason（不写 0 充数）
          python3 -m djb_node.cli machine --json --out artifacts/macos.json \
            | tee artifacts/02-machine.txt
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("artifacts/macos.json", encoding="utf-8"))
          print("schema =", doc.get("schema"), "platform =", doc.get("platform"))
          assert doc.get("schema") == "djb.machine-eval/1", "schema 不符"
          assert doc.get("platform") == "macos", "平台必须是 macos（不能拿 linux 冒充）"
          for key in ("cpu", "memory", "gpus", "disks", "load", "benchmark"):
              assert key in doc, "缺字段：" + key
          mem = doc.get("memory") or {}
          assert mem.get("total_bytes") or mem.get("unavailable_reason"), "内存既无值也无原因"
          for gpu in doc.get("gpus") or []:
              assert gpu.get("vram_bytes") or gpu.get("unavailable_reason"), "显存既无值也无原因"
          bench = doc.get("benchmark") or {}
          assert (bench.get("tokens_per_second") or bench.get("unavailable_reason")), "基准既无值也无原因"
          print("self-check ok")
          PY

      - name: 安装 → 启动 → 状态 → 暂停/恢复 → 诊断 → 停止
        run: |
          set -eu
          export DJB_HOME="$RUNNER_TEMP/djb-e2e-macos"
          # 云端在 NAS 里，公网 runner 不可达：按离线/未绑定路径记录（不伪造注册）
          python3 -m djb_node.cli init --no-env --gateway http://127.0.0.1:18095 \
            > artifacts/03-init.txt 2>&1 || true
          python3 -m djb_node.cli start --no-token --timeout 20 \
            > artifacts/04-start.txt 2>&1 || echo "start_exit=$?" >> artifacts/04-start.txt
          python3 -m djb_node.cli status > artifacts/05-status.txt 2>&1 || true
          python3 -m djb_node.cli pause --json > artifacts/06-pause.txt 2>&1 || true
          python3 -m djb_node.cli resume --json > artifacts/07-resume.txt 2>&1 || true
          python3 -m djb_node.cli diagnose > artifacts/08-diagnose.txt 2>&1 || true
          python3 -m djb_node.cli stop --timeout 15 > artifacts/09-stop.txt 2>&1 || true
          ls -l artifacts

      - name: 窄测（只跑与本次改动相关的 suites）
        run: |
          set -eu
          python3 -m pip -q install pytest
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_machine_profile.py tests/test_update.py \
            tests/test_notifications.py tests/test_contract_openapi.py \
            | tee artifacts/10-pytest.txt

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-machine-eval
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
